<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <title>For a Living Planet</title>
    <meta name="description" content="See Earth as a living system." />
    <link rel="canonical" href="https://4planet.org/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="4PLANET MAGAZINE" href="/rss.xml" />

    <!-- Quiet social fallback. Product routes are prerendered with their own metadata at build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="4PLANET_" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="For a Living Planet" />
    <meta property="og:description" content="See Earth as a living system." />
    <meta property="og:url" content="https://4planet.org/" />
    <meta property="og:image" content="https://4planet.org/assets/brand/front-hero.jpg" />
    <meta property="og:image:secure_url" content="https://4planet.org/assets/brand/front-hero.jpg" />
    <meta property="og:image:alt" content="Earth seen from space." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="For a Living Planet" />
    <meta name="twitter:description" content="See Earth as a living system." />
    <meta name="twitter:image" content="https://4planet.org/assets/brand/front-hero.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Sans:wght@400;500;600&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet" />
    <!-- 4BRANDS-only selectors: second visual pass, isolated from the rest of 4PLANET. -->
    <link rel="stylesheet" href="/fourbrands-round2.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/atlas-return-camera-lock-v68.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script id="fourplanet-id-static-entry">
      (() => {
        const host = location.hostname.toLowerCase();
        const allowed = new Set([
          "4planet.org","www.4planet.org","s4piens.com","www.s4piens.com",
          "4planetatlas.com","www.4planetatlas.com","labs.4planet.org",
          "4brands.org","www.4brands.org"
        ]);
        if (!allowed.has(host) || host === "id.4planet.org" || host.endsWith(".oddekalv.org") || host === "oddekalv.org") return;
        const nativeSelector = ".public-header__identity,.fourplanet-id-global-entry";
        let fallback = null;

        async function ensure() {
          if (document.querySelector(nativeSelector)) {
            fallback?.remove();
            fallback = null;
            return;
          }
          if (fallback || !document.body) return;

          let signedIn = false;
          try {
            if (window.supabase?.createClient) {
              const sb = window.supabase.createClient(
                "https://ghvdzetmplqkdtfqiror.supabase.co",
                "sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE",
                { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
              );
              const result = await sb.auth.getSession();
              signedIn = Boolean(result?.data?.session);
            }
          } catch {}

          const destination = signedIn ? "account" : "login";
          const a = document.createElement("a");
          a.dataset.fourplanetIdEntry = "static";
          a.href = "https://id.4planet.org/" + destination + "?return_to=" + encodeURIComponent(location.href);
          a.textContent = signedIn ? "4PLANET ID" : "LOG IN";
          a.setAttribute("aria-label", signedIn ? "Open 4PLANET ID account" : "Log in with 4PLANET ID");
          a.style.cssText = "position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:1090;padding:9px 12px;border:1px solid rgba(8,8,8,.18);border-radius:999px;background:rgba(255,255,255,.94);color:#080808;text-decoration:none;font:650 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;box-shadow:0 4px 18px rgba(0,0,0,.08);backdrop-filter:blur(14px)";
          fallback = a;
          document.body.appendChild(a);
        }

        const observer = new MutationObserver(() => {
          if (document.querySelector(nativeSelector)) {
            fallback?.remove();
            fallback = null;
          }
        });
        document.addEventListener("DOMContentLoaded", () => {
          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(ensure, 900);
          setTimeout(ensure, 3000);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
