<!doctype html>
<html lang="en-GB">
<head>

  <title>Orca · 4SPECIES — A Living Planet</title>
  <style>
    :root { color-scheme:light; font-family:Arial,Helvetica,sans-serif; }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { padding:0; background:transparent; color:#111; }
    .card { display:flex; flex-direction:column; justify-content:space-between; min-height:268px; padding:clamp(20px,5vw,42px); border:1px solid #d9d9d9; border-radius:15px; background:#fff; box-shadow:0 8px 28px rgba(0,0,0,.035); }

    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(30px,6vw,52px); font-weight:400; line-height:1; margin:18px 0 4px; }
    .scientific { margin:0; font-style:italic; font-size:13px; color:#666; }
    .context { max-width:38ch; font-size:clamp(13px,2.8vw,16px); line-height:1.5; margin:20px 0; }
    footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid #e5e5e5; padding-top:15px; }
    .cta { color:#111; font-size:12px; font-weight:700; text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:2px; }
    .cta:hover,.cta:focus-visible { color:#155d57; outline-offset:4px; }
    .credit { color:#777; font-size:10px; letter-spacing:.08em; }
    @media (prefers-reduced-motion:no-preference) { .cta { transition:color 160ms ease; } }

</head>
<body>
  <article class="card" aria-labelledby="species-title">
    <div>

    </div>
    <footer>
      <a class="cta" href="https://4species.com/orca" target="_blank" rel="noopener noreferrer">Explore the orca <span aria-hidden="true">↗</span></a>
      <span class="credit">4PLANET · FOR A LIVING PLANET</span>
    </footer>
  </article>
</body>
</html>
