name: Claude Code Worker — Bounded Factory Candidate

on:
  push:
    branches:
      - factory/claude-product-worker-01
    paths:
      - "docs/claude/code-work-orders/*.md"

permissions:
  contents: write
  actions: read

# Every work-order commit is independent. Valuable work is never latest-wins.
# Each job writes only to its own deterministic candidate branch.
concurrency:
  group: claude-bounded-code-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bounded-code:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout Claude control lane
        uses: actions/checkout@v4
        with:
          ref: factory/claude-product-worker-01
          fetch-depth: 0

      - name: Resolve exactly one changed code work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            FILES="$(git show --pretty='' --name-only "$AFTER")"
          else
            FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          mapfile -t ORDERS < <(printf '%s\n' "$FILES" | grep '^docs/claude/code-work-orders/[^/]*\.md$' || true)
          if [[ "${#ORDERS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one code work order in this commit; found ${#ORDERS[@]}."
            exit 1
          fi
          ORDER_PATH="${ORDERS[0]}"
          ID="$(sed -n 's/^id:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          BASE_SHA="$(sed -n 's/^base_sha:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          TEST_PROFILE="$(sed -n 's/^test_profile:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          if [[ -z "$ID" || ! "$ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid work-order id"
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base_sha"
            exit 1
          fi
          if [[ "$TEST_PROFILE" != "FACTORY" && "$TEST_PROFILE" != "PRODUCT_UI" ]]; then
            echo "::error::Approved test_profile values are FACTORY or PRODUCT_UI"
            exit 1
          fi
          CANDIDATE="factory/claude-code/${ID}"
          cp "$ORDER_PATH" /tmp/claude-code-work-order.md
          cp CLAUDE.md /tmp/claude-code-context.md
          cp docs/claude/4PLANET_PRODUCT_BRAND_CORE.md /tmp/4planet-product-brand-core.md
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "test_profile=$TEST_PROFILE" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Create isolated candidate from pinned base
        shell: bash
        env:
          BASE_SHA: ${{ steps.order.outputs.base_sha }}
          CANDIDATE: ${{ steps.order.outputs.candidate }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --no-tags
          git checkout -B "$CANDIDATE" "$BASE_SHA"
          git config user.name "4PLANET Factory Claude Code Worker"
          git config user.email "actions@users.noreply.github.com"

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLAUDE_CODE_OAUTH_TOKEN:-}"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify bounded edit permission mode exists
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          claude --help > /tmp/claude-help.txt
          grep -q 'acceptEdits' /tmp/claude-help.txt

      - name: Execute bounded code work order
        id: claude
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN}" | tr -d '\r\n')"
          PROMPT=$(cat <<'EOF'
          You are the bounded Claude Code Worker inside the existing 4PLANET Production Factory.

          Read /tmp/claude-code-context.md, /tmp/4planet-product-brand-core.md and /tmp/claude-code-work-order.md completely before acting. The work order is a bounded internal coding/product task. Repository evidence outranks assumptions. For Product/Interface work, the Product + Brand Core is required context but remains subordinate to fresher Founder decisions, the work order and exact code truth.

          You MAY edit or create only paths explicitly listed as `write_scope:` in the work order. You MUST NOT touch any other file, dependency manifest, lockfile, workflow, secret, deployment, Canon, LIVE surface, or external system. Do not commit or push; the control plane does that after validation.

          Use independent product/interface judgement. The work order defines the user outcome, constraints and evidence; it does not force a weak implementation. Implement the smallest premium change that materially closes the stated gap. Preserve MUST-NOT-LOSE value. Do not add generic SaaS/dashboard/card clutter or speculative features simply to show activity.

          You do not have shell authority: do not attempt to run tests or network commands. The Factory control plane will run the approved validation profile after your edits. If the task cannot be completed inside the declared scopes, stop and explain rather than expanding authority. Spend turns on finishing the bounded implementation and a compact handoff, not exhaustive archaeology.
          EOF
          )
          claude -p "$PROMPT" \
            --model claude-opus-5 \
            --max-turns 60 \
            --permission-mode acceptEdits \
            --tools "Read,Grep,Glob,Edit,Write" \
            --no-session-persistence \
            > /tmp/claude-code-report.md
          test -s /tmp/claude-code-report.md

      - name: Enforce exact write scopes and protected-path firewall
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCOPES < <(sed -n 's/^write_scope:[[:space:]]*//p' /tmp/claude-code-work-order.md | tr -d '\r')
          if [[ "${#SCOPES[@]}" -eq 0 ]]; then
            echo "::error::No write_scope declared"
            exit 1
          fi
          mapfile -t CHANGED < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/.* -> //')
          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "::error::Claude produced no repository change"
            exit 1
          fi
          for FILE in "${CHANGED[@]}"; do
            case "$FILE" in
              .github/*|package.json|package-lock.json|factory/package.json|factory/package-lock.json|factory/wrangler.jsonc|wrangler.jsonc|CLAUDE.md|AGENTS.md)
                echo "::error::Protected path mutation: $FILE"
                exit 1
                ;;
            esac
            ALLOWED=false
            for SCOPE in "${SCOPES[@]}"; do
              if [[ "$FILE" == "$SCOPE" || "$FILE" == "$SCOPE"/* ]]; then
                ALLOWED=true
                break
              fi
            done
            if [[ "$ALLOWED" != "true" ]]; then
              echo "::error::Out-of-scope mutation: $FILE"
              exit 1
            fi
          done
          printf '%s\n' "${CHANGED[@]}" > /tmp/claude-changed-files.txt
          echo "CLAUDE_CODE_SCOPE_GATE=PASS"

      - name: Run approved validation profile
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.order.outputs.test_profile }}
        run: |
          set -euo pipefail
          if [[ "$TEST_PROFILE" == "FACTORY" ]]; then
            cd factory
            npm install --ignore-scripts
            npm run typecheck
            npm test
            echo "FACTORY_TYPECHECK_AND_TEST_PASS" > /tmp/claude-validation.txt
          elif [[ "$TEST_PROFILE" == "PRODUCT_UI" ]]; then
            npm install --ignore-scripts
            npm run typecheck
            npm run build
            npm run test:smoke
            echo "PRODUCT_UI_TYPECHECK_BUILD_SMOKE_PASS" > /tmp/claude-validation.txt
          else
            echo "::error::Unknown validation profile"
            exit 1
          fi

      - name: Persist candidate and evidence manifest
        shell: bash
        env:
          ID: ${{ steps.order.outputs.id }}
          BASE_SHA: ${{ steps.order.outputs.base_sha }}
          CANDIDATE: ${{ steps.order.outputs.candidate }}
          TEST_PROFILE: ${{ steps.order.outputs.test_profile }}
        run: |
          set -euo pipefail
          mkdir -p docs/claude/candidate-results
          RESULT="docs/claude/candidate-results/${ID}.md"
          VALIDATION="$(cat /tmp/claude-validation.txt)"
          {
            echo "# CLAUDE BOUNDED CODE RESULT"
            echo
            echo "work_order_id: $ID"
            echo "authority: BOUNDED_CODE_CANDIDATE_ONLY"
            echo "base_sha: $BASE_SHA"
            echo "candidate_branch: $CANDIDATE"
            echo "model: claude-opus-5"
            echo "test_profile: $TEST_PROFILE"
            echo "completed_at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "validation: $VALIDATION"
            echo "head_sha: RESOLVE_FROM_CANDIDATE_BRANCH_REF"
            echo
            echo "## Changed files"
            sed 's/^/- /' /tmp/claude-changed-files.txt
            echo
            echo "## Claude report"
            cat /tmp/claude-code-report.md
          } > "$RESULT"

          git add --all
          git commit -m "candidate(factory): Claude bounded code $ID"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease origin "HEAD:refs/heads/$CANDIDATE"
          echo "CLAUDE_CODE_CANDIDATE=$CANDIDATE"
          echo "CLAUDE_CODE_HEAD=$FINAL_SHA"
          echo "No merge, TEST KING, LIVE, Canon, external release or spend authority granted."

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-bounded-code-${{ steps.order.outputs.id }}-${{ github.sha }}
          path: |
            /tmp/claude-code-work-order.md
            /tmp/claude-code-report.md
            /tmp/claude-changed-files.txt
            /tmp/claude-validation.txt
          if-no-files-found: warn
          retention-days: 14
