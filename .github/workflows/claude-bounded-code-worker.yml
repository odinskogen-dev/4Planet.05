name: Claude Code Worker — Bounded Factory Candidate

on:
  push:
    branches:
      - factory/claude-product-worker-01
    paths:
      - "docs/claude/code-work-orders/*.md"

permissions:
  contents: write
  actions: read

# Every work-order commit is independent. Valuable work is never latest-wins.
# Each job writes only to its own deterministic candidate branch.
concurrency:
  group: claude-bounded-code-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bounded-code:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout Claude control lane
        uses: actions/checkout@v4
        with:
          ref: factory/claude-product-worker-01
          fetch-depth: 0

      - name: Resolve exactly one changed code work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            FILES="$(git show --pretty='' --name-only "$AFTER")"
          else
            FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          mapfile -t ORDERS < <(printf '%s\n' "$FILES" | grep '^docs/claude/code-work-orders/[^/]*\.md$' || true)
          if [[ "${#ORDERS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one code work order in this commit; found ${#ORDERS[@]}."
            exit 1
          fi
          ORDER_PATH="${ORDERS[0]}"
          ID="$(sed -n 's/^id:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          BASE_SHA="$(sed -n 's/^base_sha:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          TEST_PROFILE="$(sed -n 's/^test_profile:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          MODEL="$(sed -n 's/^model:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          ATTEMPT="$(sed -n 's/^dispatch_attempt:[[:space:]]*//p' "$ORDER_PATH" | head -n1 | tr -d '\r\n')"
          MODEL="${MODEL:-claude-opus-5}"
          ATTEMPT="${ATTEMPT:-1}"
          if [[ -z "$ID" || ! "$ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid work-order id"
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base_sha"
            exit 1
          fi
          if [[ "$TEST_PROFILE" != "FACTORY" && "$TEST_PROFILE" != "PRODUCT_UI" ]]; then
            echo "::error::Approved test_profile values are FACTORY or PRODUCT_UI"
            exit 1
          fi
          if [[ "$MODEL" != "claude-opus-5" && "$MODEL" != "claude-sonnet-5" && "$MODEL" != "claude-sonnet-4-6" ]]; then
            echo "::error::Unapproved Claude model: $MODEL"
            exit 1
          fi
          if [[ ! "$ATTEMPT" =~ ^[0-9]+$ || "$ATTEMPT" -lt 1 ]]; then
            echo "::error::Invalid dispatch_attempt"
            exit 1
          fi
          CANDIDATE="factory/claude-code/${ID}"
          cp "$ORDER_PATH" /tmp/claude-code-work-order.md
          cp CLAUDE.md /tmp/claude-code-context.md
          cp docs/claude/4PLANET_PRODUCT_BRAND_CORE.md /tmp/4planet-product-brand-core.md
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "test_profile=$TEST_PROFILE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "dispatch_attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "CLAUDE_CODE_MODEL=$MODEL"
          echo "CLAUDE_CODE_DISPATCH_ATTEMPT=$ATTEMPT"

      - name: Create isolated candidate from pinned base
        shell: bash
        env:
          BASE_SHA: ${{ steps.order.outputs.base_sha }}
          CANDIDATE: ${{ steps.order.outputs.candidate }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --no-tags
          git checkout -B "$CANDIDATE" "$BASE_SHA"
          git config user.name "4PLANET Factory Claude Code Worker"
          git config user.email "actions@users.noreply.github.com"

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLAUDE_CODE_OAUTH_TOKEN:-}"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify bounded edit permission mode exists
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          claude --help > /tmp/claude-help.txt
          grep -q 'acceptEdits' /tmp/claude-help.txt

      - name: Execute bounded code work order
        id: claude
        shell: bash
        env:
          MODEL: ${{ steps.order.outputs.model }}
          ID: ${{ steps.order.outputs.id }}
          DISPATCH_ATTEMPT: ${{ steps.order.outputs.dispatch_attempt }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN}" | tr -d '\r\n')"

          # Claude's repository Read tool is intentionally sandboxed and cannot read /tmp.
          # The control plane therefore injects the exact governed context into the prompt
          # instead of widening filesystem authority. Repository tools remain bounded below.
          PROMPT="$({
            cat <<'EOF'
          You are the bounded Claude Code Worker inside the existing 4PLANET Production Factory.

          The complete governed operating context, Product + Brand Core and exact bounded work order are injected below by the Factory control plane. Read all three sections completely before acting. Repository evidence outranks assumptions. The Product + Brand Core is required context for Product/Interface work but remains subordinate to fresher Founder decisions, the work order and exact code truth.

          You MAY edit or create only paths explicitly listed as `write_scope:` in the work order. You MUST NOT touch any other file, dependency manifest, lockfile, workflow, secret, deployment, Canon, LIVE surface, or external system. Do not commit or push; the control plane does that after validation.

          Use independent product/interface judgement. The work order defines the user outcome, constraints and evidence; it does not force a weak implementation. Implement the strongest premium solution that materially closes the stated gap inside the exact scope. Preserve MUST-NOT-LOSE value. Do not add generic SaaS/dashboard/card clutter or speculative features simply to show activity.

          You do not have shell authority: do not attempt to run tests or network commands. The Factory control plane will run the approved validation profile after your edits. If the task cannot be completed inside the declared scopes, stop and explain rather than expanding authority. Work token-efficiently: spend turns on material product judgement, implementation and a compact decision-complete handoff rather than repetitive archaeology or narration.

          ===== BEGIN CLAUDE OPERATING CONTEXT =====
          EOF
            cat /tmp/claude-code-context.md
            cat <<'EOF'
          ===== END CLAUDE OPERATING CONTEXT =====

          ===== BEGIN 4PLANET PRODUCT + BRAND CORE =====
          EOF
            cat /tmp/4planet-product-brand-core.md
            cat <<'EOF'
          ===== END 4PLANET PRODUCT + BRAND CORE =====

          ===== BEGIN BOUNDED WORK ORDER =====
          EOF
            cat /tmp/claude-code-work-order.md
            cat <<'EOF'
          ===== END BOUNDED WORK ORDER =====

          Execute the bounded work order now. Use repository Read/Grep/Glob for current code truth, and Edit/Write only inside the declared write_scope. Finish with the compact return requested by the work order.
          EOF
          })"

          set +e
          claude -p "$PROMPT" \
            --model "$MODEL" \
            --max-turns 60 \
            --permission-mode acceptEdits \
            --tools "Read,Grep,Glob,Edit,Write" \
            --no-session-persistence \
            > /tmp/claude-code-report.md 2>&1
          EXIT_CODE=$?
          set -e

          echo "capacity_paused=false" >> "$GITHUB_OUTPUT"
          echo "fatal_failure=false" >> "$GITHUB_OUTPUT"
          echo "retry_after=" >> "$GITHUB_OUTPUT"

          if [[ "$EXIT_CODE" -ne 0 ]]; then
            STATUS="FAILED"
            RETRY_AFTER=""
            if grep -Eiq "session limit|usage limit|rate limit|capacity.*limit" /tmp/claude-code-report.md; then
              STATUS="CAPACITY_PAUSED"
              RETRY_AFTER="$(date -u -d '+60 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
              echo "capacity_paused=true" >> "$GITHUB_OUTPUT"
              echo "retry_after=$RETRY_AFTER" >> "$GITHUB_OUTPUT"
              echo "CLAUDE_CODE_PROVIDER_CAPACITY=PAUSED"
              echo "CLAUDE_CODE_PROVIDER_RETRY_AFTER=$RETRY_AFTER"
            else
              echo "fatal_failure=true" >> "$GITHUB_OUTPUT"
              echo "::error::Claude bounded-code execution failed outside recognised provider-capacity conditions."
            fi

            # Partial model edits are never retained after a non-successful model call.
            git reset --hard HEAD
            git fetch origin factory/claude-product-worker-01 --no-tags
            git checkout -B claude-status origin/factory/claude-product-worker-01
            git config user.name "4PLANET Factory Claude Code Worker"
            git config user.email "actions@users.noreply.github.com"
            mkdir -p docs/claude/code-status
            STATUS_PATH="docs/claude/code-status/${ID}.md"
            {
              echo "# CLAUDE BOUNDED CODE STATUS"
              echo
              echo "work_order_id: $ID"
              echo "status: $STATUS"
              echo "dispatch_attempt: $DISPATCH_ATTEMPT"
              echo "model: $MODEL"
              echo "updated_at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              if [[ -n "$RETRY_AFTER" ]]; then
                echo "retry_after: $RETRY_AFTER"
                echo "provider_state: SUBSCRIPTION_CAPACITY_UNAVAILABLE"
              fi
              echo "authority: BOUNDED_CODE_CANDIDATE_ONLY"
              echo
              if [[ "$STATUS" == "CAPACITY_PAUSED" ]]; then
                echo "Claude subscription/session capacity was unavailable. No candidate mutation was retained. Retry the exact same governed work order after retry_after. Exact provider text remains in the immutable run artifact."
              else
                echo "Claude execution failed before a validated candidate existed. No partial mutation was retained. Exact execution detail remains in the immutable run artifact."
              fi
            } > "$STATUS_PATH"
            git add "$STATUS_PATH"
            git commit -m "status(factory): Claude bounded code $ID [$STATUS]"

            PUSHED=false
            for PUSH_ATTEMPT in 1 2 3; do
              if git push origin HEAD:factory/claude-product-worker-01; then
                PUSHED=true
                break
              fi
              git fetch origin factory/claude-product-worker-01 --no-tags
              git rebase origin/factory/claude-product-worker-01
            done
            if [[ "$PUSHED" != "true" ]]; then
              echo "::error::Unable to persist Claude code status after bounded retries."
              exit 1
            fi
            echo "CLAUDE_CODE_STATUS_PERSISTED=$STATUS"
            exit 0
          fi

          test -s /tmp/claude-code-report.md
          echo "CLAUDE_CODE_REAL_CALL=PASS"

      - name: Enforce exact write scopes and protected-path firewall
        if: steps.claude.outputs.capacity_paused != 'true' && steps.claude.outputs.fatal_failure != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCOPES < <(sed -n 's/^write_scope:[[:space:]]*//p' /tmp/claude-code-work-order.md | tr -d '\r')
          if [[ "${#SCOPES[@]}" -eq 0 ]]; then
            echo "::error::No write_scope declared"
            exit 1
          fi
          mapfile -t CHANGED < <(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/.* -> //')
          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "::error::Claude produced no repository change"
            exit 1
          fi
          for FILE in "${CHANGED[@]}"; do
            case "$FILE" in
              .github/*|package.json|package-lock.json|factory/package.json|factory/package-lock.json|factory/wrangler.jsonc|wrangler.jsonc|CLAUDE.md|AGENTS.md)
                echo "::error::Protected path mutation: $FILE"
                exit 1
                ;;
            esac
            ALLOWED=false
            for SCOPE in "${SCOPES[@]}"; do
              if [[ "$FILE" == "$SCOPE" || "$FILE" == "$SCOPE"/* ]]; then
                ALLOWED=true
                break
              fi
            done
            if [[ "$ALLOWED" != "true" ]]; then
              echo "::error::Out-of-scope mutation: $FILE"
              exit 1
            fi
          done
          printf '%s\n' "${CHANGED[@]}" > /tmp/claude-changed-files.txt
          echo "CLAUDE_CODE_SCOPE_GATE=PASS"

      - name: Run approved validation profile
        if: steps.claude.outputs.capacity_paused != 'true' && steps.claude.outputs.fatal_failure != 'true'
        shell: bash
        env:
          TEST_PROFILE: ${{ steps.order.outputs.test_profile }}
        run: |
          set -euo pipefail
          if [[ "$TEST_PROFILE" == "FACTORY" ]]; then
            cd factory
            npm install --ignore-scripts
            npm run typecheck
            npm test
            echo "FACTORY_TYPECHECK_AND_TEST_PASS" > /tmp/claude-validation.txt
          elif [[ "$TEST_PROFILE" == "PRODUCT_UI" ]]; then
            npm install --ignore-scripts
            npm run typecheck
            npm run build
            npm run test:smoke
            echo "PRODUCT_UI_TYPECHECK_BUILD_SMOKE_PASS" > /tmp/claude-validation.txt
          else
            echo "::error::Unknown validation profile"
            exit 1
          fi

      - name: Persist candidate and evidence manifest
        if: steps.claude.outputs.capacity_paused != 'true' && steps.claude.outputs.fatal_failure != 'true'
        shell: bash
        env:
          ID: ${{ steps.order.outputs.id }}
          BASE_SHA: ${{ steps.order.outputs.base_sha }}
          CANDIDATE: ${{ steps.order.outputs.candidate }}
          TEST_PROFILE: ${{ steps.order.outputs.test_profile }}
          MODEL: ${{ steps.order.outputs.model }}
          DISPATCH_ATTEMPT: ${{ steps.order.outputs.dispatch_attempt }}
        run: |
          set -euo pipefail
          mkdir -p docs/claude/candidate-results
          RESULT="docs/claude/candidate-results/${ID}.md"
          VALIDATION="$(cat /tmp/claude-validation.txt)"
          {
            echo "# CLAUDE BOUNDED CODE RESULT"
            echo
            echo "work_order_id: $ID"
            echo "status: COMPLETED"
            echo "dispatch_attempt: $DISPATCH_ATTEMPT"
            echo "authority: BOUNDED_CODE_CANDIDATE_ONLY"
            echo "base_sha: $BASE_SHA"
            echo "candidate_branch: $CANDIDATE"
            echo "model: $MODEL"
            echo "test_profile: $TEST_PROFILE"
            echo "completed_at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "validation: $VALIDATION"
            echo "head_sha: RESOLVE_FROM_CANDIDATE_BRANCH_REF"
            echo
            echo "## Changed files"
            sed 's/^/- /' /tmp/claude-changed-files.txt
            echo
            echo "## Claude report"
            cat /tmp/claude-code-report.md
          } > "$RESULT"

          git add --all
          git commit -m "candidate(factory): Claude bounded code $ID"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease origin "HEAD:refs/heads/$CANDIDATE"
          echo "CLAUDE_CODE_CANDIDATE=$CANDIDATE"
          echo "CLAUDE_CODE_HEAD=$FINAL_SHA"
          echo "No merge, TEST KING, LIVE, Canon, external release or spend authority granted."

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-bounded-code-${{ steps.order.outputs.id }}-${{ steps.order.outputs.dispatch_attempt }}-${{ github.sha }}
          path: |
            /tmp/claude-code-work-order.md
            /tmp/claude-code-report.md
            /tmp/claude-changed-files.txt
            /tmp/claude-validation.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail terminal Claude execution after status persistence
        if: steps.claude.outputs.fatal_failure == 'true'
        shell: bash
        run: |
          echo "::error::CLAUDE_BOUNDED_CODE_TERMINAL_EXECUTION_FAILURE"
          exit 1
