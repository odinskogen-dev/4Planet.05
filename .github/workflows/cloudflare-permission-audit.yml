name: Cloudflare Permission Audit

on:
  pull_request:
    branches:
      - sandbox/s4piens-narrative-journey-v04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe required Cloudflare read paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" "${api}/zones?name=s4piens.com")"
          zone_id="$(echo "$zones" | jq -r '.result[0].id')"
          account_id="$(echo "$zones" | jq -r '.result[0].account.id')"
          echo "::add-mask::${zone_id}"
          echo "::add-mask::${account_id}"

          probe() {
            label="$1"
            url="$2"
            code="$(curl -sS -o /tmp/cf.json -w '%{http_code}' "${auth[@]}" "$url" || true)"
            success="$(jq -r '.success // false' /tmp/cf.json 2>/dev/null || echo false)"
            echo "${label}: HTTP ${code} success=${success}"
          }

          probe "ZONE_LIST" "${api}/zones?name=s4piens.com"
          probe "DNS_RECORDS" "${api}/zones/${zone_id}/dns_records?per_page=1"
          probe "PAGES_PROJECTS" "${api}/accounts/${account_id}/pages/projects?per_page=1"
          probe "WORKERS_SCRIPTS" "${api}/accounts/${account_id}/workers/scripts"
          probe "WORKERS_ROUTES" "${api}/zones/${zone_id}/workers/routes"
          probe "KV_NAMESPACES" "${api}/accounts/${account_id}/storage/kv/namespaces?per_page=1"
          probe "R2_BUCKETS" "${api}/accounts/${account_id}/r2/buckets?per_page=1"
          probe "D1_DATABASES" "${api}/accounts/${account_id}/d1/database?per_page=1"
          probe "EMAIL_ROUTING_RULES" "${api}/zones/${zone_id}/email/routing/rules?per_page=1"
          probe "EMAIL_ROUTING_ADDRESSES" "${api}/accounts/${account_id}/email/routing/addresses?per_page=1"
