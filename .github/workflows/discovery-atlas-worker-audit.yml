name: DISCOVERY ATLAS worker origin audit

on:
  push:
    branches:
      - ops/discovery-atlas-live-deploy-20261003
    paths:
      - .github/workflows/discovery-atlas-worker-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Worker and current origin
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_1:-${TOKEN_2:-}}"
          test -n "$TOKEN"
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '\r\n')"
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          echo "::add-mask::$TOKEN"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $TOKEN")
          root="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          zid="$(jq -r '.result[0].id' <<<"$root")"
          account_id="$(jq -r '.result[0].account.id' <<<"$root")"
          routes="$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}")"
          echo "ATLAS ROUTE:"
          jq -r '.result[]? | select(.pattern=="4planet.org/atlas*") | [.pattern,.script] | @tsv' <<<"$routes"
          settings="$(curl -fsS "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains/settings" "${auth[@]}")"
          echo "WORKER SETTINGS:"
          jq '{compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags,usage_model:.result.usage_model,placement:.result.placement,observability:.result.observability,bindings:[.result.bindings[]? | {name,type}]}' <<<"$settings"
          curl -fsS -D /tmp/worker.headers "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains" "${auth[@]}" -o /tmp/worker.bin
          echo "HTTP HEADERS:"
          grep -Ei '^(content-type|etag|cf-ray|content-length):' /tmp/worker.headers || true
          echo "CONTENT TYPE:"
          file /tmp/worker.bin
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          headers=Path('/tmp/worker.headers').read_text('latin1')
          ct=next((line.split(':',1)[1].strip() for line in headers.splitlines() if line.lower().startswith('content-type:')),None)
          raw=Path('/tmp/worker.bin').read_bytes()
          msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin1')+raw)
          for part in msg.walk():
              if part.is_multipart(): continue
              payload=part.get_payload(decode=True) or b''
              if b'export default' in payload and b'async fetch' in payload:
                  Path('/tmp/worker.js').write_bytes(payload)
                  break
          PY
          echo "MODULE MARKERS:"
          grep -E 'export default|addEventListener|async fetch' /tmp/worker.js | head -20 || true
          echo "EDGE SHIM:"
          grep -n -A90 -B8 'function edgeShim' /tmp/worker.js || true
          echo "LITERAL ESCAPE MARKERS:"
          grep -n -F '\\n' /tmp/worker.js | head -40 || true
          echo "PATH HELPERS:"
          grep -n -A18 -B4 'function withTrailingSlash' /tmp/worker.js || true
          echo "PROXY FUNCTION:"
          grep -n -A95 -B10 'function proxy' /tmp/worker.js || true
          echo "ATLAS HOST BLOCK:"
          grep -n -A18 -B4 'host === "4planetatlas.com"' /tmp/worker.js || true
          echo "PAGES ORIGINS:"
          strings /tmp/worker.js | grep -Eo 'https://[a-z0-9-]+[.]4planet-05[.]pages[.]dev' | sort -u || true
          echo "RELEVANT STRINGS:"
          strings /tmp/worker.js | grep -E 'atlas|species|pages[.]dev|4planet' | head -120 || true
