name: WILD ORCA Public Release QA

on:
  push:
    branches: [main]
    paths:
      - public/games/**
      - public/_redirects
      - functions/_middleware.js
      - .github/workflows/wild-orca-public-release-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-orca-public-release-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify 4PLANET Games live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 20 https://4planet.org/games || true)
            if grep -Fq 'WILD: ORCA' <<<"$page"               && grep -Fq '4planet.org/games/wild-orca/' <<<"$page"               && grep -Fq 'Early playable build' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'WILD_ORCA_4PLANET_GAMES_LIVE_PASS'

      - name: Verify 4SPECIES play entry live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 20 https://4species.com/ || true)
            if grep -Eq 'wild-orca-play|data-wild-orca-cta' <<<"$page" && grep -Fq 'https://4planet.org/games' <<<"$page" && grep -Fq 'WILD: ORCA' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'WILD_ORCA_4SPECIES_ENTRY_LIVE_PASS'

      - name: Verify Claude original byte-exact embedded render bundle
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 30 https://4planet.org/games/wild-orca/ || true)
            if grep -Fq 'window.__WILD_EMBED=' <<<"$page" && grep -Fq 'orca_decoded.glb' <<<"$page" && grep -Fq 'WILD: ORCA' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          html_sha=$(curl -fsSL --max-time 60 https://4planet.org/games/wild-orca/ | sha256sum | cut -d' ' -f1)
          test "$html_sha" = "666d04803d9118a8b12bc2619a58c3609f5b4f0347e12e0f7ab9bb34bdfdb95d"
          response_headers=$(curl -fsSI --max-time 25 https://4planet.org/games/wild-orca/)
          grep -Fq 'sha256-OARO1lDpRsoNKF+o/JPex5J3yymk87t7kZySvn8L54U=' <<<"$response_headers"
          grep -Fq 'sha256-AAFnkLX8/k0wjBNmP8S3ba7c7bTLiIc2HvFjJykd0dc=' <<<"$response_headers"
          echo 'CHALLENGER02_ORIGINAL_EMBEDDED_ORCA_BYTE_AND_CSP_PASS'
