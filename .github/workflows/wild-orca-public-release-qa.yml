name: WILD ORCA Public Release QA

on:
  push:
    branches: [main]
    paths:
      - public/games/**
      - public/_redirects
      - functions/_middleware.js
      - .github/workflows/wild-orca-public-release-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-orca-public-release-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify 4PLANET Games live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 20 https://4planet.org/games || true)
            if grep -Fq 'WILD: ORCA' <<<"$page"               && grep -Fq '4planet.org/games/wild-orca/' <<<"$page"               && grep -Fq 'Early playable build' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'WILD_ORCA_4PLANET_GAMES_LIVE_PASS'

      - name: Verify 4SPECIES play entry live
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 20 https://4species.com/ || true)
            if grep -Eq 'wild-orca-play|data-wild-orca-cta' <<<"$page" && grep -Fq 'https://4planet.org/games' <<<"$page" && grep -Fq 'WILD: ORCA' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'WILD_ORCA_4SPECIES_ENTRY_LIVE_PASS'

      - name: Verify Challenger 02 exact runtime and bundled audio
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            page=$(curl -fsSL --max-time 20 https://4planet.org/games/wild-orca/ || true)
            if grep -Fq 'index-BbW3fnWW.js' <<<"$page" && grep -Fq 'WILD: ORCA' <<<"$page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          js=$(curl -fsSL --max-time 45 https://4planet.org/games/wild-orca/assets/index-BbW3fnWW.js | sha256sum | cut -d' ' -f1)
          test "$js" = "0f081397e8698afefcffd4053caf6f59897669d668925ed6ddaeec09996ce6c3"
          css=$(curl -fsSL --max-time 30 https://4planet.org/games/wild-orca/assets/index-DL2byyip.css | sha256sum | cut -d' ' -f1)
          test "$css" = "f0804118643f39b93fc50435c234315765df4ecbdaf2c69272539eb022e6c922"
          model=$(curl -fsSL --max-time 40 https://4planet.org/games/wild-orca/assets/orca_decoded.glb | sha256sum | cut -d' ' -f1)
          test "$model" = "4842393319a37cc72f8e8b478b63711aaca405ea8111fd082d5ba9f6b2ce208d"
          echo 'WILD_ORCA_CHALLENGER02_EXACT_PUBLIC_ASSETS_PASS'
