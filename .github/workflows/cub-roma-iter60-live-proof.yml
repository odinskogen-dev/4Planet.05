name: CUB ROMA Iteration 60 exact public deployment proof
on:
  push:
    branches: [cub-roma-republic-v12-release-20261023]
    paths: [.github/workflows/cub-roma-iter60-live-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check deployed exact HTML, both web entrypoints and unchanged Cannae
        shell: bash
        run: |
          set -euo pipefail
          for host in "https://cub-lab-p4nther.odin-skogen.workers.dev" "https://lab.p4nther.com" "https://labs.p4nther.com"; do
            echo "HOST=$host"
            ready=0
            for attempt in $(seq 1 10); do
              if curl -fsSL --max-time 35 "$host/rome/index.html" -o /tmp/roma60-live.html && echo '67c2c496982f646e4b2f2f1d4f4c78f09970c57a2a7a1177855d0628a74a3582  /tmp/roma60-live.html' | sha256sum -c -; then ready=1; break; fi
              sleep 3
            done
            test "$ready" = 1 || { echo "ITER59_HASH_MISMATCH_ON=$host"; exit 3; }
            curl -fsSL --max-time 30 "$host/rome/tiles/r0c0.jpg" -o /tmp/roma60-tile.jpg
            echo '521acd746e0108cda164ea04cfe1c5b4f6f3898c11bc8f867cb79a4cc0cc6aab  /tmp/roma60-tile.jpg' | sha256sum -c -
            curl -fsSL --max-time 20 "$host/" -o /tmp/roma60-home.html
            grep -Fq 'Play ROMA · Iteration 60' /tmp/roma60-home.html
            grep -Fq 'href="/rome/"' /tmp/roma60-home.html
            curl -fsSL --max-time 20 "$host/games/roma/" -o /tmp/roma60-product.html
            grep -Fq 'Play ROMA · Iteration 60' /tmp/roma60-product.html
            grep -Fq 'href="/rome/"' /tmp/roma60-product.html
            curl -fsSL --max-time 20 "$host/roma/index.html" -o /tmp/roma60-cannae.html
            echo '3135d7a68083a013e90735266240a05d1a15dceb87cde2002520832cf9b42ae3  /tmp/roma60-cannae.html' | sha256sum -c -
            curl -fsSL --max-time 20 "$host/roma/challenger-08/index.html" -o /tmp/roma60-ch08.html
            echo 'fc5d999bf0099ab0e99523f76019f0f8b1089da678558c1d0f2c7d8c78ba949e  /tmp/roma60-ch08.html' | sha256sum -c -
            echo "ITER59_EXACT_LIVE_AND_LEGACY_PRESERVED=$host"
          done

# Rechecked against Cloudflare production release run 40780007591.
