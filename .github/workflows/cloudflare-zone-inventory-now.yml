name: Main Pages Failure Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect failed main Pages deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n'); token="${token#Bearer }"
          echo "::add-mask::$token"
          api='https://api.cloudflare.com/client/v4'
          z=$(curl -fsS -H "Authorization: Bearer $token" "$api/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id' <<<"$z")
          resp=$(curl -fsS -H "Authorization: Bearer $token" "$api/accounts/$aid/pages/projects/4planet-05/deployments?per_page=25")
          dep=$(jq -c '.result[] | select(.deployment_trigger.metadata.commit_hash=="e4dd932e739056911d0d40958b30c1c9faa98071")' <<<"$resp" | head -1)
          echo "DEPLOYMENT=$dep"
          id=$(jq -r '.id // empty' <<<"$dep")
          if [ -n "$id" ]; then
            echo '=== EXACT DEPLOYMENT ==='
            curl -fsS -H "Authorization: Bearer $token" "$api/accounts/$aid/pages/projects/4planet-05/deployments/$id" | jq '.result'
          fi
