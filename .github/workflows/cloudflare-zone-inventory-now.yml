name: Discoverability Live Diagnostic

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe current live public and private surfaces
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            echo "=== $url ==="
            curl -sSIL --max-time 20 "$url" | tr -d '\r' | grep -Ei '^(HTTP/|location:|content-type:|x-robots-tag:|cache-control:|link:)' | tail -20 || true
            curl -sSL --max-time 20 "$url" -o /tmp/probe-body || true
            head -c 1800 /tmp/probe-body | tr '\n' ' '; echo
          }
          probe https://4planetmarket.com/
          probe https://4planetmarket.com/robots.txt
          probe https://4planetmarket.com/sitemap.xml
          probe https://4planetmarket.com/api/market-health
          probe https://cre4tors.com/
          probe https://cre4tors.com/robots.txt
          probe https://cre4tors.com/sitemap.xml
          probe https://4brain.app/
          probe https://4brain.app/robots.txt
          probe https://4brain.app/sitemap.xml
          probe https://4planet.org/sitemap.xml
          probe https://s4piens.com/
          probe https://s4piens.com/robots.txt
          probe https://s4piens.com/sitemap.xml
          probe https://labs.4planet.org/
          probe https://id.4planet.org/
          probe https://4sapien.com/
          probe https://4sapien.com/robots.txt
          probe https://4sapien.com/sitemap.xml
          probe https://4sapien.com/app/food/
          probe https://4sapien.com/brain/
# rerun current live discovery verification 2026-10-05T14:15Z

# verify canonical consolidation after main deploy
