name: Cloudflare Worker Source Context Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$candidate" ] && { TOKEN="$candidate"; break; }; done
          [ -n "$TOKEN" ] || exit 2
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Print bounded source context
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zones=$(curl -fsS "${api}/zones?per_page=50" "${auth[@]}")
          aid=$(jq -r '.result[0].account.id' <<<"$zones")
          for s in 4planetmarket-prototype cre4tors-prototype n4turetech-treeoflife-proto 4planet-nation-live 4species-router 4planet-brain-public 4planet-product-domains; do
            echo "=== $s ==="
            tmp=$(mktemp)
            curl -fsS -o "$tmp" "${api}/accounts/${aid}/workers/scripts/${s}" "${auth[@]}"
            case "$s" in
              4planetmarket-prototype) sed -n '780,880p' "$tmp";;
              cre4tors-prototype) sed -n '1,120p' "$tmp";;
              n4turetech-treeoflife-proto) sed -n '1,120p' "$tmp";;
              4planet-nation-live) sed -n '1,140p' "$tmp";;
              4species-router) sed -n '1,150p' "$tmp";;
              4planet-brain-public) sed -n '1,110p' "$tmp";;
              4planet-product-domains) sed -n '1,180p' "$tmp";;
            esac
            rm -f "$tmp"
          done
          echo '=== END ==='
