name: Live Discovery Verification

on:
  push:
    branches:
      - king/test
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify canonical public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://4planet.org/sitemap.xml \
            https://4planet.org/robots.txt \
            https://4planetatlas.com/ \
            https://4planetatlas.com/robots.txt \
            https://4planetatlas.com/sitemap.xml \
            https://4brands.org/ \
            https://4brands.org/robots.txt \
            https://4brands.org/sitemap.xml \
            https://s4piens.com/ \
            https://4planetmagazine.com/magazine/ \
            https://4sapien.com/ \
            https://4species.com/ \
            https://4nation.org/ \
            https://4brain.app/ \
            https://4planetmarket.com/ \
            https://cre4tors.com/ \
            https://n4turetech.com/; do
            echo "=== $url ==="
            curl -L -sS --max-time 15 -D /tmp/headers -o /tmp/body "$url" || true
            tr -d '\r' </tmp/headers | grep -Ei '^(HTTP/|content-type:|x-robots-tag:|location:|link:)' | tail -12 || true
            head -c 700 /tmp/body | tr '\n' ' '; echo
          done
