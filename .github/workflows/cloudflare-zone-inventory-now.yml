name: Pages Deployment State Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read Cloudflare Pages deploy state and live discovery
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n'); token="${token#Bearer }"
          echo "::add-mask::$token"
          api='https://api.cloudflare.com/client/v4'
          z=$(curl -fsS -H "Authorization: Bearer $token" "$api/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id' <<<"$z")
          echo '=== PAGES DEPLOYS ==='
          curl -fsS -H "Authorization: Bearer $token" "$api/accounts/$aid/pages/projects/4planet-05/deployments?per_page=20" |
            jq -r '.result[] | [(.environment//""),(.deployment_trigger.metadata.branch//""),(.deployment_trigger.metadata.commit_hash//""),(.latest_stage.status//""),(.url//"")] | @tsv' | head -20
          echo '=== LIVE S4PIENS ==='
          for u in https://s4piens.com/ https://s4piens.com/robots.txt https://s4piens.com/sitemap.xml; do
            echo "--- $u"; curl -LfsS --max-time 15 -D /tmp/h -o /tmp/b "$u" || true; tr -d '\r' </tmp/h | grep -Ei '^(HTTP/|content-type:|x-robots-tag:|location:)' | tail -8 || true; head -c 900 /tmp/b | tr '\n' ' '; echo
          done
          echo '=== LIVE 4PLANET SITEMAP MARKERS ==='
          sm=$(curl -fsS --max-time 15 https://4planet.org/sitemap.xml)
          printf 'atlas='; grep -c '<loc>https://4planet.org/atlas</loc>' <<<"$sm" || true
          printf 'species='; grep -c '<loc>https://4planet.org/species</loc>' <<<"$sm" || true
          printf 'orca='; grep -c '<loc>https://4planet.org/species/orca</loc>' <<<"$sm" || true
          echo '=== END ==='
