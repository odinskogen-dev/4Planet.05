name: Worker Source Focus Now
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/cloudflare-zone-inventory-now.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          T=$(printf '%s' "$T" | tr -d '\r\n'); T="${T#Bearer }"; echo "::add-mask::$T"; echo "T=$T" >> "$GITHUB_ENV"
      - name: Print 4SPECIES and 4NATION source
        run: |
          set -e
          api='https://api.cloudflare.com/client/v4'
          z=$(curl -fsS -H "Authorization: Bearer $T" "$api/zones?per_page=1")
          a=$(jq -r '.result[0].account.id' <<<"$z")
          echo '=== 4SPECIES ==='
          curl -fsS -H "Authorization: Bearer $T" "$api/accounts/$a/workers/scripts/4species-router" | sed -n '1,220p'
          echo '=== 4NATION ==='
          curl -fsS -H "Authorization: Bearer $T" "$api/accounts/$a/workers/scripts/4planet-nation-live" | sed -n '1,180p'
          echo '=== END ==='
