name: Public Discoverability Audit Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit public domains read-only
        shell: bash
        run: |
          set -euo pipefail
          domains=(
            4planet.org
            4planetatlas.com
            4planetmagazine.com
            4planetmarket.com
            4sapien.com
            s4piens.com
            4brands.org
            4nation.org
            4species.com
            cre4tors.com
            n4turetech.com
            oddekalv.org
            4brain.app
          )
          echo '=== PUBLIC DISCOVERABILITY AUDIT ==='
          for d in "${domains[@]}"; do
            echo "--- $d ---"
            headers=$(mktemp); body=$(mktemp)
            if curl -LfsS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" "https://$d/"; then
              final=$(curl -LIsS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{url_effective}|%{http_code}|%{content_type}' "https://$d/" || true)
              xrobots=$(awk 'BEGIN{IGNORECASE=1}/^x-robots-tag:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print}' "$headers" | tail -1)
              title=$(python3 -c 'import re,sys; s=open(sys.argv[1],errors="ignore").read(); m=re.search(r"<title[^>]*>(.*?)</title>",s,re.I|re.S); print(re.sub(r"\\s+"," ",m.group(1)).strip() if m else "")' "$body")
              meta=$(python3 -c 'import re,sys; s=open(sys.argv[1],errors="ignore").read(); ms=re.findall(r"<meta[^>]+>",s,re.I); vals=[]; [vals.append(x) for x in ms if re.search(r"(name|property)=[\"\\x27]robots[\"\\x27]",x,re.I)]; print(" ".join(vals)[:800])' "$body")
              canon=$(python3 -c 'import re,sys; s=open(sys.argv[1],errors="ignore").read(); m=re.search(r"<link[^>]+rel=[\"\\x27]canonical[\"\\x27][^>]*href=[\"\\x27]([^\"\\x27]+)",s,re.I); print(m.group(1) if m else "")' "$body")
              echo "ROOT|$final|XROBOTS=${xrobots:-NONE}|TITLE=${title:-NONE}|CANON=${canon:-NONE}|META_ROBOTS=${meta:-NONE}"
            else
              echo 'ROOT|FETCH_FAILED'
            fi
            rm -f "$headers" "$body"

            rcode=$(curl -LsS --connect-timeout 5 --max-time 12 -o /tmp/robots.$$ -w '%{http_code}|%{content_type}' "https://$d/robots.txt" || true)
            rbody=$(tr '\n' ' ' </tmp/robots.$$ | head -c 700 || true)
            echo "ROBOTS|$rcode|$rbody"
            rm -f /tmp/robots.$$

            scode=$(curl -LsS --connect-timeout 5 --max-time 12 -o /tmp/sitemap.$$ -w '%{http_code}|%{content_type}' "https://$d/sitemap.xml" || true)
            sbody=$(head -c 240 /tmp/sitemap.$$ | tr '\n' ' ' || true)
            echo "SITEMAP|$scode|$sbody"
            rm -f /tmp/sitemap.$$
          done
          echo '=== END ==='
