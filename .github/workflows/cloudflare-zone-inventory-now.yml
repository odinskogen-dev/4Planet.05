name: Cloudflare Pages Inventory Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && { TOKEN="$candidate"; break; }
          done
          [ -n "$TOKEN" ] || { echo 'missing Cloudflare token'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: List Pages projects and domains read-only
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl -fsS "${api}/zones?per_page=50" "${auth[@]}")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          [ -n "$aid" ] || { echo 'No account id'; exit 3; }
          resp=$(curl -fsS "${api}/accounts/${aid}/pages/projects" "${auth[@]}")
          jq -e '.success == true' <<<"$resp" >/dev/null
          echo '=== PAGES PROJECTS ==='
          jq -r '.result[] | {
            name,
            subdomain,
            production_branch,
            domains,
            source:(.source.config // {}),
            build_config:(.build_config // {}),
            deployment_configs:{
              production:{
                compatibility_date:(.deployment_configs.production.compatibility_date // null),
                env_vars:((.deployment_configs.production.env_vars // {})|keys)
              },
              preview:{
                compatibility_date:(.deployment_configs.preview.compatibility_date // null),
                env_vars:((.deployment_configs.preview.env_vars // {})|keys)
              }
            }
          } | @json' <<<"$resp"
          echo '=== END ==='
