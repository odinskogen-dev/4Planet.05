name: Cloudflare Worker SEO Source Audit Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$candidate" ] && { TOKEN="$candidate"; break; }; done
          [ -n "$TOKEN" ] || exit 2
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Inspect SEO-sensitive Worker source read-only
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          zones=$(curl -fsS "${api}/zones?per_page=50" "${auth[@]}")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          scripts=(
            4planetmarket-prototype
            cre4tors-prototype
            n4turetech-treeoflife-proto
            four-sapien-embla
            4planet-nation-live
            4species-router
            4planet-brain-public
            4planet-product-domains
          )
          echo '=== WORKER SEO SOURCE AUDIT ==='
          for s in "${scripts[@]}"; do
            echo "--- $s ---"
            tmp=$(mktemp)
            headers=$(mktemp)
            if curl -fsS -D "$headers" -o "$tmp" "${api}/accounts/${aid}/workers/scripts/${s}" "${auth[@]}"; then
              ct=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print}' "$headers" | tail -1)
              echo "CONTENT_TYPE=$ct"
              echo "SIZE=$(wc -c <"$tmp")"
              echo 'SEO_LINES_BEGIN'
              grep -ainE 'noindex|nofollow|robots|sitemap|canonical|x-robots|<title|description|hostname|host' "$tmp" | head -120 || true
              echo 'SEO_LINES_END'
            else
              echo 'FETCH_FAILED'
            fi
            rm -f "$tmp" "$headers"
          done
          echo '=== END ==='
