name: Cloudflare Worker Domain Inventory Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$candidate" ] && { TOKEN="$candidate"; break; }; done
          [ -n "$TOKEN" ] || exit 2
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: List worker scripts and custom domains read-only
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl -fsS "${api}/zones?per_page=50" "${auth[@]}")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          echo '=== WORKER SCRIPTS ==='
          scripts=$(curl -fsS "${api}/accounts/${aid}/workers/scripts" "${auth[@]}" || echo '{"result":[]}')
          jq -r '.result[]? | [.id, (.modified_on // ""), (.etag // "")] | @tsv' <<<"$scripts"
          echo '=== WORKER CUSTOM DOMAINS ==='
          domains=$(curl -fsS "${api}/accounts/${aid}/workers/domains" "${auth[@]}" || echo '{"result":[]}')
          jq -r '.result[]? | [.hostname, (.service // ""), (.environment // ""), (.zone_id // "")] | @tsv' <<<"$domains"
          echo '=== ZONE WORKER ROUTES ==='
          jq -r '.result[] | [.id,.name] | @tsv' <<<"$zones" | while IFS=$'\t' read -r zid name; do
            routes=$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}" || echo '{"result":[]}')
            jq -r --arg z "$name" '.result[]? | [$z,.pattern,(.script//"<none>")] | @tsv' <<<"$routes"
          done
          echo '=== END ==='
