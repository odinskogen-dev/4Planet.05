name: Cloudflare Zone Inventory Now

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-zone-inventory-now.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && { TOKEN="$candidate"; break; }
          done
          [ -n "$TOKEN" ] || { echo 'missing Cloudflare token'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: List zones and public routing read-only
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl -fsS "${api}/zones?per_page=50&order=name&direction=asc" "${auth[@]}")
          jq -e '.success == true' <<<"$zones" >/dev/null
          echo '=== CLOUDFLARE PUBLIC DOMAIN INVENTORY ==='
          jq -r '.result[] | [.id,.name] | @tsv' <<<"$zones" | while IFS=$'\t' read -r zid domain; do
            dns=$(curl -fsS "${api}/zones/${zid}/dns_records?per_page=100" "${auth[@]}")
            apex=$(jq -r --arg d "$domain" '[.result[]? | select(.name==$d and (.type=="A" or .type=="AAAA" or .type=="CNAME")) | (.type+":"+(.content//""))] | join(",")' <<<"$dns")
            www=$(jq -r --arg d "www.$domain" '[.result[]? | select(.name==$d and (.type=="A" or .type=="AAAA" or .type=="CNAME")) | (.type+":"+(.content//""))] | join(",")' <<<"$dns")
            routes=$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}" || echo '{"result":[]}')
            rtxt=$(jq -r '[.result[]? | (.pattern+"=>"+(.script//"<none>"))] | join(",")' <<<"$routes")
            probe=$(curl -LIsS --connect-timeout 4 --max-time 10 -o /dev/null -w '%{http_code}|%{url_effective}' "https://$domain/" || true)
            [ -n "$probe" ] || probe='000|'
            printf '%s\t%s\t%s\t%s\t%s\n' "$domain" "${apex:-NONE}" "${www:-NONE}" "${rtxt:-NONE}" "$probe"
          done
          echo '=== END ==='
