name: Dependency Repair Proposal

on:
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'prepare dependency repair workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: build/four-product-integrated-prototype

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched runtime and tooling dependencies
        run: |
          npm install react-router-dom@latest
          npm install --save-dev eslint@latest @eslint/js@latest typescript-eslint@latest

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Contract and smoke tests
        run: npm run test:smoke

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit tested dependency repair
        run: |
          git config user.name "4PLANET dependency control"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "apply tested dependency security repair"
          git push origin HEAD:build/four-product-integrated-prototype
