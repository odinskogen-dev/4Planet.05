name: Magazine dependency security upgrade — candidate only
on:
  push:
    branches:
      - fix/magazine-http-https-20261019
    paths:
      - '.github/workflows/magazine-security-upgrade-candidate.yml'

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Repair known audited vulnerabilities in candidate only
        run: |
          npm audit fix --force || true
          npm ls --depth=0
          npm audit --audit-level=high
      - name: Block any remaining high and critical dependencies
        run: npm audit --audit-level=high
      - name: Compile full app
        run: npm run typecheck
      - name: Run Magazine and Films contracts
        run: npm run test:magazine
      - name: Build static and client products
        env:
          VITE_MAGAZINE_SITE_ORIGIN: https://4planetmagazine.com
        run: npm run build
      - name: Commit repaired dependencies only after green checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '4PLANET Candidate QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No changes required'; exit 0; }
          git commit -m 'fix(security): resolve high and critical npm advisories after candidate gates'
          git push origin HEAD:fix/magazine-http-https-20261019
