name: SPECIES Safari Route Regression
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/species-safari-routing-repro.yml]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Diagnose public ATLAS API responses
        shell: bash
        run: |
          for host in 4species.com species-v53.4planet-05.pages.dev 4planet-05.pages.dev; do
            echo "== https://$host/api/atlas-species?name=Orcinus%20orca =="
            curl -sS -L -D "/tmp/atlas-$host.headers" -o "/tmp/atlas-$host.body" -w 'http=%{http_code} final=%{url_effective} type=%{content_type}\n' --max-time 18 "https://$host/api/atlas-species?name=Orcinus%20orca" || true
            head -n 15 "/tmp/atlas-$host.headers" || true
            head -c 180 "/tmp/atlas-$host.body" || true
            echo
          done
      - name: Prove public v53 homepage and six clean species URLs on iPhone Safari/WebKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/species-safari
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {webkit,devices} from '@playwright/test';
          const browser=await webkit.launch({headless:true});
          const entries=[['orca','Orca'],['english-oak','English oak'],['atlantic-puffin','Atlantic puffin'],['western-honey-bee','Western honey bee'],['fly-agaric','Fly agaric'],['common-octopus','Common octopus']];
          for(const [device,profile] of [['iPhone 13',devices['iPhone 13']],['desktop',{viewport:{width:1440,height:900}}]]) {
            const context=await browser.newContext(profile);
            const page=await context.newPage();
            const errs=[];page.on('pageerror',e=>errs.push(String(e)));
            await page.goto('https://4species.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.getByRole('heading',{name:/Meet life on Earth/i}).first().waitFor({timeout:25000});
            await page.getByRole('combobox',{name:'Search species'}).fill('orca');
            await page.getByRole('combobox',{name:'Search species'}).press('Enter');
            await page.waitForURL(/\/orca(?:\?|#|$)/,{timeout:20000});
            await page.getByRole('heading',{name:/^Orca$/i}).first().waitFor({timeout:20000});
            console.log('SEARCH_PASS '+device+' '+page.url());
            for(const [slug,name] of entries) {
              // Direct link + intentional stale hash from the previous Orca prototype.
              for(const suffix of ['', '#/labs/species/orca']) {
                await page.goto('https://4species.com/'+slug+suffix,{waitUntil:'domcontentloaded',timeout:45000});
                await page.getByRole('heading',{name:new RegExp('^'+name+'$','i')}).first().waitFor({timeout:20000});
                assert.equal(new URL(page.url()).pathname,'/'+slug);
                const text=await page.locator('h1').first().innerText();
                assert.equal(text.toLowerCase(),name.toLowerCase());
              }
              console.log('SPECIES_PASS '+device+' '+slug);
            }
            for(const pathname of ['/explore','/quiz','/about']){
              const response=await page.goto('https://4species.com'+pathname,{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(response.status(),200);
              assert.equal(new URL(page.url()).pathname,pathname);
              await page.locator('h1').first().waitFor({timeout:20000});
              console.log('UNIVERSE_PASS '+device+' '+pathname);
            }
            const old=await page.request.get('https://4species.com/species/orca',{maxRedirects:0});
            assert.equal(old.status(),301);
            assert.equal(old.headers().location,'https://4species.com/orca');
            assert.equal(errs.length,0,'Runtime errors on '+device+': '+errs.join('; '));
            await page.screenshot({path:'/tmp/species-safari/home-'+device.replace(/\s/g,'-')+'.png'});
            await context.close();
          }
          await browser.close();
          console.log('SPECIES_V53_WEBKIT_ROUTING_ALL_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: species-v53-safari-proof
          path: /tmp/species-safari
          retention-days: 14
          if-no-files-found: ignore
