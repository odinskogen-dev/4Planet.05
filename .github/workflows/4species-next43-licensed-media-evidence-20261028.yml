name: 4SPECIES Remaining 43 Licensed Photo and Asset Attribution Evidence 20261028
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/4species-next43-licensed-media-evidence-20261028.yml]
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Research each missing species' rights-preserving photo sources, never deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/species-next43-media-root /tmp/species-next43-media-reports
          SPECIES_OUTPUT_ROOT=/tmp/species-next43-media-root \
            SPECIES_REPORT_DIR=/tmp/species-next43-media-reports \
            node ops/species/next61/build-cohort.mjs --build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('/tmp/species-next43-media-reports/research-report.json','utf8'));
          const current=new Set('koala quokka capybara red-fox giant-anteater giant-otter walrus common-kingfisher secretary-bird scarlet-macaw peregrine-falcon ocean-sunfish giant-manta-ray greater-blue-ringed-octopus peacock-mantis-shrimp venus-flytrap titan-arum giant-sequoia'.split(' '));
          const visual=JSON.parse(fs.readFileSync('ops/species/next61/v1-visual-approved-20261022.json','utf8')).approved;
          const rejects=JSON.parse(fs.readFileSync('ops/species/next61/photo-visual-rejects-20261021.json','utf8')).rejects;
          const rejectIds=new Set(rejects.map(p=>Number(p.photoId)));
          assert.equal(report.records.length,61);
          const remaining=report.records.filter(r=>!current.has(r.slug));
          assert.equal(remaining.length,43);
          const inventory=remaining.map(r=>{
            const photos=(r.pictures||[]).filter(p=>p.artist&&p.license&&p.licenceUrl&&p.sourcePage&&
              String(p.sourcePage).startsWith('https://')&&/^[0-9a-f]{64}$/i.test(p.sha256||'')&&
              (p.photoId==null||!rejectIds.has(Number(p.photoId)))&&p.local&&
              fs.existsSync(path.join('/tmp/species-next43-media-root/public',p.local.replace(/^\//,''))));
            // Candidate only; human photo identity/captive/quality and rights still need Gold.
            const best=photos[0];
            const fallback=best?{
              photoId:best.photoId??null,
              sourcePage:best.sourcePage,artist:best.artist,license:best.license,
              licenceUrl:best.licenceUrl,local:best.local,sha256:best.sha256,
              candidateTitle:(r.commonName||r.slug)+' — Photograph: '+best.artist+' · '+best.license,
              priorVisualShortlist:!!visual[r.slug]&&visual[r.slug].sha256===best.sha256,
              observationQuality:best.observationQuality||null,
              captive:best.captive??null
            }:null;
            return {slug:r.slug,photoCandidatesFromLicensedSources:photos.length,shortlisted:fallback,
              visualIdentityApprovedByIndependentGold:false,rightsVerifiedForRelease:false};
          });
          const found=inventory.filter(x=>x.shortlisted).length;
          const pinned=inventory.filter(x=>x.shortlisted?.priorVisualShortlist).length;
          const result={status:'CANDIDATE_MEDIA_ONLY_NOT_PUBLISH_AUTHORITY',date:'2026-10-28',
            original57Protected:57,remainingSpecies:43,candidateWithAtLeastOnePhoto:found,
            samePhotoAsPreviouslyVisualShortlisted:pinned,records:inventory};
          fs.writeFileSync('/tmp/species-next43-media-reports/asset-bank-attribution-candidates.json',JSON.stringify(result,null,2));
          const lines=['# 4SPECIES next43 first-party candidate photo metadata','',
            '43 missing species audited, '+found+' with at least one record containing photographer, license, link and byte SHA; '+pinned+' identical to previous human-photo shortlist. Candidate photos are NOT approved Gold.','',
            '| Species | Rights-recorded options | First photo asset title (includes photographer) | Prior visual shortlist |',
            '|---|---:|---|---|'];
          for(const x of inventory)lines.push('| '+x.slug+' | '+x.photoCandidatesFromLicensedSources+' | '+(x.shortlisted?.candidateTitle||'NONE')+' | '+(x.shortlisted?.priorVisualShortlist?'yes':'no')+' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log('NEXT43_RIGHTS_PROVENANCE_CANDIDATE_AUDIT_PASS',JSON.stringify({outstanding:43,withLicensedCandidate:found,priorSignedMatch:pinned,unavailable:inventory.filter(x=>!x.shortlisted).map(x=>x.slug)}));
          NODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 4species-next43-source-photo-credits-rights-shortlist
          path: /tmp/species-next43-media-reports/asset-bank-attribution-candidates.json
          retention-days: 14
