name: 4PLANET OS — scheduled Brain source sync
on:
  push:
    branches: [main]
    paths: [.github/workflows/os-brain-scheduled.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: os-brain-sync-scheduled
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: labs/overview-v1
      - name: Synchronize controlled 4PLANET Drive sources
        run: |
          node --check scripts/os-brain-sync.mjs
          python3 -m py_compile scripts/os-xlsx-rows.py
          node scripts/os-brain-sync.mjs

