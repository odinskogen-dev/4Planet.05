name: 4SAPIEN Ask Embla source inspect

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - '.github/workflows/ask-embla-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact Claude-leading source
        run: |
          set -euo pipefail
          mkdir -p /tmp/embla
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla/index.html
          python products/4sapien/build/apply_provider_guard.py /tmp/embla/index.html
      - name: Print sanitised persistence contexts
        run: |
          python - <<'PY'
          import pathlib,re,hashlib
          s=pathlib.Path('/tmp/embla/index.html').read_text()
          patterns=['saveShop','receipt_path','four-sapien-receipts','function Meals','setBudget','function Economy','addMany','four_sapien_shop_lines','four_sapien_list_items','receiptSignedUrl','storage.from']
          for p in patterns:
            i=s.find(p)
            if i<0:
              print(f'NOT_FOUND {p}')
              continue
            a=max(0,i-1600); b=min(len(s),i+3600)
            chunk=s[a:b]
            chunk=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', '[EMAIL]', chunk)
            chunk=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+', '[SUPABASE_KEY]', chunk)
            chunk=re.sub(r'https://ghvdzetmplqkdtfqiror\\.supabase\\.co', '[SUPABASE_URL]', chunk)
            print(f'\\n===== {p} @ {i} =====\\n{chunk}\\n===== END =====')
          print('SOURCE_SHA256',hashlib.sha256(s.encode()).hexdigest())
          PY
