name: 4SAPIEN Ask Embla source inspect

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - '.github/workflows/ask-embla-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact Claude-leading source
        run: |
          set -euo pipefail
          mkdir -p /tmp/embla
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla/index.html
          python products/4sapien/build/apply_provider_guard.py /tmp/embla/index.html
          grep -q 'Ask Embla' /tmp/embla/index.html
          grep -q 'four_sapien_profiles' /tmp/embla/index.html
      - name: Print sanitised auth/profile/onboarding contexts
        run: |
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/embla/index.html').read_text()
          patterns=[
            'La oss gjøre Embla til din',
            'four_sapien_profiles',
            'onAuthStateChange',
            'getSession',
            'signInWithOAuth',
            'signOut',
            'googleEnabled',
            'function Profile',
            'const Profile',
            "activeTab === 'meg'",
            'Meg',
          ]
          seen=[]
          for p in patterns:
            i=s.find(p)
            if i<0: continue
            a=max(0,i-1800); b=min(len(s),i+3000)
            chunk=s[a:b]
            chunk=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', '[EMAIL]', chunk)
            chunk=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+', '[SUPABASE_KEY]', chunk)
            chunk=re.sub(r'https://ghvdzetmplqkdtfqiror\\.supabase\\.co', '[SUPABASE_URL]', chunk)
            print(f'\\n===== CONTEXT: {p} @ {i} =====\\n{chunk}\\n===== END =====')
          print('SOURCE_BYTES', len(s))
          print('SOURCE_SHA256', __import__('hashlib').sha256(s.encode()).hexdigest())
          PY
