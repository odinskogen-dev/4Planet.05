name: Living Systems v1.4.2 ZERO LOSS Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/living-systems-v142-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-systems-v142-zero-loss-live-20261007
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact release carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove bounded release authority and 88/88 exact blobs
        run: node scripts/live-promotion-authority-gate.mjs

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token="${token#Bearer }"
          echo "::add-mask::$token"
          zone=$(curl -fsS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$aid"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"

      - name: Build exact Living Systems release carrier
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/living-systems-v142-zero-loss.test.mjs
          npm run build
          test -f dist/livingsystems/index.html
          grep -Fq 'Living Systems' dist/livingsystems/index.html
          grep -Fq 'A system for understanding how nature' dist/livingsystems/index.html
          grep -Fq '<loc>https://4planet.org/livingsystems/</loc>' dist/sitemap.xml
          route_count=$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')
          test "$route_count" -gt 0
          asset_count=$(find dist/livingsystems/_next -type f | wc -l | tr -d ' ')
          test "$asset_count" -gt 0
          echo "LS_V142_EXPORTED_HTML_ROUTES=$route_count"
          echo "LS_V142_EXPORTED_NEXT_ASSETS=$asset_count"
          echo 'LS_V142_BUILD_PASS'

      - name: Deploy exact carrier to existing 4PLANET Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist \
            --project-name 4planet-05 \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Living Systems v1.4.2 ZERO LOSS live"

      - name: Wait for recovered v1.4.2 on custom domain
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            page=$(curl -fsS --max-time 15 https://4planet.org/livingsystems/ || true)
            if grep -Fq 'A system for understanding how nature' <<<"$page" \
              && grep -Fq 'Living Systems' <<<"$page" \
              && grep -Fq '/livingsystems/start' <<<"$page"; then
              echo "LS_V142_CUSTOM_DOMAIN_VISIBLE_AFTER_ATTEMPT=$i"
              break
            fi
            sleep 4
          done
          grep -Fq 'A system for understanding how nature' <<<"$page"
          grep -Fq 'Living Systems' <<<"$page"
          grep -Fq '/livingsystems/start' <<<"$page"
          echo 'LS_V142_ROOT_LIVE_PASS'

      - name: Verify every exported Living Systems route LIVE
        shell: bash
        run: |
          set -euo pipefail
          expected=$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')
          live=0
          : > /tmp/ls-route-proof.txt
          while IFS= read -r file; do
            rel="${file#dist}"
            rel="${rel%index.html}"
            url="https://4planet.org${rel}"
            code=$(curl -sS --max-time 20 -o /tmp/ls-page.html -w '%{http_code}' "$url")
            test "$code" = "200"
            grep -Fqi '<html' /tmp/ls-page.html
            printf '%s %s\n' "$code" "$url" >> /tmp/ls-route-proof.txt
            live=$((live+1))
          done < <(find dist/livingsystems -type f -name index.html | sort)
          test "$live" = "$expected"
          echo "LS_V142_LIVE_HTML_ROUTES=$live"

      - name: Verify v1.4.2 intelligence surfaces and static assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://4planet.org/livingsystems/start/ | grep -Fq 'Start with a question'
          curl -fsS https://4planet.org/livingsystems/dependencies/ | grep -Fq 'Dependencies'
          curl -fsS https://4planet.org/livingsystems/decisions/ | grep -Fq 'Decision'
          curl -fsS https://4planet.org/livingsystems/learning/ | grep -Fq 'Learning'
          curl -fsS https://4planet.org/livingsystems/trust/ | grep -Fq 'Trust'
          curl -fsS https://4planet.org/livingsystems/sources/ | grep -Fq 'Source'
          curl -fsS https://4planet.org/livingsystems/ecosystems/EC_AMAZON_RAINFOREST/ | grep -Fq 'Amazon'
          curl -fsS https://4planet.org/livingsystems/species/western-honey-bee/ | grep -Fq 'Honey'
          root=$(curl -fsS https://4planet.org/livingsystems/)
          assets=$(grep -oE '/livingsystems/_next/static/[^"[:space:]]+' <<<"$root" | sort -u)
          test -n "$assets"
          asset_live=0
          while IFS= read -r asset; do
            curl -fsS --max-time 20 -o /dev/null "https://4planet.org$asset"
            asset_live=$((asset_live+1))
          done <<<"$assets"
          test "$asset_live" -gt 0
          echo "LS_V142_REFERENCED_ASSETS_LIVE=$asset_live"
          echo 'LS_V142_ZERO_LOSS_CUSTOM_DOMAIN_PASS'
