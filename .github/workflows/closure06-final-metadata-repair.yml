name: 4PLANET Films Closure 06 Final Metadata Repair

on:
  push:
    branches:
      - work/magazine-films-premium-closure-05
    paths:
      - 'scripts/closure06-final-metadata-repair.mjs'

permissions:
  contents: write

jobs:
  apply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/magazine-films-premium-closure-05
      - run: node scripts/closure06-final-metadata-repair.mjs
      - shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          [ "$changed" = 'src/content/magazineFilms.ts' ] || { echo "Unexpected write scope: $changed"; exit 2; }
          git diff --check
          git config user.name '4PLANET Closure 06'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/magazineFilms.ts
          git commit -m 'FILMS CLOSURE 06: finish verified metadata corrections'
          git push origin HEAD:work/magazine-films-premium-closure-05
