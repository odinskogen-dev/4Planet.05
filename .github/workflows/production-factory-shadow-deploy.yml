name: Production Factory Shadow Deploy

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-factory-shadow-deploy
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      credentials_ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check deployment credentials without exposing them
        id: credentials
        env:
          CLOUDFLARE_FACTORY_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_FACTORY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_FACTORY_API_TOKEN" && -n "$CLOUDFLARE_FACTORY_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Factory shadow deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Factory shadow deployment blocked: required dedicated repository secrets are not configured."
          fi

  deploy-shadow:
    needs: preflight
    if: needs.preflight.outputs.credentials_ready == 'true'
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v6
      - name: Deploy dedicated Factory SHADOW Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          workingDirectory: factory
          packageManager: npm
          wranglerVersion: "4.127.1"
          command: deploy

      - name: Prove deployed World Class runtime and real Orchestra 03 processing
        id: canary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOYMENT_URL:-}" ]]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi

          BASE_URL="${DEPLOYMENT_URL%/}"
          HEALTH_URL="${BASE_URL}/__factory/health"
          CANARY_URL="${BASE_URL}/__factory/canary"

          capture_runtime_error() {
            local probe_url="$1"
            echo "Capturing bounded Cloudflare runtime error evidence for ${probe_url}"
            (
              sleep 3
              curl --silent --show-error --connect-timeout 5 --max-time 12 "${probe_url}" >/dev/null 2>&1 || true
            ) &
            (
              cd factory
              timeout 18s npx --no-install wrangler tail 4planet-production-factory-v01-shadow --format json --status error || true
            )
          }

          echo "Probing ${HEALTH_URL}"
          HEALTH_JSON="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --retry 2 --retry-delay 1 "${HEALTH_URL}" || true)"
          echo "Health response: ${HEALTH_JSON}"
          if ! echo "${HEALTH_JSON}" | grep -q '"mode":"SHADOW"' || ! echo "${HEALTH_JSON}" | grep -q '"noLiveAuthority":true'; then
            capture_runtime_error "${HEALTH_URL}"
            exit 1
          fi

          READY="false"
          CANARY_JSON=""
          for attempt in $(seq 1 36); do
            CANARY_JSON="$(curl --silent --show-error --connect-timeout 5 --max-time 15 "${CANARY_URL}" || true)"
            if echo "${CANARY_JSON}" | grep -q '"ready":true' \
              && echo "${CANARY_JSON}" | grep -q '"runtimeContract":"WORLD_CLASS_BUILD_03_ORCHESTRA_V03"' \
              && echo "${CANARY_JSON}" | grep -q '"orchestraId":"4planet-first-real-orchestra-v03"' \
              && echo "${CANARY_JSON}" | grep -q '"orchestraProcessed":true'; then
              READY="true"
              break
            fi
            echo "Orchestra 03 runtime not complete/current yet (attempt ${attempt}/36): ${CANARY_JSON}"
            sleep 5
          done

          if [[ "${READY}" != "true" ]]; then
            echo "Deployed SHADOW canary did not prove the exact Orchestra 03 World Class runtime contract."
            echo "${CANARY_JSON}"
            capture_runtime_error "${CANARY_URL}"
            exit 1
          fi

          echo "deployment_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "health_url=${HEALTH_URL}" >> "$GITHUB_OUTPUT"
          echo "canary_url=${CANARY_URL}" >> "$GITHUB_OUTPUT"
          echo "${CANARY_JSON}" > factory-shadow-canary.json

      - name: Upload SHADOW canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-factory-shadow-canary-${{ github.sha }}
          path: factory-shadow-canary.json
          retention-days: 30

      - name: Record non-production deployment evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.canary.outputs.deployment_url }}
          HEALTH_URL: ${{ steps.canary.outputs.health_url }}
          CANARY_URL: ${{ steps.canary.outputs.canary_url }}
        run: |
          echo "### 4PLANET Production Factory SHADOW — World Class Build 03 / Orchestra 03" >> "$GITHUB_STEP_SUMMARY"
          echo "Dedicated Worker: 4planet-production-factory-v01-shadow" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Canary: ${CANARY_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact V03 runtime contract + fixed 8-package real SHADOW orchestra processing: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent quality outcomes remain evidence, not an automatic Human Gold claim." >> "$GITHUB_STEP_SUMMARY"
          echo "This deployment is SHADOW only and does not modify 4PLANET LIVE." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified SHADOW proof to Factory PR
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.canary.outputs.deployment_url }}
          HEALTH_URL: ${{ steps.canary.outputs.health_url }}
          CANARY_URL: ${{ steps.canary.outputs.canary_url }}
        with:
          script: |
            const body = [
              '## WORLD CLASS SHADOW RUNTIME + ORCHESTRA 03 — PASS',
              '',
              `Exact Factory SHA: \`${context.sha}\``,
              `Deployment: ${process.env.DEPLOYMENT_URL}`,
              `Health: ${process.env.HEALTH_URL}`,
              `Canary: ${process.env.CANARY_URL}`,
              '',
              'Deployment acceptance requires the exact `WORLD_CLASS_BUILD_03_ORCHESTRA_V03` runtime contract, the exact `4planet-first-real-orchestra-v03` orchestra identity, and all eight fixed real 4PLANET SHADOW work packages to have persisted outcomes.',
              '',
              'Independent quality decisions remain separate from runtime processing proof; Human Gold can never be inferred from technical render/source evidence.',
              '',
              '**Boundary:** SHADOW only. No LIVE release, external send, payment, signature, Canon promotion or arbitrary code write authority was granted.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 212,
              body,
            });

  credentials-missing:
    needs: preflight
    if: needs.preflight.outputs.credentials_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record fail-closed deployment blocker
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## DEPLOYED SHADOW RUNTIME — BLOCKED',
              '',
              `Exact Factory SHA: \`${context.sha}\``,
              '',
              'Dedicated GitHub repository secrets required by the Factory deploy rail are not both configured: `CLOUDFLARE_FACTORY_API_TOKEN` and `CLOUDFLARE_FACTORY_ACCOUNT_ID`.',
              '',
              'No credential value was exposed and no deployment was attempted. Factory remains SHADOW/fail-closed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 212,
              body,
            });
      - name: Fail closed without deployment
        run: |
          echo "Dedicated Factory SHADOW Worker was NOT deployed."
          exit 1
