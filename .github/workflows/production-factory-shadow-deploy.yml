name: Production Factory Autonomous Activation

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: write

env:
  FACTORY_HEAD_SHA: ${{ github.sha }}

# Certification is disposable evidence, not valuable production work. A newer
# exact Factory build invalidates and cancels an older certification run. Work
# Packages and their queues are persisted inside the Factory and are unaffected.
concurrency:
  group: production-factory-autonomous-activation
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      cloudflare_ready: ${{ steps.credentials.outputs.cloudflare_ready }}
      github_write_ready: ${{ steps.credentials.outputs.github_write_ready }}
      test_king_sha: ${{ steps.lineage.outputs.test_king_sha }}
      activation_requested: ${{ steps.activation_intent.outputs.activation_requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_HEAD_SHA }}
          fetch-depth: 0

      - name: Resolve explicit activation intent
        id: activation_intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "${COMMIT_MESSAGE:-}" == *"[factory-activate]"* ]]; then
            echo "activation_requested=true" >> "$GITHUB_OUTPUT"
            echo "Full fresh three-family activation proof REQUESTED."
          else
            echo "activation_requested=false" >> "$GITHUB_OUTPUT"
            echo "Hardening/SHADOW deployment only. Mutation proof intentionally not started on every commit."
          fi

      - name: Prove exact current TEST KING ancestry
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${FACTORY_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Factory activation blocked: exact Factory branch-head SHA is invalid."
            exit 1
          fi
          git fetch origin king/test --no-tags
          TEST_KING_SHA="$(git rev-parse origin/king/test)"
          if ! git merge-base --is-ancestor "$TEST_KING_SHA" "$FACTORY_HEAD_SHA"; then
            echo "Factory activation blocked: current TEST KING is not an ancestor of exact Factory head."
            echo "Factory: $FACTORY_HEAD_SHA"
            echo "TEST KING: $TEST_KING_SHA"
            exit 1
          fi
          echo "test_king_sha=$TEST_KING_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact Factory head: $FACTORY_HEAD_SHA"
          echo "Exact TEST KING ancestry PASS: $TEST_KING_SHA"

      - name: Check dedicated credentials without exposing values
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CF_TOKEN:-}" && -n "${CF_ACCOUNT:-}" ]]; then
            echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${FACTORY_GITHUB_TOKEN:-}" ]]; then
            echo "github_write_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_write_ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-and-certify:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.cloudflare_ready == 'true'
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FACTORY_HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json

      - name: Install Factory dependencies
        working-directory: factory
        run: npm install --ignore-scripts

      - name: Deploy exact Factory code to dedicated non-production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          workingDirectory: factory
          packageManager: npm
          wranglerVersion: "4.128.0"
          command: deploy

      - name: Install bounded runtime secrets and exact lineage evidence
        id: runtime_secrets
        working-directory: factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          TEST_KING_SHA: ${{ needs.preflight.outputs.test_king_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$CONTROL_TOKEN"
          echo "control_token=$CONTROL_TOKEN" >> "$GITHUB_OUTPUT"

          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN
          printf '%s' "$FACTORY_HEAD_SHA" | npx wrangler secret put FACTORY_BUILD_SHA
          printf '%s' "$TEST_KING_SHA" | npx wrangler secret put FACTORY_TEST_KING_BASE_SHA

          if [[ -n "${FACTORY_GITHUB_TOKEN:-}" ]]; then
            printf '%s' "$FACTORY_GITHUB_TOKEN" | npx wrangler secret put FACTORY_GITHUB_TOKEN
            echo "github_write_installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_write_installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deployed Worker URL
        id: runtime
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOYMENT_URL:-}" ]]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi
          BASE_URL="${DEPLOYMENT_URL%/}"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "health_url=$BASE_URL/__factory/health" >> "$GITHUB_OUTPUT"
          echo "canary_url=$BASE_URL/__factory/canary" >> "$GITHUB_OUTPUT"
          echo "control_room_url=$BASE_URL/__factory/control-room" >> "$GITHUB_OUTPUT"

      - name: Prove deployed SHADOW runtime and real source/browser orchestra
        id: canary
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="$BASE_URL/__factory/health"
          CANARY_URL="$BASE_URL/__factory/canary"
          READY=false
          HEALTH_JSON=""
          CANARY_JSON=""
          for attempt in $(seq 1 96); do
            HEALTH_JSON="$(curl --silent --show-error --connect-timeout 5 --max-time 20 "$HEALTH_URL" || true)"
            CANARY_JSON="$(curl --silent --show-error --connect-timeout 5 --max-time 30 "$CANARY_URL" || true)"
            printf '%s\n' "$HEALTH_JSON" > factory-shadow-health.json
            printf '%s\n' "$CANARY_JSON" > factory-shadow-canary.json
            if echo "$HEALTH_JSON" | grep -q '"noLiveAuthority":true' \
              && echo "$CANARY_JSON" | grep -q '"ready":true' \
              && echo "$CANARY_JSON" | grep -q '"runtimeContract":"WORLD_CLASS_BUILD_03_ORCHESTRA_V04"' \
              && echo "$CANARY_JSON" | grep -q '"orchestraProcessed":true'; then
              READY=true
              break
            fi
            echo "Runtime canary not ready yet ($attempt/96)."
            sleep 5
          done
          if [[ "$READY" != "true" ]]; then
            echo "Final SHADOW health snapshot:"
            echo "$HEALTH_JSON"
            echo "Final SHADOW canary snapshot:"
            echo "$CANARY_JSON"
            exit 1
          fi
          echo "shadow_runtime_proven=true" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head Factory CI and observe product convergence
        id: exact_head_gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FACTORY_PASS=false
          CONVERGENCE="pending"
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${FACTORY_HEAD_SHA}&per_page=100")"
            FACTORY="$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.name=="Production Factory Shadow CI")][0].conclusion // "pending"')"
            CONVERGENCE="$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.name=="ONE INTERFACE Convergence Gate")][0].conclusion // "pending"')"
            echo "Exact-head evidence: Factory=$FACTORY ProductConvergence=$CONVERGENCE"
            if [[ "$FACTORY" == "success" ]]; then
              FACTORY_PASS=true
              break
            fi
            if [[ "$FACTORY" != "pending" && "$FACTORY" != "success" ]]; then
              echo "Required exact-head Factory CI concluded non-success: $FACTORY"
              exit 1
            fi
            sleep 10
          done
          if [[ "$FACTORY_PASS" != "true" ]]; then
            echo "Required exact-head Factory CI did not reach success in the bounded 15-minute window."
            exit 1
          fi
          echo "shadow_ci_passed=true" >> "$GITHUB_OUTPUT"
          if [[ "$CONVERGENCE" == "success" ]]; then
            echo "convergence_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "convergence_passed=false" >> "$GITHUB_OUTPUT"
            echo "Product convergence is recorded as $CONVERGENCE but is not a Level-2 internal Factory activation gate. It remains required before TEST KING/LIVE release."
          fi

      - name: Record hardening-only SHADOW deployment
        if: needs.preflight.outputs.activation_requested != 'true'
        shell: bash
        run: |
          echo "Exact head deployed and SHADOW canary proven. Full mutation activation proof deferred until an explicit [factory-activate] head or workflow_dispatch."

      - name: Stop safely if permanent GitHub TEST-write credential is absent
        if: needs.preflight.outputs.activation_requested == 'true' && steps.runtime_secrets.outputs.github_write_installed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY=$(cat <<'EOF'
          ## FACTORY FINAL ACTIVATION — ONE FOUNDER CREDENTIAL REMAINS

          Exact code/runtime/CI/Cloudflare SHADOW gates are ready, but `FACTORY_GITHUB_TOKEN` is not configured as a GitHub repository secret. The Worker therefore cannot create durable bounded TEST candidate branches/commits/PRs after this Actions job ends.

          No temporary `GITHUB_TOKEN` was copied into the Worker because it would expire and create false 24/7 readiness.

          Factory remains SHADOW / fail-closed. LIVE, Canon, outreach, Human Gold and spend authority remain unavailable.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/236/comments" -f body="$BODY" >/dev/null
          echo "FACTORY_GITHUB_TOKEN missing: real autonomous write proof intentionally not started."
          exit 1

      - name: Start three-family real autonomous production proof
        if: needs.preflight.outputs.activation_requested == 'true' && steps.runtime_secrets.outputs.github_write_installed == 'true'
        id: proof_start
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          CONTROL_TOKEN: ${{ steps.runtime_secrets.outputs.control_token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body -X POST \
            -H "x-factory-control: $CONTROL_TOKEN" \
            -H "content-type: application/json" \
            "$BASE_URL/__factory/activation-proof/start")"
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null

      - name: Poll real production, certify fresh evidence and activate
        if: needs.preflight.outputs.activation_requested == 'true' && steps.runtime_secrets.outputs.github_write_installed == 'true'
        id: activate
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          CONTROL_TOKEN: ${{ steps.runtime_secrets.outputs.control_token }}
          CONVERGENCE_PASSED: ${{ steps.exact_head_gates.outputs.convergence_passed }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=false
          RESPONSE=""
          if [[ "$CONVERGENCE_PASSED" == "true" ]]; then
            CONVERGENCE_JSON=true
          else
            CONVERGENCE_JSON=false
          fi
          for attempt in $(seq 1 100); do
            RESPONSE="$(curl --silent --show-error --fail-with-body -X POST \
              -H "x-factory-control: $CONTROL_TOKEN" \
              -H "content-type: application/json" \
              --data "{\"shadowCiPassed\":true,\"convergencePassed\":${CONVERGENCE_JSON},\"shadowRuntimeProven\":true}" \
              "$BASE_URL/__factory/activation-proof/status" || true)"
            echo "Activation proof poll $attempt/100: $(echo "$RESPONSE" | jq -c '{ok,active,proofComplete,gate,error}' 2>/dev/null || echo "$RESPONSE")"
            if echo "$RESPONSE" | jq -e '.active == true and .gate.ready == true and .proofComplete == true' >/dev/null 2>&1; then
              ACTIVE=true
              break
            fi
            if echo "$RESPONSE" | jq -e '.proofComplete == true and (.gate.ready == false)' >/dev/null 2>&1; then
              echo "$RESPONSE" > factory-active-certification.json
              echo "Proof completed but activation gate remained closed."
              exit 1
            fi
            sleep 15
          done
          echo "$RESPONSE" > factory-active-certification.json
          if [[ "$ACTIVE" != "true" ]]; then
            echo "Factory did not reach ACTIVE inside the bounded proof window."
            exit 1
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Factory certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-factory-certification-${{ env.FACTORY_HEAD_SHA }}
          path: |
            factory-shadow-health.json
            factory-shadow-canary.json
            factory-active-certification.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record ACTIVE proof on Factory PR
        if: steps.activate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
        shell: bash
        run: |
          SUMMARY="$(jq -c '{active,gate,exactFactorySha,exactTestKingSha,metrics,governedLearning,boundaries,proofOutcomes:[.proofOutcomes[]|{id,status,actual}]}' factory-active-certification.json)"
          BODY=$(cat <<EOF
          ## 4P FACTORY 01 — AUTONOMOUS TEST PRODUCTION ACTIVE

          Exact Factory SHA: \`$FACTORY_HEAD_SHA\`
          Exact TEST KING base: \`${{ needs.preflight.outputs.test_king_sha }}\`
          Runtime: $BASE_URL
          Control Room: $BASE_URL/__factory/control-room

          Real proof: SPECIES Profile + Bay of Biscay Ecosystem + Actor Profile produced through bounded AI → GitHub candidate → draft PR → CI → 390 Browser QA → persisted outcome → governed learning.

          Product convergence observed during Level-2 certification: `${{ steps.exact_head_gates.outputs.convergence_passed }}`. This is not authority for TEST KING/LIVE; full product convergence remains a separate release gate.

          Certification: \`$SUMMARY\`

          **Still Founder-gated:** LIVE, Human Gold, Canon promotion, outreach/send, payments/spend/signature.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/236/comments" -f body="$BODY" >/dev/null

  cloudflare-credentials-missing:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.cloudflare_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "Dedicated Cloudflare Factory credentials are not configured. No deployment attempted."
          exit 1
