name: Production Factory Shadow Deploy

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-factory-shadow-deploy
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      credentials_ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check deployment credentials without exposing them
        id: credentials
        env:
          CLOUDFLARE_FACTORY_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_FACTORY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_FACTORY_API_TOKEN" && -n "$CLOUDFLARE_FACTORY_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Factory shadow deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Factory shadow deployment blocked: required dedicated repository secrets are not configured."
          fi

  deploy-shadow:
    needs: preflight
    if: needs.preflight.outputs.credentials_ready == 'true'
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v6
      - name: Deploy dedicated Factory SHADOW Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          workingDirectory: factory
          packageManager: npm
          wranglerVersion: "4.127.1"
          command: deploy

      - name: Prove deployed Worker, Agent, Workflow, sub-agents, tools and learning
        id: canary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOYMENT_URL:-}" ]]; then
            echo "Wrangler did not return a deployment URL."
            exit 1
          fi

          BASE_URL="${DEPLOYMENT_URL%/}"
          HEALTH_URL="${BASE_URL}/__factory/health"
          CANARY_URL="${BASE_URL}/__factory/canary"

          echo "Probing ${HEALTH_URL}"
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${HEALTH_URL}")"
          echo "${HEALTH_JSON}" | grep -q '"mode":"SHADOW"'
          echo "${HEALTH_JSON}" | grep -q '"noLiveAuthority":true'

          READY="false"
          CANARY_JSON=""
          for attempt in $(seq 1 36); do
            CANARY_JSON="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "${CANARY_URL}")"
            if echo "${CANARY_JSON}" | grep -q '"ready":true'; then
              READY="true"
              break
            fi
            echo "Canary not complete yet (attempt ${attempt}/36)."
            sleep 5
          done

          if [[ "${READY}" != "true" ]]; then
            echo "Deployed SHADOW canary did not prove the full round-trip."
            echo "${CANARY_JSON}"
            exit 1
          fi

          echo "deployment_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "health_url=${HEALTH_URL}" >> "$GITHUB_OUTPUT"
          echo "canary_url=${CANARY_URL}" >> "$GITHUB_OUTPUT"
          echo "${CANARY_JSON}" > factory-shadow-canary.json

      - name: Upload SHADOW canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-factory-shadow-canary-${{ github.sha }}
          path: factory-shadow-canary.json
          retention-days: 30

      - name: Record non-production deployment evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.canary.outputs.deployment_url }}
          HEALTH_URL: ${{ steps.canary.outputs.health_url }}
          CANARY_URL: ${{ steps.canary.outputs.canary_url }}
        run: |
          echo "### 4PLANET Production Factory SHADOW" >> "$GITHUB_STEP_SUMMARY"
          echo "Dedicated Worker: 4planet-production-factory-v01-shadow" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Canary: ${CANARY_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Agent → Workflow → sub-agent → bounded source/browser execution → persisted outcome → learning canary: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "This deployment is SHADOW only and does not modify 4PLANET LIVE." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified SHADOW proof to Factory PR
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.canary.outputs.deployment_url }}
          HEALTH_URL: ${{ steps.canary.outputs.health_url }}
          CANARY_URL: ${{ steps.canary.outputs.canary_url }}
        with:
          script: |
            const body = [
              '## DEPLOYED SHADOW RUNTIME — PASS',
              '',
              `Exact Factory SHA: \`${context.sha}\``,
              `Deployment: ${process.env.DEPLOYMENT_URL}`,
              `Health: ${process.env.HEALTH_URL}`,
              `Canary: ${process.env.CANARY_URL}`,
              '',
              'Verified on deployed Cloudflare runtime: Worker → named ProductionFactoryAgent Durable Object → WorkPackageWorkflow → specialist sub-agents → real bounded source/browser execution → persisted outcomes → evaluator/learning path.',
              '',
              '**Boundary:** SHADOW only. No LIVE release, external send, payment, signature, Canon promotion or arbitrary code write authority was granted.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 212,
              body,
            });

  credentials-missing:
    needs: preflight
    if: needs.preflight.outputs.credentials_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record fail-closed deployment blocker
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## DEPLOYED SHADOW RUNTIME — BLOCKED',
              '',
              `Exact Factory SHA: \`${context.sha}\``,
              '',
              'Dedicated GitHub repository secrets required by the Factory deploy rail are not both configured: `CLOUDFLARE_FACTORY_API_TOKEN` and `CLOUDFLARE_FACTORY_ACCOUNT_ID`.',
              '',
              'No credential value was exposed and no deployment was attempted. Factory remains SHADOW/fail-closed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 212,
              body,
            });
      - name: Fail closed without deployment
        run: |
          echo "Dedicated Factory SHADOW Worker was NOT deployed."
          exit 1
