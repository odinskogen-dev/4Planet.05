name: 4NATION Founder Visual Preview
on:
  push:
    branches: [king/test]
    paths: ['.github/workflows/nation-visible-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nation-visible-preview
  cancel-in-progress: true
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact HEAD and 4NATION QA gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin king/test --no-tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/king/test)" = "$GITHUB_SHA" || exit 7
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=70")
          jq -e '[.workflow_runs[] | select(.name=="4NATION Gold Candidate QA" and .conclusion=="success")] | length >= 1' <<<"$runs"
      - name: Build same existing product for non-indexed visual review
        run: |
          npm ci
          node --test scripts/4nation-gold.test.mjs
          npm run typecheck
          npm run build
          printf '/* /index.html 200\n' > dist/_redirects
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' > dist/_headers
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text().replace('</head>', '<meta name="robots" content="noindex,nofollow,noarchive" /></head>')
          p.write_text(s)
          PY
      - name: Resolve existing Cloudflare account and dedicated 4NATION preview
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zones=$(curl -fsS "$api/zones?name=4nation.org" "${auth[@]}")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          projects=$(curl -fsS "$api/accounts/$account/pages/projects" "${auth[@]}")
          jq -e '.success == true' <<<"$projects" >/dev/null
          if ! jq -e '.result[]? | select(.name=="4planet-nation")' <<<"$projects" >/dev/null; then
            npx --yes wrangler@4.128.0 pages project create 4planet-nation --production-branch king/test
          fi
      - name: Publish visual preview ONLY (no 4nation.org DNS writes)
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-nation --branch king/test --commit-hash "$GITHUB_SHA" --commit-dirty=false
          echo "VISUAL_PREVIEW=https://4planet-nation.pages.dev/"
          echo "EXACT_SHA=$GITHUB_SHA"
      - name: Check external preview
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code=$(curl -L -sS -o /tmp/nation.html -w '%{http_code}' https://4planet-nation.pages.dev/ || true)
            [ "$code" = 200 ] && break
            sleep 3
          done
          test "$code" = 200
          grep -q 'noindex,nofollow' /tmp/nation.html
          echo "FOUNDER_PREVIEW_VISIBLE=YES; ROOT_DOMAIN_UNCHANGED"
