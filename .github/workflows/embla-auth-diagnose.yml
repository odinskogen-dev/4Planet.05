name: 4SAPIEN source diagnose

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths: ['.github/workflows/embla-auth-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source and inspect search ranking
        run: |
          set -euo pipefail
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla.html
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/embla.html').read_text()
          for term in ['function score','const score','score(','pri===','balanced','health','wallet','planet','res.slice','sort(','function Search','function ProductSearch']:
              print('\n===',term,'===')
              hits=0
              for m in re.finditer(re.escape(term),s):
                  hits+=1
                  a=max(0,m.start()-700); b=min(len(s),m.end()+1300)
                  print(s[a:b])
                  if hits>=3: break
          PY
