name: 4SAPIEN source diagnose

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths: ['.github/workflows/embla-auth-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source and inspect exact anchors
        run: |
          set -euo pipefail
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla.html
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/embla.html').read_text()
          for term in ['function ProductRow','function nm','const sorted=useMemo','function Detail']:
              print('\n===',term,'===')
              m=re.search(re.escape(term),s)
              if m:
                  a=max(0,m.start()-200); b=min(len(s),m.start()+4200)
                  print(s[a:b])
          PY
