name: 4SAPIEN source diagnose

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths: ['.github/workflows/embla-auth-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source and inspect navigation anchors
        run: |
          set -euo pipefail
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla.html
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/embla.html').read_text()
          for term in ['function BottomNav','function Nav','position:"fixed",bottom:0','Hjem","Handle','background:"#','background:T.paper']:
              print('\n===',term,'===')
              for m in list(re.finditer(re.escape(term),s))[:8]:
                  a=max(0,m.start()-700); b=min(len(s),m.start()+3200)
                  print(s[a:b])
          PY
