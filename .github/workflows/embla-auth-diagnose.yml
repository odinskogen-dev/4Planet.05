name: 4SAPIEN source diagnose

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths: ['.github/workflows/embla-auth-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source and inspect theme anchors
        run: |
          set -euo pipefail
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/embla.html
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/embla.html').read_text()
          for term in ['const T=', 'const T =', 'background:T.paper', 'background:T.ink', '<body', 'body{', 'background:#']:
              print('\n===',term,'===')
              hits=list(re.finditer(re.escape(term),s))[:5]
              for m in hits:
                  a=max(0,m.start()-500); b=min(len(s),m.start()+2600)
                  print(s[a:b])
          PY
