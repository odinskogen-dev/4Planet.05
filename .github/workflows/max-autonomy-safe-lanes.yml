name: Maximum Autonomy Safe Lanes Upgrade

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - ".github/workflows/max-autonomy-safe-lanes.yml"

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/symphony-runtime-v01
          token: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json

      - name: Apply bounded safe-autonomy upgrade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Add a read-only Exa execution contract without creating a new queue/control plane.
          replace_once(
              'factory/src/contracts.ts',
              'export type ExecutionKind = "BROWSER_QA" | "HTTP_SOURCE_CHECK";\n',
              'export type ExecutionKind = "BROWSER_QA" | "HTTP_SOURCE_CHECK" | "EXA_SEARCH";\n',
          )
          replace_once(
              'factory/src/contracts.ts',
              '  viewport?: {\n    width: number;\n    height: number;\n    deviceScaleFactor?: number;\n  };\n',
              '  viewport?: {\n    width: number;\n    height: number;\n    deviceScaleFactor?: number;\n  };\n  /** Read-only discovery query used only when kind=EXA_SEARCH. */\n  query?: string;\n  /** Bounded result count for read-only discovery. */\n  limit?: number;\n',
          )

          # 2) Execute Exa through the same WorkPackage -> Workflow -> Judge path as Browser/source checks.
          replace_once(
              'factory/src/readOnlyExecution.ts',
              'import type { Outcome, WorkPackage } from "./contracts";\n',
              'import type { Outcome, WorkPackage } from "./contracts";\nimport { runResearchSearch } from "./capabilityExpansion";\n',
          )
          marker = '/** Returns undefined when no real bound adapter exists for the package. */\n'
          insertion = r'''async function exaSearch(env: Cloudflare.Env, pkg: WorkPackage): Promise<Outcome> {
  const execution = pkg.execution;
  if (!execution || execution.kind !== "EXA_SEARCH") throw new Error("EXA_SEARCH execution spec required");
  validateExecutionTarget(execution.targetUrl, execution.allowedHosts);
  const query = execution.query?.trim() ?? "";
  if (query.length < 3 || query.length > 500) throw new Error("EXA_SEARCH query is outside bounded limits");
  const limit = Math.max(1, Math.min(8, Math.floor(execution.limit ?? 5)));

  const result = await runResearchSearch(env, "exa", query, limit);
  const record = typeof result.data === "object" && result.data !== null && !Array.isArray(result.data)
    ? result.data as Record<string, unknown>
    : {};
  const rows = Array.isArray(record.results) ? record.results : [];
  const urls = rows
    .map((row) => typeof row === "object" && row !== null && !Array.isArray(row) ? (row as Record<string, unknown>).url : undefined)
    .filter((url): url is string => typeof url === "string" && /^https:\/\//i.test(url))
    .slice(0, 5);
  const bytes = new TextEncoder().encode(JSON.stringify(result.data ?? null));
  const hash = await sha256(bytes);
  const sectionEvidence = pkg.section === "CAPITAL"
    ? "eligibility/routing discovery inputs collected; eligibility itself remains unverified"
    : "source/provenance discovery inputs collected; claim correctness remains unverified";

  return baseOutcome(pkg, {
    status: "ACCEPTED",
    evidence: [
      "exa search PASS",
      "source https://api.exa.ai/search",
      `query ${query}`,
      `results ${rows.length}`,
      `payload-sha256 ${hash}`,
      sectionEvidence,
      ...urls.map((url) => `source ${url}`),
    ],
    materialDelta: `Verified live Exa discovery for ${pkg.section} and collected ${rows.length} bounded source candidates without external mutation.`,
    actual: `Exa returned ${rows.length} bounded result rows for the approved read-only query.`,
    limitation: "Discovery results are candidate evidence only. They do not prove eligibility, factual claims, fit, ranking, outreach readiness or Founder release.",
  });
}

'''
          replace_once('factory/src/readOnlyExecution.ts', marker, insertion + marker)
          replace_once(
              'factory/src/readOnlyExecution.ts',
              '  if (pkg.execution.kind === "HTTP_SOURCE_CHECK") return sourceCheck(pkg);\n  return undefined;\n',
              '  if (pkg.execution.kind === "HTTP_SOURCE_CHECK") return sourceCheck(pkg);\n  if (pkg.execution.kind === "EXA_SEARCH") return exaSearch(env, pkg);\n  return undefined;\n',
          )

          # 3) Hard block Founder-gated packages from autonomous scoring/selection.
          replace_once(
              'factory/src/scoring.ts',
              '  if (pkg.dependencies.length > 0 || project.blockedReason) return Number.NEGATIVE_INFINITY;\n',
              '  if (pkg.dependencies.length > 0 || project.blockedReason) return Number.NEGATIVE_INFINITY;\n  if (pkg.founderGate || project.founderGate) return Number.NEGATIVE_INFINITY;\n',
          )

          # 4) Route autonomous model generation through the already-proven 4planet-factory AI Gateway.
          replace_once(
              'factory/src/autonomousExecution.ts',
              '  AI?: { run(model: string, input: unknown): Promise<unknown> };\n',
              '  AI?: { run(model: string, input: unknown, options?: { gateway?: { id: string } }): Promise<unknown> };\n',
          )
          replace_once(
              'factory/src/autonomousExecution.ts',
              '  FACTORY_AI_MODEL?: string;\n};\n',
              '  FACTORY_AI_MODEL?: string;\n  FACTORY_AI_GATEWAY_ID?: string;\n};\n',
          )
          replace_once(
              'factory/src/autonomousExecution.ts',
              '    max_completion_tokens: 2400,\n  });\n',
              '    max_completion_tokens: 2400,\n  }, { gateway: { id: env.FACTORY_AI_GATEWAY_ID?.trim() || "4planet-factory" } });\n',
          )

          # 5) Add recurring daily PRODUCT / CAPITAL / INTELLIGENCE read-only packages to existing Night Shift.
          p = Path('factory/src/nightShiftPortfolio.ts')
          text = p.read_text()
          anchor = 'export function createNightShiftPortfolio(\n'
          if anchor not in text:
              raise SystemExit('night shift export anchor missing')
          helper = r'''function researchPackage(input: {
  slug: string;
  title: string;
  section: "CAPITAL" | "RESEARCH_DATA";
  query: string;
  exactTestSha: string;
  exactFactorySha: string;
  createdAt: string;
}): WorkPackage {
  const testKey = key(input.exactTestSha);
  const factoryKey = key(input.exactFactorySha);
  return {
    id: `night-${input.slug}-${testKey}-${factoryKey}`,
    projectId: NIGHT_SHIFT_PROJECT_ID,
    title: input.title,
    section: input.section,
    priority: "P0",
    goalLink: "MAXIMUM_AUTONOMOUS_PRODUCTION_01 — safe autonomous discovery",
    gapClosed: `Collect fresh ${input.section} discovery evidence without outreach, spend, Canon promotion or external mutation.`,
    deliverables: [
      "Bounded Exa discovery result set",
      "Source/provenance candidates for independent evaluation",
      "Explicit uncertainty and Founder-release boundary",
    ],
    dependencies: [],
    writeScopes: [],
    definitionOfDone: [
      "Task Contract V1 and context hash are bound before dispatch",
      "Exa execution is read-only and bounded",
      "Candidate sources and payload fingerprint are persisted",
      "Independent evaluator runs before accepted material progress",
      "No outreach, application, spend, LIVE/HEIR/Canon mutation or self-approval occurs",
    ],
    requiredEvidence: ["TASK_CONTRACT_V1", "exa search PASS", "source", "terminal authority reread"],
    execution: {
      kind: "EXA_SEARCH",
      targetUrl: "https://api.exa.ai/search",
      allowedHosts: ["api.exa.ai"],
      query: input.query,
      limit: 6,
    },
    run: {
      runId: `factory-night-shift-${input.slug}`,
      attemptId: "01",
      idempotencyKey: `factory-night:${input.slug}:${input.exactTestSha}:${input.exactFactorySha}`,
      inputStateHash: `factory=${input.exactFactorySha};test=${input.exactTestSha};exa=${input.query}`,
      expectedBaseSha: input.exactTestSha,
      workerId: `factory-cloudflare-night-${input.section.toLowerCase()}`,
      createdAt: input.createdAt,
    },
    resourceBudget: {
      maxAttempts: 1,
      maxCorrectionAttempts: 0,
      maxModelCalls: 0,
      maxTokens: 0,
      maxModelCostUsd: 0,
      maxExternalRequests: 1,
      maxGithubCalls: 0,
      maxBrowserCalls: 0,
      maxWallClockMinutes: 5,
      maxQueueRetries: 3,
    },
    learningQuestion: `Can Factory autonomously discover fresh high-value ${input.section} candidates with zero Founder minutes while preserving release and truth gates?`,
    createdAt: input.createdAt,
    estimatedValue: 10,
    criticalPath: 9,
    dependencyUnlock: 9,
    proofValue: 9,
    cashValue: input.section === "CAPITAL" ? 10 : 4,
    learningValue: 10,
    risk: 1,
    founderBurden: 0,
    concurrencyCost: 0,
    status: "READY",
  };
}

'''
          text = text.replace(anchor, helper + anchor, 1)
          old = '''  const packages = defs.map(([slug, title, targetUrl, width, height]) => browserPackage({
    slug, title, targetUrl, viewport: { width, height }, exactTestSha, exactFactorySha, createdAt,
  }));
  return { projects: [project], packages };
'''
          new = '''  const packages = defs.map(([slug, title, targetUrl, width, height]) => browserPackage({
    slug, title, targetUrl, viewport: { width, height }, exactTestSha, exactFactorySha, createdAt,
  }));

  // Founder-approved MAXIMUM_AUTONOMOUS_PRODUCTION_01: one fresh, bounded
  // PRODUCT / CAPITAL / INTELLIGENCE cycle per UTC day. Stable legacy Night
  // Shift proof packages remain intact; date-scoped ids make the new work recur
  // without creating a second scheduler, queue or truth store.
  const day = createdAt.slice(0, 10).replaceAll("-", "");
  packages.push(browserPackage({
    slug: `product-daily-atlas-mobile-${day}`,
    title: `PRODUCT daily live verification ${day}`,
    targetUrl: "https://4planet.org/atlas",
    viewport: { width: 390, height: 844 },
    exactTestSha,
    exactFactorySha,
    createdAt,
  }));
  packages.push(researchPackage({
    slug: `capital-daily-opportunity-discovery-${day}`,
    title: `CAPITAL daily non-dilutive opportunity discovery ${day}`,
    section: "CAPITAL",
    query: "open 2026 non-dilutive grants foundations biodiversity nature climate environmental technology Europe Norway funding application deadline",
    exactTestSha,
    exactFactorySha,
    createdAt,
  }));
  packages.push(researchPackage({
    slug: `intelligence-daily-living-planet-${day}`,
    title: `INTELLIGENCE daily living-planet discovery ${day}`,
    section: "RESEARCH_DATA",
    query: "latest 2026 biodiversity nature climate ecological restoration conservation technology scientific research solutions",
    exactTestSha,
    exactFactorySha,
    createdAt,
  }));
  return { projects: [project], packages };
'''
          if old not in text:
              raise SystemExit('night shift package return anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate upgrade before writeback
        working-directory: factory
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test

      - name: Commit validated safe-autonomy lanes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4PLANET Factory"
          git config user.email "factory@4planet.org"
          git add factory/src/contracts.ts factory/src/readOnlyExecution.ts factory/src/scoring.ts factory/src/autonomousExecution.ts factory/src/nightShiftPortfolio.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(factory): activate recurring safe PRODUCT CAPITAL INTELLIGENCE lanes"
          git push origin HEAD:factory/symphony-runtime-v01
