name: AXE nanoid lockfile fix

on:
  push:
    branches:
      - fix/axe-nanoid-3-3-18

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/axe-nanoid-3-3-18

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fix
        run: npm audit fix --no-fund || true

      - name: Verify high-severity gate
        run: npm audit --audit-level=high

      - name: Commit exact lockfile fix if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "4PLANET AXE automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: update nanoid lockfile to 3.3.18"
          git push origin HEAD:fix/axe-nanoid-3-3-18
