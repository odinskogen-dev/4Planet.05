name: PSI Convergence Contracts

on:
  push:
    branches:
      - agent/psi-production-convergence-v1
  pull_request:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: psi-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Existing smoke and truth contracts
        run: npm run test:smoke

      - name: PSI schema convergence contracts
        run: npm run test:psi

      - name: Production build integrity
        run: npm run build
