name: Cloudflare Workers Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-workers-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ACCOUNT_ID: d53c17b06219066a0325eec01c21729e

jobs:
  audit-and-fix-analytics:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Backup current Worker scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/4p-worker-backup
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts"
          for service in cre4tors-prototype 4planetmarket-prototype; do
            curl -fsS -D "/tmp/4p-worker-backup/${service}.headers" -o "/tmp/4p-worker-backup/${service}.js" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${service}"
            ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "/tmp/4p-worker-backup/${service}.headers")"
            printf '%s' "$ct" > "/tmp/4p-worker-backup/${service}.content-type"
            case "$ct" in
              application/javascript*|text/javascript*) ;;
              *) echo "Refusing mutation: ${service} has complex Content-Type ${ct}" >&2; exit 1 ;;
            esac
          done

      - name: Preserve rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-worker-backup-${{ github.sha }}
          path: /tmp/4p-worker-backup
          retention-days: 30

      - name: Deploy consent-safe analytics proxy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts"
          changed=""

          rollback() {
            rc=$?
            if [[ "$rc" -ne 0 && -n "$changed" ]]; then
              echo "Deployment failed; rolling back changed Workers." >&2
              for service in $changed; do
                ct="$(cat "/tmp/4p-worker-backup/${service}.content-type")"
                curl -fsS -X PUT "${api}/${service}" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: ${ct}" \
                  --data-binary "@/tmp/4p-worker-backup/${service}.js" >/dev/null || true
              done
            fi
            exit "$rc"
          }
          trap rollback EXIT

          deploy() {
            service="$1" origin="$2"
            out="/tmp/${service}-analytics.js"
            sed "s|__4P_ORIGIN__|${origin}|g" scripts/analytics-worker-proxy.js > "$out"
            grep -q '4PLANET_ANALYTICS_PROXY_V1' "$out"
            grep -q 'G-Q79Y9HJRL8' "$out"
            code="$(curl -sS -w '%{http_code}' -o "/tmp/${service}.put" -X PUT "${api}/${service}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/javascript" \
              --data-binary "@${out}")"
            [[ "$code" =~ ^2 ]] || { echo "Worker PUT failed for ${service}: HTTP ${code}" >&2; cat "/tmp/${service}.put" >&2; return 1; }
            changed="${changed} ${service}"
            verify="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${service}")"
            [[ "$verify" == *4PLANET_ANALYTICS_PROXY_V1* ]] || { echo "Worker source verification failed: ${service}" >&2; return 1; }
          }

          deploy cre4tors-prototype https://b8a8f6c1.4planet-05.pages.dev
          deploy 4planetmarket-prototype https://4482f621.4planet-05.pages.dev

          verify_live() {
            host="$1"
            ok=0
            for i in $(seq 1 24); do
              headers="$(curl -fsSI "https://${host}/" | tr -d '\r' || true)"
              html="$(curl -fsS "https://${host}/" || true)"
              shim="$(curl -fsS "https://${host}/_4p-analytics.js" || true)"
              csp="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/ {sub(/^[^:]+:[[:space:]]*/,""); print; exit}')"
              csp_ok=0
              if [[ -z "$csp" || ( "$csp" == *googletagmanager.com* && "$csp" == *google-analytics.com* ) ]]; then csp_ok=1; fi
              if [[ "$html" == *'/_4p-analytics.js'* && "$shim" == *'G-Q79Y9HJRL8'* && "$shim" == *'4planet.analytics.consent.v1'* && "$csp_ok" == 1 ]]; then
                ok=1; break
              fi
              sleep 5
            done
            [[ "$ok" == 1 ]] || { echo "Live analytics verification failed for ${host}" >&2; return 1; }
          }

          verify_live cre4tors.com
          verify_live 4planetmarket.com
          trap - EXIT

          cat > /tmp/workers-report.md <<'EOF'
          # Analytics Worker deployment

          - cre4tors.com: consent-safe GA4 shim **LIVE PASS**
          - 4planetmarket.com: consent-safe GA4 shim **LIVE PASS**
          - Measurement ID: `G-Q79Y9HJRL8`
          - Existing immutable product origins preserved.
          - Rollback copies saved as a GitHub Actions artifact.
          EOF

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -f /tmp/workers-report.md ]]; then
            gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body-file /tmp/workers-report.md
          else
            gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body "# Analytics Worker deployment\n\nResult: **FAIL / ROLLBACK GUARDED** on commit \`${GITHUB_SHA}\`."
          fi
