name: Cloudflare Workers Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-workers-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit worker routing
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone_json}")"
          [[ -n "${account_id}" ]] || { echo "No account id"; exit 1; }

          domains_json="$(curl -fsS "${api}/accounts/${account_id}/workers/domains" "${auth[@]}" || true)"

          {
            echo "# Cloudflare Worker custom domains"
            echo
            if jq -e '.success == true' <<<"${domains_json}" >/dev/null 2>&1; then
              for domain in 4planetmagazine.com cre4tors.com 4planetmarket.com; do
                echo "## ${domain}"
                row="$(jq -c --arg h "$domain" '.result[]? | select(.hostname==$h)' <<<"${domains_json}" | head -n1)"
                if [[ -n "$row" ]]; then
                  echo "- service: \`$(jq -r '.service // ""' <<<"$row")\`"
                  echo "- environment: \`$(jq -r '.environment // ""' <<<"$row")\`"
                  echo "- zone: \`$(jq -r '.zone_name // ""' <<<"$row")\`"
                  echo "- domain id: \`$(jq -r '.id // ""' <<<"$row")\`"
                else
                  echo "- No Worker custom-domain record found."
                fi
                echo
              done
            else
              echo "Workers Domains API unavailable with current token."
              jq '{success,errors}' <<<"${domains_json}" 2>/dev/null || true
            fi
          } > /tmp/workers-report.md
          cat /tmp/workers-report.md

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f /tmp/workers-report.md ]]; then
            gh issue comment 173 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/workers-report.md
          fi
