name: Cloudflare Workers Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-workers-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit worker routing
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone_json}")"
          [[ -n "${account_id}" ]] || { echo "No account id"; exit 1; }

          domains_json="$(curl -fsS "${api}/accounts/${account_id}/workers/domains" "${auth[@]}" || true)"
          {
            echo "# Cloudflare Worker origin audit"
            echo
            for domain in 4planetmagazine.com cre4tors.com 4planetmarket.com; do
              row="$(jq -c --arg h "$domain" '.result[]? | select(.hostname==$h)' <<<"${domains_json}" | head -n1)"
              echo "## ${domain}"
              if [[ -z "$row" ]]; then
                echo "- No Worker custom-domain record found."
                echo
                continue
              fi
              service="$(jq -r '.service // ""' <<<"$row")"
              echo "- service: \`${service}\`"
              script_file="/tmp/${service}.worker"
              code="$(curl -sS -w '%{http_code}' -o "$script_file" "${api}/accounts/${account_id}/workers/scripts/${service}" "${auth[@]}")"
              echo "- script fetch HTTP: \`${code}\`"
              if [[ "$code" == "200" ]]; then
                refs="$(grep -Eo 'https://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+' "$script_file" | sed 's/[),;]$//' | sort -u | head -n 20 || true)"
                if [[ -n "$refs" ]]; then
                  echo "- embedded URL refs:"
                  while IFS= read -r ref; do echo "  - \`${ref}\`"; done <<<"$refs"
                else
                  echo "- embedded URL refs: none detected"
                fi
                pages_refs="$(strings "$script_file" | grep -Eo '[A-Za-z0-9._-]+\.pages\.dev' | sort -u | head -n 20 || true)"
                if [[ -n "$pages_refs" ]]; then
                  echo "- pages.dev refs:"
                  while IFS= read -r ref; do echo "  - \`${ref}\`"; done <<<"$pages_refs"
                fi
              fi
              echo
            done
          } > /tmp/workers-report.md
          cat /tmp/workers-report.md

      - name: Map fixed Pages origins to source branches
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          account_id="d53c17b06219066a0325eec01c21729e"
          json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/accounts/${account_id}/pages/projects/4planet-05/deployments?per_page=100")"
          jq -e '.success == true' <<<"$json" >/dev/null
          {
            echo '# Analytics fixed-origin source map'
            echo
            for short in b8a8f6c1 4482f621; do
              row="$(jq -c --arg u "https://${short}.4planet-05.pages.dev" '.result[] | select(.url==$u)' <<<"$json" | head -n1)"
              echo "## ${short}.4planet-05.pages.dev"
              if [[ -z "$row" ]]; then
                echo '- not found in first 100 deployments'
              else
                echo "- branch: \`$(jq -r '.deployment_trigger.metadata.branch // ""' <<<"$row")\`"
                echo "- commit: \`$(jq -r '.deployment_trigger.metadata.commit_hash // ""' <<<"$row")\`"
                echo "- environment: \`$(jq -r '.environment // ""' <<<"$row")\`"
                echo "- created: \`$(jq -r '.created_on // ""' <<<"$row")\`"
              fi
              echo
            done
          } > /tmp/origin-source-report.md
          cat /tmp/origin-source-report.md

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f /tmp/workers-report.md ]]; then
            gh issue comment 173 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/workers-report.md
          fi
          if [[ -f /tmp/origin-source-report.md ]]; then
            gh issue comment 173 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/origin-source-report.md
          fi
