name: CUB MEDIEVAL CH05 — Kingdoms at War staging and economy gameplay QA
on:
  push:
    branches: ['build/medieval-ch05-kingdoms-at-war-20261022']
    paths:
      - '.github/workflows/cub-medieval-ch05-staging.yml'
      - 'site/medieval/ch05src/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cub-medieval-ch05-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve Build 03 and ROMA and validate CH05 source
        shell: bash
        run: |
          set -euo pipefail
          echo '3135d7a68083a013e90735266240a05d1a15dceb87cde2002520832cf9b42ae3  site/roma/index.html' | sha256sum -c -
          echo '3a676e40e0dfdc4f91a413a9c8f4691851c55a0a6cf0a55dfa064bedc399ca83  site/medieval/index.html' | sha256sum -c -
          node --check site/medieval/ch04src/challenger04_patch.js
          node --check site/medieval/ch05src/challenger05_patch.js
          node --check site/medieval/ch04src/ch04_extra_geometry.js
          python3 -m py_compile site/medieval/ch04src/build_ch04.py site/medieval/ch05src/build_ch05.py
      - name: Build Challenger 04 foundation and Challenger 05 Kingdoms at War
        shell: bash
        run: |
          set -euo pipefail
          python3 site/medieval/ch04src/build_ch04.py site/medieval/index.html site/medieval/challenger04/index.html
          python3 site/medieval/ch05src/build_ch05.py site/medieval/challenger04/index.html site/medieval/challenger05/index.html
          echo 'b0d7768342447feb1339fae9046bc2a4ba40c2693743424d84c76f2ac996602e  site/medieval/challenger04/index.html' | sha256sum -c -
          test "$(wc -c < site/medieval/challenger04/index.html)" -eq 2276326
          test -s site/medieval/challenger05/index.html
          echo 'CUB_CH05_BYTE_IDENTITY_AND_ROMA_PRESERVATION_PASS'
      - name: Resolve Cloudflare account using existing authorised secrets
        shell: bash
        env:
          TOKEN1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN2: ${{ secrets.CF_TOKEN }}
          TOKEN3: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for t in "$TOKEN1" "$TOKEN2" "$TOKEN3"; do
            if [ -n "$t" ]; then token="$t"; break; fi
          done
          test -n "$token" || { echo 'CLOUDFLARE_TOKEN_UNAVAILABLE'; exit 2; }
          token=$(printf '%s' "$token" | tr -d '\r\n' | sed 's/^Bearer //')
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          zones=$(curl -fsS -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/zones?name=p4nther.com')
          account=$(jq -r '.result[0].account.id // empty' <<< "$zones")
          test -n "$account" || { echo 'CLOUDFLARE_ACCOUNT_UNAVAILABLE'; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Deploy independent CH05 staging worker (never touching production CUB worker)
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy --name cub-medieval-ch05-staging --assets ./site --compatibility-date 2026-10-18
      - name: Verify publicly served game content
        run: |
          set -euo pipefail
          url=https://cub-medieval-ch05-staging.odin-skogen.workers.dev/medieval/challenger05/index.html
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 30 "$url" -o /tmp/ch05.html && grep -q 'ch05-kingdoms-at-war-01' /tmp/ch05.html; then ok=1;break;fi
            sleep 4
          done
          test "$ok" -eq 1 || { echo CH05_STAGE_NOT_VERIFIED; exit 5; }
          echo "CH05_STAGE_LIVE=$url"
      - name: Chromium mobile and desktop economy gameplay QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node <<'NODE'
          const {chromium}=require('playwright');
          const url='https://cub-medieval-ch05-staging.odin-skogen.workers.dev/medieval/challenger05/';
          (async()=>{
           const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
           const cases=[{id:'kingdoms-mobile',mobile:true,side:'kingdoms',map:'hattin-sandbox'},
             {id:'belvoir-desktop',mobile:false,side:'siege',map:'belvoir-siege'},
             {id:'marches-desktop',mobile:false,side:'marches',map:'northern-marches'},
             {id:'hattin-original',mobile:false,side:'jerusalem',map:'hattin-historical'}];
           for(const spec of cases){
             const ctx=await browser.newContext({viewport:spec.mobile?{width:390,height:844}:{width:1365,height:900},hasTouch:spec.mobile,isMobile:spec.mobile});
             const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
             const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:70000});
             await page.waitForTimeout(2000);
             await page.evaluate(side=>window.ROMA.app.newGame(side),spec.side);
             await page.waitForTimeout(5000);
             const state=await page.evaluate(()=>({playing:window.ROMA?.app?.playing,map:window.ROMA?.app?.sim?.mk04?.mapId,eco:window.MEDIEVAL_KINGDOMS_05.gameState(),menu:getComputedStyle(document.querySelector('.mk-left')).display,footer:getComputedStyle(document.querySelector('.mk-bottom')).display}));
             console.log('CH05_BROWSER',spec.id,response.status(),JSON.stringify(state),'ERRORS',JSON.stringify(errors));
             if(response.status()!==200||!state.playing||state.map!==spec.map||state.menu!=='none'||state.footer!=='none'||errors.length)throw Error('CH05 browser boot failed for '+spec.id);
             if(spec.side!=='jerusalem'){
               if(!state.eco.rts||state.eco.workers<8||state.eco.buildings<8)throw Error('Economy start incomplete: '+spec.id);
               await page.locator('#mk05ui button[data-mk05="build"]').click();
               const menu=await page.evaluate(()=>({open:window.ROMA.app.hud.buildOpen,display:getComputedStyle(document.querySelector('#buildmenu')).display,options:document.querySelectorAll('#buildmenu .pbtn').length}));
               console.log('CH05_BUILD_UI',spec.id,JSON.stringify(menu));
               if(!menu.open||menu.display==='none'||menu.options<4)throw Error('Build menu unusable');
               const outcome=await page.evaluate(()=>{
                 const s=window.ROMA.app.sim,p=s.players[1],camp=s.mk05.base;
                 const barracks=[...s.buildings.values()].find(b=>b.owner===1&&b.type==='barracks');
                 const training=s.train(barracks.id,'hastati');
                 const before=p.res.wood, beforeCount=s.buildings.size;
                 let placed=null;
                 for(const [dx,dz] of [[60,60],[-70,50],[70,-20],[-40,-60],[95,25]]){
                    const x=camp.x+dx,z=camp.z+dz;
                    if(s.validatePlacement(1,'domus',x,z,0).ok){placed=s.placeBuilding(1,'domus',x,z,0);break}
                 }
                 return {training,placed:placed?{ok:placed.ok,why:placed.reason}:null,costDeducted:p.res.wood<before,buildingAdded:s.buildings.size>beforeCount,trainQueue:barracks.queue.length};
               });
               console.log('CH05_BUILD_TRAIN',spec.id,JSON.stringify(outcome));
               if(!outcome.training.ok||!outcome.placed?.ok||!outcome.costDeducted||!outcome.buildingAdded||!outcome.trainQueue)throw Error('Build+train economy contract failed');
             }
             await page.screenshot({path:'ch05-'+spec.id+'.png',fullPage:true});
             await ctx.close();
           }
           await browser.close();console.log('CH05_ALL_GAMEPLAY_CHECKS_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medieval-ch05-live-staging-screens
          path: ch05-*.png
          retention-days: 21
          if-no-files-found: ignore
