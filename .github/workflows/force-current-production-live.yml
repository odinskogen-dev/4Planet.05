name: Force current canonical production live

on:
  push:
    branches:
      - ops/domain-routing-20260914
    paths:
      - .github/workflows/force-current-production-live.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/one-interface-sprint2-6bbfebb
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build canonical live branch
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          npm ci
          npm run build

      - name: Deploy same canonical branch to existing 4planet-05 Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest pages deploy dist \
            --project-name 4planet-05 \
            --branch release/one-interface-sprint2-6bbfebb \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "AXE verified SPECIES + ATLAS live repair"
