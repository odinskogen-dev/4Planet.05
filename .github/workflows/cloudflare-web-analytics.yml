name: Cloudflare LABS Domain Diagnose

on:
  pull_request:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-web-analytics.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_PROJECT: 4planet-05
  CF_ZONE: 4planet.org
  LABS_DOMAIN: labs.4planet.org

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read Cloudflare ownership state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone="$(curl -fsS "${api}/zones?name=${CF_ZONE}&status=active" "${auth[@]}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zone}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone}")"
          test -n "${zone_id}" && test -n "${account_id}"

          dns="$(curl -fsS "${api}/zones/${zone_id}/dns_records?name=${LABS_DOMAIN}&per_page=100" "${auth[@]}")"
          domain="$(curl -fsS "${api}/accounts/${account_id}/pages/projects/${CF_PROJECT}/domains/${LABS_DOMAIN}" "${auth[@]}")"

          dns_summary="$(jq -c '[.result[]? | {id,type,name,content,proxied,proxiable,locked,meta,comment,tags,settings}]' <<<"${dns}")"
          domain_summary="$(jq -c '{name:.result.name,status:.result.status,verification_data:.result.verification_data,validation_data:.result.validation_data,zone_tag:.result.zone_tag}' <<<"${domain}")"

          body=$(cat <<EOF
          LABS CLOUDFLARE DIAGNOSIS

          Pages domain:
          ${domain_summary}

          DNS records for labs.4planet.org:
          ${dns_summary}
          EOF
          )
          curl -fsS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg body "${body}" '{body:$body}')" >/dev/null
          echo "Diagnosis published to PR."
