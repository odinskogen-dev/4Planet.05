name: Cloudflare LABS Domain Bootstrap

on:
  pull_request:
    branches: [king/test]
    paths:
      - .github/workflows/cloudflare-web-analytics.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_PROJECT: 4planet-05
  CF_ZONE: 4planet.org
  LABS_DOMAIN: labs.4planet.org
  LABS_BRANCH: labs/overview-v1
  LABS_BRANCH_ALIAS: labs-overview-v1.4planet-05.pages.dev
  LABS_EXPECTED_SHA: 35486b0304779476e550b7d10e9981dd51dc8ef7

jobs:
  bind-labs-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Bind verified LABS branch to labs.4planet.org
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          zone_json="$(curl -fsS "${api}/zones?name=${CF_ZONE}&status=active" "${auth[@]}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zone_json}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone_json}")"
          test -n "${zone_id}" && test -n "${account_id}" || { echo "Could not resolve active ${CF_ZONE} zone/account"; exit 1; }

          deployments="$(curl -fsS "${api}/accounts/${account_id}/pages/projects/${CF_PROJECT}/deployments?env=preview&per_page=100" "${auth[@]}")"
          match="$(jq -c --arg branch "${LABS_BRANCH}" --arg sha "${LABS_EXPECTED_SHA}" '.result[]? | select((.deployment_trigger.metadata.branch // "") == $branch) | select((.deployment_trigger.metadata.commit_hash // "") == $sha)' <<<"${deployments}" | head -n1)"
          test -n "${match}" || { echo "Exact LABS deployment not found; refusing domain switch"; exit 1; }
          curl -fsS --retry 4 --retry-delay 2 "https://${LABS_BRANCH_ALIAS}/labs" -o /tmp/labs-branch.html
          grep -Eiq 'LABS|4PLANET' /tmp/labs-branch.html || { echo "Branch alias returned unexpected content"; exit 1; }

          code="$(curl -sS -o /tmp/domain-get.json -w '%{http_code}' "${api}/accounts/${account_id}/pages/projects/${CF_PROJECT}/domains/${LABS_DOMAIN}" "${auth[@]}")"
          if [[ "${code}" == "404" ]]; then
            created="$(curl -fsS -X POST "${api}/accounts/${account_id}/pages/projects/${CF_PROJECT}/domains" "${auth[@]}" --data "$(jq -nc --arg name "${LABS_DOMAIN}" '{name:$name}')")"
            [[ "$(jq -r '.success // false' <<<"${created}")" == "true" ]] || { jq '{success,errors}' <<<"${created}"; exit 1; }
          elif [[ "${code}" != "200" ]]; then
            echo "Unexpected Pages-domain lookup HTTP ${code}"; cat /tmp/domain-get.json; exit 1
          fi

          records="$(curl -fsS "${api}/zones/${zone_id}/dns_records?name=${LABS_DOMAIN}&per_page=100" "${auth[@]}")"
          record_id="$(jq -r '.result[0].id // empty' <<<"${records}")"
          payload="$(jq -nc --arg name "${LABS_DOMAIN}" --arg content "${LABS_BRANCH_ALIAS}" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')"
          if [[ -n "${record_id}" ]]; then
            dns="$(curl -fsS -X PUT "${api}/zones/${zone_id}/dns_records/${record_id}" "${auth[@]}" --data "${payload}")"
          else
            dns="$(curl -fsS -X POST "${api}/zones/${zone_id}/dns_records" "${auth[@]}" --data "${payload}")"
          fi
          [[ "$(jq -r '.success // false' <<<"${dns}")" == "true" ]] || { jq '{success,errors}' <<<"${dns}"; exit 1; }
          [[ "$(jq -r '.result.content // empty' <<<"${dns}")" == "${LABS_BRANCH_ALIAS}" ]] || { echo "DNS target mismatch"; exit 1; }
          [[ "$(jq -r '.result.proxied // false' <<<"${dns}")" == "true" ]] || { echo "DNS must be proxied for branch custom-domain routing"; exit 1; }

          status=""
          for i in $(seq 1 24); do
            domain="$(curl -fsS "${api}/accounts/${account_id}/pages/projects/${CF_PROJECT}/domains/${LABS_DOMAIN}" "${auth[@]}")"
            status="$(jq -r '.result.status // empty' <<<"${domain}")"
            [[ "${status}" == "active" ]] && break
            [[ "${status}" == "error" || "${status}" == "blocked" ]] && { jq '.result' <<<"${domain}"; exit 1; }
            sleep 5
          done
          [[ "${status}" == "active" ]] || { echo "Pages custom domain did not become active"; exit 1; }

          curl -fsS -L --retry 8 --retry-delay 3 "https://${LABS_DOMAIN}/" -o /tmp/labs-root.html
          curl -fsS -L --retry 8 --retry-delay 3 "https://${LABS_DOMAIN}/labs" -o /tmp/labs-path.html
          grep -Eiq 'LABS' /tmp/labs-root.html || { echo "Custom-domain root does not render LABS"; exit 1; }
          grep -Eiq 'LABS' /tmp/labs-path.html || { echo "Custom-domain /labs does not render LABS"; exit 1; }
          curl -fsS -L --retry 4 --retry-delay 2 "https://4planet.org/" -o /tmp/main.html
          test -s /tmp/main.html || { echo "4planet.org regression check failed"; exit 1; }

          echo "result=PASS" >> "$GITHUB_OUTPUT"
          echo "LABS custom domain is live and verified."

      - name: Report PASS to pull request
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          LABS DOMAIN BOOTSTRAP — PASS

          Verified source: https://labs-overview-v1.4planet-05.pages.dev/labs
          Source branch: labs/overview-v1
          Source SHA: 35486b0304779476e550b7d10e9981dd51dc8ef7
          Live root: https://labs.4planet.org/
          Live Project OS: https://labs.4planet.org/labs

          Cloudflare Pages custom-domain state = active.
          DNS readback = proxied CNAME to labs-overview-v1.4planet-05.pages.dev.
          HTTPS/root/LABS content checks = PASS.
          4planet.org reachability regression check = PASS.
          EOF
          )
          curl -fsS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg body "${body}" '{body:$body}')" >/dev/null

      - name: Report failure to pull request
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='LABS DOMAIN BOOTSTRAP — FAIL. Domain is not approved as live. Inspect this workflow run; no production-code merge is required.'
          curl -fsS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg body "${body}" '{body:$body}')" >/dev/null
