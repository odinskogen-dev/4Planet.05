name: Inspect Frontier Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-gateway-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - name: Inspect current test gateway
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_KEY:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          EMAIL="${CF_EMAIL:-odin.skogen@gmail.com}"
          request() {
            local url="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $CF_KEY" "$url" || true)
            if [ "$code" = "400" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
              code=$(curl -sS -o "$out" -w '%{http_code}' -H "X-Auth-Email: $EMAIL" -H "X-Auth-Key: $CF_KEY" "$url" || true)
            fi
            echo "$code"
          }
          ZCODE=$(request "https://api.cloudflare.com/client/v4/zones?name=4planet.org" zone.json)
          echo "zone_http=$ZCODE"
          python - <<'PY'
          import json
          z=json.load(open('zone.json'))
          if not z.get('success') or not z.get('result'):
              raise SystemExit('zone lookup failed: '+str(z.get('errors')))
          zone=z['result'][0]
          print('zone_id='+zone['id'])
          print('account_id='+zone['account']['id'])
          open('ids.env','w').write('ZONE_ID='+zone['id']+'\nACCOUNT_ID='+zone['account']['id']+'\n')
          PY
          . ids.env
          WCODE=$(request "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/4planet-four-state-control-v1" worker.txt)
          echo "worker_http=$WCODE"
          echo "----- WORKER START -----"
          sed -n '1,260p' worker.txt
          echo "----- WORKER END -----"
