name: Verify Frontier Legacy Chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-gateway-inspect.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: External redirect-chain readback
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --connect-timeout 10 --max-time 30 -D frontier.h -o frontier.b https://test.4planet.org/frontier
          curl -sS --connect-timeout 10 --max-time 30 -D slash.h -o /dev/null https://test.4planet.org/universalboard/
          curl -sS --connect-timeout 10 --max-time 30 -L -o /dev/null -w 'legacy_effective=%{url_effective}\nlegacy_code=%{http_code}\nredirects=%{num_redirects}\n' https://test.4planet.org/universalboard > chain.txt
          curl -sS --connect-timeout 10 --max-time 30 -o root.b https://test.4planet.org/

          cat slash.h
          cat chain.txt

          grep -Eq '^HTTP/[^ ]+ 200' frontier.h
          grep -q '4PLANET FRONTIER' frontier.b
          grep -q 'life-os-canvas-6g481v.v2.appdeploy.ai' frontier.b
          grep -Eq '^HTTP/[^ ]+ 308' slash.h
          grep -qi '^location: https://test.4planet.org/frontier' slash.h
          grep -q '^legacy_effective=https://test.4planet.org/frontier$' chain.txt
          ! grep -q 'life-os-canvas-6g481v.v2.appdeploy.ai' root.b
          echo "FRONTIER_LEGACY_CHAIN=PASS"
