name: Security and Search Review QA

on:
  pull_request:
    paths:
      - 'src/identity/identityClient.ts'
      - 'src/analytics/Analytics.tsx'
      - 'scripts/analytics-privacy-contract.test.mjs'
      - 'scripts/identity-oauth-contract.test.mjs'
      - 'ops/discovery/4species-router.js'
      - 'scripts/species-sitemap-safety.test.mjs'
      - 'scripts/search-live-readonly-audit.mjs'
      - '.github/workflows/security-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-species-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify OAuth credential-scrubbing and auth compatibility
        run: node --test scripts/identity-oauth-contract.test.mjs
      - name: Verify reviewed-only SPECIES sitemap and robots route
        run: node --test scripts/species-sitemap-safety.test.mjs
      - name: Reject sensitive Analytics parameters before both telemetry sinks
        run: node --test scripts/analytics-privacy-contract.test.mjs
      - name: Verify types
        run: npm run typecheck
      - name: Observe actual public robots, sitemaps and landing pages without writing
        run: node scripts/search-live-readonly-audit.mjs
      - name: Preserve dated URL-level read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-search-live-readonly-audit
          path: search-live-audit.json
          if-no-files-found: ignore
