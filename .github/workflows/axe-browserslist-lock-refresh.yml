name: AXE Browserslist lock refresh

on:
  push:
    branches:
      - fix/testking-browserslist-20260901

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate only the transitive Browserslist lock tree
        run: npm update browserslist --package-lock-only --ignore-scripts

      - name: Prove high-severity dependency gate is closed
        run: npm audit --audit-level=high

      - name: Show bounded lock delta
        run: git diff -- package-lock.json

      - name: Commit generated lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): refresh Browserslist transitive lock tree"
          git push origin HEAD:fix/testking-browserslist-20260901
