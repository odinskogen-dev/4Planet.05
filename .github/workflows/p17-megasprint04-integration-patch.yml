name: P17 Megasprint 04 integration patch

on:
  push:
    branches:
      - build/p17-organisations-discovery-scale-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p17-integration-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/p17-organisations-discovery-scale-gate
          fetch-depth: 0
      - name: Apply bounded integration patch
        run: python scripts/p17-megasprint04-integration-patch.py
      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/PublicShell.tsx src/pages/v5/Home.tsx src/pages/integrated/Actors.tsx src/earth/World.tsx
          if git diff --cached --quiet; then
            echo "No patch required"
          else
            git commit -m "feat(p17): connect organisations across the main universe [p17-integration-patched]"
            git push origin HEAD:build/p17-organisations-discovery-scale-gate
          fi
