name: Dispatch 4MARKET private canary
on:
  push:
    branches:
      - axe/market-commerce-pod-multisprint-20260915
    paths:
      - '.github/market-commerce-canary-trigger.txt'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private canary workflow on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/market-commerce-canary-stage.yml/dispatches" \
            -d "{\"ref\":\"$REF_NAME\"}"
          echo 'Private canary workflow dispatched.'
