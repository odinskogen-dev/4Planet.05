name: Magazine Email Bootstrap

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/magazine-email-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Configure 4planetmagazine.com email
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo "TOKEN_MISSING"; exit 2; }
          echo "::add-mask::$CF_TOKEN"
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }

          ZONES=$(api "https://api.cloudflare.com/client/v4/zones?name=4planetmagazine.com&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",[]); print(r[0].get("id","") if r else "")')
          [ -n "$ZONE_ID" ] || { echo "ZONE_NOT_VISIBLE"; exit 3; }
          echo "ZONE_VISIBLE"

          # Idempotent activation: Cloudflare keeps existing routing DNS if already enabled.
          ENABLE=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/dns")
          printf '%s' "$ENABLE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROUTING_ENABLE_SUCCESS="+str(d.get("success"))); print("ROUTING_ENABLE_ERRORS="+" | ".join(str(x.get("code",""))+":"+x.get("message","") for x in (d.get("errors") or [])))'

          create_record() {
            local body="$1" label="$2"
            local resp
            resp=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" --data "$body")
            printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sys.argv[1]+"_SUCCESS="+str(d.get("success"))); print(sys.argv[1]+"_ERRORS="+" | ".join(str(x.get("code",""))+":"+x.get("message","") for x in (d.get("errors") or [])))' "$label"
          }

          create_record '{"type":"TXT","name":"resend._domainkey","content":"p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCnh+r+YYLA4etv26HKCQGR36m6f9hmskNuWPDLvIYVP7nICuDIx5CWmI2fxKSB8glJjd4MgQKQEqh4e+ye+ScL54LSylM3e0CzqUFAg5jn6vz3ez/YoKaxyjLtoOWZsVgo1P1P47nrFem0Z+DSreR2Ak8DhEN+iJC0q2xb2LRjRQIDAQAB","ttl":1}' DKIM
          create_record '{"type":"MX","name":"send","content":"feedback-smtp.eu-west-1.amazonses.com","priority":10,"ttl":1}' SPF_MX
          create_record '{"type":"TXT","name":"send","content":"v=spf1 include:amazonses.com ~all","ttl":1}' SPF_TXT
          create_record '{"type":"TXT","name":"_dmarc","content":"v=DMARC1; p=none; adkim=r; aspf=r; pct=100","ttl":1}' DMARC

          RULE_BODY='{"name":"4PLANET Magazine editor","enabled":true,"matchers":[{"type":"literal","field":"to","value":"editor@4planetmagazine.com"}],"actions":[{"type":"forward","value":["odin.skogen@gmail.com"]}],"priority":0}'
          RULE=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/rules" --data "$RULE_BODY")
          printf '%s' "$RULE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROUTE_CREATE_SUCCESS="+str(d.get("success"))); print("ROUTE_CREATE_ERRORS="+" | ".join(str(x.get("code",""))+":"+x.get("message","") for x in (d.get("errors") or [])))'

          STATUS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing")
          printf '%s' "$STATUS" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("FINAL_STATUS="+str(r.get("status"))); print("FINAL_ENABLED="+str(r.get("enabled")))'
