name: LIVE Promotion Authority Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-authority-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail closed unless exact Founder-authorised TEST KING artifact
        run: node scripts/live-promotion-authority-gate.mjs
