name: Public Credibility Phase 02 Gate

on:
  push:
    branches:
      - agent/public-credibility-phase02-p0-convergence-v1
  pull_request:
    paths:
      - "src/pages/credibility/**"
      - "src/routes/router.tsx"
      - "src/pages/integrated/ImpactPrototype.tsx"
      - "scripts/public-credibility-contracts.test.mjs"
      - ".github/workflows/public-credibility-phase02.yml"

permissions:
  contents: read

jobs:
  credibility-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify controlled assets
        run: npm run assets:verify

      - name: Build candidate
        run: npm run build

      - name: Run existing prototype contracts
        run: npm run test:contracts

      - name: Run public credibility contracts
        run: node --test scripts/public-credibility-contracts.test.mjs
