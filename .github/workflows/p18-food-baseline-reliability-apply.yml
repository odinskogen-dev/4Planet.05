name: P18 FOOD Apply Baseline Reliability

on:
  push:
    branches:
      - agent/p18-food-02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'require reliable baseline for comparison') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FOOD continuation branch
        uses: actions/checkout@v4
        with:
          ref: agent/p18-food-02

      - name: Apply staged reliability patch
        run: node scripts/apply-baseline-reliability.mjs

      - name: Commit reliability contract
        run: |
          rm scripts/apply-baseline-reliability.mjs
          rm .github/workflows/p18-food-baseline-reliability-apply.yml
          git config user.name "4PLANET Gate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/food/core.js scripts/food-contracts.test.mjs scripts/apply-baseline-reliability.mjs .github/workflows/p18-food-baseline-reliability-apply.yml
          git commit -m "fix(food): require reliable baseline for comparison"
          git push origin HEAD:agent/p18-food-02
