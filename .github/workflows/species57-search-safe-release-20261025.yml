name: 4SPECIES 57 — controlled search discovery LIVE upgrade + IndexNow
on:
  push:
    branches: [ops/species57-search-discovery-20261025]
    paths: [.github/workflows/species57-search-safe-release-20261025.yml]
permissions: {contents: read}
concurrency: {group: species57-20261025-search-live, cancel-in-progress: false}
jobs:
  verify-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_WORKER_VERSION: c13f2334-bb70-4f79-b3a4-41222100f287
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Compile verified 57-source additive directory patch, exact frozen 57 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/release/species-v1-selective-20261022:refs/remotes/origin/release/species-v1-selective-20261022
          src=origin/release/species-v1-selective-20261022
          test "$(git rev-parse "$src:ops/discovery/4species-router.js")" = "140d6854b34609e537a016068543c8bf44a6e7cf"
          for f in ops/discovery/4species-router.js ops/discovery/species-proof-router.js public/species-data/v1/english-oak.json; do
            git cat-file -e "$src:$f"
            git restore --source="$src" --worktree -- "$f"
          done
          python3 ops/species57/patch-57-discovery.py ops/discovery/4species-router.js ops/discovery/4species-router-seo57.js
          node --check ops/discovery/4species-router-seo57.js
          node --check ops/discovery/species57-search-directory.js
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {directoryHtml,directoryJson,exploreDiscoveryFooter,directoryEntries} from "./ops/discovery/species57-search-directory.js";
          const r=await fetch("https://4species.com/species-data/v1/index.json",{headers:{"User-Agent":"4SPECIES-57-SEARCH-DRYRUN/20261025"}});
          assert.equal(r.status,200);
          const index=await r.json();
          assert.equal(index.pages.length,57);
          const html=directoryHtml(index),json=JSON.parse(directoryJson(index)),nav=exploreDiscoveryFooter(index);
          assert.equal(directoryEntries(index).length,57);
          assert.equal(json.total,57);
          assert.equal((html.match(/class="card"/g)||[]).length,57);
          assert.equal((nav.match(/href="\/[a-z-]+"/g)||[]).length,19);
          assert.ok(html.includes('"@type":"CollectionPage"')&&html.includes('"@type":"ItemList"'));
          assert.ok(html.includes('rel="canonical" href="https://4species.com/species-directory"'));
          assert.ok(html.includes('robots" content="index,follow'));
          for(const slug of ["orca","koala","giant-sequoia"])assert.ok(html.includes('href="/'+slug+'"'));
          assert.ok(!html.includes("editorial-card.svg")&&!nav.includes("editorial-card.svg"));
          console.log("SPECIES57_DRYRUN_SOURCE_DATA_DIRECTORY57_NEW18_LINKS_PASS");
          NODE
      - name: Preserve read-only before snapshots; no original 39 site changes allowed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p species57-search-release
          python3 - <<'PY'
          import concurrent.futures,urllib.request,hashlib,json
          from pathlib import Path
          site="https://4species.com"
          old39="orca lion tiger african-savanna-elephant asian-elephant bald-eagle black-rhinoceros blue-whale bornean-orangutan cheetah chimpanzee emperor-penguin giant-panda giraffe gray-wolf great-white-shark green-sea-turtle hippopotamus jaguar monarch-butterfly polar-bear english-oak western-honey-bee fly-agaric common-octopus atlantic-puffin sei-whale eurasian-lynx humpback-whale sperm-whale harbour-porpoise bottlenose-dolphin atlantic-cod blue-mussel whale-shark leopard eastern-gorilla acropora-palmata hyacinth-macaw".split()
          old18="koala quokka capybara red-fox giant-anteater giant-otter walrus common-kingfisher secretary-bird scarlet-macaw peregrine-falcon ocean-sunfish giant-manta-ray greater-blue-ringed-octopus peacock-mantis-shrimp venus-flytrap titan-arum giant-sequoia".split()
          assert len(old39)==39 and len(old18)==18
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"4SPECIES-SEARCH-LIVE-SNAPSHOT/20261025","Cache-Control":"no-cache"}),timeout=40) as r:return r.read(),dict(r.headers),r.status
          def snapshot(slug):
            data,_,_=get(site+"/species-data/v1/"+slug+".json")
            html,headers,status=get(site+"/"+slug)
            frozen="https://e17e1392.4planet-05.pages.dev" if slug in old39 else "https://de9e3e0e.4planet-05.pages.dev"
            prior=json.loads(get(frozen+"/species-data/v1/"+slug+".json")[0])
            assert status==200 and json.loads(data)==prior,("BASELINE57_FAILED",slug)
            assert (site+"/"+slug).encode() in html
            return {"slug":slug,"htmlSha":hashlib.sha256(html).hexdigest(),"jsonSha":hashlib.sha256(data).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: rows=list(ex.map(snapshot,old39+old18))
          assert len(rows)==57
          Path("species57-search-release/pre.json").write_text(json.dumps(rows,indent=2))
          print("SPECIES57_PRE_RELEASE_IMMUTABLE_39_PLUS_18_PASS",len(rows))
          PY
      - name: Production worker version safety precondition — reject any concurrent deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/zones?name=4species.com" > /tmp/zones.json
          account=$(jq -r '.result[0].account.id // empty' /tmp/zones.json)
          test -n "$account"
          curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$account/workers/scripts/4species-router/deployments" > /tmp/deploy.json
          current=$(jq -er '.result | (if type=="array" then . else .deployments end) | .[0].versions[0].version_id' /tmp/deploy.json)
          test "$current" = "$EXPECTED_WORKER_VERSION" || { echo "STOP_WRONG_WORKER_VERSION:$current"; exit 1; }
          echo "ROLLBACK_WORKER=$current" >> "$GITHUB_ENV"
          echo "SPECIES57_PRELIVE_WORKER_PINNED $current"
      - name: Deploy only discovery extension; verify all 57 original bytes and new crawler routes; auto rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            echo "SPECIES57_SEARCH_RELEASE_FAILED_ROLLBACK $ROLLBACK_WORKER"
            npx --yes wrangler@4.128.0 rollback "$ROLLBACK_WORKER" --name 4species-router || true
          }
          trap rollback ERR
          npx --yes wrangler@4.128.0 deploy ops/discovery/4species-router-seo57.js --name 4species-router --compatibility-date 2026-10-05 --keep-vars 2>&1 | tee /tmp/species57-deploy.log
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,urllib.request,xml.etree.ElementTree as ET,re
          root="https://4species.com"
          before={x["slug"]:x for x in json.loads(Path("species57-search-release/pre.json").read_text())}
          assert len(before)==57
          def get(path):
            with urllib.request.urlopen(urllib.request.Request(root+path,headers={"User-Agent":"4SPECIES-57-POSTLIVE-SEO/20261025","Cache-Control":"no-cache"}),timeout=40) as r:return r.read(),dict(r.headers),r.status
          def check(slug):
            h,headers,status=get("/"+slug)
            raw,_,_=get("/species-data/v1/"+slug+".json")
            assert status==200 and hashlib.sha256(h).hexdigest()==before[slug]["htmlSha"],("EXISTING_PROFILE_HTML_CHANGED",slug)
            assert hashlib.sha256(raw).hexdigest()==before[slug]["jsonSha"],("EXISTING_PROFILE_JSON_CHANGED",slug)
            assert (root+"/"+slug).encode() in h
            assert "noindex" not in headers.get("X-Robots-Tag","").lower()
            assert b"editorial-card.svg" not in h
            return slug
          with ThreadPoolExecutor(max_workers=5) as pool: checked=list(pool.map(check,before))
          assert len(checked)==57
          catalogue=json.loads(get("/species-data/v1/index.json")[0])
          assert len(catalogue["pages"])==57
          directory,head,status=get("/species-directory")
          assert status==200 and b"Species Directory" in directory and b"index,follow" in directory
          assert directory.count(b'class="card"')==57
          assert b"/orca" in directory and b"/koala" in directory
          assert "noindex" not in head.get("X-Robots-Tag","").lower()
          directoryData=json.loads(get("/species-directory.json")[0])
          assert directoryData["total"]==57 and len(directoryData["profiles"])==57
          explore,_,status=get("/explore")
          assert status==200 and b'id="species57-search-discovery"' in explore
          for slug in ("koala","giant-sequoia","common-kingfisher"):
            assert (b'href="/'+slug.encode()+b'"') in explore
          xml=get("/sitemap.xml")[0]
          locs={el.text for el in ET.fromstring(xml).iter() if el.tag.endswith("loc") and el.text}
          assert root+"/species-directory" in locs
          assert all(root+"/"+slug in locs for slug in before)
          assert root+"/red-panda" not in locs
          robots=get("/robots.txt")[0].decode()
          assert "Sitemap: https://4species.com/sitemap.xml" in robots
          llms=get("/llms.txt")[0]
          assert b"4PLANET SPECIES" in llms
          imageSitemap=get("/species-v1-images.xml")[0]
          assert imageSitemap.count(b"<image:image>")==18
          print("SPECIES57_SEARCH_LIVE_CLOSURE_PASS_39_ORIGINAL_HTML_JSON_IDENTICAL_18_IDENTICAL_57_CATALOG_ALL_LINKED")
          print("SPECIES57_SEO_PUBLIC_DIRECTORY_JSON_HTML_SITEMAP_EXPLORER_PASS")
          Path("species57-search-release/results.json").write_text(json.dumps({"unchanged57":57,"original39Changed":0,"older18Changed":0,"directoryHtml":True,"directoryJson":True,"exploreNew18":True,"sitemapAll57":True,"imageSitemap18":True,"newSpeciesPublished":0},indent=2))
          PY
          trap - ERR
      - name: Submit all 57 LIVE species canonical URLs to IndexNow once after real discovery structure update
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          old=json.load(open("species57-search-release/pre.json"))
          urls=["https://4species.com/"+p["slug"] for p in old]
          assert len(urls)==len(set(urls))==57
          key="8f4c2d91a7b64e3fa1c9d0b6e5274a83"
          with urllib.request.urlopen("https://4species.com/"+key+".txt",timeout=25) as r:assert r.read().decode().strip()==key
          payload=json.dumps({"host":"4species.com","key":key,"keyLocation":"https://4species.com/"+key+".txt","urlList":urls}).encode()
          request=urllib.request.Request("https://api.indexnow.org/indexnow",data=payload,headers={"Content-Type":"application/json; charset=utf-8"},method="POST")
          try:
            with urllib.request.urlopen(request,timeout=35) as r:
              code=r.status
          except Exception as exc:
            print("SPECIES57_INDEXNOW_NOT_CONFIRMED",str(exc)[:250])
            raise
          json.dump({"http":code,"submittedUrls":57,"status":"RECEIVED_ONLY_NOT_VERIFIED_INDEXED"},open("species57-search-release/indexnow.json","w"),indent=2)
          assert code in (200,202)
          print("SPECIES57_INDEXNOW_ACKNOWLEDGED",code,57,"NOT_GOOGLE_INDEXING_PROOF")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: species57-search-live-proof-indexnow-and-full57-regression
          path: species57-search-release/
          retention-days: 30
          if-no-files-found: error
