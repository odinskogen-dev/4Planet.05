name: P18 FOOD Vertical Slice Gate

on:
  push:
    branches:
      - agent/p18-food-vertical-slice
  pull_request:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - "src/food/**"
      - "functions/api/food.ts"
      - "scripts/food-contracts.test.mjs"
      - "tests/e2e/food-vertical-slice.spec.ts"
      - "src/routes/router.tsx"
      - "package.json"
      - ".github/workflows/p18-food-vertical-slice.yml"

permissions:
  contents: read

concurrency:
  group: p18-food-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck FOOD source adapter
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM functions/api/food.ts

      - name: Production build
        run: npm run build

      - name: FOOD contracts
        run: npm run test:food

      - name: Repository smoke contracts
        run: npm run test:smoke

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start bounded local preview
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 > /tmp/p18-food-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/labs/food-intelligence > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p18-food-preview.log
          exit 1

      - name: Run deterministic local browser fixtures
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/food-vertical-slice.spec.ts

      - name: Await hosted branch preview
        env:
          HOSTED_URL: https://agent-p18-food-vertical-slic.4planet-05.pages.dev
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent --show-error "$HOSTED_URL/labs/food-intelligence" > hosted-food-route.html; then
              printf '%s\n' "$HOSTED_URL" > hosted-food-url.txt
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run deterministic hosted browser fixtures
        env:
          BASE_URL: https://agent-p18-food-vertical-slic.4planet-05.pages.dev
        run: npx playwright test tests/e2e/food-vertical-slice.spec.ts

      - name: Capture one real Open Food Facts source envelope
        env:
          HOSTED_URL: https://agent-p18-food-vertical-slic.4planet-05.pages.dev
          BARCODE: "7038010055652"
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output hosted-food-source.json --write-out '%{http_code}' "$HOSTED_URL/api/food?barcode=$BARCODE" || true)"
            if [ "$status" = "200" ] && node -e 'JSON.parse(require("fs").readFileSync("hosted-food-source.json", "utf8"))'; then
              break
            fi
            sleep 2
          done

          node <<'NODE'
          const fs = require('fs');
          const envelope = JSON.parse(fs.readFileSync('hosted-food-source.json', 'utf8'));
          if (!envelope.source || !envelope.product || !envelope.request) {
            throw new Error('Hosted FOOD response is not a valid source envelope');
          }
          const products = Array.isArray(envelope.alternatives?.raw?.products)
            ? envelope.alternatives.raw.products
            : [];
          const summary = {
            requestedBarcode: envelope.request.barcode ?? null,
            retrievedAt: envelope.retrievedAt ?? null,
            sourceId: envelope.source.id ?? null,
            apiVersion: envelope.source.apiVersion ?? null,
            schemaVersion: envelope.source.schemaVersion ?? null,
            productKind: envelope.product.kind ?? null,
            productStatus: envelope.product.httpStatus ?? null,
            productCode: envelope.product.raw?.code ?? null,
            productName: envelope.product.raw?.product_name ?? null,
            brand: envelope.product.raw?.brands ?? null,
            quantity: envelope.product.raw?.quantity ?? null,
            categories: envelope.product.raw?.categories_tags ?? [],
            categoryTag: envelope.alternatives?.categoryTag ?? null,
            marketScope: envelope.alternatives?.marketScope ?? null,
            alternativeKind: envelope.alternatives?.kind ?? null,
            alternativeCount: products.length,
            licence: envelope.source.licence ?? null,
          };
          fs.writeFileSync('hosted-food-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Evaluate live product-card and comparison gates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { normaliseSourceEnvelope, rankAlternatives } from './src/food/core.js';

          const envelope = JSON.parse(fs.readFileSync('hosted-food-source.json', 'utf8'));
          const result = normaliseSourceEnvelope(envelope);
          if (result.state !== 'found' || !result.product) {
            throw new Error(`Live product-card gate failed: state=${result.state}`);
          }

          const product = result.product;
          const productGatePass = Boolean(
            product.gtin
            && product.name
            && product.sourceRef?.sourceId === 'open_food_facts'
            && !['malformed', 'conflicted'].includes(product.dataQuality.state)
          );
          if (!productGatePass) {
            throw new Error(`Live product-card gate failed: ${JSON.stringify(product.dataQuality)}`);
          }

          const ranking = rankAlternatives(product, result.alternatives ?? [], { lowerSugar: true });
          const comparisonGatePass = Boolean(
            result.alternativeState === 'found'
            && ranking.eligible.length >= 3
            && ranking.eligible.every((item) =>
              item.product.comparisonCategory === product.comparisonCategory
              && item.explanations.length > 0
              && !Object.prototype.hasOwnProperty.call(item, 'score')
            )
          );

          const decisionSummary = {
            productGate: productGatePass ? 'PASS' : 'FAIL',
            comparisonGate: comparisonGatePass ? 'PASS' : 'FAIL',
            modelVersion: product.modelVersion,
            comparisonModelVersion: ranking.modelVersion,
            product: {
              gtin: product.gtin,
              name: product.name,
              brand: product.brand,
              quantity: product.quantity,
              comparisonCategory: product.comparisonCategory,
              confidence: product.dataQuality.confidence,
              completeness: product.dataQuality.completeness,
              missingFields: product.dataQuality.missingFields,
              conflicts: product.dataQuality.conflicts,
            },
            source: product.sourceRef,
            rawAlternativeCount: result.alternatives?.length ?? 0,
            alternativeSourceState: result.alternativeState ?? null,
            eligibleCount: ranking.eligible.length,
            excludedCount: ranking.excluded.length,
            topAlternatives: ranking.eligible.map((item) => ({
              gtin: item.product.gtin,
              name: item.product.name,
              brand: item.product.brand,
              confidence: item.product.dataQuality.confidence,
              reasons: item.explanations,
            })),
            exclusionReasons: ranking.excluded.slice(0, 10).map((item) => ({
              gtin: item.product.gtin,
              name: item.product.name,
              reasons: item.exclusions,
            })),
          };

          fs.writeFileSync('hosted-food-decision-summary.json', JSON.stringify(decisionSummary, null, 2));
          console.log(JSON.stringify(decisionSummary, null, 2));

          if (!comparisonGatePass) {
            throw new Error(`Live comparison gate failed: eligible=${ranking.eligible.length}, source=${result.alternativeState}`);
          }
          NODE

      - name: Upload FOOD gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p18-food-gate-evidence
          path: |
            playwright-report
            test-results
            /tmp/p18-food-preview.log
            hosted-food-url.txt
            hosted-food-route.html
            hosted-food-source.json
            hosted-food-summary.json
            hosted-food-decision-summary.json
          if-no-files-found: warn
          retention-days: 14
