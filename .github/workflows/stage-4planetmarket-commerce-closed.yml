name: Stage 4MARKET commerce runtime — public checkout CLOSED
on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/stage-4planetmarket-commerce-closed.yml'
permissions:
  contents: read
concurrency:
  group: bind-4planetmarket-domain
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 0061d27addfeb68760a091c2bf1bf944c791c231
  MARKET_UPSTREAM: https://f9588c18.4planet-05.pages.dev
  MARKET_MARKER: 4market-commerce-closed-0061d27
  ROLLBACK_UPSTREAM: https://1ae04048.4planet-05.pages.dev
  ROLLBACK_SOURCE: 90f04d71ddb56ba01cf460a96713404c22cb4822
  ROLLBACK_MARKER: 4market-11-products-amalie-90f04d7

jobs:
  stage-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commerce candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=''
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/zones.json"
          status=$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=4planetmarket.com&status=active')
          test "$status" = 200
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$file")
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Judge candidate before live mutation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/market-commerce-contract.test.mjs
          npx --yes tsx@latest scripts/market-commerce-integration.test.ts
          npx tsc --noEmit
          npm run build
          npx --yes wrangler@latest deploy workers/4planetmarket-commerce.ts --name 4planetmarket-prototype --compatibility-date 2026-09-15 --dry-run --outdir "$RUNNER_TEMP/worker-build"
          for path in /market /market/odin/reinebringen-vista.jpg /market/amalie/a01-dense-animals-green-leaves.jpg; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$MARKET_UPSTREAM$path")
            test "$code" = 200
          done

      - name: Deploy isolated commerce Worker with every release switch OFF
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$GITHUB_WORKSPACE/workers/4planetmarket-commerce.ts"
          compatibility_date = "2026-09-15"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [vars]
          MARKET_UPSTREAM = "$MARKET_UPSTREAM"
          MARKET_SOURCE_SHA = "$CANDIDATE_SHA"
          MARKET_MARKER = "$MARKET_MARKER"
          MARKET_COMMERCE_ENV = "LIVE"
          MARKET_PUBLIC_ORIGIN = "https://4planetmarket.com"
          MARKET_STRIPE_LIVE_ENABLED = "false"
          MARKET_FULFILMENT_LIVE_ENABLED = "false"
          MARKET_LIVE_RELEASE_APPROVED = "false"
          MARKET_LIVE_CANARY_ENABLED = "false"
          MARKET_PHOTO_SAMPLE_APPROVED = "false"
          MARKET_ART_SAMPLE_APPROVED = "false"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"
          touch "$RUNNER_TEMP/market-mutated"

      - name: Verify live API is fail-closed and UI is exact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "https://4planetmarket.com/api/market-commerce-status?stage=$CANDIDATE_SHA&attempt=$attempt" || true)
            if [ "$code" = 200 ] && jq -e '.environment=="LIVE" and .publicCheckoutEnabled==false and .checkoutInfrastructureReady==false' "$RUNNER_TEMP/status.json" >/dev/null 2>&1; then
              break
            fi
            sleep 4
          done
          jq -e '.environment=="LIVE" and .publicCheckoutEnabled==false and .checkoutInfrastructureReady==false' "$RUNNER_TEMP/status.json" >/dev/null
          checkout_code=$(curl -sS -o "$RUNNER_TEMP/checkout.json" -w '%{http_code}' -X POST https://4planetmarket.com/api/market-checkout -H 'content-type: application/json' -H 'origin: https://4planetmarket.com' --data '{"productId":"market:odin:reinebringen-vista","attemptId":"closedstage001"}')
          test "$checkout_code" = 503
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const viewport of [{width:1440,height:1000},{width:390,height:844}]) {
            const page = await browser.newPage({viewport});
            const response = await page.goto('https://4planetmarket.com/?commerce_stage=0061d27', {waitUntil:'networkidle', timeout:60000});
            const headers = response?.headers() ?? {};
            if (headers['x-4planet-market'] !== '4market-commerce-closed-0061d27') throw new Error('Wrong Market Worker marker');
            await page.waitForSelector('.mkt-first-product');
            if (await page.locator('.mkt-first-product').count() !== 11) throw new Error('Expected 11 products');
            if (await page.getByText('BUY PRINT →').count() !== 0) throw new Error('Public BUY unexpectedly enabled');
            const text=(await page.locator('.mkt-first-products').innerText()).toLowerCase();
            for (const token of ['release gated','launch price candidate','odin oddekalv','amalie marie myrtvedt']) if(!text.includes(token)) throw new Error(`Missing ${token}`);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>2) throw new Error(`overflow ${overflow}`);
            await page.close();
          }
          await browser.close();
          NODE
          other=$(curl -sSI https://4planet.org/ | tr -d '\r' | grep -i '^x-4planet-market:' || true)
          test -z "$other"
          touch "$RUNNER_TEMP/live-verified"

      - name: Automatic rollback on any post-deploy failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/market-mutated" ] || [ -f "$RUNNER_TEMP/live-verified" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/rollback.mjs" <<EOF
          const UPSTREAM = "$ROLLBACK_UPSTREAM";
          const MARKER = "$ROLLBACK_MARKER";
          const SOURCE = "$ROLLBACK_SOURCE";
          export default { async fetch(request) {
            const incoming = new URL(request.url);
            const upstream = new URL(incoming.pathname || "/", UPSTREAM);
            upstream.search = incoming.search;
            const response = await fetch(new Request(upstream.toString(), request));
            const headers = new Headers(response.headers);
            headers.set('x-robots-tag','noindex, nofollow, noarchive');
            headers.set('x-4planet-market',MARKER);
            headers.set('x-4planet-market-source',SOURCE);
            headers.set('cache-control','no-store');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers});
          }};
          EOF
          cat > "$RUNNER_TEMP/rollback.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/rollback.mjs"
          compatibility_date = "2026-09-15"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/rollback.toml"
