name: Snapshot Public Worker Sources

on:
  push:
    branches:
      - king/test
    paths:
      - .github/workflows/snapshot-public-workers.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: king/test
          fetch-depth: 0

      - name: Export deployed Worker source
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n')
          token="${token#Bearer }"
          echo "::add-mask::$token"
          api='https://api.cloudflare.com/client/v4'
          zone=$(curl -fsS -H "Authorization: Bearer $token" "$api/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id' <<<"$zone")
          mkdir -p ops/discovery/live-workers
          for script in 4planetmarket-prototype cre4tors-prototype 4planet-brain-public four-sapien-embla n4turetech-treeoflife-proto; do
            curl -fsS -D "/tmp/$script.headers" -o "/tmp/$script.body" -H "Authorization: Bearer $token" "$api/accounts/$aid/workers/scripts/$script"
            python3 scripts/extract-worker-source.py "$script" "/tmp/$script.headers" "/tmp/$script.body" "ops/discovery/live-workers/$script.js"
            node --check "ops/discovery/live-workers/$script.js"
          done

      - name: Commit source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4PLANET automation"
          git config user.email "automation@4planet.org"
          git add ops/discovery/live-workers
          if git diff --cached --quiet; then
            echo "SNAPSHOT_UNCHANGED"
            exit 0
          fi
          git commit -m "control(discovery): snapshot live public Worker sources"
          git pull --rebase origin king/test
          git push origin HEAD:king/test
