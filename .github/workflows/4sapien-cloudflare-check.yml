name: 4SAPIEN Cloudflare Check

on:
  push:
    branches:
      - build/4me-personal-choice-proof
    paths:
      - .github/workflows/4sapien-cloudflare-check.yml

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check domain and Pages mapping
        shell: bash
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          request() {
            local label="$1"
            local url="$2"
            local out="$3"
            local http
            http="$(curl -sS -o "$out" -w '%{http_code}' "$url" "${auth[@]}")"
            local success
            success="$(jq -r '.success // false' "$out" 2>/dev/null || echo false)"
            local errors
            errors="$(jq -r '[.errors[]? | ((.code|tostring) + ":" + (.message // ""))] | join("; ")' "$out" 2>/dev/null || true)"
            echo "${label}: HTTP ${http}; success=${success}; errors=${errors:-none}" >&2
            printf '%s' "$http"
          }

          base_http="$(request base-zone "${api}/zones?name=4planet.org&status=active" /tmp/base.json)"
          account_id="$(jq -r '.result[0].account.id // empty' /tmp/base.json)"

          sapien_http="$(request sapien-zone "${api}/zones?name=4sapien.com" /tmp/sapien.json)"
          zone_status="$(jq -r '.result[0].status // "NOT_FOUND"' /tmp/sapien.json)"
          nameservers="$(jq -r '[.result[0].name_servers[]?] | join(", ")' /tmp/sapien.json)"

          domain_rows="UNKNOWN"
          domains_http="NOT_RUN"
          if [[ -n "$account_id" ]]; then
            domains_http="$(request pages-domains "${api}/accounts/${account_id}/pages/projects/4planet-05/domains" /tmp/domains.json)"
            if [[ "$(jq -r '.success // false' /tmp/domains.json)" == "true" ]]; then
              domain_rows="$(jq -r '[.result[]? | select(.name == "4sapien.com" or .name == "www.4sapien.com") | (.name + " [" + (.status // "unknown") + "]")] | join(", ")' /tmp/domains.json)"
              [[ -n "$domain_rows" ]] || domain_rows="NOT_ATTACHED"
            else
              domain_rows="API_ERROR"
            fi
          fi

          preview_url="NOT_FOUND"
          preview_status="NOT_FOUND"
          preview_commit=""
          deployments_http="NOT_RUN"
          if [[ -n "$account_id" ]]; then
            deployments_http="$(request deployments "${api}/accounts/${account_id}/pages/projects/4planet-05/deployments?page=1&per_page=25" /tmp/deployments.json)"
            if [[ "$(jq -r '.success // false' /tmp/deployments.json)" == "true" ]]; then
              branch_row="$(jq -c '[.result[]? | select(.deployment_trigger.metadata.branch == "build/4me-personal-choice-proof")] | sort_by(.created_on) | reverse | first // empty' /tmp/deployments.json)"
              if [[ -n "$branch_row" ]]; then
                preview_url="$(jq -r '.url // ""' <<<"$branch_row")"
                preview_status="$(jq -r '.latest_stage.status // "unknown"' <<<"$branch_row")"
                preview_commit="$(jq -r '.deployment_trigger.metadata.commit_hash // ""' <<<"$branch_row")"
              fi
            fi
          fi

          {
            echo "## 4SAPIEN Cloudflare check"
            echo
            echo "- Cloudflare base-zone query: ${base_http}"
            echo "- 4sapien.com zone query: ${sapien_http}"
            echo "- 4sapien.com zone: **${zone_status}**"
            echo "- Nameservers: ${nameservers:-NOT_FOUND}"
            echo "- Pages-domain query: ${domains_http}"
            echo "- 4planet-05 Pages custom-domain mapping: **${domain_rows}**"
            echo "- Deployments query: ${deployments_http}"
            echo "- Latest branch preview status: **${preview_status}**"
            echo "- Latest branch preview URL: ${preview_url}"
            echo "- Preview commit: ${preview_commit:0:12}"
          } > /tmp/report.md
          cat /tmp/report.md

      - name: Report to implementation gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f /tmp/report.md ]]; then
            gh issue comment 183 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/report.md
          else
            gh issue comment 183 --repo "${GITHUB_REPOSITORY}" --body "4SAPIEN Cloudflare check failed before report generation."
          fi
