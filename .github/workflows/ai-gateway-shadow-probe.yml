name: AI Gateway SHADOW Connectivity Probe

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - ".github/workflows/ai-gateway-shadow-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json

      - name: Install Factory dependencies
        working-directory: factory
        run: npm install --ignore-scripts

      - name: Deploy exact Factory code with bounded control token
        working-directory: factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$CONTROL_TOKEN"
          umask 077
          printf '%s' "$CONTROL_TOKEN" > "$RUNNER_TEMP/4planet-ai-gateway-control-token"
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN
          npx wrangler deploy
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN

      - name: Prove model request routes through 4planet-factory gateway
        env:
          BASE_URL: https://4planet-production-factory-v01-shadow.odin-skogen.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(cat "$RUNNER_TEMP/4planet-ai-gateway-control-token")"
          echo "::add-mask::$CONTROL_TOKEN"

          READY=false
          HTTP_STATUS="000"
          for attempt in $(seq 1 30); do
            HTTP_STATUS="$(curl --silent --show-error \
              -o "$RUNNER_TEMP/ai-gateway-probe.json" \
              -w '%{http_code}' \
              -X POST \
              -H "x-factory-control: $CONTROL_TOKEN" \
              -H "x-founder-release: APPROVED" \
              -H "content-type: application/json" \
              --data '{}' \
              "$BASE_URL/__factory/capabilities/ai-gateway/probe" || true)"
            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              READY=true
              break
            fi
            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo "AI Gateway probe failed with HTTP ${HTTP_STATUS:-000}"
            jq -c '{ok,error}' "$RUNNER_TEMP/ai-gateway-probe.json" 2>/dev/null || true
            exit 1
          fi

          jq -e '.ok == true and .gatewayId == "4planet-factory" and .data != null' "$RUNNER_TEMP/ai-gateway-probe.json" >/dev/null
          jq -c '{ok,gatewayId,model}' "$RUNNER_TEMP/ai-gateway-probe.json"
          echo "AI_GATEWAY_CONNECTIVITY_PROBE=PASS"
