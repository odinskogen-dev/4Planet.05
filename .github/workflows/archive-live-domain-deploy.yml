name: 4PLANET old LIVE archive domain

on:
  push:
    branches:
      - ops/archive-live-20260908
    paths:
      - .github/workflows/archive-live-domain-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          [ -n "$TOKEN" ] || { echo 'No Cloudflare token available'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          api='https://api.cloudflare.com/client/v4'
          zone=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "${api}/zones?name=4planet.org&status=active")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone")
          [ -n "$account_id" ] && [ -n "$zone_id" ] || { echo 'Unable to resolve Cloudflare account/zone for 4planet.org'; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Stage immutable old LIVE Worker without touching any domain
        shell: bash
        run: |
          set -euo pipefail
          upstream='https://d3d3fae0.4planet-05.pages.dev'
          expected='c78f3b9814e823fdaa9167ccc784d2a88283215d'

          for path in / /atlas /species /living-systems /impact; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "${upstream}${path#/}")
            [ "$code" = '200' ] || { echo "Pinned old LIVE artifact failed before switch: ${path} -> ${code}"; exit 4; }
          done

          cat > "$RUNNER_TEMP/archive-worker.mjs" <<'EOF'
          const UPSTREAM = "https://d3d3fae0.4planet-05.pages.dev";
          const SOURCE_SHA = "c78f3b9814e823fdaa9167ccc784d2a88283215d";
          const ARCHIVE_HOST = "archive.4planet.org";

          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname + incoming.search, UPSTREAM);
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);

              const location = headers.get("location");
              if (location) {
                try {
                  const target = new URL(location, upstream);
                  if (target.hostname === "d3d3fae0.4planet-05.pages.dev") {
                    target.protocol = "https:";
                    target.hostname = ARCHIVE_HOST;
                    target.port = "";
                    headers.set("location", target.toString());
                  }
                } catch {}
              }

              headers.set("x-4planet-surface", "core-old-live-archive");
              headers.set("x-4planet-source-sha", SOURCE_SHA);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              if ((headers.get("content-type") || "").includes("text/html")) headers.set("cache-control", "no-store");

              return new Response(response.body, {
                status: response.status,
                statusText: response.statusText,
                headers,
              });
            },
          };
          EOF

          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planet-core-archive-20260908"
          main = "$RUNNER_TEMP/archive-worker.mjs"
          compatibility_date = "2026-09-08"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = false
          preview_urls = false
          EOF

          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"

      - name: Reassign archive hostname only, with automatic restoration on failure
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          hostname='archive.4planet.org'
          new_service='4planet-core-archive-20260908'
          expected='c78f3b9814e823fdaa9167ccc784d2a88283215d'

          domains=$(curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${auth[@]}")
          old_service=$(jq -r --arg h "$hostname" '.result[]? | select(.hostname == $h) | .service // empty' <<<"$domains" | head -1)
          old_id=$(jq -r --arg h "$hostname" '.result[]? | select(.hostname == $h) | .id // empty' <<<"$domains" | head -1)

          if [ -n "$old_service" ] && [ "$old_service" != '4planet-four-state-control-v1' ] && [ "$old_service" != "$new_service" ]; then
            echo "Refusing to take archive hostname from unexpected service: $old_service"
            exit 5
          fi

          switched=0
          restore_old() {
            rc=$?
            trap - ERR
            if [ "$switched" -eq 1 ] && [ -n "$old_service" ] && [ "$old_service" != "$new_service" ]; then
              echo "Archive verification failed; restoring archive.4planet.org to ${old_service}"
              curl -fsS -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${auth[@]}" \
                --data "{\"hostname\":\"${hostname}\",\"service\":\"${old_service}\",\"zone_id\":\"${CLOUDFLARE_ZONE_ID}\",\"zone_name\":\"4planet.org\"}" >/tmp/archive-restore.json || true
            fi
            exit "$rc"
          }
          trap restore_old ERR

          if [ "$old_service" != "$new_service" ]; then
            direct=$(curl -sS -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${auth[@]}" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"${new_service}\",\"zone_id\":\"${CLOUDFLARE_ZONE_ID}\",\"zone_name\":\"4planet.org\"}")

            if [ "$(jq -r '.success // false' <<<"$direct")" != 'true' ]; then
              [ -n "$old_id" ] || { echo "$direct"; exit 6; }
              curl -fsS -X DELETE "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${old_id}" "${auth[@]}" >/tmp/archive-detach.json
              attach=$(curl -fsS -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${auth[@]}" \
                --data "{\"hostname\":\"${hostname}\",\"service\":\"${new_service}\",\"zone_id\":\"${CLOUDFLARE_ZONE_ID}\",\"zone_name\":\"4planet.org\"}")
              [ "$(jq -r '.success // false' <<<"$attach")" = 'true' ] || { echo "$attach"; exit 7; }
            fi
            switched=1
          fi

          ok=0
          for attempt in $(seq 1 36); do
            headers=$(curl -fsSI --connect-timeout 10 --max-time 30 "https://${hostname}/" | tr -d '\r' || true)
            if printf '%s\n' "$headers" | grep -qi '^HTTP/.* 200' \
              && printf '%s\n' "$headers" | grep -qi '^x-4planet-surface: core-old-live-archive$' \
              && printf '%s\n' "$headers" | grep -qi "^x-4planet-source-sha: ${expected}$"; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'Archive root did not verify after hostname switch'; false; }

          for path in /atlas /species /living-systems /impact; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "https://${hostname}${path}")
            [ "$code" = '200' ] || { echo "Archive route failed: ${path} -> ${code}"; false; }
          done

          domains_after=$(curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" "${auth[@]}")
          bound=$(jq -r --arg h "$hostname" '.result[]? | select(.hostname == $h) | .service // empty' <<<"$domains_after" | head -1)
          [ "$bound" = "$new_service" ] || { echo "Archive domain bound to unexpected service after switch: $bound"; false; }

          trap - ERR
          echo 'ARCHIVE LIVE PASS'
          echo "URL=https://${hostname}/"
          echo "SOURCE_SHA=${expected}"
          echo "SERVICE=${new_service}"
          echo "PREVIOUS_ARCHIVE_SERVICE=${old_service}"
