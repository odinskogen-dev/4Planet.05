name: ATLAS Canonical Domain Patch

on:
  push:
    branches: [fix/atlas-canonical-domain-20260914]
    paths:
      - .github/workflows/atlas-canonical-domain-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlas-canonical-domain-20260914
          fetch-depth: 0

      - name: Apply host-aware ATLAS routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"anchor missing in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          router = Path('src/routes/router.tsx')
          s = router.read_text()
          anchor = 'const ActorFallback = (<div aria-hidden style={{ minHeight: "100vh", background: "#080b10" }} />);\n'
          addition = '''const ActorFallback = (<div aria-hidden style={{ minHeight: "100vh", background: "#080b10" }} />);\n\nfunction isAtlasHost() {\n  if (typeof window === "undefined") return false;\n  return window.location.hostname.toLowerCase().replace(/^www\\./, "") === "4planetatlas.com";\n}\n\nfunction RootHome() {\n  if (isAtlasHost()) return <Suspense fallback={WorldFallback}><PublicWorld /></Suspense>;\n  return <Home />;\n}\n'''
          if 'function RootHome()' not in s:
              if anchor not in s: raise SystemExit('router fallback anchor missing')
              s = s.replace(anchor, addition, 1)
          if '<Route path="/" element={<Home />} />' in s:
              s = s.replace('<Route path="/" element={<Home />} />', '<Route path="/" element={<RootHome />} />', 1)
          elif '<Route path="/" element={<RootHome />} />' not in s:
              raise SystemExit('root route anchor missing')
          router.write_text(s)

          replace_once('src/App.tsx',
          '''function AtlasProductSwitcher() {\n  const { pathname } = useLocation();\n  if (!pathname.startsWith("/atlas")) return null;\n''',
          '''function AtlasProductSwitcher() {\n  const { pathname } = useLocation();\n  const atlasHost = typeof window !== "undefined" && window.location.hostname.toLowerCase().replace(/^www\\./, "") === "4planetatlas.com";\n  if (!atlasHost && !pathname.startsWith("/atlas")) return null;\n''')

          nav = Path('src/product/ProductNav.tsx')
          s = nav.read_text()
          old = '''function activeProduct(pathname: string): ProductKey {\n  if (pathname.startsWith("/atlas")) return "ATLAS";\n  if (pathname.startsWith("/species")) return "SPECIES";\n  if (pathname.startsWith("/living-systems")) return "LIVING SYSTEMS";\n  if (pathname.startsWith("/impact")) return "IMPACT";\n  return "4PLANET";\n}\n'''
          new = '''export function activeProduct(pathname: string, hostname = ""): ProductKey {\n  const host = hostname.toLowerCase().replace(/^www\\./, "");\n  if (host === "4planetatlas.com" || pathname.startsWith("/atlas")) return "ATLAS";\n  if (pathname.startsWith("/species")) return "SPECIES";\n  if (pathname.startsWith("/living-systems")) return "LIVING SYSTEMS";\n  if (pathname.startsWith("/impact")) return "IMPACT";\n  return "4PLANET";\n}\n\nexport function productHref(key: ProductKey, path: string, currentSearch = "") {\n  const host = typeof window !== "undefined" ? window.location.hostname.toLowerCase().replace(/^www\\./, "") : "";\n  if (key === "ATLAS") return `https://4planetatlas.com${contextHref("/", currentSearch)}`;\n  const relative = contextHref(path, currentSearch);\n  if (host === "4planetatlas.com") return `https://4planet.org${relative}`;\n  return relative;\n}\n'''
          if old not in s: raise SystemExit('ProductNav activeProduct anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('const active = activeProduct(location.pathname);', 'const active = activeProduct(location.pathname, typeof window !== "undefined" ? window.location.hostname : "");', 1)
          s = s.replace('to={contextHref(product.path, location.search)}', 'to={productHref(product.key, product.path, location.search)}', 1)
          nav.write_text(s)

          switcher = Path('src/product/ProductSwitcher.tsx')
          s = switcher.read_text()
          s = s.replace('import { contextHref, type ProductKey } from "@/product/ProductNav";', 'import { activeProduct, productHref, type ProductKey } from "@/product/ProductNav";', 1)
          local = '''function activeProduct(pathname: string): ProductKey {\n  if (pathname.startsWith("/atlas")) return "ATLAS";\n  if (pathname.startsWith("/species")) return "SPECIES";\n  if (pathname.startsWith("/living-systems")) return "LIVING SYSTEMS";\n  if (pathname.startsWith("/impact")) return "IMPACT";\n  return "4PLANET";\n}\n\n'''
          if local not in s: raise SystemExit('ProductSwitcher local activeProduct anchor missing')
          s = s.replace(local, '', 1)
          s = s.replace('const active = activeProduct(location.pathname);', 'const active = activeProduct(location.pathname, typeof window !== "undefined" ? window.location.hostname : "");', 1)
          s = s.replace('to={contextHref(p.path, location.search)}', 'to={productHref(p.key, p.path, location.search)}', 1)
          switcher.write_text(s)

          metadata = Path('src/components/ShareMetadata.tsx')
          s = metadata.read_text()
          old = '''    const path = normalisePath(pathname);\n    if ((manifest.excludedPrefixes || []).some((prefix) => path === prefix || path.startsWith(`${prefix}/`))) return;\n\n    const meta = resolveMeta(path);\n    const canonical = absoluteUrl(meta.canonicalPath || path);\n    const image = absoluteUrl(meta.image);\n'''
          new = '''    const path = normalisePath(pathname);\n    const host = typeof window !== "undefined" ? window.location.hostname.toLowerCase().replace(/^www\\./, "") : "";\n    const effectivePath = host === "4planetatlas.com" && path === "/" ? "/atlas" : path;\n    if ((manifest.excludedPrefixes || []).some((prefix) => effectivePath === prefix || effectivePath.startsWith(`${prefix}/`))) return;\n\n    const meta = resolveMeta(effectivePath);\n    const canonical = effectivePath === "/atlas"\n      ? "https://4planetatlas.com/"\n      : absoluteUrl(meta.canonicalPath || effectivePath);\n    const image = absoluteUrl(meta.image);\n'''
          if old not in s: raise SystemExit('ShareMetadata anchor missing')
          metadata.write_text(s.replace(old, new, 1))

          analytics = Path('src/analytics/Analytics.tsx')
          s = analytics.read_text()
          s = s.replace('  "4planet.org",\n', '  "4planet.org",\n  "4planetatlas.com",\n', 1)
          old = '''function productArea(pathname: string): string {\n  if (pathname.startsWith("/magazine")) return "magazine";\n  if (pathname.startsWith("/atlas")) return "atlas";\n'''
          new = '''function productArea(pathname: string, hostname = ""): string {\n  if (canonicalHost(hostname) === "4planetatlas.com") return "atlas";\n  if (pathname.startsWith("/magazine")) return "magazine";\n  if (pathname.startsWith("/atlas")) return "atlas";\n'''
          if old not in s: raise SystemExit('Analytics productArea anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('content_group: productArea(location.pathname),', 'content_group: productArea(location.pathname, window.location.hostname),', 1)
          analytics.write_text(s)

          route_analytics = Path('src/analytics/ProductRouteAnalytics.tsx')
          s = route_analytics.read_text()
          s = s.replace('function classifyProduct(pathname: string): ProductArea {\n  if (pathname.startsWith("/magazine")) return "magazine";', 'function classifyProduct(pathname: string, hostname = ""): ProductArea {\n  if (hostname.toLowerCase().replace(/^www\\./, "") === "4planetatlas.com") return "atlas";\n  if (pathname.startsWith("/magazine")) return "magazine";', 1)
          s = s.replace('const product = classifyProduct(pathname);', 'const product = classifyProduct(pathname, window.location.hostname);', 1)
          route_analytics.write_text(s)

          context = Path('src/product/ContextRetained.tsx')
          s = context.read_text()
          s = s.replace('function productOf(pathname: string) {\n  if (pathname.startsWith("/atlas")) return "ATLAS";', 'function productOf(pathname: string, hostname = "") {\n  if (hostname.toLowerCase().replace(/^www\\./, "") === "4planetatlas.com" || pathname.startsWith("/atlas")) return "ATLAS";', 1)
          s = s.replace('const product = productOf(location.pathname);', 'const product = productOf(location.pathname, window.location.hostname);', 1)
          context.write_text(s)

          camera = Path('src/earth/AtlasReturnCameraAuthority.tsx')
          s = camera.read_text()
          s = s.replace('    if (!pathname.startsWith("/atlas")) return;', '    const atlasHost = window.location.hostname.toLowerCase().replace(/^www\\./, "") === "4planetatlas.com";\n    if (!atlasHost && !pathname.startsWith("/atlas")) return;', 1)
          camera.write_text(s)

          contract = Path('scripts/prototype-contracts.test.mjs')
          c = contract.read_text()
          c = c.replace(
              '  assert.match(routes, /<Route path="\\/" element=\\{<Home \\/>\\}/);',
              '  assert.match(routes, /<Route path="\\/" element=\\{<RootHome \\/>\\}/);\n  assert.match(routes, /4planetatlas\\.com/);\n  assert.match(nav, /https:\\/\\/4planetatlas\\.com/);\n  const app = read("src/App.tsx");\n  const share = read("src/components/ShareMetadata.tsx");\n  assert.match(app, /4planetatlas\\.com/);\n  assert.match(share, /https:\\/\\/4planetatlas\\.com\\//);',
              1,
          )
          if '<RootHome' not in c or '4planetatlas\\.com' not in c:
              raise SystemExit('contract replacement failed')
          contract.write_text(c)
          PY

      - name: Validate build and contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:contracts
          npm run build
          git diff --check

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '4PLANET Domain Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src/routes/router.tsx src/App.tsx src/product/ProductNav.tsx src/product/ProductSwitcher.tsx src/components/ShareMetadata.tsx src/analytics/Analytics.tsx src/analytics/ProductRouteAnalytics.tsx src/product/ContextRetained.tsx src/earth/AtlasReturnCameraAuthority.tsx scripts/prototype-contracts.test.mjs
          git diff --cached --check
          git commit -m 'feat: make 4planetatlas.com the canonical ATLAS surface'
          git push origin HEAD:fix/atlas-canonical-domain-20260914
