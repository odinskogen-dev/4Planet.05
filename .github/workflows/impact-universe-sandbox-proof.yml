name: IMPACT Universe Sandbox Browser Proof

# Exact-SHA browser proof for the registered IMPACT SANDBOX (claude/impact-universe-01).
# Waits for the Cloudflare Pages branch preview to serve THIS commit, then runs:
#   1. the IMPACT Gold continuity spec against live NATUREBRAIN (no fixtures);
#   2. the Universe template spec with NATUREBRAIN fixtures injected in the browser
#      (proves templates, the AXE-new-project path and responsive matrix on the deployed build).
# No LIVE authority. Evidence is uploaded as an artifact for Founder / independent review.

on:
  push:
    branches:
      - claude/impact-universe-01
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: impact-universe-sandbox-proof
  cancel-in-progress: true

jobs:
  prove-impact-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.sha }}
      BASE_URL: https://claude-impact-universe-01.4planet-05.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for the exact commit on the sandbox preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE_URL/impact-build.json?t=$attempt" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "\"sha\": \"$EXACT_SHA\""; then
              printf '%s\n' "$body" | tee impact-sandbox-build.json
              exit 0
            fi
            echo "Waiting for $EXACT_SHA on $BASE_URL — attempt $attempt/120"
            sleep 10
          done
          echo "Sandbox preview did not serve the exact commit"; exit 1

      - name: Gold continuity — live NATUREBRAIN on the sandbox
        run: npx playwright test tests/e2e/impact-lan-gold.spec.ts --project=desktop-1440 --project=mobile-390

      - name: Universe templates — deployed build with injected NATUREBRAIN fixtures
        env:
          IMPACT_FIXTURE: "1"
        run: npx playwright test tests/e2e/impact-universe.spec.ts --project=desktop-1440

      - name: Live-data route captures (real NATUREBRAIN)
        if: always()
        shell: bash
        run: |
          cat > /tmp/capture.mjs <<'JS'
          import { chromium } from "playwright";
          const base = process.env.BASE_URL;
          const routes = ["/impact", "/impact/project/florida-coral-restoration", "/impact/project/african-forest-gardens", "/impact/actors/the-ocean-cleanup", "/impact/issue/reef-degradation", "/impact/solution/forest-garden-agroforestry"];
          const browser = await chromium.launch();
          for (const [w, h] of [[390, 844], [430, 932], [768, 1024], [1440, 900], [1920, 1080]]) {
            const page = await browser.newPage({ viewport: { width: w, height: h }, isMobile: w < 500, hasTouch: w < 500 });
            for (const route of routes) {
              await page.goto(base + route, { waitUntil: "networkidle" }).catch(() => undefined);
              await page.waitForTimeout(1500);
              const name = route.replace(/\W+/g, "-").replace(/^-|-$/g, "");
              await page.screenshot({ path: `artifacts/product-proof/live-${w}-${name}.png`, fullPage: true });
            }
            await page.close();
          }
          await browser.close();
          JS
          mkdir -p artifacts/product-proof
          cp /tmp/capture.mjs ./capture-live.mjs && node capture-live.mjs

      - name: Record verdict
        if: success()
        run: printf 'IMPACT UNIVERSE SANDBOX PROOF PASS\nSHA=%s\nURL=%s/impact\nLIVE_AUTHORITY=ABSENT\n' "$EXACT_SHA" "$BASE_URL" > impact-sandbox-verdict.txt

      - name: Report exact-SHA evidence to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > report.mjs <<'JS'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const base = process.env.BASE_URL;
          const sha = process.env.EXACT_SHA;
          const key = "sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE";
          const rpc = async (name) => {
            const r = await fetch(`https://ghvdzetmplqkdtfqiror.supabase.co/rest/v1/rpc/${name}`, { method: "POST", headers: { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" }, body: "{}" });
            if (!r.ok) return `${name}: HTTP ${r.status}`;
            const d = await r.json();
            return `${name}: ${d.version} · projects=${(d.projects || []).length}${d.issues ? ` · issues=${d.issues.length} · actors=${d.actors.length}` : ""}`;
          };
          const probes = [await rpc("impact_lan_v02"), await rpc("impact_lan_gold_v01")];
          let stats = "no results.json";
          try { const s = JSON.parse(fs.readFileSync("artifacts/atlas-gold/results.json", "utf8")).stats; stats = `expected=${s.expected} unexpected=${s.unexpected} skipped=${s.skipped} flaky=${s.flaky}`; } catch {}
          const build = fs.existsSync("impact-sandbox-build.json") ? fs.readFileSync("impact-sandbox-build.json", "utf8").trim() : "missing";
          const browser = await chromium.launch();
          const rows = [];
          const thumbs = [];
          const routes = ["/impact", "/impact/project/florida-coral-restoration", "/impact/actors/the-ocean-cleanup", "/impact/issue/reef-degradation", "/impact/solution/forest-garden-agroforestry"];
          for (const [w, h] of [[390, 844], [1440, 900]]) {
            const page = await browser.newPage({ viewport: { width: w, height: h }, isMobile: w < 500, hasTouch: w < 500 });
            for (const route of routes) {
              await page.goto(base + route, { waitUntil: "networkidle" }).catch(() => undefined);
              await page.waitForTimeout(1200);
              const info = await page.evaluate(() => ({
                h1: document.querySelector("h1")?.textContent?.trim(),
                tiles: document.querySelectorAll(".iu-section--index .iu-tile").length,
                claims: document.querySelectorAll(".iu-claim").length,
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                provenance: document.querySelector(".iu-provenance")?.textContent?.trim(),
              }));
              rows.push(`| ${w} | \`${route}\` | ${info.h1 ?? "—"} | ${info.tiles} | ${info.claims} | ${info.overflow} |`);
              if (w === 390 && (route === "/impact" || route.includes("/project/"))) {
                for (const y of route === "/impact" ? [0, 560] : [0]) {
                  await page.evaluate((top) => window.scrollTo(0, top), y);
                  await page.waitForTimeout(500);
                  const buf = await page.screenshot({ type: "jpeg", quality: 30 });
                  thumbs.push(`${route}@${y}:${buf.toString("base64")}`);
                }
              }
              if (route === "/impact" && w === 1440) rows.push(`| | provenance | ${info.provenance ?? "—"} | | | |`);
            }
            await page.close();
          }
          await browser.close();
          const body = [
            `### IMPACT Universe sandbox proof — \`${sha.slice(0, 12)}\``,
            `Sandbox: ${base}/impact · LIVE authority: **absent** · status: OUTPUT RECEIVED / AWAITING GPT AUDIT`,
            "", "**Exact build**", "```json", build, "```",
            "**Live NATUREBRAIN probe (from the runner)**", ...probes.map((p) => `- ${p}`),
            "", `**Playwright** ${stats}`, "",
            "| width | route | h1 | index tiles | claims | overflow px |", "|---|---|---|---|---|---|", ...rows,
            "", `<!-- impact-thumbs ${thumbs.join(" ")} -->`,
          ].join("\n");
          fs.writeFileSync("pr-report.md", body.slice(0, 64000));
          JS
          node report.mjs
          pr=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:claude/impact-universe-01&state=open" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=JSON.parse(d);console.log(a[0]?.number||"")})')
          if [ -n "$pr" ]; then
            node -e 'process.stdout.write(JSON.stringify({body:require("fs").readFileSync("pr-report.md","utf8")}))' > comment.json
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" "https://api.github.com/repos/${{ github.repository }}/issues/$pr/comments" --data @comment.json > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-universe-sandbox-${{ env.EXACT_SHA }}
          path: |
            impact-sandbox-build.json
            impact-sandbox-verdict.txt
            artifacts/product-proof/*.png
            artifacts/atlas-gold/results.json
          if-no-files-found: warn
          retention-days: 45
