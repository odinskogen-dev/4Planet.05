name: MAX EXPOSURE ATLAS Canonical Source Integrity (No Live)
on:
  push:
    branches: [fix/atlas-canonical-source-20261021]
    paths: [.github/workflows/atlas-canonical-source-qa.yml]
permissions:
  contents: read
jobs:
  atlas-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect exact current production ancestor and only one canonical URL correction
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fceab8e18f2fb403184dcac9f04180b2d05cf36c HEAD
          git diff fceab8e18f2fb403184dcac9f04180b2d05cf36c HEAD -- functions/_middleware.js | tee /tmp/atlas-search.diff
          grep -Fq 'https://${host}/' /tmp/atlas-search.diff
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js=fs.readFileSync('functions/_middleware.js','utf8');
          const f=js.match(/function atlasSitemapXml\(host\) \{([\s\S]*?)\n\}/)?.[1];
          assert.ok(f,'reuse exact existing sitemap function');
          assert.ok(f.includes('https://${host}/'),'canonical root in first sitemap location');
          assert.ok(!f.includes('https://${host}/atlas/'),'exclude alternate duplicated root');
          assert.ok(f.includes('ATLAS_INDEXABLE_PLACES.map'),'250 place entries unchanged');
          assert.ok(f.includes('/map.svg'),'250 mapped images unchanged');
          console.log('ATLAS_ROOT_CANONICAL_SOURCE_GATE_PASS');
          NODE
      - name: Restore protected v43 artifact exactly as live build
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build current 250-place ATLAS without DNS or production updates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/build-atlas-places.mjs
          npm run typecheck
          node --test scripts/atlas-v43-contract.test.mjs scripts/atlas-human-awe-contract.test.mjs scripts/seo-ownership-contract.test.mjs scripts/atlas-mobile-context-control-contract.test.mjs scripts/atlas-recovery-contract.test.mjs
          npm run build:atlas
          node --test scripts/atlas-max-exposure-middleware-runtime.test.mjs
          test -f dist/index.html
          node --check functions/_middleware.js
          echo ATLAS_SEARCH_ONLY_250_PLACE_ZERO_LOSS_BUILD_PASS
