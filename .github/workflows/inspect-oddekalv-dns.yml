name: Inspect oddekalv.com DNS activation

on:
  push:
    branches:
      - ops/oddekalv-domain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read Cloudflare zone and Pages domain state
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error

          token = os.environ['CF_API_TOKEN']
          api = 'https://api.cloudflare.com/client/v4'
          domain = 'oddekalv.com'

          def cf(path):
              req = urllib.request.Request(api + path, headers={'Authorization': f'Bearer {token}', 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return json.loads(e.read().decode())

          accounts = cf('/accounts?per_page=50')
          for acct in accounts.get('result', []):
              aid = acct['id']
              zones = cf('/zones?name=' + urllib.parse.quote(domain) + '&account.id=' + aid + '&per_page=50')
              if zones.get('success') and zones.get('result'):
                  z = zones['result'][0]
                  print('ZONE_STATUS:', z.get('status'))
                  print('CLOUDFLARE_NAMESERVERS:', ', '.join(z.get('name_servers') or []))
                  print('ORIGINAL_NAMESERVERS:', ', '.join(z.get('original_name_servers') or []))
                  print('REGISTRAR_FROM_CF:', z.get('original_registrar'))
                  projects = cf(f'/accounts/{aid}/pages/projects')
                  for p in projects.get('result', []):
                      if p.get('name') == 'odinoddekalv' or p.get('subdomain') == 'odinoddekalv.pages.dev':
                          ds = cf(f"/accounts/{aid}/pages/projects/{p['name']}/domains")
                          print('PAGES_PROJECT:', p.get('name'), p.get('subdomain'))
                          for d in ds.get('result', []):
                              if d.get('name') in {domain, 'www.' + domain}:
                                  print('PAGES_DOMAIN:', d.get('name'), 'status=', d.get('status'))
                  break

          try:
              req = urllib.request.Request('https://rdap.verisign.com/com/v1/domain/' + domain, headers={'User-Agent':'4PLANET-domain-check/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  rdap = json.load(r)
              registrar = None
              for ent in rdap.get('entities', []):
                  roles = ent.get('roles') or []
                  if 'registrar' in roles:
                      registrar = ent.get('vcardArray', [None, []])[1]
                      break
              print('RDAP_REGISTRAR_ENTITY:', registrar if registrar else 'not-returned')
              print('RDAP_NAMESERVERS:', ', '.join(ns.get('ldhName','') for ns in rdap.get('nameservers', [])))
          except Exception as e:
              print('RDAP_LOOKUP_ERROR:', type(e).__name__, str(e))
          PY

      - name: Read public authoritative nameservers
        shell: bash
        run: |
          echo "PUBLIC_NS:"
          dig +short NS oddekalv.com || true
          echo "PUBLIC_A:"
          dig +short A oddekalv.com || true
          echo "PUBLIC_WWW:"
          dig +short CNAME www.oddekalv.com || true