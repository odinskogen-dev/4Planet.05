name: Oslofjorden CC0 Media Custody

on:
  pull_request:
    branches:
      - phase04/brand-product-convergence
    paths:
      - '.github/workflows/oslofjorden-media-custody.yml'

permissions:
  contents: write

jobs:
  custody:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Acquire rights-clean derivatives and record custody metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/places/oslofjorden
          desktop='public/assets/places/oslofjorden/hero-oslofjorden-cc0-1920.jpg'
          mobile='public/assets/places/oslofjorden/hero-oslofjorden-cc0-960.jpg'
          source='https://commons.wikimedia.org/wiki/File:Oslofjorden_2022-08-17_15.jpg'
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslofjorden_2022-08-17_15.jpg?width=1920' -o "$desktop"
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Oslofjorden_2022-08-17_15.jpg?width=960' -o "$mobile"
          test "$(wc -c < "$desktop")" -gt 100000
          test "$(wc -c < "$mobile")" -gt 50000
          desktop_sha="$(sha256sum "$desktop" | cut -d' ' -f1)"
          mobile_sha="$(sha256sum "$mobile" | cut -d' ' -f1)"
          desktop_bytes="$(wc -c < "$desktop" | tr -d ' ')"
          mobile_bytes="$(wc -c < "$mobile" | tr -d ' ')"
          cat > public/assets/places/oslofjorden/hero-oslofjorden-cc0-custody.json <<EOF
          {
            "sourcePage": "$source",
            "creator": "Leonhard Lenz",
            "capturedAt": "2022-08-17T08:26:24",
            "license": "CC0 1.0 Universal Public Domain Dedication",
            "sourceMasterSha1": "7b7d2c709a5009b984df764624c7668e671ee1f3",
            "desktop": {"path": "/assets/places/oslofjorden/hero-oslofjorden-cc0-1920.jpg", "sha256": "$desktop_sha", "bytes": $desktop_bytes},
            "mobile": {"path": "/assets/places/oslofjorden/hero-oslofjorden-cc0-960.jpg", "sha256": "$mobile_sha", "bytes": $mobile_bytes},
            "custody": "REPO_CONTROLLED_DERIVATIVE",
            "note": "Derivatives acquired from the documented Wikimedia Commons CC0 source. They are place context, not ecological-state evidence."
          }
          EOF
          git status --short

      - name: Commit custody once
        shell: bash
        run: |
          if git diff --quiet -- public/assets/places/oslofjorden && git status --porcelain -- public/assets/places/oslofjorden | grep -q '^$'; then
            echo 'Media already under repository custody.'
            exit 0
          fi
          git config user.name '4PLANET controlled QA'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/places/oslofjorden
          git commit -m 'chore(media): localise rights-clean Oslofjord CC0 hero derivatives'
          git push origin HEAD:${{ github.head_ref }}
