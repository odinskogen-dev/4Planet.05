name: LABS OS — Cloudflare credential and routing audit
on:
  push:
    branches: [labs/overview-v1]
    paths: [.github/workflows/labs-os-cloudflare-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: labs-os-cloudflare-preflight
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_FACTORY: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
      TOKEN_ALTERNATE: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_CF_API: ${{ secrets.CF_API_TOKEN }}
      TOKEN_CF: ${{ secrets.CF_TOKEN }}
      ACCOUNT_FALLBACK: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
    steps:
      - name: Audit available Cloudflare token capabilities without mutation
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          account='d53c17b06219066a0325eec01c21729e'
          if [[ -n "${ACCOUNT_FALLBACK:-}" ]]; then account="$ACCOUNT_FALLBACK"; fi
          report='/tmp/labs-cf-preflight.md'
          printf '# LABS OS — Cloudflare capability audit\n\nExact GitHub SHA: `%s`\n\n' "$GITHUB_SHA" > "$report"
          trap 'rc=$?; printf "\nRead-only audit exit code: %s\n" "$rc" >> "$report"' EXIT
          probe() {
            local label="$1" endpoint="$2" token="$3"
            local status
            status="$(curl -sS --connect-timeout 7 --max-time 25 -o "/tmp/labs-${label}.json" -w '%{http_code}' -H "Authorization: Bearer $token" "$api$endpoint" 2>/dev/null || true)"
            printf '%s' "${status:-000}"
          }
          printf '| Existing secret | Verify | Zone | DNS | Pages | Preview deployments | Worker routes |\n|---|---|---|---|---|---|---|\n' >> "$report"
          found_valid=0
          found_pages=0
          for label in PRIMARY FACTORY ALTERNATE CF_API CF; do
            var="TOKEN_$label"
            token="${!var:-}"
            [[ -n "$token" ]] || continue
            token="${token#Bearer }"
            echo "::add-mask::$token"
            v="$(probe "${label}-verify" '/user/tokens/verify' "$token")"
            verified="$(jq -r '.success // false' "/tmp/labs-${label}-verify.json" 2>/dev/null || echo false)"
            if [[ "$v" != 200 || "$verified" != true ]]; then
              printf '| %s | %s | n/a | n/a | n/a | n/a | n/a |\n' "$label" "$v" >> "$report"
              continue
            fi
            found_valid=1
            zone_status="$(probe "${label}-zone" '/zones?name=4planet.org' "$token")"
            zone_id="$(jq -r '.result[0].id // empty' "/tmp/labs-${label}-zone.json" 2>/dev/null || true)"
            dns_status='n/a'
            worker_status='n/a'
            if [[ -n "$zone_id" ]]; then
              dns_status="$(probe "${label}-dns" "/zones/$zone_id/dns_records?name=labs.4planet.org" "$token")"
              worker_status="$(probe "${label}-routes" "/zones/$zone_id/workers/routes" "$token")"
            fi
            pages_status="$(probe "${label}-pages" "/accounts/$account/pages/projects/4planet-05" "$token")"
            deploy_status='n/a'
            if [[ "$pages_status" == 200 ]]; then
              found_pages=1
              deploy_status="$(probe "${label}-deploys" "/accounts/$account/pages/projects/4planet-05/deployments?env=preview&page=1&per_page=100" "$token")"
            fi
            printf '| %s | %s | %s | %s | %s | %s | %s |\n' "$label" "$v" "$zone_status" "$dns_status" "$pages_status" "$deploy_status" "$worker_status" >> "$report"
            if [[ "$dns_status" == 200 ]]; then
              printf '\n## LABS exact DNS (read using %s)\n\n' "$label" >> "$report"
              jq -r 'if (.result|length)==0 then "- NO EXACT RECORD" else .result[] | "- " + .type + " " + .name + " → " + (.content // "") + " proxied=" + (.proxied|tostring) end' "/tmp/labs-${label}-dns.json" >> "$report"
            fi
            if [[ "$pages_status" == 200 ]]; then
              printf '\n## Existing Pages project (read using %s)\n\n' "$label" >> "$report"
              jq -r '"- Name: " + (.result.name // "UNKNOWN") + "\n- Production branch: " + (.result.production_branch // "UNKNOWN") + "\n- Domains: " + ([.result.domains[]?]|join(", "))' "/tmp/labs-${label}-pages.json" >> "$report"
              if [[ "$deploy_status" == 200 ]]; then
                jq -r '[.result[]? | select(.deployment_trigger.metadata.branch == "labs/overview-v1")] | .[:4][] | "- LABS SHA " + (.deployment_trigger.metadata.commit_hash // "UNKNOWN") + " | " + (.latest_stage.status // "UNKNOWN") + " | " + (.url // "NO_URL")' "/tmp/labs-${label}-deploys.json" >> "$report"
              fi
            fi
            if [[ "$worker_status" == 200 ]]; then
              printf '\n## Existing LABS Worker route matches\n\n' >> "$report"
              jq -r '.result[]? | select(.pattern|contains("labs.4planet.org")) | "- " + .pattern + " → " + (.script // "<none>")' "/tmp/labs-${label}-routes.json" >> "$report"
            fi
          done
          printf '\nSUMMARY: usable API token observed=%s; Pages readable=%s. No Cloudflare mutation.\n' "$found_valid" "$found_pages" >> "$report"
          cat "$report"
      - name: Attach verification to existing LABS task
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f /tmp/labs-cf-preflight.md ]]; then
            gh issue comment 329 --repo "$GITHUB_REPOSITORY" --body-file /tmp/labs-cf-preflight.md
          else
            gh issue comment 329 --repo "$GITHUB_REPOSITORY" --body "LABS Cloudflare audit failed before its report. No mutation."
          fi
