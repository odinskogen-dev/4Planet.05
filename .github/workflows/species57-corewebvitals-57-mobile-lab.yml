name: SPECIES 57 - mobile web performance LCP CLS lab audit (read-only)
on:
  push:
    branches: [ops/species57-p0-asset-mime-safe-20261026]
    paths: [.github/workflows/species57-corewebvitals-57-mobile-lab.yml]
permissions: {contents: read}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure all 57 live routes via Chromium PerformanceObserver on 390px mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/species57-perf playwright@1.56.0 --no-audit --no-fund
          /tmp/species57-perf/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {chromium} from "/tmp/species57-perf/node_modules/playwright/index.mjs";
          const old39="orca lion tiger african-savanna-elephant asian-elephant bald-eagle black-rhinoceros blue-whale bornean-orangutan cheetah chimpanzee emperor-penguin giant-panda giraffe gray-wolf great-white-shark green-sea-turtle hippopotamus jaguar monarch-butterfly polar-bear english-oak western-honey-bee fly-agaric common-octopus atlantic-puffin sei-whale eurasian-lynx humpback-whale sperm-whale harbour-porpoise bottlenose-dolphin atlantic-cod blue-mussel whale-shark leopard eastern-gorilla acropora-palmata hyacinth-macaw".split(" ");
          const newer="koala quokka capybara red-fox giant-anteater giant-otter walrus common-kingfisher secretary-bird scarlet-macaw peregrine-falcon ocean-sunfish giant-manta-ray greater-blue-ringed-octopus peacock-mantis-shrimp venus-flytrap titan-arum giant-sequoia".split(" ");
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const samples=[];
          for(const slug of [...old39,...newer]){
            const page=await context.newPage();
            await page.addInitScript(()=>{
              window.__speciesMetrics={lcp:0,cls:0,firstInput:0};
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__speciesMetrics.lcp=e.startTime}).observe({type:"largest-contentful-paint",buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__speciesMetrics.cls+=e.value}).observe({type:"layout-shift",buffered:true})}catch{}
            });
            try{
              const response=await page.goto("https://4species.com/"+slug,{waitUntil:"domcontentloaded",timeout:50000});
              try{await page.waitForFunction(()=>document.querySelector("#main-content")?.classList.contains("spx-root"),null,{timeout:15000})}catch{}
              await page.waitForTimeout(1350);
              const values=await page.evaluate(()=>({lcp:window.__speciesMetrics?.lcp||null,cls:window.__speciesMetrics?.cls||0,domContentLoaded:performance.getEntriesByType("navigation")[0]?.domContentLoadedEventEnd||null,loadedImages:[...document.images].filter(x=>x.complete&&x.naturalWidth>0).length,criticalAppHydrated:document.querySelector("#main-content")?.classList.contains("spx-root")||false}));
              samples.push({slug,status:response?.status(),...values});
            }catch(e){samples.push({slug,error:String(e)})}
            finally{await page.close()}
          }
          await context.close();await browser.close();
          const ranked=samples.filter(x=>typeof x.lcp==="number").sort((a,b)=>b.lcp-a.lcp);
          const summary={measurement:"Synthetic unthrottled GitHub runner mobile viewport; not CrUX field Core Web Vitals; INP cannot be obtained without real user interactions",profiles:samples.length,lcpAvailable:ranked.length,lcpAbove2500:ranked.filter(x=>x.lcp>2500).length,clsAbove0_1:ranked.filter(x=>x.cls>0.1).length,topSlowest:ranked.slice(0,12),missing:samples.filter(x=>!x.lcp||x.error)};
          fs.writeFileSync("evidence/synthetic-all57.json",JSON.stringify({summary,profiles:samples},null,2));
          console.log("SPECIES57_SYNTHETIC_MOBILE_PERFORMANCE",JSON.stringify(summary));
          if(samples.length!==57)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: species57-synthetic-mobile-lcp-cls-all57-lab
          path: evidence/
          retention-days: 30
