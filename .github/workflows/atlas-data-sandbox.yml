name: ATLAS Data Sandbox

on:
  push:
    branches:
      - sandbox/atlas-data-lab-20260819
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-data-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sandbox exact SHA
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source catalogue
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('atlas-data-sandbox/sources.json','utf8')); if(!Array.isArray(x.sources)||x.sources.length<10) throw new Error('source catalogue invalid'); console.log('catalogue sources='+x.sources.length)"

      - name: Sandbox connector contracts
        run: node --test scripts/atlas-data-sandbox/contracts.test.mjs

      - name: Probe public source contracts
        env:
          ATLAS_PROBE_TIMEOUT_MS: 12000
          ATLAS_PROBE_CONCURRENCY: 4
        run: node scripts/atlas-data-sandbox/probe.mjs

      - name: Probe Climate TRACE v7 source shape
        run: node scripts/atlas-data-sandbox/climate-trace-v7-probe.mjs

      - name: Inventory seabed habitat WMTS contract
        run: node scripts/atlas-data-sandbox/habitat-wmts-probe.mjs

      - name: Probe exact ATLAS layer products
        run: node scripts/atlas-data-sandbox/layer-contract-probe.mjs

      - name: Compare seabed habitat candidate products
        run: node scripts/atlas-data-sandbox/habitat-candidates.mjs

      - name: Inventory advertised OGC layers
        env:
          ATLAS_PROBE_TIMEOUT_MS: 12000
        run: node scripts/atlas-data-sandbox/ogc-inventory.mjs

      - name: Upload source-health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-data-source-probes
          path: artifacts/atlas-data-sandbox
          if-no-files-found: error
          retention-days: 30

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sandbox exact SHA
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contracts

      - name: Production build
        run: npm run build

  browser-map-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout sandbox exact SHA
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Start sandbox preview
        run: |
          npm run preview -- --host 0.0.0.0 > atlas-sandbox-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/atlas-data-sandbox > /dev/null; then exit 0; fi
            sleep 1
          done
          cat atlas-sandbox-preview.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser proof — canonical ATLAS + lab extensions + journeys
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/atlas-data-sandbox.spec.ts tests/e2e/atlas-data-journeys.spec.ts --project=desktop-1440 --project=mobile-390

      - name: Upload map proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-data-map-proof
          path: |
            artifacts/atlas-data-sandbox
            playwright-report
            test-results
            atlas-sandbox-preview.log
          if-no-files-found: warn
          retention-days: 30

  deployed-preview-proof:
    runs-on: ubuntu-latest
    needs: regression
    timeout-minutes: 22
    env:
      BASE_URL: https://sandbox-atlas-data-lab-20260.4planet-05.pages.dev
    steps:
      - name: Checkout sandbox exact SHA
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Wait for Cloudflare branch preview to carry repaired v7 function
        run: |
          for attempt in {1..72}; do
            BODY="$(curl --silent --show-error --max-time 20 "$BASE_URL/api/climate-trace?sectors=power&year=2024&gas=co2e_100yr&limit=5" || true)"
            if BODY="$BODY" node -e 'try{const x=JSON.parse(process.env.BODY||"{}"); process.exit(x.ok===true && x.apiVersion==="v7" && x.count>0 ? 0 : 1)}catch{process.exit(1)}'; then
              echo "Cloudflare branch preview carries Climate TRACE v7 and real sources."
              exit 0
            fi
            echo "waiting for current branch deploy ($attempt/72)"
            sleep 10
          done
          echo "Cloudflare branch preview did not converge to the current repaired function in time."
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser proof — deployed Cloudflare data paths
        run: npx playwright test tests/e2e/atlas-data-deployed.spec.ts --project=desktop-1440 --project=mobile-390

      - name: Upload deployed preview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-data-deployed-proof
          path: |
            artifacts/atlas-data-sandbox
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
