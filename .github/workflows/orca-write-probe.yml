name: ORCA clarity write-permission probe
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/orca-write-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check grant only
        run: echo ORCA_GITHUB_WRITE_PROBE_READY
