name: Cloudflare AXE Wake Canary
on:
  push:
    branches: ["system/cloudflare-axe-wake-canary-20261003"]
    paths:
      - "axe-clock-canary/**"
      - ".github/workflows/cloudflare-axe-wake-canary.yml"
permissions:
  contents: read
jobs:
  deploy-and-fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          test -n "$SLACK_WEBHOOK"
      - name: Install Slack webhook as Worker secret
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
        run: printf '%s' "$SLACK_WEBHOOK" | npx wrangler@4.128.0 secret put SLACK_AXE_WEBHOOK_URL
      - name: Deploy isolated canary Worker
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        run: npx wrangler@4.128.0 deploy
      - name: Fire canary through Cloudflare Worker
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="$(npx wrangler@4.128.0 deployments status --json 2>/dev/null | jq -r '.[0].url // empty' || true)"
          if [ -z "$URL" ]; then
            URL="https://4planet-axe-wake-canary.${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}.workers.dev"
          fi
          echo "Canary worker deployed; invoking via workers.dev discovery."
          SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}/workers/subdomain" | jq -r '.result.subdomain')
          curl --fail-with-body --silent --show-error "https://4planet-axe-wake-canary.$SUBDOMAIN.workers.dev/canary"
