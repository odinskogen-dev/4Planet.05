name: Finance Premium Visual Preview
on:
  push:
    branches: [build/finance-intelligence-mvp-20261008, work/finance-id-release-20261008]
    paths:
      - 'src/pages/finance/**'
      - 'src/App.tsx'
      - 'scripts/finance-mvp-contract.test.mjs'
      - 'deploy/finance-router/**'
      - '.github/workflows/finance-beta-domain.yml'
      - 'src/identity/identityClient.ts'
      - '.github/workflows/finance-visual-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: finance-premium-visual-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Confirm exact SHA finance QA passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            outcome=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" | jq -r '[.workflow_runs[] | select(.name=="Finance MVP Preview QA")] | map(select(.event=="push")) | .[0].conclusion // "pending"')
            if [ "$outcome" = "success" ]; then exit 0; fi
            if [ "$outcome" != "pending" ]; then echo "Finance exact SHA quality gate: $outcome"; exit 4; fi
            sleep 10
          done
          echo "Finance QA still pending"; exit 5
      - name: Verify existing Cloudflare project and branch isolation
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 8; }
          api=https://api.cloudflare.com/client/v4
          zones=$(curl -fsS "$api/zones?name=4planet.org" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          projects=$(curl -fsS "$api/accounts/$account/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          production=$(jq -r '[.result[]? | select(.name=="4planet-05")][0].production_branch // empty' <<<"$projects")
          test -n "$production" && test "$production" != "finance-preview"
          echo "NONPRODUCTION_BRANCH_GUARD=PASS"
      - name: Build and mark noindex
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          printf "/* /index.html 200\n" > dist/_redirects
          printf "/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n" > dist/_headers
          python -c "from pathlib import Path; p=Path('dist/index.html');p.write_text(p.read_text().replace('</head>','<meta name=\"robots\" content=\"noindex,nofollow,noarchive\" /></head>'))"
      - name: Deploy to existing Pages origin, isolated preview branch only
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-05 --branch finance-preview --commit-hash "$GITHUB_SHA" --commit-dirty=false | tee /tmp/finance-preview.txt
          url=$(grep -Eo 'https://[a-z0-9-]+[.]4planet-05[.]pages[.]dev' /tmp/finance-preview.txt | head -n1 || true)
          test -n "$url"
          echo "FINANCE_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "FINANCE_PREVIEW=$url/finance" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify external remote HTTP and noindex
        run: |
          set -euo pipefail
          code=$(curl -LsS -D /tmp/finance-preview-headers -w '%{http_code}' -o /tmp/finance-preview.html "$FINANCE_PREVIEW_URL/finance")
          test "$code" = 200
          { grep -Eiq '^x-robots-tag:.*noindex' /tmp/finance-preview-headers || grep -qi noindex /tmp/finance-preview.html; } || { echo "NOINDEX_HEADER_AND_META_MISSING"; exit 29; }
          echo "PREVIEW_PUBLIC_HTTP=PASS; NO DNS OR PRODUCTION REFS MODIFIED"
