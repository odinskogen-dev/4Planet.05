name: Stripe Runtime Read-Only Audit 2026-09-14

on:
  push:
    branches: [audit/stripe-runtime-20260914]
    paths:
      - .github/workflows/stripe-runtime-readonly-audit-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      GH_STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      GH_STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      GH_STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      GH_STRIPE_INTERNAL_BILLING_TOKEN: ${{ secrets.STRIPE_INTERNAL_BILLING_TOKEN }}
      GH_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check GitHub secret presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          check() { if [[ -n "${2:-}" ]]; then echo "GITHUB_SECRET $1=PRESENT"; else echo "GITHUB_SECRET $1=MISSING"; fi; }
          check CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check STRIPE_TEST_SECRET_KEY "${GH_STRIPE_TEST_SECRET_KEY:-}"
          check STRIPE_LIVE_SECRET_KEY "${GH_STRIPE_LIVE_SECRET_KEY:-}"
          check STRIPE_WEBHOOK_SECRET_TEST "${GH_STRIPE_WEBHOOK_SECRET_TEST:-}"
          check STRIPE_WEBHOOK_SECRET_LIVE "${GH_STRIPE_WEBHOOK_SECRET_LIVE:-}"
          check STRIPE_INTERNAL_BILLING_TOKEN "${GH_STRIPE_INTERNAL_BILLING_TOKEN:-}"
          check SUPABASE_URL "${GH_SUPABASE_URL:-}"
          check SUPABASE_SERVICE_ROLE_KEY "${GH_SUPABASE_SERVICE_ROLE_KEY:-}"

      - name: Audit Cloudflare payment runtime without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "RESULT CLOUDFLARE_API_TOKEN=MISSING"; exit 1; }
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          zone="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone}")"
          test -n "$account_id" || { echo "RESULT CLOUDFLARE_ACCOUNT=UNRESOLVED"; exit 1; }
          echo "RESULT CLOUDFLARE_ACCOUNT=RESOLVED"

          project="$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05" "${auth[@]}")"
          jq -e '.success == true' <<<"${project}" >/dev/null
          echo "RESULT PAGES_PROJECT=4planet-05"
          echo "RESULT PRODUCTION_BRANCH=$(jq -r '.result.production_branch // "UNKNOWN"' <<<"${project}")"
          echo "RESULT DOMAINS=$(jq -r '[.result.domains[]?] | join(",")' <<<"${project}")"

          prod_envs="$(jq -c '.result.deployment_configs.production.env_vars // {}' <<<"${project}")"
          preview_envs="$(jq -c '.result.deployment_configs.preview.env_vars // {}' <<<"${project}")"

          inspect_env() {
            scope="$1"
            envs="$2"
            shift 2
            for key in "$@"; do
              type="$(jq -r --arg k "$key" '.[$k].type // empty' <<<"${envs}")"
              if [[ -z "$type" ]]; then
                echo "$scope $key=MISSING"
              elif [[ "$type" == "secret_text" ]]; then
                echo "$scope $key=PRESENT(secret_text)"
              else
                value="$(jq -r --arg k "$key" '.[$k].value // "<no-value>"' <<<"${envs}")"
                case "$key" in
                  STRIPE_PAYMENT_ENV|STRIPE_CHECKOUT_TEST_ENABLED|STRIPE_CHECKOUT_LIVE_ENABLED|STRIPE_LIVE_RELEASE_APPROVED|STRIPE_WEBHOOK_LIVE_ENABLED|STRIPE_INVOICE_LIVE_ENABLED|MARKET_STRIPE_LIVE_CANARY_ENABLED)
                    echo "$scope $key=$value($type)"
                    ;;
                  *)
                    echo "$scope $key=PRESENT($type)"
                    ;;
                esac
              fi
            done
          }

          keys=(
            STRIPE_PAYMENT_ENV
            STRIPE_TEST_SECRET_KEY
            STRIPE_LIVE_SECRET_KEY
            STRIPE_CHECKOUT_TEST_ENABLED
            STRIPE_CHECKOUT_LIVE_ENABLED
            STRIPE_LIVE_RELEASE_APPROVED
            STRIPE_WEBHOOK_SECRET_TEST
            STRIPE_WEBHOOK_SECRET_LIVE
            STRIPE_WEBHOOK_LIVE_ENABLED
            STRIPE_INVOICE_LIVE_ENABLED
            STRIPE_INTERNAL_BILLING_TOKEN
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            MARKET_STRIPE_LIVE_CANARY_ENABLED
          )

          inspect_env "PRODUCTION_ENV" "$prod_envs" "${keys[@]}"
          inspect_env "PREVIEW_ENV" "$preview_envs" "${keys[@]}"

          live_price_count="$(jq -r '[keys[] | select(startswith("STRIPE_LIVE_PRICE_"))] | length' <<<"${prod_envs}")"
          echo "RESULT STRIPE_LIVE_PRICE_ENV_COUNT=$live_price_count"
          jq -r 'keys[] | select(startswith("STRIPE_LIVE_PRICE_")) | "LIVE_PRICE_ENV " + . + "=PRESENT"' <<<"${prod_envs}" | sort || true

          projects="$(curl -fsS "${api}/accounts/${account_id}/pages/projects" "${auth[@]}")"
          echo "RESULT PAGES_PROJECTS_WITH_MARKET_DOMAIN_BEGIN"
          jq -r '.result[]? | select(any(.domains[]?; . == "4planetmarket.com" or . == "www.4planetmarket.com")) | "MARKET_PROJECT name=" + .name + " production_branch=" + (.production_branch // "UNKNOWN") + " domains=" + ([.domains[]?] | join(","))' <<<"${projects}" || true
          echo "RESULT PAGES_PROJECTS_WITH_MARKET_DOMAIN_END"

          market_zone="$(curl -fsS "${api}/zones?name=4planetmarket.com&status=active" "${auth[@]}" || true)"
          market_zone_id="$(jq -r '.result[0].id // empty' <<<"${market_zone:-{}}" 2>/dev/null || true)"
          if [[ -n "$market_zone_id" ]]; then
            echo "RESULT MARKET_ZONE=RESOLVED"
            dns="$(curl -fsS "${api}/zones/${market_zone_id}/dns_records?per_page=100" "${auth[@]}")"
            jq -r '.result[]? | select(.name == "4planetmarket.com" or .name == "www.4planetmarket.com") | "MARKET_DNS name=" + .name + " type=" + .type + " content=" + .content + " proxied=" + (.proxied|tostring)' <<<"${dns}" || true
          else
            echo "RESULT MARKET_ZONE=NOT_RESOLVED_WITH_CURRENT_TOKEN"
          fi

      - name: Probe deployed payment routes read-only
        shell: bash
        run: |
          set -u
          probe() {
            url="$1"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -L -sS --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            ctype="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="content-type"{v=$2} END{print v}' || true)"
            server="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="server"{v=$2} END{print v}' || true)"
            cf_ray="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="cf-ray"{v=$2} END{print v}' || true)"
            title="$(grep -oi '<title>[^<]*' "$body" 2>/dev/null | head -1 | sed 's/<title>//I' || true)"
            echo "PROBE $url HTTP=$code CONTENT_TYPE=${ctype:-UNKNOWN} SERVER=${server:-UNKNOWN} CF_RAY=${cf_ray:+PRESENT} TITLE=${title:-NONE}"
          }
          probe "https://4planet.org/api/stripe/catalog"
          probe "https://4planetmarket.com/api/stripe/catalog"
          probe "https://4planetmarket.com/4market-live-canary.html"
          probe "https://4planetmarket.com/"

      - name: Audit conclusion
        shell: bash
        run: |
          echo "READ_ONLY_AUDIT_COMPLETE=true"
          echo "NO_CLOUDFLARE_PATCH=true"
          echo "NO_STRIPE_WRITE=true"
          echo "NO_PAYMENT_CREATED=true"
