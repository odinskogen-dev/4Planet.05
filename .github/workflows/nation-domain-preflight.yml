name: 4NATION Domain Read-Only Preflight

on:
  push:
    branches: [king/test]
    paths:
      - '.github/workflows/nation-domain-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read Cloudflare domain and Pages mappings without mutation
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          if [[ -z "${CF_TOKEN:-}" ]]; then
            echo '4NATION_DOMAIN_PREFLIGHT=BLOCKED_NO_CLOUDFLARE_TOKEN'
            exit 2
          fi
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json')
          zone=$(curl -fsS --retry 2 "${api}/zones?name=4nation.org&per_page=10" "${auth[@]}")
          jq -e '.success == true' <<<"$zone" >/dev/null
          zid=$(jq -r '.result[0].id // empty' <<<"$zone")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          state=$(jq -r '.result[0].status // "NOT_FOUND"' <<<"$zone")
          echo "4NATION_ZONE_PRESENT=$([[ -n "$zid" ]] && echo YES || echo NO)"
          echo "4NATION_ZONE_STATE=${state}"
          if [[ -z "$zid" || -z "$aid" ]]; then
            echo '4NATION_DOMAIN_MAPPING=UNVERIFIED / NO ACCESSIBLE ZONE'
            exit 0
          fi
          get_optional() {
            local stage="$1" url="$2" body http
            body=$(mktemp)
            http=$(curl -sS --retry 2 --max-time 15 -o "$body" -w '%{http_code}' "$url" "${auth[@]}" || true)
            echo "4NATION_${stage}_HTTP=${http}" >&2
            if [[ "$http" != "200" ]]; then
              jq -r '.errors[]? | "CLOUDFLARE_ERROR_CODE="+(.code|tostring)+" / "+(.message//"unknown")' "$body" >&2 || true
              rm -f "$body"
              echo '{"success":false,"result":[]}'
              return
            fi
            cat "$body"
            rm -f "$body"
          }
          dns=$(get_optional ROOT_DNS "${api}/zones/${zid}/dns_records?name=4nation.org")
          jq -e '.success == true' <<<"$dns" >/dev/null || echo '4NATION_ROOT_DNS=NOT_VERIFIED / API REJECTED'
          www=$(get_optional WWW_DNS "${api}/zones/${zid}/dns_records?name=www.4nation.org")
          jq -e '.success == true' <<<"$www" >/dev/null || echo '4NATION_WWW_DNS=NOT_VERIFIED / API REJECTED'
          projects=$(get_optional PAGES "${api}/accounts/${aid}/pages/projects?per_page=100")
          jq -e '.success == true' <<<"$projects" >/dev/null || echo '4NATION_PAGES=NOT_VERIFIED / API REJECTED'
          echo '4NATION_ROOT_DNS:'
          jq -r '.result[]? | [.type,.name,.content,((.proxied // false)|tostring)] | @tsv' <<<"$dns"
          echo '4NATION_WWW_DNS:'
          jq -r '.result[]? | [.type,.name,.content,((.proxied // false)|tostring)] | @tsv' <<<"$www"
          echo '4NATION_PAGES_OWNER:'
          jq -r '.result[]? | select(any(.domains[]?; .=="4nation.org" or .=="www.4nation.org")) | [.name,.production_branch,(.domains|join(","))] | @tsv' <<<"$projects"
          echo '4NATION_DOMAIN_PREFLIGHT=READ_ONLY_NO_DEPLOY'
