name: Bind 4species.com to SPECIES

on:
  push:
    branches:
      - ops/4species-domain-20260820
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare API token without exposing it
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          [ -n "$TOKEN" ] || { echo "No supported Cloudflare API token secret is available."; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          [ -n "$TOKEN" ] || exit 2
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" 'https://api.cloudflare.com/client/v4/zones?name=4species.com&status=active')
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' <<<"$json")
          [ -n "$ACCOUNT_ID" ] || exit 3
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy 4species single-source router
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/4species-worker.mjs" <<'EOF'
          const ORIGIN = "https://4planet-05.pages.dev";
          const RESERVED = new Set([
            "labs","os","story","domains","missions","atlas","lens","food","s4piens","4sapien",
            "impact","checkout","join","people","brands","partners","actors","get-involved","funders",
            "living-systems","reports","about","magazine","stories","privacy","culture","m","marketplace",
            "store","cart","members","ambassadors","portal","sponsors","oce4n","e4rth","4culture","system","404"
          ]);
          const ASSET_PREFIXES = ["/assets/","/api/","/fonts/","/images/","/icons/","/static/","/data/","/media/","/.well-known/"];
          function isAsset(path) {
            if (ASSET_PREFIXES.some((prefix) => path.startsWith(prefix))) return true;
            if (["/favicon.ico","/robots.txt","/sitemap.xml","/manifest.webmanifest"].includes(path)) return true;
            return (path.split("/").pop() || "").includes(".");
          }
          function first(path) { return path.split("/").filter(Boolean)[0] || ""; }
          function redirect(url, status = 302) { return Response.redirect(url, status); }
          async function proxy(request, targetPath) {
            const incoming = new URL(request.url);
            const target = new URL(ORIGIN);
            target.pathname = targetPath;
            target.search = incoming.search;
            return fetch(new Request(target.toString(), request));
          }
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              const host = url.hostname.toLowerCase();
              const path = url.pathname || "/";
              if (host === "www.4species.com") return redirect(`https://4species.com${path}${url.search}`, 308);
              if (path === "/" || path === "") return redirect(`https://4species.com/species${url.search}`);
              if (path === "/atlas" || path.startsWith("/atlas/")) return redirect(`https://4planetatlas.com/${url.search}`.replace('/?', '?'), 308);
              if (isAsset(path)) return proxy(request, path);
              if (path === "/species" || path.startsWith("/species/")) return proxy(request, path);
              if (RESERVED.has(first(path))) return redirect(`https://4planet.org${path}${url.search}`, 308);
              return redirect(`https://4species.com/species${path}${url.search}`);
            }
          };
          EOF
          cat > "$RUNNER_TEMP/4species-wrangler.toml" <<EOF
          name = "4species-router"
          main = "$RUNNER_TEMP/4species-worker.mjs"
          compatibility_date = "2026-09-15"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4species.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4species.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/4species-wrangler.toml"

      - name: Verify SPECIES routing and single origin
        shell: bash
        run: |
          set -euo pipefail
          root=$(curl -sS -I --max-time 15 https://4species.com/)
          echo "$root"
          echo "$root" | grep -qi '^location: https://4species.com/species'
          code=$(curl -L -sS -o /tmp/species.html -w '%{http_code}' --max-time 30 https://4species.com/)
          [ "$code" = "200" ]
          grep -q '<div id="root"' /tmp/species.html
          code2=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://4species.com/orca)
          [ "$code2" = "200" ]
          echo "PASS: 4species.com resolves SPECIES from 4planet-05.pages.dev only."
