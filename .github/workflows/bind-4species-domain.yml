name: Bind 4species.com to SPECIES

on:
  push:
    branches:
      - ops/4species-domain-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare API token without exposing it
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "No supported Cloudflare API token secret is available in this repository."
            exit 2
          fi
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"
          if [ -z "$TOKEN" ]; then
            echo "Cloudflare token secret became empty after safe normalization."
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve 4species.com zone and account
        shell: bash
        run: |
          set -euo pipefail
          zones_file="$RUNNER_TEMP/cf-zones.json"
          zones_status=$(curl -sS -o "$zones_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            'https://api.cloudflare.com/client/v4/zones?name=4species.com&status=active')
          if [ "$zones_status" != "200" ]; then
            echo "Cloudflare zone lookup HTTP status: $zones_status"
            jq '{success, errors, messages}' "$zones_file" 2>/dev/null || cat "$zones_file"
            exit 5
          fi
          jq -e '.success == true' "$zones_file" >/dev/null
          ZONE_ID=$(jq -r '.result[0].id // empty' "$zones_file")
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$zones_file")
          if [ -z "$ZONE_ID" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "4species.com was not found as an active Cloudflare zone accessible to this token."
            exit 3
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "Cloudflare token has zone access and 4species.com resolved."

      - name: Rebind 4species.com to canonical SPECIES route
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/4species-worker.mjs" <<'EOF'
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const path = incoming.pathname || "/";
              let targetPath;
              if (path === "/" || path === "") targetPath = "/species";
              else if (path === "/species" || path.startsWith("/species/")) targetPath = path;
              else targetPath = `/species${path.startsWith("/") ? path : `/${path}`}`;
              const target = new URL(targetPath, "https://4planet.org");
              target.search = incoming.search;
              return Response.redirect(target.toString(), 302);
            }
          };
          EOF
          cat > "$RUNNER_TEMP/4species-wrangler.toml" <<EOF
          name = "4species-router"
          main = "$RUNNER_TEMP/4species-worker.mjs"
          compatibility_date = "2026-09-15"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4species.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4species.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/4species-wrangler.toml"

      - name: Verify live 4species routing
        shell: bash
        run: |
          set -euo pipefail
          check_redirect() {
            local url="$1"
            local expected="$2"
            for attempt in $(seq 1 24); do
              headers=$(curl -sS -I --max-time 15 "$url" || true)
              status=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}')
              location=$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}')
              echo "$url -> status=${status:-none} location=${location:-none}"
              if [[ "$status" =~ ^30[1278]$ ]] && [[ "$location" == "$expected"* ]]; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          check_redirect "https://4species.com/" "https://4planet.org/species"
          check_redirect "https://www.4species.com/" "https://4planet.org/species"
          check_redirect "https://4species.com/orca" "https://4planet.org/species/orca"

      - name: Record deployment intent
        run: |
          echo "4species.com is an alias into the single canonical 4planet.org live source."
          echo "Root redirects to /species; species slugs map to /species/<slug>."
