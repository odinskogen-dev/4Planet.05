name: Bind 4species.com to SPECIES

on:
  push:
    branches:
      - ops/4species-domain-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare API token without exposing it
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "No supported Cloudflare API token secret is available in this repository."
            exit 2
          fi
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"
          if [ -z "$TOKEN" ]; then
            echo "Cloudflare token secret became empty after safe normalization."
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve 4species.com zone and account
        shell: bash
        run: |
          set -euo pipefail
          zones_file="$RUNNER_TEMP/cf-zones.json"
          zones_status=$(curl -sS -o "$zones_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            'https://api.cloudflare.com/client/v4/zones?name=4species.com&status=active')
          if [ "$zones_status" != "200" ]; then
            echo "Cloudflare zone lookup HTTP status: $zones_status"
            jq '{success, errors, messages}' "$zones_file" 2>/dev/null || cat "$zones_file"
            exit 5
          fi
          jq -e '.success == true' "$zones_file" >/dev/null
          ZONE_ID=$(jq -r '.result[0].id // empty' "$zones_file")
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$zones_file")
          if [ -z "$ZONE_ID" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "4species.com was not found as an active Cloudflare zone accessible to this token."
            exit 3
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "Cloudflare token has zone access and 4species.com resolved."

      - name: Keep 4species.com router live
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/4species-worker.mjs" <<'EOF'
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const path = incoming.pathname || "/";
              let targetPath;
              if (path === "/" || path === "") targetPath = "/species";
              else if (path === "/species" || path.startsWith("/species/")) targetPath = path;
              else targetPath = `/species${path.startsWith("/") ? path : `/${path}`}`;
              const target = new URL(targetPath, "https://4planet.org");
              target.search = incoming.search;
              return Response.redirect(target.toString(), 302);
            }
          };
          EOF
          cat > "$RUNNER_TEMP/4species-wrangler.toml" <<EOF
          name = "4species-router"
          main = "$RUNNER_TEMP/4species-worker.mjs"
          compatibility_date = "2026-08-20"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4species.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4species.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/4species-wrangler.toml"

      - name: Verify fixed prototype upstreams
        shell: bash
        run: |
          set -euo pipefail
          tree="https://build-tree-of-life-action-in.4planet-05.pages.dev/tree-of-life"
          labs="https://labs-overview-v1.4planet-05.pages.dev/labs"
          for url in "$tree" "$labs"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done

      - name: Bind n4turetech.com to TREE OF LIFE prototype
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/n4turetech-worker.mjs" <<'EOF'
          const UPSTREAM = "https://build-tree-of-life-action-in.4planet-05.pages.dev";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              let path = incoming.pathname || "/";
              if (path === "/" || path === "") path = "/tree-of-life";
              else if (path === "/choice") path = "/tree-of-life/choice";
              const upstream = new URL(path, UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              return new Response(response.body, {status: response.status, statusText: response.statusText, headers});
            }
          };
          EOF
          cat > "$RUNNER_TEMP/n4turetech-wrangler.toml" <<EOF
          name = "n4turetech-treeoflife-proto"
          main = "$RUNNER_TEMP/n4turetech-worker.mjs"
          compatibility_date = "2026-08-20"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "n4turetech.com"
          custom_domain = true
          [[routes]]
          pattern = "www.n4turetech.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/n4turetech-wrangler.toml"

      - name: Bind labs.4planet.org to current 4PLANET LABS
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/labs-worker.mjs" <<'EOF'
          const UPSTREAM = "https://labs-overview-v1.4planet-05.pages.dev";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              let path = incoming.pathname || "/";
              if (path === "/" || path === "") path = "/labs";
              const upstream = new URL(path, UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              return new Response(response.body, {status: response.status, statusText: response.statusText, headers});
            }
          };
          EOF
          cat > "$RUNNER_TEMP/labs-wrangler.toml" <<EOF
          name = "4planet-labs-fixed-domain"
          main = "$RUNNER_TEMP/labs-worker.mjs"
          compatibility_date = "2026-08-20"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "labs.4planet.org"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/labs-wrangler.toml"

      - name: Verify live fixed domains
        shell: bash
        run: |
          set -euo pipefail
          check_200() {
            local url="$1"
            for attempt in $(seq 1 24); do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
              echo "$url -> HTTP $code (attempt $attempt/24)"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 10
            done
            return 1
          }
          check_200 "https://n4turetech.com/"
          check_200 "https://n4turetech.com/choice"
          check_200 "https://labs.4planet.org/"
          check_200 "https://labs.4planet.org/labs"

      - name: Inventory Cloudflare zones
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" "${api}/zones?per_page=50")"
          echo "$zones" | jq -e '.success == true' >/dev/null
          echo "=== CLOUDFLARE ZONES ==="
          echo "$zones" | jq -r '.result | sort_by(.name)[] | [.name, .status, .type] | @tsv'

      - name: Record deployment intent
        run: |
          echo "4species.com stays a canonical SPECIES entry alias."
          echo "n4turetech.com is a fixed noindex TREE OF LIFE prototype surface."
          echo "labs.4planet.org is a fixed noindex 4PLANET LABS development surface."
