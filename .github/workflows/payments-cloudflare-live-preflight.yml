name: Payments Cloudflare LIVE Preflight

on:
  push:
    branches: [build/payments-live-model-01]
    paths:
      - .github/workflows/payments-cloudflare-live-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_INTERNAL_BILLING_TOKEN: ${{ secrets.STRIPE_INTERNAL_BILLING_TOKEN }}
    steps:
      - name: Resolve Cloudflare Pages project
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone}")"
          test -n "$account_id" || { echo "Cloudflare account not resolved"; exit 1; }
          project="$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05" "${auth[@]}")"
          jq -e '.success == true' <<<"${project}" >/dev/null
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project 4planet-05 resolved."

      - name: Check server-only payment secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in STRIPE_LIVE_SECRET_KEY STRIPE_WEBHOOK_SECRET_LIVE SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY STRIPE_INTERNAL_BILLING_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "MISSING: $key"
              missing=1
            else
              echo "PRESENT: $key"
            fi
          done
          [[ "${STRIPE_LIVE_SECRET_KEY:-}" == sk_live_* ]] || { echo "INVALID: STRIPE_LIVE_SECRET_KEY prefix"; missing=1; }
          [[ "${STRIPE_WEBHOOK_SECRET_LIVE:-}" == whsec_* ]] || { echo "INVALID: STRIPE_WEBHOOK_SECRET_LIVE prefix"; missing=1; }
          [[ ${#STRIPE_INTERNAL_BILLING_TOKEN} -ge 24 ]] || { echo "INVALID: STRIPE_INTERNAL_BILLING_TOKEN length"; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stage LIVE runtime in fail-closed mode
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          body="$(jq -n \
            --arg stripe "$STRIPE_LIVE_SECRET_KEY" \
            --arg whsec "$STRIPE_WEBHOOK_SECRET_LIVE" \
            --arg supa "$SUPABASE_URL" \
            --arg service "$SUPABASE_SERVICE_ROLE_KEY" \
            --arg billing "$STRIPE_INTERNAL_BILLING_TOKEN" \
            '{deployment_configs:{production:{env_vars:{
              STRIPE_PAYMENT_ENV:{type:"plain_text",value:"LIVE"},
              STRIPE_CHECKOUT_LIVE_ENABLED:{type:"plain_text",value:"false"},
              STRIPE_LIVE_RELEASE_APPROVED:{type:"plain_text",value:"false"},
              STRIPE_WEBHOOK_LIVE_ENABLED:{type:"plain_text",value:"false"},
              STRIPE_INVOICE_LIVE_ENABLED:{type:"plain_text",value:"false"},
              STRIPE_LIVE_SECRET_KEY:{type:"secret_text",value:$stripe},
              STRIPE_WEBHOOK_SECRET_LIVE:{type:"secret_text",value:$whsec},
              SUPABASE_URL:{type:"secret_text",value:$supa},
              SUPABASE_SERVICE_ROLE_KEY:{type:"secret_text",value:$service},
              STRIPE_INTERNAL_BILLING_TOKEN:{type:"secret_text",value:$billing}
            }}}}' )"
          response="$(curl -fsS -X PATCH "${api}/accounts/${ACCOUNT_ID}/pages/projects/4planet-05" "${auth[@]}" --data "$body")"
          jq -e '.success == true' <<<"${response}" >/dev/null
          echo "Cloudflare LIVE payment secrets staged with all payment switches CLOSED."

      - name: Read back fail-closed switches
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          project="$(curl -fsS "${api}/accounts/${ACCOUNT_ID}/pages/projects/4planet-05" "${auth[@]}")"
          for key in STRIPE_PAYMENT_ENV STRIPE_CHECKOUT_LIVE_ENABLED STRIPE_LIVE_RELEASE_APPROVED STRIPE_WEBHOOK_LIVE_ENABLED STRIPE_INVOICE_LIVE_ENABLED; do
            value="$(jq -r --arg k "$key" '.result.deployment_configs.production.env_vars[$k].value // empty' <<<"$project")"
            echo "$key=$value"
          done
          test "$(jq -r '.result.deployment_configs.production.env_vars.STRIPE_PAYMENT_ENV.value // empty' <<<"$project")" = "LIVE"
          test "$(jq -r '.result.deployment_configs.production.env_vars.STRIPE_CHECKOUT_LIVE_ENABLED.value // empty' <<<"$project")" = "false"
          test "$(jq -r '.result.deployment_configs.production.env_vars.STRIPE_LIVE_RELEASE_APPROVED.value // empty' <<<"$project")" = "false"
