name: Browser Product Proof

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: browser-product-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-critical-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact evidence candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_SHA"
          printf '%s\n' "$actual" > runtime-sha.txt

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and browser system packages
        run: npx playwright install --with-deps chromium

      - name: Build the exact current source
        run: npm run build

      - name: Start exact-head local preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/4planet-preview.log 2>&1 &
          echo $! > /tmp/4planet-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              printf '%s\n' "http://127.0.0.1:4173" > runtime-url.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/4planet-preview.log || true
          exit 1

      - name: Run desktop, mobile, map and critical-route tests against exact head
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e -- --project=desktop-1440 --project=desktop-1280 --project=mobile-390 --project=mobile-430

      - name: Confirm tracked product tree stayed clean
        shell: bash
        run: |
          git diff --exit-code --
          git diff --cached --exit-code --

      - name: Upload current product screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-proof-browser-evidence
          path: |
            artifacts/product-proof
            playwright-report
            test-results
            runtime-url.txt
            runtime-sha.txt
          if-no-files-found: warn
          retention-days: 14
