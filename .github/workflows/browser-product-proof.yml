name: Browser Product Proof

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: browser-product-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-current-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Record exact candidate
        run: git rev-parse HEAD > runtime-sha.txt

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build exact source
        run: npm run build

      - name: Smoke + contract proof
        run: npm run test:smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start exact-source local preview
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 > browser-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              printf '%s\n' 'http://127.0.0.1:4173' > runtime-url.txt
              exit 0
            fi
            sleep 1
          done
          cat browser-preview.log
          exit 1

      - name: Jaguar desktop + mobile product proof
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/jaguar-world.spec.ts --project=desktop-1440 --project=mobile-390

      - name: Upload current product screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-proof-browser-evidence
          path: |
            artifacts/jaguar-world
            playwright-report
            test-results
            runtime-url.txt
            runtime-sha.txt
            browser-preview.log
          if-no-files-found: warn
          retention-days: 14
