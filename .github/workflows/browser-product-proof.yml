name: Browser Product Proof

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: browser-product-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-critical-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and browser system packages
        run: npx playwright install --with-deps chromium

      - name: Build the public candidate
        run: npm run build

      - name: Start the exact built candidate
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run desktop, mobile, map and critical-route tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Upload current product screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-proof-browser-evidence
          path: |
            artifacts/product-proof
            playwright-report
            test-results
            preview.log
          if-no-files-found: warn
          retention-days: 14
