name: Browser Product Proof

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: browser-product-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDITED_RUNTIME_SHA: 60d55cd758e496ac40fcd7e4654713b110f54718
  AUDITED_RUNTIME_URL: https://build-four-product-integrate.4planet-05.pages.dev
  AUDITED_RUNTIME_MARKER: pq02-claude-02-audit-preview-2026-07-26

jobs:
  test-critical-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact evidence candidate
        uses: actions/checkout@v4

      - name: Confirm that runtime product files still match the controlled candidate
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$AUDITED_RUNTIME_SHA"
          git diff --exit-code "$AUDITED_RUNTIME_SHA" HEAD -- src public package.json package-lock.json supabase

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and browser system packages
        run: npx playwright install --with-deps chromium

      - name: Build the current source for integrity
        run: npm run build

      - name: Confirm the controlled branch deployment is current and reachable
        shell: bash
        run: |
          for attempt in {1..90}; do
            marker="$(curl --fail --silent "$AUDITED_RUNTIME_URL/product-build.txt" || true)"
            if printf '%s' "$marker" | grep --fixed-strings --quiet "$AUDITED_RUNTIME_MARKER"; then
              printf '%s\n' "$AUDITED_RUNTIME_URL" > runtime-url.txt
              printf '%s\n' "$AUDITED_RUNTIME_SHA" > runtime-sha.txt
              printf '%s\n' "$marker" > runtime-marker.txt
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run desktop, mobile, map and critical-route tests against the controlled deployment
        env:
          BASE_URL: ${{ env.AUDITED_RUNTIME_URL }}
        run: npm run test:e2e

      - name: Upload current product screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-proof-browser-evidence
          path: |
            artifacts/product-proof
            playwright-report
            test-results
            runtime-url.txt
            runtime-sha.txt
            runtime-marker.txt
          if-no-files-found: warn
          retention-days: 14
