name: 4PLANET MARKET Gold Product Gate

on:
  pull_request:
    paths:
      - 'src/market/**'
      - 'src/pages/v5/ImpactMarketGold.tsx'
      - 'src/styles/impact-market-gold.css'
      - 'src/routes/router.tsx'
      - 'tests/e2e/impact-market-gold.spec.ts'
      - '.github/workflows/impact-market-gold.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impact-market-gold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 > impact-market-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/market > /dev/null; then exit 0; fi
            sleep 1
          done
          cat impact-market-preview.log
          exit 1

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Market desktop + mobile acceptance
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/impact-market-gold.spec.ts --project=desktop-1440 --project=mobile-390 --project=webkit-desktop --project=webkit-390

      - name: Upload Market evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-market-gold-evidence
          path: |
            artifacts/
            test-results/
            playwright-report/
            impact-market-preview.log
