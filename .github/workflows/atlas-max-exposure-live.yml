name: MAX EXPOSURE — ATLAS LIVE 250 Places

on:
  push:
    branches:
      - release/atlas-max-exposure-20261011
    paths:
      - 'functions/**'
      - 'scripts/atlas-max-exposure-middleware-runtime.test.mjs'
      - 'docs/control/ATLAS_MAX_EXPOSURE_ZERO_LOSS_RELEASE_20261011.md'
      - '.github/workflows/atlas-max-exposure-qa.yml'
      - '.github/workflows/atlas-max-exposure-live.yml'

permissions:
  contents: read

concurrency:
  group: atlas-max-exposure-live-20261011
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ATLAS_PROJECT: 4planet-atlas
      ATLAS_DOMAIN: 4planetatlas.com
      BASELINE_SHA: b44c5b7e1a123ee2b3ee6a97168b0f2c4e15da74
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zero-loss diff gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          allowed='^(functions/_middleware\.js|functions/atlas-promoted-places\.generated\.js|scripts/atlas-max-exposure-middleware-runtime\.test\.mjs|docs/control/ATLAS_MAX_EXPOSURE_ZERO_LOSS_RELEASE_20261011\.md|\.github/workflows/atlas-max-exposure-qa\.yml|\.github/workflows/atlas-max-exposure-live\.yml)$'
          for file in "${changed[@]}"; do
            grep -Eq "$allowed" <<<"$file" || { echo "UNEXPECTED PRODUCT FILE: $file"; exit 21; }
          done
          # Only the live Atlas middleware and this exact release gate may differ.
          test "${#changed[@]}" = 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'functions/_middleware.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/atlas-max-exposure-live.yml'
          echo "ATLAS_ZERO_LOSS_DIFF_PASS"

      - name: Apply exact protected v43 product overlay
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build + protected product QA
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-atlas-places.mjs
          npm run typecheck
          node --test scripts/atlas-v43-contract.test.mjs scripts/atlas-human-awe-contract.test.mjs scripts/seo-ownership-contract.test.mjs scripts/atlas-mobile-context-control-contract.test.mjs scripts/atlas-recovery-contract.test.mjs
          npm run build:atlas
          node --test scripts/atlas-max-exposure-middleware-runtime.test.mjs
          node --input-type=module <<'NODE'
          import {onRequest} from './functions/_middleware.js';
          import assert from 'node:assert/strict';
          const call=async path=>onRequest({request:new Request('https://4planetatlas.com'+path),next:async()=>new Response('<!doctype html><html><body>ATLAS map</body></html>',{status:200,headers:{'content-type':'text/html'}})});
          for(const path of ['/','/atlas/','/atlas/?place=oslo&z=7','/embed/atlas?place=berlin','/places','/place/oslo','/place/berlin','/place/svalbard','/place/oslofjord','/place/great-barrier-reef','/place/serengeti','/sitemap-discovery.xml']){
            const r=await call(path);assert.equal(r.status,200,path);
          }
          for(const path of ['/unpublished-random-path-404','/unknown/prefix','/place/not-a-qualifying-place','/place/amazon-basin','/place/borneo','/place/congo-basin','/place/costa-rica']){
            const r=await call(path);assert.equal(r.status,404,path);
            assert.match(r.headers.get('x-robots-tag'),/noindex/);
          }
          for(const [path,loc] of [['/species','https://4species.com/explore'],['/living-systems','https://4planet.org/livingsystems/']]){
            const r=await call(path);assert.equal(r.status,302,path);assert.equal(r.headers.get('location'),loc,path);
          }
          console.log('ATLAS_SOFT404_P0_DEEP_LINK_PRESERVATION_PASS');
          NODE

          test -f dist/index.html
          js=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          [ -n "$js" ]
          echo "EXPECTED_APP_JS=$js" >> "$GITHUB_ENV"
          echo "ATLAS_BUILD_QA_PASS"

      - name: Resolve Cloudflare authority
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -z "$candidate" ] || { token="$candidate"; break; }
          done
          [ -n "$token" ]
          token=$(printf '%s' "$token" | tr -d '\r\n'); token="${token#Bearer }"; token="${token#bearer }"
          echo "::add-mask::$token"
          zone=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=4planetatlas.com&status=active' -H "Authorization: Bearer $token")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account" ]
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Deploy exact candidate to dedicated ATLAS production
        id: deploy
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist             --project-name "$ATLAS_PROJECT"             --branch main             --commit-hash "$GITHUB_SHA"             --commit-message "MAX EXPOSURE ATLAS 250 Places $GITHUB_SHA"

      - name: Verify custom-domain LIVE
        id: live
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 25 "https://$ATLAS_DOMAIN/" || true)
            if [ "$root_code" = '200' ] && grep -Fq "$EXPECTED_APP_JS" /tmp/root.html; then break; fi
            sleep 3
          done
          test "$root_code" = '200'
          grep -Fq "$EXPECTED_APP_JS" /tmp/root.html
          atlas=$(curl -fsSL "https://$ATLAS_DOMAIN/atlas")
          grep -Fq "$EXPECTED_APP_JS" <<<"$atlas"
          echo "ATLAS_LIVE_CHECKPOINT premium-root-and-atlas=PASS"

          places=$(curl -fsSL "https://$ATLAS_DOMAIN/places")
          place_count=$(grep -o 'href="/place/[^"]*"' <<<"$places" | sort -u | wc -l | tr -d ' ')
          test "$place_count" = '250'
          echo "ATLAS_LIVE_CHECKPOINT place-index=$place_count"

          # Hub paths: the home page still links /species and /living-systems (home bytes unchanged);
          # on 4planetatlas.com those exact paths now redirect (302) to the live hubs.
          for spec in /species=https://4species.com/explore /living-systems=https://4planet.org/livingsystems/; do
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 25 "https://$ATLAS_DOMAIN${spec%%=*}")
            echo "ATLAS_LIVE_DIAG hub ${spec%%=*} -> $got (target status, info only: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "${spec#*=}" || true))"
            test "$got" = "302 ${spec#*=}"
          done
          echo "ATLAS_LIVE_CHECKPOINT hub-redirects=PASS"

          for slug in berlin oslo london tokyo nairobi kenya sao-tome; do
            html=$(curl -fsSL "https://$ATLAS_DOMAIN/place/$slug")
            echo "ATLAS_LIVE_DIAG place-$slug title=$(grep -o '<title>[^<]*</title>' <<<"$html" | head -1 || true)"
            echo "ATLAS_LIVE_DIAG place-$slug canonical=$(grep -o 'rel=\"canonical\" href=\"[^\"]*\"' <<<"$html" | head -1 || true)"
            echo "ATLAS_LIVE_DIAG place-$slug acquisition=$(grep -o 'data-acquisition-entry=\"[^\"]*\"' <<<"$html" | head -1 || true)"
            echo "ATLAS_LIVE_DIAG place-$slug handoff=$(grep -o '/atlas/?place=[^\"]*' <<<"$html" | head -1 || true)"
            grep -Fq "rel=\"canonical\" href=\"https://$ATLAS_DOMAIN/place/$slug\"" <<<"$html"
            grep -Fq 'data-acquisition-entry="organic-place"' <<<"$html"
            grep -Fq "/atlas/?place=$slug" <<<"$html"
            grep -Fq 'BreadcrumbList' <<<"$html"
            echo "ATLAS_LIVE_CHECKPOINT place-$slug=PASS"
          done

          # sites-fix-plan-01 item 1 follow-up: expected status per featured/discovery URL.
          for spec in /:200 /place/kenya:200 /place/norway:200 /place/svalbard:200 /place/oslofjord:200 /place/great-barrier-reef:200 /place/serengeti:200 /place/amazon-basin:404 /place/borneo:404 /place/congo-basin:404 /place/costa-rica:404; do
            path="${spec%:*}"; want="${spec##*:}"
            code=$(curl -sS -o /tmp/discovery.html -w '%{http_code}' "https://$ATLAS_DOMAIN$path")
            echo "ATLAS_LIVE_DIAG discovery $path status=$code expected=$want"
            test "$code" = "$want"
            if [ "$want" = 404 ]; then grep -Fq 'noindex' /tmp/discovery.html; fi
          done
          for slug in svalbard oslofjord great-barrier-reef serengeti; do
            html=$(curl -fsSL "https://$ATLAS_DOMAIN/place/$slug")
            grep -Fq "rel=\"canonical\" href=\"https://$ATLAS_DOMAIN/place/$slug\"" <<<"$html"
            grep -Fq "data-atlas-discovery-place=\"$slug\"" <<<"$html"
            if grep -Eq 'href="/(species|living-systems|about|brands|impact|join|missions|reports|privacy|domains)' <<<"$html"; then echo "shell link on $slug"; exit 41; fi
            if grep -Eqi 'discovery object|navigation geometry|publication threshold' <<<"$html"; then echo "internal wording on $slug"; exit 42; fi
          done
          dsm=$(curl -fsSL "https://$ATLAS_DOMAIN/sitemap-discovery.xml")
          discovery_places=$(grep -o "<loc>https://$ATLAS_DOMAIN/place/[^<]*</loc>" <<<"$dsm" | sort -u | wc -l | tr -d ' ')
          test "$discovery_places" = '4'
          echo "ATLAS_LIVE_CHECKPOINT discovery-first-wave=PASS sitemap-discovery=$discovery_places"

          sm=$(curl -fsSL "https://$ATLAS_DOMAIN/sitemap.xml")
          grep -Fq "<loc>https://$ATLAS_DOMAIN/</loc>" <<<"$sm"
          ! grep -Fq "<loc>https://$ATLAS_DOMAIN/atlas/</loc>" <<<"$sm"
          echo ATLAS_ROOT_SELF_CANONICAL_SITEMAP_PASS
          sitemap_places=$(grep -o "<loc>https://$ATLAS_DOMAIN/place/[^<]*</loc>" <<<"$sm" | sort -u | wc -l | tr -d ' ')
          sitemap_images=$(grep -o "<image:loc>https://$ATLAS_DOMAIN/place/[^<]*/map.svg</image:loc>" <<<"$sm" | sort -u | wc -l | tr -d ' ')
          test "$sitemap_places" = '250'
          test "$sitemap_images" = '250'
          echo "ATLAS_LIVE_CHECKPOINT sitemap-places=$sitemap_places images=$sitemap_images"

          robots=$(curl -fsSL "https://$ATLAS_DOMAIN/robots.txt")
          grep -Fq "Sitemap: https://$ATLAS_DOMAIN/sitemap.xml" <<<"$robots"
          grep -Fq "Sitemap: https://$ATLAS_DOMAIN/sitemap-discovery.xml" <<<"$robots"
          echo "ATLAS_LIVE_CHECKPOINT robots=PASS"

          status=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' "https://$ATLAS_DOMAIN/place/__max_exposure_unknown__")
          test "$status" = '404'
          grep -Fq 'noindex' /tmp/unknown.html
          echo "ATLAS_LIVE_CHECKPOINT unknown-404=PASS"
          for path in /no-such-atlas-public-path-404 /unknown/nested-route; do
            code=$(curl -sS -o /tmp/atlas-invalid.html -w '%{http_code}' "https://$ATLAS_DOMAIN$path")
            test "$code" = 404
            grep -Fq 'noindex' /tmp/atlas-invalid.html
          done
          echo "ATLAS_GENERIC_SOFT404_LIVE_PASS"

          http_code=$(curl -sS -o /dev/null -w '%{http_code}' "http://$ATLAS_DOMAIN/place/berlin")
          case "$http_code" in 301|302|307|308) : ;; *) echo "HTTP canonical transport failed: $http_code"; exit 31 ;; esac

          echo "ATLAS_250_LIVE_PASS source=$GITHUB_SHA"

      - name: Roll back exact prior v43 production on release failure
        # Roll back if the deploy step ran at all (success, failure/step timeout, or cancel) and LIVE was not proven.
        # Step timeouts above fire before the 90-minute job timeout, so a hang takes the failure() path.
        if: (failure() || cancelled()) && contains(fromJSON('["success","failure","cancelled"]'), steps.deploy.outcome) && steps.live.outcome != 'success'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git checkout "$BASELINE_SHA"
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          rm -rf /tmp/v43
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json
          npm ci
          node scripts/build-atlas-places.mjs
          npm run build:atlas
          npx --yes wrangler@4.128.0 pages deploy dist             --project-name "$ATLAS_PROJECT"             --branch main             --commit-hash "$BASELINE_SHA"             --commit-message "ROLLBACK ATLAS v43 $BASELINE_SHA"
          echo "ATLAS_ROLLBACK_DEPLOYED $BASELINE_SHA"
