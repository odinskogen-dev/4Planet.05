name: MAX EXPOSURE — ATLAS LIVE closure

on:
  push:
    branches:
      - release/atlas-max-exposure-live-20261011

permissions:
  contents: read

concurrency:
  group: atlas-max-exposure-live-20261011
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: 4planet-atlas
      DOMAIN: 4planetatlas.com
      BASELINE_SHA: 6c01c2029810f18838243c839d1f55477792ea3a
      REQUIRED_QA_SHA: d134ab39f5e16291b99c19f78ee0d2a8f46e00a8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bound release to audited MAX EXPOSURE files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REQUIRED_QA_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          allowed='^(functions/_middleware\.js|functions/atlas-promoted-places\.generated\.js|scripts/atlas-max-exposure-middleware-runtime\.test\.mjs|docs/control/ATLAS_MAX_EXPOSURE_ZERO_LOSS_RELEASE_20261011\.md|\.github/workflows/atlas-max-exposure-qa\.yml|\.github/workflows/atlas-max-exposure-live\.yml)$'
          for file in "${changed[@]}"; do
            if ! grep -Eq "$allowed" <<<"$file"; then
              echo "UNEXPECTED ATLAS RELEASE FILE: $file"
              exit 21
            fi
          done
          grep -Fq 'MAX EXPOSURE ZERO-LOSS' functions/_middleware.js
          grep -Fq 'if (host === "4planetatlas.com") return context.next();' functions/_middleware.js
          echo ATLAS_BOUNDED_RELEASE_PASS

      - name: Apply exact v43 protected product overlay
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build + protected product contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-atlas-places.mjs
          npm run typecheck
          node --test             scripts/atlas-v43-contract.test.mjs             scripts/atlas-human-awe-contract.test.mjs             scripts/seo-ownership-contract.test.mjs             scripts/atlas-mobile-context-control-contract.test.mjs             scripts/atlas-recovery-contract.test.mjs
          npm run build:atlas
          test -f dist/index.html
          node --test scripts/atlas-max-exposure-middleware-runtime.test.mjs
          PRODUCT_JS=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          test -n "$PRODUCT_JS"
          echo "PRODUCT_JS=$PRODUCT_JS" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare authority
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=''
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -z "$candidate" ] || { TOKEN="$candidate"; break; }
          done
          test -n "$TOKEN"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          zone=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=4planetatlas.com&status=active' -H "Authorization: Bearer $TOKEN")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Deploy exact candidate to existing dedicated ATLAS project
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist             --project-name "$PROJECT"             --branch main             --commit-hash "$GITHUB_SHA"             --commit-message "ATLAS MAX EXPOSURE live $GITHUB_SHA"
          echo ATLAS_DEPLOY_SUBMITTED

      - name: Verify custom-domain LIVE
        id: live
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 40); do
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 25 "https://$DOMAIN/" || true)
            places_code=$(curl -sS -o /tmp/places.html -w '%{http_code}' --max-time 25 "https://$DOMAIN/places" || true)
            if [ "$root_code" = '200' ] && [ "$places_code" = '200' ] && grep -Fq "$PRODUCT_JS" /tmp/root.html; then
              count=$(grep -o 'href="/place/[^"]*"' /tmp/places.html | sort -u | wc -l | tr -d ' ')
              if [ "$count" = '250' ]; then ready=true; break; fi
            fi
            sleep 3
          done
          test "$ready" = true

          atlas=$(curl -fsS "https://$DOMAIN/atlas")
          grep -Fq "$PRODUCT_JS" <<<"$atlas"

          for slug in berlin oslo london tokyo nairobi kenya sao-tome; do
            html=$(curl -fsS "https://$DOMAIN/place/$slug")
            grep -Fq "rel=\"canonical\" href=\"https://4planetatlas.com/place/$slug\"" <<<"$html"
            grep -Fq 'data-acquisition-entry="organic-place"' <<<"$html"
            grep -Fq "/atlas/?place=$slug" <<<"$html"
            grep -Fq 'BreadcrumbList' <<<"$html"
          done

          sm=$(curl -fsS "https://$DOMAIN/sitemap.xml")
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = '250'
          test "$(grep -o '<image:loc>https://4planetatlas.com/place/[^<]*/map.svg</image:loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = '250'

          unknown=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' "https://$DOMAIN/place/__max_exposure_unknown__")
          test "$unknown" = '404'
          grep -Fq 'noindex' /tmp/unknown.html
          curl -fsS "https://$DOMAIN/robots.txt" | grep -Fq 'Sitemap: https://4planetatlas.com/sitemap.xml'
          echo ATLAS_MAX_EXPOSURE_LIVE_PASS

      - name: Roll back to protected v43 baseline if live proof fails
        if: failure() && steps.deploy.outcome == 'success' && steps.live.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/atlas-rollback "$BASELINE_SHA"
          cd /tmp/atlas-rollback
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43-rollback
          cp -a /tmp/v43-rollback/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43-rollback/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json
          npm ci
          node scripts/build-atlas-places.mjs
          npm run build:atlas
          npx --yes wrangler@4.128.0 pages deploy dist             --project-name "$PROJECT"             --branch main             --commit-hash "$BASELINE_SHA"             --commit-message "ROLLBACK ATLAS v43 $BASELINE_SHA"
          echo ATLAS_ROLLBACK_DEPLOYED

      - name: Release receipt
        if: always()
        shell: bash
        run: |
          printf '%s\n'             "candidate=$GITHUB_SHA"             "baseline=$BASELINE_SHA"             "domain=https://$DOMAIN"             "project=$PROJECT"             "status=${{ job.status }}" | tee /tmp/atlas-max-exposure-live.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-max-exposure-live-${{ github.sha }}
          path: /tmp/atlas-max-exposure-live.txt
