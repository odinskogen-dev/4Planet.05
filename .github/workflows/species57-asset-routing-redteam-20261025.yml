name: 4SPECIES 57 - investigate V53/V1 JS asset route and hydration (READ-ONLY)
on:
  push:
    branches: [audit/species57-visibility-redteam-20261025]
    paths: [.github/workflows/species57-asset-routing-redteam-20261025.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Compare JS/CSS byte responses for old39 and newer18 by exact hashed script name
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request,urllib.error,json,hashlib,re
          from pathlib import Path
          hosts=["https://4species.com","https://e17e1392.4planet-05.pages.dev","https://de9e3e0e.4planet-05.pages.dev"]
          assets=["/assets/index-DJRRK0k4.js","/assets/index-DLiHR8tZ.js","/assets/index-CQ7FBRNk.css","/assets/jsx-runtime-CdvZGgm7.js"]
          out=[]
          for host in hosts:
            for asset in assets:
              url=host+asset
              try:
                r=urllib.request.Request(url,headers={"User-Agent":"4SPECIES-REDTEAM-HASHED-ASSET-20261025","Cache-Control":"no-cache"})
                with urllib.request.urlopen(r,timeout=35) as x:
                  data=x.read(1800000)
                  d={"host":host,"path":asset,"status":x.status,"type":x.headers.get("Content-Type",""),"bodyBytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"firstText":data[:65].decode("utf-8","replace")}
              except urllib.error.HTTPError as x:
                d={"host":host,"path":asset,"status":x.code,"type":x.headers.get("Content-Type",""),"bodyBytes":None}
              out.append(d)
              print("SPECIES_REDTEAM_ASSET",json.dumps(d),flush=True)
          Path("evidence/assets.json").write_text(json.dumps(out,indent=2))
          PY
      - name: Render koala and orca in real Chromium, capture failed network requests, computed styles and console errors
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/species-asset-check playwright@1.56.0 --no-audit --no-fund
          /tmp/species-asset-check/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {chromium} from "/tmp/species-asset-check/node_modules/playwright/index.mjs";
          const b=await chromium.launch({headless:true});
          const rows=[];
          for(const slug of ["orca","lion","koala","giant-sequoia"]){
            const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            const p=await ctx.newPage(),resources=[],errors=[];
            p.on("response",r=>{if(/assets\/.*\.(js|css)|host-indexing-policy\.js/.test(r.url()))resources.push({url:r.url(),status:r.status(),type:r.headers()["content-type"]});});
            p.on("requestfailed",r=>resources.push({url:r.url(),error:r.failure()?.errorText}));
            p.on("console",m=>{if(m.type()==="error")errors.push(m.text().slice(0,300));});
            p.on("pageerror",e=>errors.push("PAGEERROR:"+String(e).slice(0,300)));
            await p.goto("https://4species.com/"+slug,{waitUntil:"domcontentloaded",timeout:45000});
            await p.waitForTimeout(4000);
            const styles=await p.evaluate(()=>({stylesheets:document.styleSheets.length,bodyFont:getComputedStyle(document.body).fontFamily,h1Font:getComputedStyle(document.querySelector("h1")).fontFamily,prerenderPresent:!!document.querySelector(".spx-prerender"),mainClasses:document.querySelector("#main-content")?.className||"",cssRefs:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>({href:x.href,loaded:!!x.sheet})),title:document.title}));
            await p.screenshot({path:"evidence/"+slug+"-mobile4s.png",animations:"disabled",fullPage:false});
            rows.push({slug,styles,errors,resources});
            console.log("SPECIES_REDTEAM_HYDRATION",JSON.stringify(rows.at(-1)));
            await ctx.close();
          }
          await b.close();
          fs.writeFileSync("evidence/hydration.json",JSON.stringify(rows,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4species57-asset-and-runtime-hydration-proof
          path: evidence/
          retention-days: 30
