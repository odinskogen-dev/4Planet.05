name: TEMP Market cleanup and build
on:
  push:
    branches:
      - axe/market-clean-amalie-20260914
    paths:
      - '.github/workflows/market-cleanup-build-temp.yml'
permissions:
  contents: write
jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove synthetic placeholder artwork only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/v5/ImpactMarketGold.tsx')
          s = p.read_text()
          old = '      <section className="mkt-product-stage">\n        <div className="mkt-art-frame" aria-label="Synthetic abstract artwork fixture">\n          <div className="mkt-art mkt-art-one"><i /><i /><i /></div>\n          <span>DEMO ARTWORK · FIXTURE</span>\n        </div>\n        <div className="mkt-product-copy">'
          new = '      <section className="mkt-product-stage mkt-product-stage--no-art">\n        <div className="mkt-product-copy">'
          assert s.count(old) == 1, 'Expected demo artwork block not found exactly once'
          p.write_text(s.replace(old, new, 1))
          css = Path('src/styles/impact-market-gold.css')
          c = css.read_text()
          rule = '\n.mkt-product-stage--no-art{grid-template-columns:1fr;min-height:auto}.mkt-product-stage--no-art .mkt-product-copy{max-width:1000px;padding:8vw 6vw}\n'
          if '.mkt-product-stage--no-art{' not in c:
              css.write_text(c + rule)
          PY
      - name: Catalogue truth checks
        shell: bash
        run: |
          set -euo pipefail
          test ! -f public/market/odin/fjord-valley-mirror.jpg
          test "$(find public/market/odin -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 5
          test "$(find public/market/amalie -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 6
          if grep -q 'fjord-valley-mirror' src/market/firstCreatorCatalogue.ts; then exit 1; fi
          if grep -q 'Still Water, Two Skies' src/market/firstCreatorCatalogue.ts; then exit 1; fi
          if grep -q 'Synthetic abstract artwork fixture' src/pages/v5/ImpactMarketGold.tsx; then exit 1; fi
          if grep -q 'DEMO ARTWORK · FIXTURE' src/pages/v5/ImpactMarketGold.tsx; then exit 1; fi
          test "$(grep -c 'market:amalie:' src/market/firstCreatorCatalogue.ts)" -eq 6
          grep -q 'Amalie Marie Myrtvedt' src/market/firstCreatorCatalogue.ts
          grep -q 'ART PRINT' src/market/firstCreatorCatalogue.ts
          grep -q 'NOT YET FOR SALE' src/market/firstCreatorCatalogue.ts
      - name: Typecheck and production build
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/market-cleanup-build-temp.yml
          git add src/pages/v5/ImpactMarketGold.tsx src/styles/impact-market-gold.css
          git status --short
          git commit -m '4MARKET: remove demo artwork visual and verify creator catalogue'
          git push origin HEAD:axe/market-clean-amalie-20260914
