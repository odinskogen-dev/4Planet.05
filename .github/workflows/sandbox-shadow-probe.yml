name: Sandbox SHADOW Connectivity Probe

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - ".github/workflows/sandbox-shadow-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json

      - name: Install Factory dependencies
        working-directory: factory
        run: npm install --ignore-scripts

      - name: Bind control token and deploy exact Factory
        working-directory: factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$CONTROL_TOKEN"
          umask 077
          printf '%s' "$CONTROL_TOKEN" > "$RUNNER_TEMP/4planet-sandbox-probe-control-token"
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN
          npx wrangler deploy
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN

      - name: Prove Sandbox through deployed Factory capability rail
        env:
          BASE_URL: https://4planet-production-factory-v01-shadow.odin-skogen.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(cat "$RUNNER_TEMP/4planet-sandbox-probe-control-token")"
          echo "::add-mask::$CONTROL_TOKEN"

          # A newly deployed Container can report "runtime updating" briefly.
          # Retry safely; each runtime attempt is separately budgeted under 25h.
          sleep 45
          READY=false
          for attempt in $(seq 1 6); do
            HTTP_STATUS="$(curl --silent --show-error \
              -o "$RUNNER_TEMP/sandbox-probe.json" \
              -w '%{http_code}' \
              -X POST \
              -H "x-factory-control: $CONTROL_TOKEN" \
              -H "content-type: application/json" \
              "$BASE_URL/__factory/capabilities/sandbox/probe" || true)"

            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]] \
              && jq -e '.ok == true and .usedMinutes <= 20 and .reservation.monthlyHardCapMinutes == 1500' \
                "$RUNNER_TEMP/sandbox-probe.json" >/dev/null 2>&1; then
              READY=true
              break
            fi

            echo "Sandbox probe not ready yet ($attempt/6), HTTP ${HTTP_STATUS:-000}."
            jq -c '{ok,error,runId,reservation,skipped}' "$RUNNER_TEMP/sandbox-probe.json" 2>/dev/null || true
            sleep 30
          done

          if [[ "$READY" != "true" ]]; then
            echo "Sandbox probe did not become ready in bounded retry window."
            exit 1
          fi

          jq -c '{ok,runId,usedMinutes,exitCode,reservation:{monthlyHardCapMinutes:.reservation.monthlyHardCapMinutes,reservedMinutes:.reservation.reservedMinutes}}' \
            "$RUNNER_TEMP/sandbox-probe.json"
          echo "SANDBOX_CONNECTIVITY_PROBE=PASS"
