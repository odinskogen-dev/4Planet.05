name: Living Learning Loop — Live Source Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/sourceRefresh.ts'
      - 'src/data/providers/**'
      - 'scripts/source-learning-loop-*.mjs'
      - 'scripts/source-provider-adapter-runtime.test.mjs'
      - '.github/workflows/source-learning-loop-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gbif-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic learning-loop red team
        run: npm run test:learning-loop
      - name: Check live GBIF source through the real adapter
        run: node scripts/source-learning-loop-live-gbif.mjs
