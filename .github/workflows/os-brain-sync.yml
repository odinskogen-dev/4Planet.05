name: 4PLANET OS Brain Sync
on:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: os-brain-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and sync organizational Brain
        run: |
          node --check scripts/os-brain-sync.mjs
          node scripts/os-brain-sync.mjs
