name: First-party GSC Portfolio Bridge Contract
on:
  push:
    branches: [work/gsc-portfolio-firstparty-20261020]
    paths:
      - ops/discovery/gsc-portfolio/**
      - .github/workflows/gsc-portfolio-contract.yml
  pull_request:
    branches: [king/test]
    paths:
      - ops/discovery/gsc-portfolio/**
      - .github/workflows/gsc-portfolio-contract.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate Google OAuth scopes and owner-portfolio readback contract
        run: node --test ops/discovery/gsc-portfolio/test.mjs
