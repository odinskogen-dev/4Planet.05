name: PSI Phase 05 — BRAIN Postgres Gate

on:
  push:
    branches:
      - agent/psi-phase05-canonical-convergence
  pull_request:
    branches:
      - agent/founder-gate-one-interface-convergence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psi-phase05-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Ensure local Supabase project config
        shell: bash
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start fresh Postgres/PostGIS and apply all migrations
        run: supabase db start

      - name: Reapply migrations from a clean state
        run: supabase db reset

      - name: Locate local database container
        id: db
        shell: bash
        run: |
          name="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          docker exec "$name" psql -U postgres -d postgres -Atc "select version(); select postgis_version();" | tee postgres-version.txt

      - name: Run Phase 05 BRAIN SQL contract tests
        shell: bash
        run: |
          docker cp supabase/tests/phase05_brain_intelligence.sql "${{ steps.db.outputs.name }}:/tmp/phase05.sql"
          docker exec "${{ steps.db.outputs.name }}" psql -U postgres -d postgres -f /tmp/phase05.sql | tee phase05-sql-gate.txt
          grep -q 'PHASE05_BRAIN_INTELLIGENCE_SQL_GATE_PASS' phase05-sql-gate.txt

      - name: Generate canonical schema types
        shell: bash
        run: |
          supabase gen types typescript --local > phase05-schema.gen.ts
          grep -q 'brain_objects' phase05-schema.gen.ts
          grep -q 'claims' phase05-schema.gen.ts
          grep -q 'implementations' phase05-schema.gen.ts

      - name: Database lint
        run: supabase db lint --level warning

      - name: Application typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-phase05-postgres-evidence
          path: |
            postgres-version.txt
            phase05-sql-gate.txt
            phase05-schema.gen.ts
          if-no-files-found: warn
          retention-days: 30
