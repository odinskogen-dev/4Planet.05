name: Closure 07 A Plastic Ocean artwork repair
on:
  push:
    branches: [work/magazine-public-launch-gold-01]
    paths: ['.github/workflows/closure07-fix-a-plastic-ocean.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/magazine-public-launch-gold-01
      - name: Apply exact official-art repair
        run: node .github/closure07-fix-a-plastic-ocean.mjs
      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name '4PLANET LIVE Closure 07'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/magazineFilms.ts
          git commit -m 'FILMS LIVE 07: repair A Plastic Ocean official artwork'
          git push origin HEAD:work/magazine-public-launch-gold-01
