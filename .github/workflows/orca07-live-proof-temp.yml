name: ORCA07 Live Route and CSP Diagnostic
on:
  push:
    branches: [release/wild-orca-07-20261016]
    paths: [.github/workflows/orca07-live-proof-temp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live response
        shell: bash
        run: |
          set -euo pipefail
          echo 'LIVE_HEADERS_BEGIN'
          curl -sSI --max-time 25 'https://4planet.org/games/wild-orca/' | tr -d '\\r' | grep -iE '^HTTP/|^content-security-policy:|^cache-control:' || true
          echo 'LIVE_HEADERS_END'
          echo 'LIVE_RESPONSE_STATUS'
          curl -fsSL --max-time 35 https://4planet.org/games/wild-orca/ -o /tmp/orca07.html
          sha256sum /tmp/orca07.html
          echo 'GAMES_ROUTE_STATUS'
          curl -fsSL --max-time 25 https://4planet.org/games/ -o /tmp/games.html
          grep -oE 'src="/games/[^"]+"' /tmp/games.html | head -n 3 || true
          echo 'ROOT_STATUS'
          curl -sSL --max-time 20 -o /dev/null -w '%{http_code}\n' https://4planet.org/
