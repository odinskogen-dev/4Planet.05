name: ORCA07 Live Header and Hub Diagnosis
on:
  push:
    branches: [release/wild-orca-07-20261016]
    paths: [.github/workflows/orca07-live-proof-temp.yml]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Compare LIVE and preview headers and games wrapper
        shell: bash
        run: |
          set -euo pipefail
          for u in https://4planet.org/games/wild-orca/ https://4planet.org/games/ https://95dcfae7.4planet-05.pages.dev/games/wild-orca/ https://95dcfae7.4planet-05.pages.dev/games/; do
            echo "URL=$u"
            curl -fsSL --max-time 30 -D /tmp/head.txt "$u" -o /tmp/page.html
            echo 'HEADERS'
            head -n 22 /tmp/head.txt | cut -c1-350
            echo 'BODY_SHA'
            sha256sum /tmp/page.html
            echo 'BODY_BEGIN'
            head -c 350 /tmp/page.html | tr '\n' ' ' || true
            echo
            echo 'GAMES_MATCH'
            grep -oE 'src="/games/[^"]+"' /tmp/page.html | head -n 3 || true
          done
