name: Contact Deploy Audit

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/contact-deploy-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit Cloudflare Pages targets
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          zone="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          aid="$(jq -r '.result[0].account.id // empty' <<<"$zone")"
          test -n "$aid"
          projects="$(curl -fsS "${api}/accounts/${aid}/pages/projects" "${auth[@]}")"
          echo "PROJECTS_FOR_TARGET_DOMAINS"
          jq -r '.result[] | select(any(.domains[]?; .=="4planet.org" or .=="4planetmagazine.com" or .=="oddekalv.org")) | [.name, (.production_branch//""), ([.domains[]?]|join(","))] | @tsv' <<<"$projects"
          echo "LATEST_DEPLOYMENTS"
          for p in $(jq -r '.result[] | select(any(.domains[]?; .=="4planet.org" or .=="4planetmagazine.com" or .=="oddekalv.org")) | .name' <<<"$projects"); do
            echo "PROJECT=$p"
            d="$(curl -fsS "${api}/accounts/${aid}/pages/projects/${p}/deployments?page=1&per_page=5" "${auth[@]}")"
            jq -r '.result[]? | [(.environment//""),(.deployment_trigger.metadata.branch//""),(.deployment_trigger.metadata.commit_hash//""),(.latest_stage.status//""),(.created_on//""),(.url//"")] | @tsv' <<<"$d"
          done
