name: Finance Isolated Beta Domain Release
on:
  push:
    branches: [work/finance-id-release-20261008]
    paths:
      - '.github/workflows/finance-beta-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: finance-4planet-beta-domain
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact SHA QA + independent nonproduction preview proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 75); do
            data=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=90")
            qa=$(jq -r '[.workflow_runs[] | select(.name=="Finance MVP Preview QA" and .event=="push")][0].conclusion // "pending"' <<<"$data")
            preview=$(jq -r '[.workflow_runs[] | select(.name=="Finance Premium Visual Preview" and .event=="push")][0].conclusion // "pending"' <<<"$data")
            if [ "$qa" = success ] && [ "$preview" = success ]; then echo 'EXACT_SHA_FINANCE_CI_AND_PREVIEW_PASS'; exit 0; fi
            if [ "$qa" != pending ] && [ "$qa" != success ]; then echo "FINANCE_QA_BLOCKED=$qa"; exit 21; fi
            if [ "$preview" != pending ] && [ "$preview" != success ]; then echo "FINANCE_PREVIEW_BLOCKED=$preview"; exit 22; fi
            sleep 10
          done
          echo 'Exact SHA evidence unavailable'; exit 23
      - name: Read only deployment preflight and existing host guard
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          zone_response=$(curl -fsS "$api/zones?name=4planet.org" "${auth[@]}")
          zone=$(jq -r '.result[0].id // empty' <<<"$zone_response")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone_response")
          test -n "$zone" && test -n "$account"
          echo "ZONE_ID=$zone" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          dns=$(curl -fsS "$api/zones/$zone/dns_records?name=finance.4planet.org" "${auth[@]}")
          [ "$(jq -r '.result | length' <<<"$dns")" = 1 ] || { echo 'Expected single finance-only DNS record'; exit 24; }
          jq -e '[.result[] | select(.type=="CNAME" and .name=="finance.4planet.org" and .content=="4planet-05.pages.dev" and .proxied==true)] | length==1' <<<"$dns" >/dev/null || { echo 'Unexpected finance DNS baseline'; exit 24; }
          preview=$(curl -LsS -D /tmp/finance-preflight-headers -o /tmp/finance-preflight.html -w '%{http_code}' https://7ac99599.4planet-05.pages.dev/finance)
          [ "$preview" = 200 ] && { grep -Eiq '^x-robots-tag:.*noindex' /tmp/finance-preflight-headers || grep -qi noindex /tmp/finance-preflight.html; } || { echo 'Pinned Pages deployment unverified'; exit 25; }
          echo 'ROUTING_BASELINE_PASS_EXISTING_HOSTS_UNCHANGED'
      - name: Deploy isolated read-only Finance edge router
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy --config deploy/finance-router/wrangler.toml --outdir /tmp/finance-router-build
          echo 'FINANCE_ROUTER_CODE_DEPLOYED_NO_OTHER_SITE_EDIT'
      - name: Remote host + noindex + identity entry response
        id: remote
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -D /tmp/finance-headers -o /tmp/finance-home -w '%{http_code}' https://finance.4planet.org/ || true)
            if [ "$code" = 200 ] && grep -Eiq '^x-robots-tag:.*noindex' /tmp/finance-headers && grep -q '<html' /tmp/finance-home; then passed=1; break; fi
            sleep 5
          done
          [ "$passed" = 1 ] || { echo 'FINANCE_DOMAIN_HTTP_NOT_VERIFIED'; exit 27; }
          grep -q "4PLANET FINANCE" /tmp/finance-home || { echo 'Finance title missing'; exit 31; }
          grep -q "family=DM+Sans:wght" /tmp/finance-home || { echo 'DM Sans-only host stylesheet missing'; exit 32; }
          if grep -q "Instrument+Sans" /tmp/finance-home; then echo 'Foreign font on finance host'; exit 33; fi
          code2=$(curl -L -sS -o /tmp/finance-my -w '%{http_code}' https://finance.4planet.org/my || true)
          [ "$code2" = 200 ] || { echo 'FINANCE_PRIVATE_CLIENT_ENTRY_MISSING'; exit 28; }
          echo 'FINANCE_4PLANET_DOMAIN_HTTP_200_NOINDEX=PASS'
          echo 'https://finance.4planet.org/' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore previous finance-only worker if remote check failed
        if: failure() && steps.remote.outcome == 'failure'
        run: |
          set -euo pipefail
          sed -i 's/7ac99599.4planet-05.pages.dev/255d593e.4planet-05.pages.dev/g' deploy/finance-router/src/index.js
          npx --yes wrangler@4.128.0 deploy --config deploy/finance-router/wrangler.toml --outdir /tmp/finance-router-rollback
          echo 'FINANCE_ROUTER_ROLLED_BACK_TO_PREVIOUS_VERIFIED_ORIGIN'
