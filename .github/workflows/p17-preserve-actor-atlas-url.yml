name: P17 preserve Actor Mode URL

on:
  push:
    branches:
      - build/p17-organisations-discovery-scale-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/p17-organisations-discovery-scale-gate
          fetch-depth: 0
      - name: Preserve Actor Mode URL context
        run: python scripts/p17-preserve-actor-atlas-url.py
      - name: Commit bounded URL contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/earth/World.tsx
          if git diff --cached --quiet; then
            echo "No patch required"
          else
            git commit -m "fix(p17): preserve Actor Mode identity in ATLAS URL"
            git push origin HEAD:build/p17-organisations-discovery-scale-gate
          fi
