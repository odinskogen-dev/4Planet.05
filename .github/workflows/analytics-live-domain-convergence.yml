name: Analytics Live Domain Convergence

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/analytics-live-domain-convergence.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CF_ACCOUNT_ID: d53c17b06219066a0325eec01c21729e

jobs:
  converge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Wait for analytics-ready branch aliases
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/analytics-convergence.md
          echo '# Analytics live-domain convergence' > "$report"
          echo >> "$report"

          has_ga_bundle() {
            local host="$1"
            local html asset
            html="$(curl -fsS "https://${host}/")" || return 1
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if curl -fsS "https://${host}${asset}" | grep -q 'G-Q79Y9HJRL8'; then
                return 0
              fi
            done < <(printf '%s' "$html" | grep -Eo 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | grep '^/' | sort -u)
            return 1
          }

          wait_ready() {
            local host="$1"
            for i in $(seq 1 48); do
              csp="$(curl -fsSI "https://${host}/" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/ {sub(/^[^:]+:[[:space:]]*/,""); print; exit}' || true)"
              if [[ "$csp" == *googletagmanager.com* && "$csp" == *google-analytics.com* ]] && has_ga_bundle "$host"; then
                echo "- ${host}: analytics bundle + CSP **PASS**" >> "$report"
                return 0
              fi
              sleep 5
            done
            echo "- ${host}: analytics bundle/CSP **FAIL**" >> "$report"
            return 1
          }

          wait_ready recovery-testking-magazine.4planet-05.pages.dev
          wait_ready recovery-testking-cre4tors.4planet-05.pages.dev
          wait_ready recovery-testking-market.4planet-05.pages.dev

      - name: Point CRE4TORS and MARKET Workers at moving recovery aliases
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts"
          report=/tmp/analytics-convergence.md

          update_worker() {
            local service="$1" old="$2" new="$3"
            local src="/tmp/${service}.js" headers="/tmp/${service}.headers" out="/tmp/${service}.new.js"
            curl -fsS -D "$headers" -o "$src" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${service}"
            ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
            case "$ct" in
              application/javascript*|text/javascript*) ;;
              *) echo "Refusing to rewrite ${service}: unsupported Content-Type ${ct}" >&2; exit 1 ;;
            esac
            count="$(grep -Fo "$old" "$src" | wc -l | tr -d ' ')"
            if [[ "$count" != "1" ]]; then
              echo "Refusing to rewrite ${service}: expected exactly one ${old}, found ${count}" >&2
              exit 1
            fi
            python3 - "$src" "$out" "$old" "$new" <<'PY'
import pathlib, sys
src, out, old, new = sys.argv[1:]
text = pathlib.Path(src).read_text()
if text.count(old) != 1:
    raise SystemExit('origin count changed during rewrite')
pathlib.Path(out).write_text(text.replace(old, new))
PY
            curl -fsS -X PUT "${api}/${service}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: ${ct}" \
              --data-binary "@${out}" >/tmp/${service}.put.json
            success="$(jq -r '.success // false' /tmp/${service}.put.json 2>/dev/null || echo false)"
            [[ "$success" == "true" ]] || { cat /tmp/${service}.put.json >&2; exit 1; }
            verify="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${service}")"
            [[ "$verify" == *"$new"* ]] || { echo "Worker ${service} verification failed" >&2; exit 1; }
            echo "- ${service}: origin moved to \`${new}\` **PASS**" >> "$report"
          }

          update_worker cre4tors-prototype b8a8f6c1.4planet-05.pages.dev recovery-testking-cre4tors.4planet-05.pages.dev
          update_worker 4planetmarket-prototype 4482f621.4planet-05.pages.dev recovery-testking-market.4planet-05.pages.dev

      - name: Verify live domains expose analytics-ready application
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/analytics-convergence.md
          for host in 4planetmagazine.com cre4tors.com 4planetmarket.com; do
            ok=0
            for i in $(seq 1 24); do
              html="$(curl -fsS "https://${host}/" || true)"
              if [[ -n "$html" ]]; then
                asset="$(printf '%s' "$html" | grep -Eo 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | grep '^/' | head -n1 || true)"
                csp="$(curl -fsSI "https://${host}/" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-security-policy:/ {sub(/^[^:]+:[[:space:]]*/,""); print; exit}' || true)"
                if [[ -n "$asset" ]] && curl -fsS "https://${host}${asset}" | grep -q 'G-Q79Y9HJRL8' \
                  && [[ "$csp" == *googletagmanager.com* && "$csp" == *google-analytics.com* ]]; then
                  ok=1; break
                fi
              fi
              sleep 5
            done
            if [[ "$ok" == 1 ]]; then
              echo "- https://${host}: live analytics code + CSP **PASS**" >> "$report"
            else
              echo "- https://${host}: live analytics code/CSP **FAIL**" >> "$report"
              exit 1
            fi
          done

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report=/tmp/analytics-convergence.md
          [[ -f "$report" ]] || printf '# Analytics live-domain convergence\n\nResult: **FAIL before report**\n' > "$report"
          gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body-file "$report"
