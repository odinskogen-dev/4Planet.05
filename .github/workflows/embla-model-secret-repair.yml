name: 4SAPIEN Embla model secret repair

on:
  push:
    branches: [build/embla-core-20260914]
    paths:
      - '.github/workflows/embla-model-secret-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: ghvdzetmplqkdtfqiror

jobs:
  repair-model-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check and repair Embla model secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 31; }
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" > /tmp/secrets.txt
          if grep -Eq '(^|[[:space:]])OPENAI_API_KEY([[:space:]]|$)' /tmp/secrets.txt; then
            echo 'SUPABASE_OPENAI_SECRET_PRESENT'
            exit 0
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'OPENAI_KEY_MISSING_BOTH_GITHUB_AND_SUPABASE'
            exit 42
          fi
          npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" OPENAI_API_KEY="$OPENAI_API_KEY" >/dev/null
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" > /tmp/secrets-after.txt
          grep -Eq '(^|[[:space:]])OPENAI_API_KEY([[:space:]]|$)' /tmp/secrets-after.txt || { echo 'OPENAI_SECRET_SET_VERIFY_FAILED'; exit 43; }
          echo 'SUPABASE_OPENAI_SECRET_REPAIRED'
