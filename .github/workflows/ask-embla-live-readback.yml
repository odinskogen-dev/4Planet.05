name: 4SAPIEN One Product live readback

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - '.github/workflows/ask-embla-live-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE

jobs:
  live-readback:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live public front and security headers
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/headers.txt -H 'Sec-Fetch-Mode: navigate' https://4sapien.com/ -o /tmp/root.html
          grep -q 'See your life clearly.' /tmp/root.html
          grep -q 'illustrative demo' /tmp/root.html
          grep -q '/app/food/' /tmp/root.html
          grep -q '/app/money/' /tmp/root.html
          grep -q '#2E2EFF' /tmp/root.html
          grep -q '#0A0A0A' /tmp/root.html
          ! grep -Eqi 'service[_-]?role|sb_secret_|KASSALAPP_API_KEY|KASSALAPP_TOKEN' /tmp/root.html
          grep -Eqi '^permissions-policy:.*camera=\(self\)' /tmp/headers.txt || { echo 'HEADER_FAIL: permissions-policy camera'; cat /tmp/headers.txt; exit 24; }
          grep -Eqi '^content-security-policy:.*ghvdzetmplqkdtfqiror\.supabase\.co' /tmp/headers.txt || { echo 'HEADER_FAIL: content-security-policy supabase'; cat /tmp/headers.txt; exit 25; }

      - name: Verify live Food and Money surfaces
        run: |
          set -euo pipefail
          curl -fsS -H 'Sec-Fetch-Mode: navigate' https://4sapien.com/app/food/ -o /tmp/food.html
          grep -q 'Ask Embla' /tmp/food.html
          grep -q 'four_sapien_profiles' /tmp/food.html
          grep -q 'four_sapien_meal_plans' /tmp/food.html
          grep -q 'functions/v1/embla-products' /tmp/food.html
          curl -fsS -H 'Sec-Fetch-Mode: navigate' https://4sapien.com/app/money/ -o /tmp/money.html
          grep -q '<title>4SAPIEN Finance — Embla</title>' /tmp/money.html
          grep -q 'four_sapien_finance_accounts' /tmp/money.html
          grep -q 'four_sapien_finance_events' /tmp/money.html
          grep -q 'four-sapien-finance-docs' /tmp/money.html
          ! grep -Eqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' /tmp/food.html /tmp/money.html

      - name: Verify Food and Embla gateways reject unauthenticated calls
        run: |
          set -euo pipefail
          for fn in embla-products embla-core-preview; do
            code=$(curl -sS -o "/tmp/${fn}.json" -w '%{http_code}' -X POST \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H 'Content-Type: application/json' \
              --data '{"q":"yoghurt","message":"hello"}' \
              "${SUPABASE_URL}/functions/v1/${fn}" || true)
            test "$code" = "401" || { echo "LIVE_${fn}_UNAUTH_FAIL HTTP=${code}"; cat "/tmp/${fn}.json"; exit 26; }
          done
