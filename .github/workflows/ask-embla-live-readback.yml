name: 4SAPIEN Ask Embla live readback

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - '.github/workflows/ask-embla-live-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE

jobs:
  live-readback:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live production payload and headers
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/headers.txt -H 'Sec-Fetch-Mode: navigate' https://4sapien.com -o /tmp/live.html
          check(){ grep -q "$1" /tmp/live.html || { echo "MISSING_LIVE_MARKER: $1"; exit 21; }; }
          check 'Ask Embla'
          check '4SAPIEN by 4PLANET'
          check '4PLANET ID · INNLOGGET'
          check 'Fullfør 4SAPIEN-profilen din.'
          check 'LIST_HYDRATE_FAILED'
          check 'SHOPS_HYDRATE_FAILED'
          check 'functions/v1/embla-products'
          check 'RATE_LIMITED'
          check '4PLANET ID – innlogget'
          if grep -q 'S4PIENS' /tmp/live.html; then echo 'FORBIDDEN_LIVE_MARKER: S4PIENS'; exit 22; fi
          if grep -Eqi 'service[_-]?role|sb_secret_|KASSALAPP_API_KEY|KASSALAPP_TOKEN' /tmp/live.html; then echo 'FORBIDDEN_BROWSER_SECRET_MARKER'; exit 23; fi
          grep -Eqi '^permissions-policy:.*camera=\(self\)' /tmp/headers.txt || { echo 'HEADER_FAIL: permissions-policy camera'; cat /tmp/headers.txt; exit 24; }
          grep -Eqi '^content-security-policy:.*ghvdzetmplqkdtfqiror\.supabase\.co' /tmp/headers.txt || { echo 'HEADER_FAIL: content-security-policy supabase'; cat /tmp/headers.txt; exit 25; }
          python - <<'PY'
          import hashlib, pathlib
          b=pathlib.Path('/tmp/live.html').read_bytes()
          print('LIVE_BYTES',len(b))
          print('LIVE_SHA256',hashlib.sha256(b).hexdigest())
          PY

      - name: Verify live product gateway rejects unauthenticated calls before data access
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/gateway.json -w '%{http_code}' -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"q":"yoghurt"}' \
            "${SUPABASE_URL}/functions/v1/embla-products" || true)
          test "$code" = "401" || { echo "LIVE_GATEWAY_UNAUTH_FAIL HTTP=${code}"; cat /tmp/gateway.json; exit 26; }
          grep -Eq 'UNAUTHENTICATED|Invalid JWT|Missing authorization' /tmp/gateway.json || { echo 'LIVE_GATEWAY_401_BODY_UNEXPECTED'; cat /tmp/gateway.json; exit 27; }
          echo "LIVE_GATEWAY_UNAUTH_HTTP=${code}"
