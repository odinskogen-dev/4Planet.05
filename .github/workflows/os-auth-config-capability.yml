name: 4PLANET OS auth-configuration scoped capability probe
on:
  push:
    branches: [labs/overview-v1]
    paths: [.github/workflows/os-auth-config-capability.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_API_TOKEN: ${{ secrets.SUPABASE_API_TOKEN }}
      SUPABASE_PERSONAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
      FACTORY_SUPABASE_TOKEN: ${{ secrets.FACTORY_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check exact scoped management-token availability without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_MANAGEMENT_TOKEN SUPABASE_PAT SUPABASE_API_TOKEN SUPABASE_PERSONAL_ACCESS_TOKEN FACTORY_SUPABASE_TOKEN SUPABASE_TOKEN; do
            if [[ -n "${!name:-}" ]]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
