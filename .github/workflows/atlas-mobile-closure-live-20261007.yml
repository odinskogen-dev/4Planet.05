name: ATLAS Mobile Closure LIVE

on:
  push:
    branches: [king/test]
    paths:
      - ".github/workflows/atlas-mobile-closure-live-20261007.yml"
      - "docs/control/ATLAS_LIVE_RELEASE_20261007.json"
      - "scripts/atlas-recovery-contract.test.mjs"
      - "scripts/atlas-mobile-human-performance-contract.test.mjs"

permissions:
  contents: read

concurrency:
  group: atlas-mobile-closure-live-20261007
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_FILE: docs/control/ATLAS_LIVE_RELEASE_20261007.json
      ATLAS_DOMAIN: 4planetatlas.com
      PAGES_PROJECT: 4planet-05
      PREVIEW_BRANCH: atlas-live-20261007
      ROUTER_SERVICE: atlas-live-router-20261007
    steps:
      - name: Checkout exact authorised HEIR artifact
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Founder-scoped release authority
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status=="FOUNDER_AUTHORISED" and .scope=="ATLAS_ONLY" and .sourceBranch=="king/test" and .requiredDomain=="4planetatlas.com"' "$RELEASE_FILE" >/dev/null
          echo "ATLAS_RELEASE_AUTHORITY_PASS sha=$GITHUB_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve Cloudflare token and Atlas zone
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && { TOKEN="$candidate"; break; }
          done
          [ -n "$TOKEN" ] || { echo "No Cloudflare token"; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          echo "::add-mask::$TOKEN"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          zone=$(curl -fsS "${api}/zones?name=$ATLAS_DOMAIN&status=active" "${auth[@]}")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$zone_id" ] && [ -n "$account_id" ] || { echo "ATLAS zone/account unresolved"; exit 3; }
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "ATLAS_ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Prove existing Atlas routing is rollback-safe
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          routes=$(curl -fsS "${api}/zones/${ATLAS_ZONE_ID}/workers/routes" "${auth[@]}")
          existing=$(jq -c --arg d "$ATLAS_DOMAIN" '[.result[]? | select(.pattern==($d+"/*") or .pattern==("*."+$d+"/*"))]' <<<"$routes")
          count=$(jq 'length' <<<"$existing")
          if [ "$count" -gt 0 ]; then
            echo "Existing Worker route already owns Atlas; refusing to overwrite without reconciliation:"
            jq . <<<"$existing"
            exit 4
          fi
          projects=$(curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" "${auth[@]}")
          jq -e --arg p "$PAGES_PROJECT" '.result[]? | select(.name==$p)' <<<"$projects" >/dev/null
          production=$(curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?env=production&page=1&per_page=1" "${auth[@]}")
          previous_sha=$(jq -r '.result[0].deployment_trigger.metadata.commit_hash // empty' <<<"$production")
          previous_url=$(jq -r '.result[0].url // empty' <<<"$production")
          echo "ATLAS_PREVIOUS_SHARED_PRODUCTION_SHA=$previous_sha" >> "$GITHUB_ENV"
          echo "ATLAS_PREVIOUS_SHARED_PRODUCTION_URL=$previous_url" >> "$GITHUB_ENV"
          echo "ATLAS_ROUTE_ISOLATION_PASS shared_production_will_not_move previous_sha=$previous_sha"

      - name: Install exact dependencies
        run: npm ci

      - name: ATLAS static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/atlas-mobile-human-performance-contract.test.mjs \
            scripts/atlas-recovery-contract.test.mjs \
            scripts/atlas-search-discovery-contract.test.mjs \
            scripts/atlas-source-bridge-contract.test.mjs \
            scripts/atlas-mobile-context-control-contract.test.mjs

      - name: Typecheck and exact production build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          grep -R -Fq 'data-atlas-mobile-closure' dist/assets
          echo "ATLAS_BUILD_PASS"

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start exact local preview
        shell: bash
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/atlas-preview.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173/atlas >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/atlas-preview.log
          exit 7

      - name: Mobile viewport and surface proof before LIVE
        shell: bash
        run: |
          xvfb-run -a node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';
          const cases = [
            { name: 'chromium', engine: chromium, launch: { headless: false, args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'] }, interactiveRequired: true },
            { name: 'webkit', engine: webkit, launch: {}, interactiveRequired: false },
          ];
          for (const item of cases) {
            const browser = await item.engine.launch(item.launch);
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/atlas', { waitUntil: 'domcontentloaded' });
            const world = page.locator('.world[data-atlas-mobile-closure="v1"]');
            const interactive = await world.isVisible().catch(() => false);
            if (!interactive) {
              if (item.interactiveRequired) throw new Error(item.name + ' did not expose interactive ATLAS');
              await page.getByText('The living planet needs a capable canvas.').waitFor({ timeout: 15000 });
              const fallbackOverflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
              if (fallbackOverflow > 1) throw new Error('WebKit fallback creates horizontal overflow');
              await browser.close();
              continue;
            }
            await page.locator('.maplibregl-canvas').waitFor({ timeout: 30000 });
            const geometry = await page.evaluate(() => {
              const world = document.querySelector('.world')?.getBoundingClientRect();
              const canvas = document.querySelector('.maplibregl-canvas')?.getBoundingClientRect();
              return { iw: innerWidth, ih: innerHeight, sw: document.documentElement.scrollWidth, world, canvas };
            });
            if (!geometry.world || geometry.sw > geometry.iw + 1 || geometry.world.width > geometry.iw + 1 || geometry.world.height < geometry.ih - 3) throw new Error('Mobile map viewport is clipped or overflowing');
            const input = page.locator('.search-line input');
            await input.focus();
            await input.fill('orca');
            await page.locator('.world.search-active').waitFor();
            const savedVisibility = await page.locator('.atlas-saved-views').evaluate(el => getComputedStyle(el).visibility);
            if (savedVisibility !== 'hidden') throw new Error('My Atlas competes with Search');
            await page.locator('.search-exit').click();
            await page.locator('.atlas-panel .sect').first().click();
            await page.locator('.world.layers-active').waitFor();
            await page.locator('.atlas-panel .sect').first().click();
            await page.locator('.atlas-saved-toggle').click();
            await page.locator('.atlas-saved-views.open').waitFor();
            if ((await page.evaluate(() => document.documentElement.scrollWidth - innerWidth)) > 1) throw new Error('My Atlas creates horizontal overflow');
            if (pageErrors.length) throw new Error('Page errors: ' + pageErrors.join(' | '));
            await browser.close();
          }
          console.log('ATLAS_MOBILE_PRELIVE_PROOF_PASS');
          NODE

      - name: Deploy exact HEIR build as non-production Pages preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "ATLAS isolated live origin $GITHUB_SHA"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          preview_url=""
          for i in $(seq 1 30); do
            deployments=$(curl -fsS "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?page=1&per_page=25" "${auth[@]}")
            preview_url=$(jq -r --arg sha "$GITHUB_SHA" --arg br "$PREVIEW_BRANCH" '[.result[]? | select(.deployment_trigger.metadata.commit_hash==$sha and .deployment_trigger.metadata.branch==$br and .latest_stage.status=="success")][0].url // empty' <<<"$deployments")
            [ -n "$preview_url" ] && break
            sleep 3
          done
          [ -n "$preview_url" ] || { echo "Exact preview deployment not found"; exit 8; }
          echo "ATLAS_PREVIEW_ORIGIN=$preview_url" >> "$GITHUB_ENV"
          echo "ATLAS_EXACT_PREVIEW_PASS $preview_url"

      - name: Verify exact preview before routing public traffic
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 25 -o /tmp/atlas-preview-origin.html -w '%{http_code}' "$ATLAS_PREVIEW_ORIGIN/")
          test "$code" = "200"
          xvfb-run -a node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: false, args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'] });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await page.goto(process.env.ATLAS_PREVIEW_ORIGIN + '/atlas', { waitUntil: 'domcontentloaded' });
          await page.locator('.world[data-atlas-mobile-closure="v1"]').waitFor({ timeout: 30000 });
          await page.locator('.maplibregl-canvas').waitFor({ timeout: 30000 });
          await browser.close();
          console.log('ATLAS_EXACT_PREVIEW_BROWSER_PASS');
          NODE

      - name: Route only 4planetatlas.com to exact preview origin
        id: route
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          cat > /tmp/atlas-router.js <<EOF
          const ORIGIN = "${ATLAS_PREVIEW_ORIGIN}";
          addEventListener("fetch", event => event.respondWith(handle(event.request)));
          async function handle(request) {
            const incoming = new URL(request.url);
            const target = new URL(incoming.pathname + incoming.search, ORIGIN);
            const response = await fetch(new Request(target.toString(), request));
            const headers = new Headers(response.headers);
            headers.set("x-4planet-atlas-release", "${GITHUB_SHA}");
            return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
          }
          EOF
          upload=$(curl -fsS -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ROUTER_SERVICE}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/javascript" \
            --data-binary @/tmp/atlas-router.js)
          jq -e '.success==true' <<<"$upload" >/dev/null
          route=$(curl -fsS -X POST "${api}/zones/${ATLAS_ZONE_ID}/workers/routes" "${auth[@]}" \
            --data "$(jq -nc --arg p "$ATLAS_DOMAIN/*" --arg s "$ROUTER_SERVICE" '{pattern:$p,script:$s}')")
          jq -e '.success==true' <<<"$route" >/dev/null
          route_id=$(jq -r '.result.id // empty' <<<"$route")
          [ -n "$route_id" ] || exit 9
          echo "ATLAS_WORKER_ROUTE_ID=$route_id" >> "$GITHUB_ENV"
          echo "ATLAS_DOMAIN_ROUTE_CREATED route_id=$route_id"

      - name: Verify ATLAS LIVE on iPhone-sized Chromium and WebKit
        id: liveproof
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            headers=$(curl -sSI --max-time 20 "https://$ATLAS_DOMAIN/" | tr -d '\r' || true)
            grep -qi "^x-4planet-atlas-release: $GITHUB_SHA$" <<<"$headers" && break
            sleep 3
          done
          grep -qi "^x-4planet-atlas-release: $GITHUB_SHA$" <<<"$headers"
          xvfb-run -a node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';
          const cases = [
            { name: 'chromium', engine: chromium, launch: { headless: false, args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'] }, interactiveRequired: true },
            { name: 'webkit', engine: webkit, launch: {}, interactiveRequired: false },
          ];
          for (const item of cases) {
            const browser = await item.engine.launch(item.launch);
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('https://4planetatlas.com/', { waitUntil: 'domcontentloaded' });
            const world = page.locator('.world[data-atlas-mobile-closure="v1"]');
            const interactive = await world.isVisible().catch(() => false);
            if (!interactive) {
              if (item.interactiveRequired) throw new Error(item.name + ' did not expose interactive LIVE ATLAS');
              await page.getByText('The living planet needs a capable canvas.').waitFor({ timeout: 15000 });
              if ((await page.evaluate(() => document.documentElement.scrollWidth - innerWidth)) > 1) throw new Error('LIVE WebKit fallback overflow');
              await browser.close();
              continue;
            }
            await page.locator('.maplibregl-canvas').waitFor({ timeout: 30000 });
            const g = await page.evaluate(() => {
              const w = document.querySelector('.world')?.getBoundingClientRect();
              return { iw: innerWidth, ih: innerHeight, sw: document.documentElement.scrollWidth, w };
            });
            if (!g.w || g.sw > g.iw + 1 || g.w.width > g.iw + 1 || g.w.height < g.ih - 3) throw new Error('LIVE viewport failure');
            const input = page.locator('.search-line input');
            await input.focus();
            await input.fill('orca');
            await page.locator('.world.search-active').waitFor();
            await page.locator('.search-exit').click();
            await page.locator('.atlas-saved-toggle').click();
            await page.locator('.atlas-saved-views.open').waitFor();
            await browser.close();
          }
          console.log('ATLAS_LIVE_MOBILE_PROOF_PASS');
          NODE

      - name: Roll back route automatically if LIVE proof fails
        if: failure() && steps.route.outcome == 'success' && steps.liveproof.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          curl -fsS -X DELETE "${api}/zones/${ATLAS_ZONE_ID}/workers/routes/${ATLAS_WORKER_ROUTE_ID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null || true
          curl -fsS -X DELETE "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${ROUTER_SERVICE}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null || true
          echo "ATLAS_ROUTE_ROLLED_BACK"

      - name: Record release facts
        if: always()
        shell: bash
        run: |
          {
            echo "ATLAS_RELEASE_SHA=$GITHUB_SHA"
            echo "ATLAS_DOMAIN=$ATLAS_DOMAIN"
            echo "ATLAS_EXACT_PREVIEW=${ATLAS_PREVIEW_ORIGIN:-UNRESOLVED}"
            echo "ATLAS_PREVIOUS_SHARED_PRODUCTION_SHA=${ATLAS_PREVIOUS_SHARED_PRODUCTION_SHA:-UNRESOLVED}"
            echo "ATLAS_WORKER_ROUTE_ID=${ATLAS_WORKER_ROUTE_ID:-UNRESOLVED}"
            echo "ATLAS_RELEASE_STATUS=${{ job.status }}"
          } | tee /tmp/atlas-release-facts.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-mobile-closure-live-${{ github.sha }}
          path: |
            /tmp/atlas-release-facts.txt
            /tmp/atlas-preview.log
