name: ORCA pixel quality audit - no deployment
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/orca-pixel-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect exact live ORCA bytes without mutation
        shell: bash
        run: |
          set -euo pipefail
          printf 'REPO_ORCA_SHA256='; sha256sum public/games/wild-orca/index.html
          curl -sSL --max-time 40 https://4planet.org/games/wild-orca/ -o /tmp/live-orca.html
          printf 'DIRECT_ORCA_SHA256='; sha256sum /tmp/live-orca.html
          printf 'DIRECT_ORCA_HEADER\n'; curl -sSI https://4planet.org/games/wild-orca/ | head -30
          printf 'PORTAL_ORCA_HEADER\n'; curl -sSI https://4planet.org/games | head -20
          python3 - <<'PY'
          import pathlib,re,json
          s=pathlib.Path('public/games/wild-orca/index.html').read_text(errors='replace')
          needles=['setPixelRatio(', 'devicePixelRatio', 'renderScale', 'quality', 'localStorage', 'viewport', 'cf-polished','rocket-loader']
          for q in needles:
            m=re.search(re.escape(q),s,re.I)
            if m:print('ORCA_SOURCE_HIT',q,m.start(),s[max(0,m.start()-110):m.start()+240].replace('\n',' ')[:370])
          print('ORCA_SOURCE_LENGTH',len(s))
          portal='https://4planet.org/games'
          PY
      - name: Install mobile browser
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Compare mobile rendering at direct and iframe URLs
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const urls=[['direct','https://4planet.org/games/wild-orca/'],['portal_iframe','https://4planet.org/games']];
            for(const [label,url] of urls){
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:55000});
              await page.waitForTimeout(2000);
              const state=await page.evaluate(()=>({pixelRatio:devicePixelRatio,iframes:[...document.querySelectorAll('iframe')].map(x=>({src:x.src,width:x.clientWidth,height:x.clientHeight})),canvas:[...document.querySelectorAll('canvas')].map(x=>({width:x.width,height:x.height,clientWidth:x.clientWidth,clientHeight:x.clientHeight})),scale:getComputedStyle(document.body).transform,localQuality:localStorage.getItem('quality')}));
              console.log('ORCA_LIVE_AUDIT',label,response.status(),JSON.stringify(state),'js_errors',JSON.stringify(errors));
              if(page.frames().length>1){for(const fr of page.frames().slice(1)){const z=await fr.evaluate(()=>({ratio:devicePixelRatio,canvas:[...document.querySelectorAll('canvas')].map(x=>({width:x.width,height:x.height,clientWidth:x.clientWidth,clientHeight:x.clientHeight}))})).catch(e=>({error:String(e)}));console.log('ORCA_IFRAME_GAME',label,JSON.stringify(z));}}
              await page.screenshot({path:'orca-'+label+'-mobile.png',fullPage:true});
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-pixel-audit-screenshots
          path: orca-*-mobile.png
          retention-days: 14
