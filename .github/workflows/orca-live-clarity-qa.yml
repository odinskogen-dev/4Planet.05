name: WILD ORCA live clarity Chrome QA
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/orca-live-clarity-qa.yml]
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Real deployed mobile canvas and game smoke test
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            for(const [name,url,minWidth] of [
              ['high','https://4planet.org/games/wild-orca/?q=high',770],
              ['standard','https://4planet.org/games/wild-orca/',620],
              ['portal','https://4planet.org/games',620]
            ]){
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
              const page=await context.newPage();let errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:65000});
              await page.waitForTimeout(1800);
              const stage=page.frames().length>1?page.frames()[1]:page.mainFrame();
              const canvases=await stage.evaluate(()=>[...document.querySelectorAll('canvas')].map(c=>({width:c.width,height:c.height,cssWidth:c.clientWidth,cssHeight:c.clientHeight})));
              console.log('LIVE_ORCA_MODE',name,'HTTP',response.status(),'CANVAS',JSON.stringify(canvases),'PAGE_ERRORS',JSON.stringify(errors));
              if(response.status()!==200||!canvases.length||canvases[0].width<minWidth||errors.length)throw Error('ORCA_LIVE_MOBILE_QA_FAILED: '+name);
              await page.screenshot({path:'orca-live-'+name+'.png',fullPage:true});
              await context.close();
            }
            await browser.close();console.log('ORCA_LIVE_MOBILE_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-live-mobile-sharpness
          path: orca-live-*.png
          retention-days: 14
