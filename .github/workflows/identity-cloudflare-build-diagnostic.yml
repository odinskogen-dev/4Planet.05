name: 4PLANET ID Cloudflare Build Diagnostic

on:
  pull_request:
    paths: ['.github/workflows/identity-cloudflare-build-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read production release state and safe build errors
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          api=https://api.cloudflare.com/client/v4
          zone=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api/zones?name=4planet.org")
          account=$(jq -r '.result[0].account.id' <<< "$zone")
          dep=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api/accounts/$account/pages/projects/4planet-05/deployments?env=production&page=1&per_page=3")
          echo '--- RELEASES ---'
          jq -r '.result[]? | [.id,.deployment_trigger.metadata.commit_hash,.latest_stage.name,.latest_stage.status] | @tsv' <<< "$dep"
          id=$(jq -r '.result[0].id' <<< "$dep")
          echo '--- LATEST STAGES ---'
          jq -r '.result[0].stages[]? | [.name,.status,(.started_on // "") ,(.ended_on // "")] | @tsv' <<< "$dep"
          echo '--- SAFE BUILD SUMMARY ---'
          response=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api/accounts/$account/pages/projects/4planet-05/deployments/$id/history/logs" || true)
          jq -r '.result.data[]?.line? | select(test("build|success|failed|error|finish|deploy|timeout";"i")) | .[0:170]' <<< "$response" | tail -n 28 || true
