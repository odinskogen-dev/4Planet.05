name: Main Security Closure QA
on:
  pull_request:
    branches: [main]
    paths:
      - src/identity/identityClient.ts
      - src/analytics/Analytics.tsx
      - scripts/identity-oauth-contract.test.mjs
      - scripts/analytics-privacy-contract.test.mjs
      - .github/workflows/main-security-closure-qa.yml
      - .github/workflows/discovery-main-live.yml
permissions: { contents: read }
jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/identity-oauth-contract.test.mjs scripts/analytics-privacy-contract.test.mjs
      - run: npm run typecheck
      - run: node scripts/security-secret-scan.mjs
      - run: npm run build
      - name: Verify safe production bundle contains explicit URL sanitation
        run: |
          grep -Rl 'analytics_storage' dist/assets/ >/dev/null
          test -f dist/sitemap.xml
