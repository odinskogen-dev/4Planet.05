name: IMPACT LIVE Data Proof — Multisprint 01

on:
  push:
    branches:
      - qa/impact-live-multisprint-01-20261019

permissions:
  contents: read

jobs:
  prove-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://4planet.org
      EXPECTED_BUILD_SHA: 63526e3557caeb1dffe7ebdba175f4863e8ae2e6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record canonical LIVE build identity when exposed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --connect-timeout 10 --max-time 30 "$BASE_URL/impact" | tr -d '\r' | tee live-headers.txt
          body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE_URL/impact-build.json" || true)
          printf '%s\n' "$body" > live-build-response.txt
          if printf '%s\n' "$body" | grep -q "\"sha\":"; then
            printf '%s\n' "$body" | tee live-build.json
            printf '%s\n' "$body" | grep -q "\"sha\": \"$EXPECTED_BUILD_SHA\""
            echo "BUILD_IDENTITY=VERIFIED" | tee live-build-state.txt
          else
            echo "BUILD_IDENTITY=NOT_EXPOSED_ON_CANONICAL_LIVE" | tee live-build-state.txt
          fi

      - name: Compare canonical LIVE with immutable approved IMPACT release
        shell: bash
        run: |
          mkdir -p artifacts/impact-live
          cat > impact-live-proof.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const surfaces = [
            ["canonical","https://4planet.org"],
            ["approved_immutable","https://c2cb9671.4planet-05.pages.dev"]
          ];
          const issues = [
            ["biodiversity-loss","Biodiversity loss"],
            ["deforestation","Deforestation"],
            ["overfishing","Overfishing"],
            ["coral-bleaching-and-mortality","Coral bleaching and mortality"],
            ["fossil-carbon-dioxide-emissions","Fossil carbon dioxide emissions"],
            ["methane-emissions","Methane emissions"],
            ["water-scarcity","Water scarcity"],
            ["food-waste","Food waste"],
            ["high-resource-extraction","High resource extraction"],
            ["short-lived-electronics-and-e-waste","Short-lived electronics and e-waste"],
            ["air-pollution","Air pollution"],
            ["plastic-and-microplastic-pollution","Plastic and microplastic pollution"],
            ["finance-for-nature-negative-activity","Finance for nature-negative activity"],
            ["poor-cross-system-coordination","Poor cross-system coordination"]
          ];
          const browser=await chromium.launch();
          const out=[];
          for (const [surface,base] of surfaces) {
            for (const [width,height] of [[390,844],[1440,900]]) {
              const page=await browser.newPage({viewport:{width,height},isMobile:width<500,hasTouch:width<500});
              await page.goto(base+"/impact",{waitUntil:"networkidle",timeout:60000});
              await page.waitForTimeout(1000);
              const home=await page.evaluate(()=>({
                h1:document.querySelector("h1")?.textContent?.trim(),
                text:document.body.innerText,
                projectTiles:document.querySelectorAll(".iu-section--index .iu-tile").length,
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                sections:[...document.querySelectorAll("h2")].map(x=>x.textContent?.trim()).filter(Boolean).slice(0,20)
              }));
              out.push({surface,width,route:"/impact",...home});
              await page.screenshot({path:`artifacts/impact-live/${surface}-home-${width}.png`,fullPage:true});
              for (const [slug,name] of issues) {
                const route="/impact/issue/"+slug;
                await page.goto(base+route,{waitUntil:"networkidle",timeout:60000}).catch(()=>undefined);
                await page.waitForTimeout(400);
                const info=await page.evaluate(()=>({
                  h1:document.querySelector("h1")?.textContent?.trim(),
                  claims:document.querySelectorAll(".iu-claim").length,
                  text:document.body.innerText.slice(0,1200),
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  pathname:location.pathname
                }));
                out.push({surface,width,route,expected:name,...info});
              }
              await page.close();
            }
          }
          await browser.close();
          fs.writeFileSync("artifacts/impact-live/comparison.json",JSON.stringify(out,null,2));
          const can=out.find(x=>x.surface==="canonical"&&x.width===1440&&x.route==="/impact");
          const imm=out.find(x=>x.surface==="approved_immutable"&&x.width===1440&&x.route==="/impact");
          console.log("CANONICAL",JSON.stringify(can));
          console.log("IMMUTABLE",JSON.stringify(imm));
          if (imm?.h1!=="Find people bringing life back.") throw new Error("Approved immutable IMPACT no longer matches locked template");
          const immutableIssues=out.filter(x=>x.surface==="approved_immutable"&&x.route!=="/impact");
          for (const row of immutableIssues) {
            if (row.h1!==row.expected || row.claims<1 || row.overflow>0) throw new Error("Immutable issue proof failed: "+JSON.stringify(row));
          }
          console.log("APPROVED_IMMUTABLE_PASS");
          JS
          node impact-live-proof.mjs

      - name: Record verdict
        run: |
          printf 'IMPACT APPROVED IMMUTABLE DATA PROOF PASS\nAPPROVED_BUILD_SHA=%s\nIMMUTABLE=https://c2cb9671.4planet-05.pages.dev/impact\nCANONICAL=https://4planet.org/impact\nENV63_PUBLIC_WAVE=14\n' "$EXPECTED_BUILD_SHA" | tee artifacts/impact-live/verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-live-multisprint-01-proof
          path: |
            live-build.json
            live-build-response.txt
            live-build-state.txt
            live-headers.txt
            artifacts/impact-live
          retention-days: 45
          if-no-files-found: warn
