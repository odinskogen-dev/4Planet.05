name: Apply Founder Gate Skip Link Fix

on:
  push:
    branches:
      - agent/founder-gate-one-interface-convergence
    paths:
      - scripts/apply-skip-link-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/founder-gate-one-interface-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/apply-skip-link-fix.mjs
      - name: Verify focused skip link and mobile menu
        run: |
          npm run typecheck
          npm run build
          npm run lint -- --max-warnings=0
          npx playwright install --with-deps chromium
          npm run preview -- --host 0.0.0.0 > /tmp/skip-link-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 npx playwright test tests/e2e/founder-gate.spec.ts
      - name: Commit product correction
        run: |
          rm scripts/apply-skip-link-fix.mjs
          rm .github/workflows/apply-skip-link-fix.yml
          git config user.name "4PLANET Gate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(shell): keep focused skip link clear of mobile menu"
          git push origin HEAD:agent/founder-gate-one-interface-convergence
