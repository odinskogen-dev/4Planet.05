name: 4NATION UX06 Visual Capture
on:
  push:
    branches: [king/test]
    paths: ['.github/workflows/nation-visual-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Capture actual immutable preview
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p visual-proof
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const views=[['mobile390',390,844],['mobile430',430,932],['tablet',834,1112],['desktop',1440,1200]];
            for (const view of views) {
              const name=view[0], width=view[1], height=view[2];
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto('https://82a64686.4planet-05.pages.dev/4nation',{waitUntil:'networkidle'});
              await page.screenshot({path:'visual-proof/'+name+'-top.png',fullPage:false});
              await page.screenshot({path:'visual-proof/'+name+'-full.png',fullPage:true});
              await page.close();
            }
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: 4nation-ux06-visual-proof
          path: visual-proof/*.png
          if-no-files-found: error
