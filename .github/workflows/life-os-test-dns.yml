name: LIFE OS test DNS

on:
  push:
    branches:
      - ops/test-lifeos-dns-20260916
    paths:
      - '.github/workflows/life-os-test-dns.yml'

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_TOKEN_5: ${{ secrets.CF_API_KEY }}
      CF_EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL_2: ${{ secrets.CF_API_EMAIL }}
      ZONE_NAME: 4planet.org
      RECORD_NAME: test.4planet.org
      RECORD_TARGET: proxy-v2.appdeploy.ai
    steps:
      - name: Detach Worker custom domain and point test to Life OS
        shell: bash
        run: |
          set -euo pipefail

          TOKENS=("${CF_TOKEN_1:-}" "${CF_TOKEN_2:-}" "${CF_TOKEN_3:-}" "${CF_TOKEN_4:-}" "${CF_TOKEN_5:-}")
          EMAIL="${CF_EMAIL_1:-}"
          if [ -z "$EMAIL" ]; then EMAIL="${CF_EMAIL_2:-}"; fi
          if [ -z "$EMAIL" ]; then EMAIL='odin.skogen@gmail.com'; fi

          AUTH_MODE=''
          TOKEN=''
          ZONE_JSON=''

          for candidate in "${TOKENS[@]}"; do
            [ -n "$candidate" ] || continue
            body="$(mktemp)"
            code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -H "Authorization: Bearer $candidate" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && jq -e '.success == true and (.result|length) > 0' "$body" >/dev/null 2>&1; then
              AUTH_MODE='bearer'; TOKEN="$candidate"; ZONE_JSON="$(cat "$body")"; rm -f "$body"; break
            fi
            rm -f "$body"
            body="$(mktemp)"
            code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -H "X-Auth-Email: $EMAIL" -H "X-Auth-Key: $candidate" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && jq -e '.success == true and (.result|length) > 0' "$body" >/dev/null 2>&1; then
              AUTH_MODE='global_key'; TOKEN="$candidate"; ZONE_JSON="$(cat "$body")"; rm -f "$body"; break
            fi
            rm -f "$body"
          done

          test -n "$AUTH_MODE"
          test -n "$TOKEN"
          echo "Cloudflare authentication succeeded using ${AUTH_MODE}."

          headers=()
          if [ "$AUTH_MODE" = 'bearer' ]; then
            headers=(-H "Authorization: Bearer $TOKEN")
          else
            headers=(-H "X-Auth-Email: $EMAIL" -H "X-Auth-Key: $TOKEN")
          fi

          cf_request() {
            local method="$1" url="$2" payload="${3:-}"
            local body code
            body="$(mktemp)"
            if [ -n "$payload" ]; then
              code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -X "$method" "${headers[@]}" -H 'Content-Type: application/json' --data "$payload" "$url")"
            else
              code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' -X "$method" "${headers[@]}" -H 'Content-Type: application/json' "$url")"
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Cloudflare ${method} ${url} failed with HTTP ${code}" >&2
              jq '{success,errors,messages}' "$body" >&2 || cat "$body" >&2
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          ZONE_ID="$(printf '%s' "$ZONE_JSON" | jq -r '.result[0].id // empty')"
          ACCOUNT_ID="$(printf '%s' "$ZONE_JSON" | jq -r '.result[0].account.id // empty')"
          test -n "$ZONE_ID"
          test -n "$ACCOUNT_ID"

          list_record() {
            cf_request GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?per_page=100" | jq --arg name "$RECORD_NAME" '{success,errors,messages,result:[.result[] | select(.name == $name)]}'
          }

          RECORD_JSON="$(list_record)"
          RECORD_ID="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].id // empty')"
          CURRENT_TYPE="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].type // empty')"
          CURRENT_CONTENT="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].content // empty')"
          CURRENT_PROXIED="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].proxied // false')"
          READ_ONLY="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].meta.read_only // false')"
          ORIGIN_WORKER_ID="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].meta.origin_worker_id // empty')"

          if [ "$READ_ONLY" = 'true' ] && [ -n "$ORIGIN_WORKER_ID" ]; then
            echo 'test.4planet.org is owned by a Worker Custom Domain. Locating binding.'
            WORKER_DOMAINS="$(cf_request GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains")"
            DOMAIN_ID="$(printf '%s' "$WORKER_DOMAINS" | jq -r --arg h "$RECORD_NAME" '.result[]? | select(.hostname == $h) | .id' | head -n1)"
            SERVICE="$(printf '%s' "$WORKER_DOMAINS" | jq -r --arg h "$RECORD_NAME" '.result[]? | select(.hostname == $h) | .service' | head -n1)"
            if [ -z "$DOMAIN_ID" ]; then
              echo 'Worker Custom Domain binding was not returned by the API.' >&2
              exit 4
            fi
            echo "Detaching exact Worker custom domain from service: ${SERVICE:-unknown}."
            cf_request DELETE "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains/${DOMAIN_ID}" >/dev/null

            for attempt in $(seq 1 20); do
              sleep 2
              RECORD_JSON="$(list_record)"
              RECORD_ID="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].id // empty')"
              [ -z "$RECORD_ID" ] && break
            done
          fi

          RECORD_JSON="$(list_record)"
          RECORD_ID="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].id // empty')"
          CURRENT_TYPE="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].type // empty')"
          CURRENT_CONTENT="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].content // empty')"
          CURRENT_PROXIED="$(printf '%s' "$RECORD_JSON" | jq -r '.result[0].proxied // false')"
          PAYLOAD="$(jq -nc --arg name "$RECORD_NAME" --arg content "$RECORD_TARGET" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')"

          if [ -z "$RECORD_ID" ]; then
            cf_request POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" "$PAYLOAD" >/dev/null
            echo 'Created test.4planet.org CNAME.'
          elif [ "$CURRENT_TYPE" = 'CNAME' ] && [ "$CURRENT_CONTENT" = "$RECORD_TARGET" ] && [ "$CURRENT_PROXIED" = 'false' ]; then
            echo 'test.4planet.org already points to expected AppDeploy target.'
          else
            cf_request PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" "$PAYLOAD" >/dev/null
            echo 'Updated test.4planet.org CNAME.'
          fi

          VERIFY_JSON="$(list_record)"
          printf '%s' "$VERIFY_JSON" | jq -e --arg target "$RECORD_TARGET" '.success == true and .result[0].type == "CNAME" and .result[0].content == $target and .result[0].proxied == false' >/dev/null
          echo 'Cloudflare DNS verification passed.'
