name: 4PLANET domain routing ops v6

on:
  push:
    branches:
      - ops/domain-routing-20260914
    paths:
      - .github/workflows/domain-routing-ops-v6.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Complete product-domain routing
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: bash .ops/domain-router/configure-custom-domains.sh
