name: 4SAPIEN One Product Finance runtime verification

on:
  push:
    branches: [build/ask-embla-live-20260909, work/4sapien-finance-e2e-20260915]
    paths:
      - '.github/workflows/ask-embla-finance-runtime.yml'
      - 'products/4sapien/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE

jobs:
  verify-finance-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize guarded candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/finance-e2e-site
          mkdir -p /tmp/finance-e2e-site/app/food
          touch /tmp/finance-e2e-site/index.html
          python products/4sapien/build/apply_finance_route.py /tmp/finance-e2e-site/index.html
          python products/4sapien/build/apply_finance_canonical_guard.py /tmp/finance-e2e-site
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_provider_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_meal_plan_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_product_gateway_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_food_money_guard.py /tmp/finance-e2e-site/app/food/index.html

      - name: Candidate product truth checks
        run: |
          set -euo pipefail
          MONEY=/tmp/finance-e2e-site/app/money/index.html
          FOOD=/tmp/finance-e2e-site/app/food/index.html
          grep -q 'AXE_FINANCE_CANONICAL_V1' "$MONEY"
          grep -q 'four_sapien_finance_save_event' "$MONEY"
          grep -q 'four_sapien_finance_save_account' "$MONEY"
          grep -q 'four_sapien_finance_batch_save_events' "$MONEY"
          grep -q 'four_sapien_finance_soft_delete_event' "$MONEY"
          grep -q 'four_sapien_embla_finance_tool' "$MONEY"
          grep -q 'Canonical Finance Twin' "$MONEY"
          grep -q 'FACTS, NOT ADVICE' "$MONEY"
          grep -q 'FOUR_SAPIEN_FOOD_MONEY_V1' "$FOOD"
          grep -q 'plan_food_until_payday' "$FOOD"
          grep -q 'FOOD × MONEY · DETERMINISTISK' "$FOOD"
          grep -q 'Eksakt handlekurvsum er UKJENT' "$FOOD"
          ! grep -Eqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' /tmp/finance-e2e-site

      - name: Parse guarded Food React source
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('/tmp/finance-e2e-site/app/food/index.html').read_text()
          m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
          assert m,'Babel source missing'
          pathlib.Path('/tmp/food-e2e.jsx').write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/food-e2e.jsx --loader:.jsx=jsx --outfile=/tmp/food-e2e.js

      - name: Parse injected Finance experience
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/finance-e2e-site/app/money/index.html').read_text()
          i=s.index('<!-- AXE_FINANCE_EXPERIENCE_V2 -->')
          a=s.rfind('<script',0,i); a=s.index('>',a)+1
          b=s.index('</script>',i)
          pathlib.Path('/tmp/finance-experience.js').write_text(s[a:b])
          PY
          node --check /tmp/finance-experience.js

      - name: Verify shared 4SAPIEN backend seam
        run: |
          set -euo pipefail
          for object in four_sapien_finance_accounts four_sapien_finance_events four_sapien_embla_tool_calls; do
            code=$(curl -sS -o "/tmp/${object}.json" -w '%{http_code}' -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/rest/v1/${object}?select=*&limit=0")
            test "$code" = "200"
          done
          for rpc in four_sapien_finance_twin four_sapien_embla_finance_tool four_sapien_plan_food_until_payday_context; do
            code=$(curl -sS -o "/tmp/${rpc}.json" -w '%{http_code}' -X POST -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' "${SUPABASE_URL}/rest/v1/rpc/${rpc}" -d '{}')
            test "$code" = "401" -o "$code" = "403"
          done

      - name: Verify current live baseline remains healthy
        run: |
          set -euo pipefail
          for base in https://four-sapien-embla.odin-skogen.workers.dev https://4sapien.com; do
            body=/tmp/live-money.html
            status=$(curl -sS -L --retry 3 --retry-delay 2 -H 'Sec-Fetch-Mode: navigate' -o "$body" -w '%{http_code}' "${base}/app/money/")
            test "$status" = "200"
            grep -q '<title>4SAPIEN Finance — Embla</title>' "$body"
          done
