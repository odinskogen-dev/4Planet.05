name: 4SAPIEN One Product Finance runtime verification

on:
  push:
    branches: [build/ask-embla-live-20260909, work/4sapien-finance-e2e-20260915]
    paths:
      - '.github/workflows/ask-embla-finance-runtime.yml'
      - 'products/4sapien/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE

jobs:
  verify-finance-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact production guard chain
        run: |
          set -euo pipefail
          rm -rf /tmp/finance-e2e-site
          mkdir -p /tmp/finance-e2e-site/app/food /tmp/finance-e2e-site/app
          python products/4sapien/build/apply_front_v2_release.py products/4sapien/source/claude-front-20260915-v2.html /tmp/finance-e2e-site/index.html
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_provider_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_meal_plan_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_product_gateway_guard.py /tmp/finance-e2e-site/app/food/index.html
          python products/4sapien/build/apply_finance_route.py /tmp/finance-e2e-site/index.html
          python products/4sapien/build/apply_finance_typography_guard.py /tmp/finance-e2e-site

      - name: Candidate product truth checks
        run: |
          set -euo pipefail
          MONEY=/tmp/finance-e2e-site/app/money/index.html
          FOOD=/tmp/finance-e2e-site/app/food/index.html
          for marker in AXE_FINANCE_CANONICAL_V1 four_sapien_finance_save_event four_sapien_finance_save_account four_sapien_finance_batch_save_events four_sapien_finance_soft_delete_event four_sapien_embla_finance_tool 'Canonical Finance Twin' 'FACTS, NOT ADVICE'; do grep -q "$marker" "$MONEY"; done
          for marker in FOUR_SAPIEN_FOOD_MONEY_V1 plan_food_until_payday 'FOOD × MONEY · DETERMINISTISK' 'Eksakt handlekurvsum er UKJENT'; do grep -q "$marker" "$FOOD"; done
          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' /tmp/finance-e2e-site

      - name: Parse guarded React sources
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,pathlib
          for src,out in [('/tmp/finance-e2e-site/app/food/index.html','/tmp/food.jsx'),('/tmp/finance-e2e-site/app/money/index.html','/tmp/money.jsx')]:
            s=pathlib.Path(src).read_text(); blocks=re.findall(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S); assert blocks,src; pathlib.Path(out).write_text('\n'.join(blocks))
          PY
          npx --yes esbuild@0.25.9 /tmp/food.jsx --loader:.jsx=jsx --outfile=/tmp/food.js
          npx --yes esbuild@0.25.9 /tmp/money.jsx --loader:.jsx=jsx --outfile=/tmp/money.js

      - name: Verify shared backend seam and current live baseline
        run: |
          set -euo pipefail
          for object in four_sapien_finance_accounts four_sapien_finance_events; do
            code=$(curl -sS -o "/tmp/${object}.json" -w '%{http_code}' -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/rest/v1/${object}?select=*&limit=0")
            test "$code" = "200"
          done
          for base in https://four-sapien-embla.odin-skogen.workers.dev https://4sapien.com; do
            status=$(curl -sS -L --retry 3 --retry-delay 2 -H 'Sec-Fetch-Mode: navigate' -o /tmp/live-money.html -w '%{http_code}' "${base}/app/money/")
            test "$status" = "200"; grep -q '<title>4SAPIEN Finance — Embla</title>' /tmp/live-money.html
          done
