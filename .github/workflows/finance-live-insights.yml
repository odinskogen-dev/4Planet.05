name: 4Finance 2.2 Live Browser Proof
on:
  push:
    branches: [work/finance-insights-oauth-premium-20261011]
    paths:
      - 'scripts/finance-live-insights.e2e.mjs'
      - '.github/workflows/finance-live-insights.yml'
permissions:
  contents: read
jobs:
  external-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify external 4Finance 2.2 on desktop and 390px
        run: node scripts/finance-live-insights.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-2-2-live-desktop-mobile
          path: artifacts/finance-live-insights
          if-no-files-found: ignore
          retention-days: 7
