name: Earth Now bounded human proof
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/earth-now-human-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earth-now-human-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/earth-now-human-proof.mjs "$RUNNER_TEMP/earth-now-human-proof.mjs"
      - uses: actions/checkout@v4
        with:
          ref: 950e81ca36569793b28d0b4658d2871656a8ebc7
      - run: cp "$RUNNER_TEMP/earth-now-human-proof.mjs" scripts/earth-now-human-proof.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the immutable production-source artifact already built and deployed
        run: |
          echo "EARTH_BASE_URL=https://02ced84e.4planet-05.pages.dev" >> "$GITHUB_ENV"
          echo "https://02ced84e.4planet-05.pages.dev" > earth-preview-url.txt
          echo 'Source 950e81ca36569793b28d0b4658d2871656a8ebc7; build and deploy receipt run39592111508.'
      - run: node scripts/earth-now-human-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-now-human-proof
          path: |
            artifacts/earth-now
            earth-preview-url.txt
            earth-rollback.json
          retention-days: 14
