name: Earth Now bounded human proof
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/earth-now-human-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earth-now-human-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/earth-now-human-proof.mjs "$RUNNER_TEMP/earth-now-human-proof.mjs"
      - uses: actions/checkout@v4
        with:
          ref: abeb4825c21629791b5e57180db8d53adaaf9826
      - run: cp "$RUNNER_TEMP/earth-now-human-proof.mjs" scripts/earth-now-human-proof.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for exact corrected source on existing production domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_TOKEN"
          aid=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active' | jq -r '.result[0].account.id')
          for attempt in $(seq 1 40); do
            curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$aid/pages/projects/4planet-05" > /tmp/earth-live.json
            sha=$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash' /tmp/earth-live.json)
            if [ "$sha" = abeb4825c21629791b5e57180db8d53adaaf9826 ]; then
              jq '{name:.result.name,production_branch:.result.production_branch,canonical_deployment:.result.canonical_deployment}' /tmp/earth-live.json > earth-live-release.json
              echo "EARTH_BASE_URL=https://4planet.org" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo 'Corrected production source not yet deployed'; exit 1
      - run: node scripts/earth-now-human-proof.mjs
      - run: node scripts/earth-now-human-proof.mjs
        env:
          EARTH_ENGINE: webkit
          EARTH_PROOF_DIR: artifacts/earth-now-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-now-human-proof
          path: |
            artifacts/earth-now
            artifacts/earth-now-webkit
            earth-preview-url.txt
            earth-rollback.json
            earth-live-release.json
          retention-days: 14
