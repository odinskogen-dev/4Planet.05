name: Earth Now bounded human proof
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/earth-now-human-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earth-now-human-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/earth-now-human-proof.mjs "$RUNNER_TEMP/earth-now-human-proof.mjs"
      - uses: actions/checkout@v4
        with:
          ref: 950e81ca36569793b28d0b4658d2871656a8ebc7
      - run: cp "$RUNNER_TEMP/earth-now-human-proof.mjs" scripts/earth-now-human-proof.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Resolve existing Cloudflare account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          echo "::add-mask::$CF_TOKEN"
          aid=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active' | jq -r '.result[0].account.id')
          test -n "$aid" && test "$aid" != null
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$aid/pages/projects/4planet-05" | jq '{name:.result.name,production_branch:.result.production_branch,canonical_deployment:.result.canonical_deployment}' > earth-rollback.json
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
      - name: Deploy exact bounded production-source preview only
        run: |
          npx --yes wrangler@4.128.0 pages deploy dist --project-name=4planet-05 --branch=king/test --commit-hash=950e81ca36569793b28d0b4658d2871656a8ebc7 --commit-dirty=false | tee /tmp/earth-preview.log
          preview=$(grep -Eo 'https://[a-z0-9]+\.4planet-05\.pages\.dev' /tmp/earth-preview.log | head -1)
          test -n "$preview"
          echo "EARTH_BASE_URL=$preview" >> "$GITHUB_ENV"
          echo "$preview" > earth-preview-url.txt
      - run: node scripts/earth-now-human-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-now-human-proof
          path: |
            artifacts/earth-now
            earth-preview-url.txt
            earth-rollback.json
          retention-days: 14
