name: Earth Now bounded human proof
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/earth-now-human-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earth-now-human-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/earth-now-human-proof.mjs "$RUNNER_TEMP/earth-now-human-proof.mjs"
      - uses: actions/checkout@v4
        with:
          ref: abeb4825c21629791b5e57180db8d53adaaf9826
      - run: cp "$RUNNER_TEMP/earth-now-human-proof.mjs" scripts/earth-now-human-proof.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx tsc -b && npx vite build && node scripts/prerender-discovery-seo.mjs
      - name: Deploy corrected first-party route to immutable preview
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          aid=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active' | jq -r '.result[0].account.id')
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$aid"
          npx --yes wrangler@4.128.0 pages deploy dist --project-name=4planet-05 --branch=king/test --commit-hash=abeb4825c21629791b5e57180db8d53adaaf9826 --commit-dirty=false | tee /tmp/earth-preview.log
          preview=$(grep -Eo 'https://[a-z0-9]+\.4planet-05\.pages\.dev' /tmp/earth-preview.log | head -1)
          test -n "$preview"
          echo "EARTH_BASE_URL=$preview" >> "$GITHUB_ENV"
          echo "$preview" > earth-preview-url.txt
      - run: node scripts/earth-now-human-proof.mjs
      - run: node scripts/earth-now-human-proof.mjs
        env:
          EARTH_ENGINE: webkit
          EARTH_PROOF_DIR: artifacts/earth-now-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-now-human-proof
          path: |
            artifacts/earth-now
            artifacts/earth-now-webkit
            earth-preview-url.txt
            earth-rollback.json
          retention-days: 14
