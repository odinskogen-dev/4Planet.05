name: Audit existing archive.4planet.org routing

on:
  push:
    branches:
      - ops/archive-live-20260908
    paths:
      - .github/workflows/archive-domain-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Cloudflare and inspect existing archive owner
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$candidate" ] && { TOKEN="$candidate"; break; }; done
          [ -n "$TOKEN" ] || exit 2
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n'); TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          api='https://api.cloudflare.com/client/v4'
          zone=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "${api}/zones?name=4planet.org&status=active")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account_id" ] || exit 3

          domains=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "${api}/accounts/${account_id}/workers/domains")
          echo '=== CUSTOM DOMAINS ON 4planet-four-state-control-v1 ==='
          jq -r '.result[]? | select(.service == "4planet-four-state-control-v1") | [.hostname,.service,.environment,.zone_name,.id] | @tsv' <<<"$domains"

          echo '=== ARCHIVE PUBLIC HEADERS ==='
          curl -sSIL --connect-timeout 10 --max-time 30 'https://archive.4planet.org/' | tr -d '\r' | sed -n '1,80p' || true

          echo '=== ARCHIVE HTML TITLE ==='
          curl -sSL --connect-timeout 10 --max-time 30 'https://archive.4planet.org/' | tr '\n' ' ' | sed -n 's/.*<title>\([^<]*\)<\/title>.*/\1/p' | head -1 || true

          echo '=== EXISTING WORKER UPSTREAM URL REFS ==='
          tmp=$(mktemp)
          if curl -fsS -H "Authorization: Bearer $TOKEN" "${api}/accounts/${account_id}/workers/services/4planet-four-state-control-v1/environments/production/content" -o "$tmp"; then
            grep -Eo 'https://[A-Za-z0-9._/-]+\.pages\.dev[A-Za-z0-9._/?=&%-]*|https://[A-Za-z0-9._/-]+\.4planet[^"[:space:]]*' "$tmp" | sort -u | head -40 || true
          elif curl -fsS -H "Authorization: Bearer $TOKEN" "${api}/accounts/${account_id}/workers/scripts/4planet-four-state-control-v1/content" -o "$tmp"; then
            grep -Eo 'https://[A-Za-z0-9._/-]+\.pages\.dev[A-Za-z0-9._/?=&%-]*|https://[A-Za-z0-9._/-]+\.4planet[^"[:space:]]*' "$tmp" | sort -u | head -40 || true
          fi
