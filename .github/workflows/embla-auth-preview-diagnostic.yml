name: 4SAPIEN Human Gold auth diagnostic

on:
  push:
    branches: [build/embla-core-20260914]
    paths:
      - '.github/workflows/embla-auth-preview-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PROJECT_REF: ghvdzetmplqkdtfqiror
  PREVIEW_URL: https://four-sapien-embla-megasprint.odin-skogen.workers.dev/

jobs:
  auth-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and configure preview redirect
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          context='4SAPIEN Human Gold Auth'
          post_status() {
            local state="$1" desc="$2"
            payload=$(jq -n --arg state "$state" --arg description "$desc" --arg context "$context" '{state:$state,description:$description,context:$context}')
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            post_status failure 'Supabase management token missing'
            echo 'SUPABASE_ACCESS_TOKEN_MISSING'
            exit 31
          fi
          endpoint="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          get_code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" || true)
          if [ "$get_code" != 200 ]; then
            post_status failure "Supabase auth config GET HTTP ${get_code}"
            echo "AUTH_CONFIG_GET_HTTP_${get_code}"
            exit 32
          fi
          current=$(jq -r '.uri_allow_list // ""' /tmp/auth.json)
          merged=$(python - "$current" "$PREVIEW_URL" <<'PY'
          import sys
          current,wanted=sys.argv[1],sys.argv[2]
          vals=[x.strip() for x in current.split(',') if x.strip()]
          if wanted not in vals: vals.append(wanted)
          print(','.join(vals))
          PY
          )
          payload=$(jq -n --arg v "$merged" '{uri_allow_list:$v}')
          patch_code=$(curl -sS -o /tmp/patched.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint" -d "$payload" || true)
          if [ "$patch_code" != 200 ]; then
            post_status failure "Supabase auth config PATCH HTTP ${patch_code}"
            echo "AUTH_CONFIG_PATCH_HTTP_${patch_code}"
            exit 33
          fi
          verify_code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" || true)
          if [ "$verify_code" != 200 ] || ! jq -e --arg wanted "$PREVIEW_URL" '(.uri_allow_list // "")|split(",")|map(gsub("^ +| +$";""))|index($wanted)!=null' /tmp/verify.json >/dev/null; then
            post_status failure 'Supabase redirect verification failed'
            echo 'AUTH_CONFIG_VERIFY_FAILED'
            exit 34
          fi
          post_status success 'Preview OAuth redirect allowlisted'
          echo 'PREVIEW_OAUTH_ALLOWLIST_PASS'
