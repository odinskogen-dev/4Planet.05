name: Probe existing Cloudflare secret name

on:
  push:
    branches:
      - ops/oddekalv-domain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S_GOODAPI_TEST_KEY: ${{ secrets.GOODAPI_TEST_KEY }}
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      S_CF_API_KEY: ${{ secrets.CF_API_KEY }}
      S_CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report configured secret names only
        shell: bash
        run: |
          found=0
          for name in GOODAPI_TEST_KEY CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CLOUDFLARE_API_KEY CF_API_KEY CLOUDFLARE_PAGES_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID; do
            var="S_${name}"
            if [ -n "${!var}" ]; then
              echo "PRESENT: ${name}"
              found=1
            else
              echo "ABSENT: ${name}"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "NO_MATCHING_SECRET_NAMES_PRESENT"
          fi