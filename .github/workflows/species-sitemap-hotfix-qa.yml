name: 4SPECIES Reviewed Search Contract
on:
  push:
    branches: [king/test]
    paths:
      - ops/discovery/4species-router.js
      - scripts/species-sitemap-safety.test.mjs
      - .github/workflows/species-sitemap-hotfix-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-only-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate 4SPECIES Worker syntax
        run: node --check ops/discovery/4species-router.js
      - name: Refuse unreviewed species and wrong canonical
        run: node --test scripts/species-sitemap-safety.test.mjs
      - name: Verify release remains manual-only and fail-closed
        run: |
          grep -Fq 'workflow_dispatch:' .github/workflows/4species-discovery-live.yml
          ! grep -Fq 'branches: [king/test]' .github/workflows/4species-discovery-live.yml
