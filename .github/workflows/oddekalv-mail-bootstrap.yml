name: Oddekalv Mail Bootstrap

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/oddekalv-mail-bootstrap.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Complete oddekalv.org inbound DNS
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || exit 2
          echo "::add-mask::$CF_TOKEN"
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONES=$(api "https://api.cloudflare.com/client/v4/zones?name=oddekalv.org&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",[]); print(r[0].get("id","") if r else "")')
          [ -n "$ZONE_ID" ] || exit 3

          ensure() {
            TYPE="$1"; FQDN="$2"; CONTENT="$3"; PRIORITY="${4:-}"
            QUERY=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=$TYPE&name=$FQDN")
            MATCH=$(printf '%s' "$QUERY" | EXPECTED="$CONTENT" PRIORITY="$PRIORITY" python3 -c 'import json,os,sys; r=json.load(sys.stdin).get("result",[]); p=os.environ.get("PRIORITY",""); ok=any(x.get("content","").rstrip(".")==os.environ["EXPECTED"].rstrip(".") and (not p or str(x.get("priority"))==p) for x in r); print("yes" if ok else "no")')
            if [ "$MATCH" = "yes" ]; then echo "DNS_OK $TYPE $FQDN"; return 0; fi
            if [ "$TYPE" = "MX" ]; then BODY=$(TYPE="$TYPE" FQDN="$FQDN" CONTENT="$CONTENT" PRIORITY="$PRIORITY" python3 -c 'import json,os; print(json.dumps({"type":os.environ["TYPE"],"name":os.environ["FQDN"],"content":os.environ["CONTENT"],"priority":int(os.environ["PRIORITY"]),"ttl":1}))'); else BODY=$(TYPE="$TYPE" FQDN="$FQDN" CONTENT="$CONTENT" python3 -c 'import json,os; print(json.dumps({"type":os.environ["TYPE"],"name":os.environ["FQDN"],"content":os.environ["CONTENT"],"ttl":1}))'); fi
            RES=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" --data "$BODY")
            OK=$(printf '%s' "$RES" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("success") else "no")')
            [ "$OK" = "yes" ] || { echo "DNS_FAILED $TYPE $FQDN"; exit 4; }
            echo "DNS_CREATED $TYPE $FQDN"
          }

          ensure MX oddekalv.org route1.mx.cloudflare.net 86
          ensure MX oddekalv.org route2.mx.cloudflare.net 28
          ensure MX oddekalv.org route3.mx.cloudflare.net 18
          ensure TXT oddekalv.org 'v=spf1 include:_spf.mx.cloudflare.net ~all'
          ensure TXT cf2024-1._domainkey.oddekalv.org 'v=DKIM1; h=sha256; k=rsa; '

          SETTINGS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing")
          printf '%s' "$SETTINGS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROUTING_STATUS="+str(d.get("result",{}).get("status"))); print("ROUTING_ENABLED="+str(d.get("result",{}).get("enabled")))'
