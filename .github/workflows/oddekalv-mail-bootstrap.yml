name: Oddekalv Mail Bootstrap

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/oddekalv-mail-bootstrap.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect oddekalv.org routing DNS
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || exit 2
          echo "::add-mask::$CF_TOKEN"
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONES=$(api "https://api.cloudflare.com/client/v4/zones?name=oddekalv.org&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",[]); print(r[0].get("id","") if r else "")')
          [ -n "$ZONE_ID" ] || exit 3
          MX=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=MX&name=oddekalv.org")
          TXT=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=oddekalv.org")
          ROUTING_DNS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/dns")
          SETTINGS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing")
          printf '%s' "$MX" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROOT_MX=" + ",".join(f"{x.get(chr(99)+chr(111)+chr(110)+chr(116)+chr(101)+chr(110)+chr(116))}:{x.get(chr(112)+chr(114)+chr(105)+chr(111)+chr(114)+chr(105)+chr(116)+chr(121))}" for x in d.get("result",[])))'
          printf '%s' "$TXT" | python3 -c 'import json,sys; d=json.load(sys.stdin); vals=[x.get("content","") for x in d.get("result",[]) if x.get("content","").startswith("v=spf1")]; print("ROOT_SPF="+" | ".join(vals))'
          printf '%s' "$SETTINGS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROUTING_SETTINGS_SUCCESS="+str(d.get("success"))); print("ROUTING_STATUS="+str(d.get("result",{}).get("status"))); print("ROUTING_ENABLED="+str(d.get("result",{}).get("enabled"))); print("ROUTING_ERRORS="+" | ".join(x.get("message","") for x in d.get("errors",[])))'
          printf '%s' "$ROUTING_DNS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ROUTING_DNS_SUCCESS="+str(d.get("success"))); print("ROUTING_DNS_ERRORS="+" | ".join(x.get("message","") for x in d.get("errors",[]))); print("ROUTING_DNS_RESULT="+json.dumps(d.get("result")))'
