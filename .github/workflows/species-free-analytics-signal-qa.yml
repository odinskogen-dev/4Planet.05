name: SPECIES Free Analytics Live Signal QA
on:
  push:
    branches: [work/species-free-search-measurement-20261014]
    paths: [.github/workflows/species-free-analytics-signal-qa.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          npm install --prefix /tmp/species-free-qa playwright@1.56.0
          /tmp/species-free-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check real Cloudflare analytics pageview and beacon on distinct species routes
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '/tmp/species-free-qa/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const rows=[];
          for (const slug of ['', 'orca', 'lion', 'tiger']) {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const signal=[];
            page.on('request',r=>{if(/cloudflareinsights.com\/beacon|cloudflareinsights.com\/cdn-cgi\/rum|cloudflareinsights.com\/beacon.min/i.test(r.url()))signal.push(r.url().split('?')[0])});
            await page.goto('https://4species.com/'+slug,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2800);
            const html=await page.evaluate(()=>({inject:!!document.querySelector('script[src*="cloudflareinsights.com/beacon.min.js"],script[data-cf-beacon]'),title:document.title,host:location.hostname}));
            rows.push({slug:slug||'home',...html,signals:signal.length,urls:[...new Set(signal)].slice(0,3)});
            await page.close();
          }
          await browser.close();
          console.log('SPECIES_FREE_TRAFFIC_BEACON_SIGNAL '+JSON.stringify(rows));
          if(rows.some(r=>!r.inject && !r.signals))process.exitCode=1;
          NODE
