name: CUB MEDIEVAL — Build 03 Live QA
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths:
      - 'site/medieval/**'
      - 'site/games/medieval/**'
      - '.github/workflows/cub-medieval-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medieval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable game bytes and unchanged ROMA
        shell: bash
        run: |
          set -euo pipefail
          echo '3a676e40e0dfdc4f91a413a9c8f4691851c55a0a6cf0a55dfa064bedc399ca83  site/medieval/index.html' | sha256sum -c -
          echo '3135d7a68083a013e90735266240a05d1a15dceb87cde2002520832cf9b42ae3  site/roma/index.html' | sha256sum -c -
          test "$(wc -c < site/medieval/index.html)" -eq 2220604
          echo MEDIEVAL_SOURCE_AND_ROMA_INTEGRITY_PASS
      - name: Verify Cloudflare has exact Build 03 at both domains
        shell: bash
        run: |
          set -euo pipefail
          for host in "https://lab.p4nther.com" "https://labs.p4nther.com"; do
            ok=0
            for attempt in $(seq 1 24); do
              if curl -fsSL --max-time 30 "$host/medieval/index.html" -o /tmp/medieval-live.html &&
                 echo '3a676e40e0dfdc4f91a413a9c8f4691851c55a0a6cf0a55dfa064bedc399ca83  /tmp/medieval-live.html' | sha256sum -c - >/dev/null; then ok=1; break; fi
              sleep 7
            done
            test "$ok" -eq 1 || { echo "MEDIEVAL_LIVE_FAILED=$host"; exit 4; }
            echo "MEDIEVAL_LIVE_EXACT_PASS=$host/medieval/"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Chromium desktop and mobile smoke test
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            for(const cfg of [{label:'mobile',width:390,height:844,mobile:true},{label:'desktop',width:1440,height:900,mobile:false}]){
              const ctx=await browser.newContext({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.mobile,hasTouch:cfg.mobile,deviceScaleFactor:1});
              const page=await ctx.newPage();
              const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
              const response=await page.goto('https://labs.p4nther.com/medieval/',{waitUntil:'domcontentloaded',timeout:65000});
              await page.waitForTimeout(8500);
              const canvases=await page.locator('canvas').count();
              const title=await page.title();
              const body=await page.locator('body').innerText().catch(()=>'');
              await page.screenshot({path:'medieval-'+cfg.label+'.png',fullPage:true});
              console.log('MEDIEVAL_BROWSER',cfg.label,'HTTP',response.status(),'TITLE',title,'CANVAS',canvases,'ERRORS',JSON.stringify(pageErrors),'BODY',body.length);
              if(response.status()!==200||!title.includes('MEDIEVAL')||canvases<1||pageErrors.length>0)throw Error('Browser smoke failure for '+cfg.label);
              await ctx.close();
            }
            await browser.close();
            console.log('MEDIEVAL_DESKTOP_MOBILE_SMOKE_PASS');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medieval-build03-live-smoke
          path: medieval-*.png
          if-no-files-found: ignore
          retention-days: 14
