name: 4SAPIEN HEIR existing product source QA — NO DEPLOY

on:
  push:
    branches: [king/test]
    paths:
      - 'products/4sapien/**'
      - 'tests/e2e/four-sapien-pantry-synthetic.spec.ts'
      - '.github/workflows/4sapien-real-data-candidate.yml'
      - '.github/workflows/ask-embla-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Materialize candidate
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          DROP=/tmp/4sapien-unified-20260917
          FOOD=$SITE/app/food/index.html
          rm -rf "$SITE" "$DROP"
          mkdir -p "$SITE/app/food" "$SITE/app" "$DROP"
          python products/4sapien/build/materialize_unified_drop.py products/4sapien/source/claude-unified-20260917 "$DROP"
          cp products/4sapien/source/4sapien-design.css "$SITE/4sapien-design.css"
          cp products/4sapien/source/4sapien-theme.js "$SITE/4sapien-theme.js"
          python products/4sapien/build/apply_front_v2_release.py "$DROP/4sapien_app_unified.html" "$SITE/index.html"
          cp "$DROP/4sapien_food_MERGED.html" "$FOOD"
          python products/4sapien/build/apply_finance_route.py "$SITE/index.html" "$DROP/4sapien_finance_MERGED.html" "$DROP/4sapien_finance_AXE_experience_MERGED.html"
          python products/4sapien/build/apply_finance_typography_guard.py "$SITE"
          python products/4sapien/build/apply_unified_design_guard.py "$SITE"
          cp products/4sapien/source/4sapien-live-hardening.css "$SITE/4sapien-live-hardening.css"
          cp products/4sapien/source/4sapien-live-hardening.js "$SITE/4sapien-live-hardening.js"
          python products/4sapien/build/apply_live_hardening_guard.py "$SITE"
          python products/4sapien/build/apply_document_intake_guard.py "$SITE"
          python products/4sapien/build/apply_pantry_first_return_guard.py "$SITE"
          cp products/4sapien/cloudflare/_headers "$SITE/_headers"
          cp products/4sapien/cloudflare/_redirects "$SITE/_redirects"

      - name: Inspect existing FOOD auth hook without private data
        run: |
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('products/4sapien/site/app/food/index.html').read_text()
          pats=['const SB','var SB','createClient(','getSession(','onAuthStateChange(','function App(','window.SB','window.FourSapien']
          print('FOOD_AUTH_HOOK_DIAGNOSTIC')
          for pat in pats:
            matches=list(re.finditer(re.escape(pat),s))
            print(pat, 'occurrences', len(matches))
            for m in matches[:2]:
              excerpt=s[max(0,m.start()-65):min(len(s),m.end()+105)].replace('\\n',' ')
              excerpt=re.sub(r'sb_publishable_[A-Za-z0-9_-]+','[PUBLIC_KEY_REDACTED]',excerpt)
              print('  ',excerpt[:190])
          print('FOOD_HTML_LENGTH',len(s))
          print('FOOD_APP_CONTEXT_BEGIN')
          a=s.find('function App(){')
          snippet=s[a:a+6200] if a>=0 else 'APP_ANCHOR_MISSING'
          snippet=re.sub(r'sb_publishable_[A-Za-z0-9_-]+','[PUBLIC_KEY_REDACTED]',snippet)
          print(snippet)
          for p in ['<Meals addMany=', 'selectedMeals={mealPlan}', 'function Meals(', 'four_sapien_embla_memories']:
            i=s.find(p)
            print('ANCHOR',p,i, re.sub(r'sb_publishable_[A-Za-z0-9_-]+','[PUBLIC_KEY_REDACTED]',s[max(0,i-260):i+430] if i>=0 else 'MISSING'))
          print('FOOD_APP_CONTEXT_END')
          PY

      - name: Build and zero-loss QA
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          ROOT=$SITE/index.html
          FOOD=$SITE/app/food/index.html
          MONEY=$SITE/app/money/index.html
          BRAIN=$SITE/brain/index.html
          for marker in 'Se livet ditt klart.' 'functions/v1/embla-core-preview' 'credit_balance_exhausted' '/4sapien-live-hardening.js' 'AbortController' '55000'; do grep -Fq "$marker" "$ROOT"; done
          for marker in 'fs-food-main' 'knownStores' 'preferredStore' 'fs-meal-cta' 'MAT · EMBLA' 'FourSapienTheme.subscribe'; do grep -Fq "$marker" "$FOOD"; done
          for marker in 'fs-money-main' 'PENGER · EMBLA' 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' '/4sapien-live-hardening.js'; do grep -Fq "$marker" "$MONEY"; done
          grep -Fq 'fs-finance-year' "$SITE/4sapien-live-hardening.js"
          grep -Fq 'fs-finance-attn-grid' "$SITE/4sapien-live-hardening.js"
          for marker in 'persistDirectContextFallback' 'MODEL_PENDING' 'brainIdentity' 'functions/v1/brain-profile' 'REQUEST_TIMEOUT' 'AbortController'; do grep -Fq "$marker" "$BRAIN"; done
          for marker in 'updateNote' 'note_updated' 'surface_viewed' 'home_hydrated' 'finance_opened' 'finance_twin_viewed' 'globalAppNav'; do grep -Fq "$marker" "$SITE/4sapien-live-hardening.js"; done
          grep -Fq '.fs-global-appnav' "$SITE/4sapien-live-hardening.css"
          grep -Fq 'bottom:clamp(120px,14vh,170px)' "$SITE/4sapien-live-hardening.css"
          grep -Fq 'embla_turn_failed' products/4sapien/supabase/functions/embla-core-preview/index.ts
          grep -Fq 'food_product_search_completed' products/4sapien/supabase/functions/embla-products/index.ts
          grep -Fq 'brain_request_failed' products/4sapien/supabase/functions/brain-profile/index.ts
          for marker in 'four_sapien_finance_confirm_document' 'four-sapien-finance-docs' 'PDF-tekst' 'Betalt' 'Bekreft og lagre'; do
            grep -Fqi "$marker" "$SITE/app/money/documents/index.html" "$SITE/4sapien-documents.js"
          done
          for target in "$MONEY" "$SITE/finance.html" "$SITE/finance/index.html"; do
            grep -Fq '/app/money/documents/' "$target"
            grep -Fq 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' "$target"
          done
          grep -Fq 'exportPersonalBrain' "$BRAIN"
          grep -Fq 'RLS-scoped' products/4sapien/build/apply_document_intake_guard.py
          node --check "$SITE/4sapien-documents.js"
          node --check "$SITE/4sapien-document-analysis.js"
          node products/4sapien/qa/test_document_analysis.cjs
          node --check "$SITE/4sapien-csv.js"
          node --check "$SITE/4sapien-import.js"
          node products/4sapien/qa/test_csv_import.cjs
          grep -Fq 'four_sapien_finance_confirm_csv_import' "$SITE/4sapien-import.js"
          grep -Fq '/4sapien-csv.js' "$SITE/app/money/import/index.html"
          grep -Fq '/app/money/import/' "$SITE/app/money/documents/index.html"
          grep -Fq '/4sapien-document-analysis.js' "$SITE/app/money/documents/index.html"
          grep -Fq 'docOcr' "$SITE/4sapien-documents.js"
          grep -Fq 'showSuggestions' "$SITE/4sapien-documents.js"
          python -m py_compile products/4sapien/build/apply_document_intake_guard.py
          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' products/4sapien/site
          node --check "$SITE/4sapien-live-hardening.js"
          node --check "$SITE/4sapien-pantry-decision.js"
          grep -Fq '<FoodPantryProof user={user} avoid={avoid}/>' "$FOOD"
          grep -Fq 'four_sapien_embla_memories' "$FOOD"
          grep -Fq 'PRIVATE PERSON' "$FOOD" || grep -Fq 'Privat Person-minne' "$FOOD"
          python -m py_compile products/4sapien/build/apply_pantry_first_return_guard.py
          python -m py_compile products/4sapien/build/apply_live_hardening_guard.py
          cat > /tmp/4sapien-deno.json <<'JSON'
          {
            "nodeModulesDir": "auto",
            "compilerOptions": {
              "strict": false,
              "noImplicitAny": false,
              "noImplicitThis": false
            }
          }
          JSON
          deno check --config /tmp/4sapien-deno.json products/4sapien/supabase/functions/brain-profile/index.ts
          deno check --config /tmp/4sapien-deno.json products/4sapien/supabase/functions/embla-core-preview/index.ts
          deno check --config /tmp/4sapien-deno.json products/4sapien/supabase/functions/embla-products/index.ts
          python - <<'PY'
          import re, pathlib
          for src,out in [
            ('products/4sapien/site/app/food/index.html','/tmp/food.jsx'),
            ('products/4sapien/site/app/money/index.html','/tmp/money.jsx'),
          ]:
            s=pathlib.Path(src).read_text()
            m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
            assert m, src
            pathlib.Path(out).write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/food.jsx --loader:.jsx=jsx --outfile=/tmp/food-check.js
          npx --yes esbuild@0.25.9 /tmp/money.jsx --loader:.jsx=jsx --outfile=/tmp/money-check.js
          python products/4sapien/build/audit_finance_typography.py products/4sapien/build/apply_finance_route.py "$MONEY"

      - name: Verify backend seams without writes
        run: |
          set -euo pipefail
          for table in four_sapien_profiles four_sapien_list_items four_sapien_shops four_sapien_meal_plans four_sapien_product_cache four_sapien_finance_accounts four_sapien_finance_events four_sapien_finance_budget; do
            code=$(curl -sS -o "/tmp/$table.json" -w '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/$table?select=*&limit=0")
            echo "$table HTTP $code"
            test "$code" = "200"
          done
          memory_code=$(curl -sS -o /tmp/four_sapien_embla_memories.json -w '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/four_sapien_embla_memories?select=*&limit=0" || true)
          echo "four_sapien_embla_memories anonymous HTTP $memory_code"
          test "$memory_code" = "401" || test "$memory_code" = "403"
          for fn in embla-products embla-core-preview brain-profile; do
            code=$(curl -sS -o "/tmp/$fn.json" -w '%{http_code}' -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data '{"q":"yoghurt","message":"hello","action":"ask","question":"hello"}' "$SUPABASE_URL/functions/v1/$fn" || true)
            echo "$fn unauthenticated HTTP $code"
            test "$code" = "401" || test "$code" = "403"
          done
          curl -fsS -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/settings" > /tmp/auth.json
          test "$(jq -r '(.external.email // false) | tostring' /tmp/auth.json)" = true

      - name: Verify Money Now and Food bridge contract and additive migrations
        run: |
          set -euo pipefail
          test -f products/4sapien/REAL_DATA_RUNTIME_CONTRACT_03.md
          grep -Fq 'four_sapien_finance_control_read' products/4sapien/REAL_DATA_RUNTIME_CONTRACT_03.md
          grep -Fq 'four_sapien_link_receipt_to_food' products/4sapien/REAL_DATA_RUNTIME_CONTRACT_03.md
          for p in products/4sapien/supabase/migrations/202609202100_four_sapien_finance_control_read_v1.sql products/4sapien/supabase/migrations/202609202130_four_sapien_receipt_food_link_v1.sql products/4sapien/supabase/migrations/202609202140_four_sapien_finance_control_read_v1_1_no_double_today.sql; do
            test -s "$p"
            grep -Fq 'security invoker' "$p"
          done
          grep -Fq 'FOOD_SHOP_MATCH_REVIEW_REQUIRED' products/4sapien/supabase/migrations/202609202130_four_sapien_receipt_food_link_v1.sql
          grep -Fq 'NO' products/4sapien/REAL_DATA_RUNTIME_CONTRACT_03.md
          echo "PASS: unchanged Claude app, typed Finance and Food contracts, additive RLS-scoped SQL"
      - name: Candidate summary
        run: |
          {
            echo '## 4SAPIEN DOCUMENT INTELLIGENCE candidate'
            echo '- Unified shell hardening: PASS'
            echo '- Food responsive/theme/store semantics: PASS'
            echo '- Finance canonical Twin/year runtime: PASS'
            echo '- Brain direct-context fallback + bounded request recovery: PASS'
            echo '- Notes create/edit/delete runtime: PASS'
            echo '- Product-value telemetry markers: PASS'
            echo '- Edge Function TypeScript checks: PASS'
            echo '- Build/secret/auth/Supabase boundary gates: PASS'
            echo '- Private image/PDF review + canonical Finance event (requires live RPC migration): candidate PASS'
            echo '- Personal Brain export + optional confirmed context: candidate PASS'
            echo '- No production deploy performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      # QA-passed, nonproduction preview on EXISTING Pages branch, never LIVE/DNS.
      - name: Prepare exact-SHA noindex 4SAPIEN review artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          site=pathlib.Path('products/4sapien/site')
          sha=os.environ['GITHUB_SHA']
          for p in site.rglob('*.html'):
              s=p.read_text()
              if s.count('</head>')!=1: raise SystemExit(f'Missing <head> in {p}')
              s=s.replace('</head>','<meta name="robots" content="noindex,nofollow,noarchive"><meta name="4planet-source-sha" content="'+sha+'"></head>',1)
              p.write_text(s)
          (site/'robots.txt').write_text('User-agent: *\nDisallow: /\n')
          p=site/'_headers'
          p.write_text(p.read_text()+'\n/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n')
          for q in [site/'index.html',site/'app/food/index.html']:
              if '4planet-source-sha' not in q.read_text(): raise SystemExit(f'Unstamped: {q}')
          print('EXACT_NONPRODUCTION_SOURCE_STAMP',sha)
          PY
      - name: Keep downloadable, QA-passed Founder review artifact
        uses: actions/upload-artifact@v4
        with:
          name: four-sapien-review-${{ github.sha }}
          path: products/4sapien/site
          retention-days: 7
      - name: Resolve EXISTING nonproduction Cloudflare Pages branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/king/test
          test -n "$CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          account=''
          for zone in 4sapien.com 4nation.org; do
            zones=$(curl -fsS "$api/zones?name=$zone" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            account=$(jq -r '.result[0].account.id // empty' <<<"$zones")
            test -z "$account" || break
          done
          test -n "$account"
          projects=$(curl -fsS "$api/accounts/$account/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          project=$(jq -r '[.result[]? | select(.name=="4planet-05")][0].name // empty' <<<"$projects")
          production=$(jq -r '[.result[]? | select(.name=="4planet-05")][0].production_branch // empty' <<<"$projects")
          test "$project" = 4planet-05
          test "$production" != 4sapien-first-return-review
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "FOOD_REVIEW_BRANCH=4sapien-first-return-review" >> "$GITHUB_ENV"
      - name: Deploy ISOLATED review branch ONLY — no LIVE or DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Run OUTSIDE repo root: root/functions is for other products and must NOT be bundled into this static 4SAPIEN preview.
          review_dir=$(mktemp -d)
          cp -a products/4sapien/site/. "$review_dir"/
          test ! -d "$review_dir/functions"
          cd "$review_dir"
          npx --yes wrangler@4.128.0 pages deploy . --project-name 4planet-05 --branch "$FOOD_REVIEW_BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=false | tee /tmp/food-review-deploy.txt
          url=$(grep -Eo 'https://[a-z0-9-]+[.]4planet-05[.]pages[.]dev' /tmp/food-review-deploy.txt | head -n1 || true)
          test -n "$url"
          echo "FOOD_REVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "EXACT_FOOD_REVIEW=$url/app/food/"
          echo "LIVE_4SAPIEN_DNS=UNCHANGED"
      - name: Verify HTTP review identity, noindex and shared pantry code
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code=$(curl -L -sS -o /tmp/food-review.html -w '%{http_code}' "$FOOD_REVIEW_URL/app/food/" || true)
            [ "$code" = 200 ] && break
            sleep 3
          done
          test "$code" = 200
          grep -Fq "4planet-source-sha\" content=\"$GITHUB_SHA\"" /tmp/food-review.html
          grep -Fq 'noindex,nofollow,noarchive' /tmp/food-review.html
          grep -Fq 'FoodPantryProof' /tmp/food-review.html
          code=$(curl -L -sS -o /tmp/food-decision.js -w '%{http_code}' "$FOOD_REVIEW_URL/4sapien-pantry-decision.js")
          test "$code" = 200
          grep -Fq 'FourSapienPantryDecision' /tmp/food-decision.js
          {
            echo "### Exact QA-passed 4SAPIEN Founder review — NOT LIVE"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Review URL: $FOOD_REVIEW_URL/app/food/"
            echo "- Existing Pages project: 4planet-05, isolated branch: $FOOD_REVIEW_BRANCH"
            echo "- HTTP 200 + noindex + shared matcher: PASS"
            echo "- Real authenticated second visit/two users/Human Gold: OPEN"
            echo "- Production release, DNS, payment and outreach: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test rendered FOOD review with SYNTHETIC backend only
        env:
          FOOD_REVIEW_URL: ${{ env.FOOD_REVIEW_URL }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          FOOD_REVIEW_URL="$FOOD_REVIEW_URL" npx playwright test tests/e2e/four-sapien-pantry-synthetic.spec.ts --project=desktop-1440 --project=mobile-390
          echo "FOOD_SYNTHETIC_BROWSER_FIRST_RETURN=PASS (NOT REAL AUTH / NOT REAL SUPABASE)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic browser trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-sapien-synthetic-browser
          path: artifacts/atlas-gold
          retention-days: 7
          if-no-files-found: ignore
