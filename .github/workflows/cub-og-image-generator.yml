name: CUB LAB — Generate Share Images
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/cub-og-image-generator.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cub-lab-og-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Convert original editorial art into social preview PNGs
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33.5
          node <<'NODE'
          const sharp=require('sharp');
          const fs=require('fs');
          const targets=[
            {slug:'home',art:'roma-art.svg',eyebrow:'INDEPENDENT GAMES',headline:'WORLDS WORTH PLAYING'},
            {slug:'roma',art:'roma-art.svg',eyebrow:'HISTORICAL STRATEGY',headline:'ROMA: THE REPUBLIC'},
            {slug:'orca',art:'orca-art.svg',eyebrow:'WILDLIFE ADVENTURE',headline:'WILD: ORCA'}
          ];
          (async()=>{
            for(const t of targets){
              const overlay='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><defs><linearGradient id="g"><stop stop-color="#000" stop-opacity=".94"/><stop offset=".62" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><text x="70" y="82" fill="#d7ff64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" letter-spacing="6">CUB LAB / '+t.eyebrow+'</text><text x="69" y="352" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="67" letter-spacing="-2">'+t.headline+'</text><path d="M70 528h300" stroke="#d7ff64" stroke-width="5"/><text x="70" y="575" fill="#d2d2d2" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">PLAYABLE GAMES IN DEVELOPMENT</text></svg>';
              await sharp(fs.readFileSync('site/assets/'+t.art)).resize(1200,630,{fit:'cover'}).composite([{input:Buffer.from(overlay)}]).png({compressionLevel:9}).toFile('site/assets/og-'+t.slug+'.png');
              const v=await sharp('site/assets/og-'+t.slug+'.png').metadata();
              if(v.width!==1200||v.height!==630||v.format!=='png')throw Error('Wrong social preview format');
              console.log('CUB_OG_IMAGE_PASS',t.slug,fs.statSync('site/assets/og-'+t.slug+'.png').size);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit only three social PNG assets to isolated lab branch
        run: |
          set -euo pipefail
          git config user.name 'CUB LAB release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/og-home.png site/assets/og-roma.png site/assets/og-orca.png
          if git diff --cached --quiet; then echo 'NO_IMAGE_CHANGE'; exit 0; fi
          git commit -m 'CUB LAB add original PNG social previews'
          git push origin HEAD:cub-lab-roma-challenger-20261018
          echo 'CUB_OG_IMAGES_COMMITTED'
