name: Dependency Repair Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-tested-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked current dependencies
        run: npm ci

      - name: Generate the tested dependency repair
        run: |
          npm install react-router-dom@6.30.4
          npm install --save-dev eslint@10.8.0 @eslint/js@10.0.1 typescript-eslint@8.65.0

      - name: Verify the repaired dependency tree
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high 2>&1 | tee dependency-audit.log
          status=${PIPESTATUS[0]}
          echo "DEPENDENCY_AUDIT_EXIT=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Contract and smoke tests
        run: npm run test:smoke

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Upload tested dependency files and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-dependency-repair
          path: |
            package.json
            package-lock.json
            dependency-audit.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit the tested repair to the working branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "The tested dependency files are already current."
            exit 0
          fi
          git config user.name "4PLANET programme control"
          git config user.email "odin.skogen@gmail.com"
          git add package.json package-lock.json
          git commit -m "Repair product dependencies and lockfile"
          git push origin HEAD:build/four-product-integrated-prototype
