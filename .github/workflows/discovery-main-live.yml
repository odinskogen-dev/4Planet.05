name: 4PLANET Discoverability Main Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discovery-main-live.yml
      - products/livingsystems/**
      - scripts/build-living-systems-v142.mjs
      - scripts/living-systems-v142-zero-loss.test.mjs
      - public/_redirects
      - public/_headers
      - public/games/**
      - package.json
      - src/pages/integrated/AtlasDiscoveryPage.tsx
      - src/pages/v5/PlanetProof.tsx
      - src/pages/integrated/Species.tsx
      - src/pages/integrated/SpeciesRoute.tsx
      - src/components/layout/PublicShell.tsx
      - src/pages/v5/AboutPages.tsx
      - src/pages/v5/Home.tsx
      - src/pages/v5/AtlasHero.tsx
      - src/styles/home-brand-reset.css
      - src/App.tsx
      - src/earth/AtlasEmbedRuntime.tsx
      - src/routes/router.tsx
      - src/content/imageRegistry.ts
      - src/earth/World.tsx
      - src/earth/PublicWorld.tsx
      - src/earth/atlasViewContract.ts
      - src/styles/human-first-public.css
      - scripts/generate-sitemap.mjs
      - scripts/prerender-discovery-seo.mjs
      - scripts/max-exposure-discovery-contract.test.mjs
      - scripts/max-exposure-main-runtime.test.mjs
      - src/data/discoveryTopics.json
      - src/pages/discovery/DiscoveryEngine.tsx
      - src/data/discoveryInventory.json
      - src/planet/proofs/planetProofs.ts
      - functions/_middleware.js
      - functions/atlas-promoted-places.generated.js
      - src/content/missions.ts

permissions:
  contents: read

concurrency:
  group: 4planet-discovery-main-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token="${token#Bearer }"
          echo "::add-mask::$token"
          zone=$(curl -fsS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$aid"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
      - name: Build current production main
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/livingsystems/index.html
          grep -Fq 'Living Systems' dist/livingsystems/index.html
          grep -Fq 'A system for understanding how nature' dist/livingsystems/index.html
          grep -Fq '<loc>https://4planet.org/livingsystems/</loc>' dist/sitemap.xml
          ls_routes="$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')"
          test "$ls_routes" -gt 0
          echo "LIVING_SYSTEMS_V142_EXPORTED_ROUTES=$ls_routes"
          echo 'LIVING_SYSTEMS_V142_BUILD_ARTIFACT_PASS'
          test -f dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/atlas</loc>' dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/species</loc>' dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/places</loc>' dist/sitemap.xml
          test -f dist/_headers
          test -f dist/robots.txt
          if [ ! -f dist/news-sitemap.xml ]; then
            ! grep -Fq 'news-sitemap.xml' dist/robots.txt
          fi
          node --test scripts/max-exposure-discovery-contract.test.mjs scripts/max-exposure-main-runtime.test.mjs scripts/search-p0-404-runtime.test.mjs
          for route in now wildfires earthquakes whales; do
            test -f "dist/$route/index.html"
            grep -Fq '<h1>' "dist/$route/index.html"
            grep -Fq "rel=\"canonical\" href=\"https://4planet.org/$route\"" "dist/$route/index.html"
          done
          grep -Fq '<loc>https://4planet.org/now</loc>' dist/sitemap.xml
          grep -Fq '<loc>https://4planet.org/wildfires</loc>' dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/place/' dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/species/' dist/sitemap.xml
          echo 'MAX_EXPOSURE_DISCOVERY_BUILD_PASS'
      - name: Deploy exact current main to existing Pages project
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-05 --branch main --commit-hash "$GITHUB_SHA" --commit-message "discoverability closure main"
      - name: Verify public editorial DOM with a real browser (not stale raw HTML copy)
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true});
          try{
            for(const [path,subject] of [['/about/what-we-believe','believe'],['/now/','Earth']]){
              const page=await b.newPage({viewport:{width:390,height:844}});
              const r=await page.goto('https://4planet.org'+path,{waitUntil:'domcontentloaded',timeout:40000});
              assert.equal(r.status(),200,path);
              await page.locator('h1').first().waitFor({timeout:25000});
              const d=await page.evaluate(()=>({heading:document.querySelector('h1')?.textContent||'',text:document.body.innerText||'',scroll:document.documentElement.scrollWidth,viewport:innerWidth}));
              assert.ok(d.heading.length>5,path+' H1');
              assert.ok(d.text.length>350,path+' human content');
              assert.ok(d.text.toLowerCase().includes(subject.toLowerCase()),path+' topic present');
              assert.ok(d.scroll<=d.viewport+16,path+' mobile horizontal overflow');
              console.log('PUBLIC_EDITORIAL_MOBILE_BROWSER_GOLD',path,d.heading.slice(0,85),d.text.length);
              await page.close();
            }
          }finally{await b.close()}
          NODE
      - name: Verify Living Systems v1.4.2 ZERO LOSS custom-domain runtime
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            ls_root=$(curl -fsS --max-time 15 https://4planet.org/livingsystems/ || true)
            if grep -Fq 'A system for understanding how nature' <<<"$ls_root" && grep -Fq 'Living Systems' <<<"$ls_root"; then
              break
            fi
            sleep 4
          done
          grep -Fq 'A system for understanding how nature' <<<"$ls_root"
          grep -Fq 'Living Systems' <<<"$ls_root"
          grep -Fq '/livingsystems/start' <<<"$ls_root"
          assets=$(grep -oE '/livingsystems/_next/static/[^"[:space:]]+' <<<"$ls_root" | sed 's/\\$//' | sort -u)
          test -n "$assets"
          while IFS= read -r asset; do
            curl -fsS --max-time 20 -o /dev/null "https://4planet.org$asset"
          done <<<"$assets"
          route_count=0
          while IFS= read -r file; do
            rel="${file#dist}"
            rel="${rel%index.html}"
            url="https://4planet.org${rel}"
            code=$(curl -sS --max-time 20 -o /tmp/ls-live-page.html -w '%{http_code}' "$url")
            test "$code" = "200"
            grep -Fqi '<html' /tmp/ls-live-page.html
            route_count=$((route_count+1))
          done < <(find dist/livingsystems -type f -name index.html | sort)
          expected_count=$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')
          test "$route_count" = "$expected_count"
          curl -fsS https://4planet.org/livingsystems/start/ | grep -Fq 'Start with a question'
          curl -fsS https://4planet.org/livingsystems/decisions/ | grep -Fq 'Decision'
          curl -fsS https://4planet.org/livingsystems/learning/ | grep -Fq 'Learning'
          curl -fsS https://4planet.org/livingsystems/trust/ | grep -Fq 'Trust'
          curl -fsS https://4planet.org/livingsystems/ecosystems/EC_AMAZON_RAINFOREST/ | grep -Fq 'Amazon'
          curl -fsS https://4planet.org/livingsystems/species/western-honey-bee/ | grep -Fq 'Honey'
          echo "LIVING_SYSTEMS_V142_LIVE_ROUTES=$route_count"
          echo 'LIVING_SYSTEMS_V142_CUSTOM_DOMAIN_PASS'

      - name: Verify ATLAS canonical Place release by status, records and protected links
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for route in / /atlas/ /places /place/berlin /place/manila /place/norway /place/kenya; do
            code=$(curl -sSL --max-time 30 -o /tmp/atlas-live-check.html -w '%{http_code}' "https://4planetatlas.com$route")
            test "$code" = 200
            grep -Fqi '<html' /tmp/atlas-live-check.html
            echo "ATLAS_PUBLIC_ROUTE_HTTP_GOLD $route"
          done
          place_index=$(curl -fsSL https://4planetatlas.com/places)
          grep -Fq 'numberOfItems' <<<"$place_index"
          test "$(grep -o 'href="/place/[^"]*"' <<<"$place_index" | sort -u | wc -l | tr -d ' ')" = 250
          sm=$(curl -fsSL https://4planetatlas.com/sitemap.xml)
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = 250
          test "$(grep -o '<image:loc>https://4planetatlas.com/place/[^<]*/map.svg</image:loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = 250
          grep -Fq '<loc>https://4planetatlas.com/</loc>' <<<"$sm"
          test "$(curl -sS -o /tmp/atlas-not-found.html -w '%{http_code}' https://4planetatlas.com/place/__indexability-canary-not-a-place__)" = 404
          grep -qi noindex /tmp/atlas-not-found.html
          echo 'ATLAS_PLACE_INDEXABILITY_LIVE_PASS'
      - name: Verify production public discovery and 404 transport
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sm=$(curl -fsSL --max-time 25 https://4planet.org/sitemap.xml)
          count=$(grep -o '<loc>' <<<"$sm" | wc -l | tr -d ' ')
          test "$count" -ge 70
          ! grep -Fq '<loc>https://4planet.org/atlas' <<<"$sm"
          ! grep -Fq '<loc>https://4planet.org/species/' <<<"$sm"
          robots=$(curl -fsSL https://4planet.org/robots.txt)
          for bot in OAI-SearchBot Googlebot Bingbot; do grep -Fq "User-agent: $bot" <<<"$robots"; done
          grep -Fq 'Disallow: /os$' <<<"$robots"
          ! grep -Fxq 'Disallow: /os' <<<"$robots"
          for path in / /now/ /about /impact /oslofjord /livingsystems/ /livingsystems/species/western-honey-bee/ /livingsystems/ecosystems/EC_AMAZON_RAINFOREST/; do
            code=$(curl -LsS --max-time 30 -o /tmp/search-public.html -w '%{http_code}' "https://4planet.org$path")
            test "$code" = 200
            grep -Fqi '<html' /tmp/search-public.html
            echo "PUBLIC_RELEASE_ROUTE_GOLD $path"
          done
          for path in /this-is-not-a-published-planet-page-404 /unknown-route/nested-not-a-page /missions/unreleased-fake-mission /place/unreleased-unknown-place; do
            code=$(curl -sS --max-time 25 -o /tmp/search-unknown.html -w '%{http_code}' "https://4planet.org$path")
            test "$code" = 404 || { echo "SOFT_404_REGRESSION $path $code"; exit 12; }
            grep -Fq 'noindex' /tmp/search-unknown.html
            echo "UNKNOWN_URL_404_GOLD $path"
          done
          deep=$(curl -LsS --max-time 30 -o /dev/null -w '%{http_code}' 'https://4planet.org/atlas?embed=news&z=5&c=5%2C18')
          test "$deep" = 200
          target=$(curl -LsS --max-time 30 -o /dev/null -w '%{url_effective}' https://4planet.org/place/kenya)
          test "$target" = https://4planetatlas.com/place/kenya
          echo "MAX_EXPOSURE_LIVE_STATUS_ROUTE_DISCOVERY_GOLD sitemap=$count"

  atlas-live-proof:
    name: ATLAS Place Live Proof
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical ATLAS Place graph
        shell: bash
        run: |
          set -euo pipefail
          places=$(curl -fsS https://4planetatlas.com/places)
          grep -Fq '<h1>Explore the world by place</h1>' <<<"$places"
          test "$(grep -o 'href="/place/[^"]*"' <<<"$places" | sort -u | wc -l | tr -d ' ')" = "250"
          berlin=$(curl -fsS https://4planetatlas.com/place/berlin)
          grep -Fq '1159151529' <<<"$berlin"
          grep -Fq 'Q64' <<<"$berlin"
          grep -Fq '2950159' <<<"$berlin"
          grep -Fq 'World Place Index' <<<"$berlin"
          manila=$(curl -fsS https://4planetatlas.com/place/manila)
          grep -Fq 'Q1461' <<<"$manila"
          grep -Fq 'South-Eastern Asia' <<<"$manila"
          kenya=$(curl -fsS https://4planetatlas.com/place/kenya)
          grep -Fq 'Connected Living Planet Intelligence' <<<"$kenya"
          grep -Fq 'African Savanna Elephant' <<<"$kenya"
          sm=$(curl -fsS https://4planetatlas.com/sitemap.xml)
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = "250"
          unknown=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' https://4planetatlas.com/place/__atlas-live-proof-unknown__)
          test "$unknown" = "404"
          echo 'ATLAS_ENTITY_AUTHORITY_LIVE_PASS'
          echo 'ATLAS_250_LIVE_PROOF_PASS'
