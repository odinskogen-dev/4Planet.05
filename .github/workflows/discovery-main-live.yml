name: 4PLANET Discoverability Main Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discovery-main-live.yml
      - products/livingsystems/**
      - scripts/build-living-systems-v142.mjs
      - scripts/living-systems-v142-zero-loss.test.mjs
      - public/_redirects
      - package.json
      - src/pages/integrated/AtlasDiscoveryPage.tsx
      - src/pages/v5/PlanetProof.tsx
      - src/pages/integrated/Species.tsx
      - src/pages/integrated/SpeciesRoute.tsx
      - src/components/layout/PublicShell.tsx
      - src/pages/v5/Home.tsx
      - src/pages/v5/AtlasHero.tsx
      - src/styles/home-brand-reset.css
      - src/App.tsx
      - src/earth/AtlasEmbedRuntime.tsx
      - src/routes/router.tsx
      - src/content/imageRegistry.ts
      - src/earth/World.tsx
      - src/earth/PublicWorld.tsx
      - src/earth/atlasViewContract.ts
      - src/styles/human-first-public.css
      - scripts/generate-sitemap.mjs
      - scripts/prerender-discovery-seo.mjs
      - src/data/discoveryInventory.json
      - src/planet/proofs/planetProofs.ts
      - functions/_middleware.js
      - functions/atlas-promoted-places.generated.js
      - src/content/missions.ts

permissions:
  contents: read

concurrency:
  group: 4planet-discovery-main-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          token="${token#Bearer }"
          echo "::add-mask::$token"
          zone=$(curl -fsS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$aid"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
      - name: Build current production main
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/livingsystems/index.html
          grep -Fq 'Living Systems' dist/livingsystems/index.html
          grep -Fq 'A system for understanding how nature' dist/livingsystems/index.html
          grep -Fq '<loc>https://4planet.org/livingsystems/</loc>' dist/sitemap.xml
          ls_routes="$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')"
          test "$ls_routes" -gt 0
          echo "LIVING_SYSTEMS_V142_EXPORTED_ROUTES=$ls_routes"
          echo 'LIVING_SYSTEMS_V142_BUILD_ARTIFACT_PASS'
          test -f dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/atlas</loc>' dist/sitemap.xml
          ! grep -Fq '<loc>https://4planet.org/species</loc>' dist/sitemap.xml
          test -f dist/_headers
          test -f dist/robots.txt
          if [ ! -f dist/news-sitemap.xml ]; then
            ! grep -Fq 'news-sitemap.xml' dist/robots.txt
          fi
      - name: Deploy exact current main to existing Pages project
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-05 --branch main --commit-hash "$GITHUB_SHA" --commit-message "discoverability closure main"
      - name: Verify Living Systems v1.4.2 ZERO LOSS custom-domain runtime
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            ls_root=$(curl -fsS --max-time 15 https://4planet.org/livingsystems/ || true)
            if grep -Fq 'A system for understanding how nature' <<<"$ls_root" && grep -Fq 'Living Systems' <<<"$ls_root"; then
              break
            fi
            sleep 4
          done
          grep -Fq 'A system for understanding how nature' <<<"$ls_root"
          grep -Fq 'Living Systems' <<<"$ls_root"
          grep -Fq '/livingsystems/start' <<<"$ls_root"
          assets=$(grep -oE '/livingsystems/_next/static/[^"[:space:]]+' <<<"$ls_root" | sort -u)
          test -n "$assets"
          while IFS= read -r asset; do
            curl -fsS --max-time 20 -o /dev/null "https://4planet.org$asset"
          done <<<"$assets"
          route_count=0
          while IFS= read -r file; do
            rel="${file#dist}"
            rel="${rel%index.html}"
            url="https://4planet.org${rel}"
            code=$(curl -sS --max-time 20 -o /tmp/ls-live-page.html -w '%{http_code}' "$url")
            test "$code" = "200"
            grep -Fqi '<html' /tmp/ls-live-page.html
            route_count=$((route_count+1))
          done < <(find dist/livingsystems -type f -name index.html | sort)
          expected_count=$(find dist/livingsystems -type f -name index.html | wc -l | tr -d ' ')
          test "$route_count" = "$expected_count"
          curl -fsS https://4planet.org/livingsystems/start/ | grep -Fq 'Start with a question'
          curl -fsS https://4planet.org/livingsystems/decisions/ | grep -Fq 'Decision'
          curl -fsS https://4planet.org/livingsystems/learning/ | grep -Fq 'Learning'
          curl -fsS https://4planet.org/livingsystems/trust/ | grep -Fq 'Trust'
          curl -fsS https://4planet.org/livingsystems/ecosystems/EC_AMAZON_RAINFOREST/ | grep -Fq 'Amazon'
          curl -fsS https://4planet.org/livingsystems/species/western-honey-bee/ | grep -Fq 'Honey'
          echo "LIVING_SYSTEMS_V142_LIVE_ROUTES=$route_count"
          echo 'LIVING_SYSTEMS_V142_CUSTOM_DOMAIN_PASS'

      - name: Verify ATLAS Place indexability live
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://4planetatlas.com/robots.txt | grep -Fq 'Sitemap: https://4planetatlas.com/sitemap.xml'
          atlas=$(curl -fsS https://4planetatlas.com/)
          grep -Fq 'https://4planetatlas.com/places' <<<"$atlas"
          grep -Fq 'https://4planetatlas.com/place/berlin' <<<"$atlas"
          echo 'ATLAS_ROOT_CRAWL_PATH_PASS'
          places=$(curl -fsS https://4planetatlas.com/places)
          grep -Fq '<h1>Explore the world by place</h1>' <<<"$places"
          grep -Fq 'numberOfItems' <<<"$places"
          test "$(grep -o 'href="/place/[^"]*"' <<<"$places" | sort -u | wc -l | tr -d ' ')" = "250"
          echo 'ATLAS_PLACE_INDEX_HUB_PASS'
          berlin=$(curl -fsS https://4planetatlas.com/place/berlin)
          grep -Fq '<h1>Berlin</h1>' <<<"$berlin"
          grep -Fq 'name="viewport"' <<<"$berlin"
          grep -Fq 'rel="canonical" href="https://4planetatlas.com/place/berlin"' <<<"$berlin"
          grep -Fq 'BreadcrumbList' <<<"$berlin"
          grep -Fq '"@type":"City"' <<<"$berlin"
          grep -Fq 'Natural Earth 1:50m Populated Places' <<<"$berlin"
          grep -Fq 'Natural Earth NE_ID' <<<"$berlin"
          grep -Fq '1159151529' <<<"$berlin"
          grep -Fq 'Q64' <<<"$berlin"
          grep -Fq '2950159' <<<"$berlin"
          grep -Fq 'Verified geographic hierarchy' <<<"$berlin"
          grep -Fq 'Related places in the current index' <<<"$berlin"
          grep -Fq 'Truth boundary:' <<<"$berlin"
          echo 'ATLAS_BERLIN_ENTITY_PASS'
          manila=$(curl -fsS https://4planetatlas.com/place/manila)
          grep -Fq '<h1>Manila</h1>' <<<"$manila"
          grep -Fq 'Q1461' <<<"$manila"
          grep -Fq '1701668' <<<"$manila"
          grep -Fq 'South-Eastern Asia' <<<"$manila"
          echo 'ATLAS_PROMOTED_MANILA_PASS'
          norway=$(curl -fsS https://4planetatlas.com/place/norway)
          grep -Fq '"@type":"Country"' <<<"$norway"
          grep -Fq 'Places within this geography' <<<"$norway"
          echo 'ATLAS_COUNTRY_GRAPH_PASS'
          kenya=$(curl -fsS https://4planetatlas.com/place/kenya)
          grep -Fq 'Connected Living Planet Intelligence' <<<"$kenya"
          grep -Fq 'African Savanna Elephant' <<<"$kenya"
          grep -Fq 'CLIM4TE_' <<<"$kenya"
          grep -Fq 'Evidence sources' <<<"$kenya"
          echo 'ATLAS_KENYA_EVIDENCE_GRAPH_PASS'
          sm=$(curl -fsS https://4planetatlas.com/sitemap.xml)
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | wc -l | tr -d ' ')" = "250"
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = "250"
          echo 'ATLAS_PLACE_SITEMAP_250_PASS'
          kenya_target=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://4planet.org/place/kenya)
          test "$kenya_target" = "https://4planetatlas.com/place/kenya"
          echo 'ATLAS_PLACE_CANONICAL_REDIRECT_PASS'
          echo 'ATLAS_PLACE_INDEXABILITY_LIVE_PASS'

      - name: Verify production public discovery
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            sm=$(curl -fsS --max-time 15 https://4planet.org/sitemap.xml || true)
            if ! grep -Fq '<loc>https://4planet.org/atlas</loc>' <<<"$sm" && ! grep -Fq '<loc>https://4planet.org/species</loc>' <<<"$sm" && grep -Fq '<loc>https://4planet.org/</loc>' <<<"$sm"; then
              break
            fi
            sleep 4
          done
          ! grep -Fq '<loc>https://4planet.org/atlas</loc>' <<<"$sm"
          ! grep -Fq '<loc>https://4planet.org/species</loc>' <<<"$sm"
          grep -Fq '<loc>https://4planet.org/</loc>' <<<"$sm"
          curl -fsS https://4planetatlas.com/robots.txt | grep -Fq 'Sitemap: https://4planetatlas.com/sitemap.xml'
          curl -fsS https://4brands.org/robots.txt | grep -Fq 'Sitemap: https://4brands.org/sitemap.xml'
          atlas=$(curl -fsS https://4planetatlas.com/)
          grep -Fq '4PLANET ATLAS — Explore the Living Planet' <<<"$atlas"
          atlas_places=$(curl -fsS https://4planetatlas.com/places)
          grep -Fq 'World Place Index' <<<"$atlas_places"
          berlin=$(curl -fsS https://4planetatlas.com/place/berlin)
          grep -Fq '<h1>Berlin</h1>' <<<"$berlin"
          grep -Fq 'Open Berlin in ATLAS' <<<"$berlin"
          grep -Fq 'application/ld+json' <<<"$berlin"
          grep -Fq 'name="viewport"' <<<"$berlin"
          grep -Fq 'Related places in the current index' <<<"$berlin"
          grep -Fq 'Natural Earth 1:50m Populated Places' <<<"$berlin"
          grep -Fq 'Truth boundary:' <<<"$berlin"
          grep -Fq '/place/' <<<"$berlin"
          unknown_code=$(curl -sS -o /tmp/atlas-unknown-place.html -w '%{http_code}' https://4planetatlas.com/place/__indexability-canary-not-a-place__)
          test "$unknown_code" = "404"
          grep -Fq 'Place not found' /tmp/atlas-unknown-place.html
          atlas_sm=$(curl -fsS https://4planetatlas.com/sitemap.xml)
          grep -Fq '<loc>https://4planetatlas.com/place/berlin</loc>' <<<"$atlas_sm"
          grep -Fq '<loc>https://4planetatlas.com/place/oslo</loc>' <<<"$atlas_sm"
          grep -Fq '<loc>https://4planetatlas.com/place/tokyo</loc>' <<<"$atlas_sm"
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$atlas_sm" | wc -l | tr -d ' ')" = "250"
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$atlas_sm" | sort -u | wc -l | tr -d ' ')" = "250"
          echo 'ATLAS_PLACE_INDEXABILITY_LIVE_PASS'
          brands=$(curl -fsS https://4brands.org/)
          grep -Fq '4BRANDS — Understand Any Company. Improve Your Own.' <<<"$brands"
          grep -Fq 'application/ld+json' <<<"$brands"
          grep -Fq 'rel="canonical" href="https://4brands.org/"' <<<"$brands"
          grep -Fq '<h1' <<<"$brands"
          echo 'FOURBRANDS_PUBLIC_SEMANTICS_PASS'
          root=$(curl -fsS https://4planet.org/)
          grep -Fq 'application/ld+json' <<<"$root"
          grep -Fq 'rel="canonical" href="https://4planet.org/"' <<<"$root"
          grep -Fq '<h1' <<<"$root"
          echo 'FOURPLANET_ROOT_SEMANTICS_PASS'
          labs_h=$(curl -sSI https://labs.4planet.org/ | tr -d '\r')
          grep -qi '^x-robots-tag:.*noindex' <<<"$labs_h"
          os_h=$(curl -sSI https://os.4planet.org/ | tr -d '\r')
          grep -qi '^x-robots-tag:.*noindex' <<<"$os_h"
          about=$(curl -fsS https://4planet.org/about)
          grep -Fq 'About 4PLANET' <<<"$about"
          grep -Fq 'rel="canonical" href="https://4planet.org/about"' <<<"$about"
          grep -Fq 'application/ld+json' <<<"$about"
          impact=$(curl -fsS https://4planet.org/impact)
          grep -Fq '4PLANET Impact' <<<"$impact"
          grep -Fq 'rel="canonical" href="https://4planet.org/impact"' <<<"$impact"
          grep -Fq 'application/ld+json' <<<"$impact"
          kenya_target=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://4planet.org/place/kenya)
          test "$kenya_target" = "https://4planetatlas.com/place/kenya"
          grep -Fq '<loc>https://4planet.org/livingsystems/</loc>' <<<"$sm"
          echo 'PLACE_GRAPH_LIVE_PASS'

  atlas-live-proof:
    name: ATLAS Place Live Proof
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical ATLAS Place graph
        shell: bash
        run: |
          set -euo pipefail
          places=$(curl -fsS https://4planetatlas.com/places)
          grep -Fq '<h1>Explore the world by place</h1>' <<<"$places"
          test "$(grep -o 'href="/place/[^"]*"' <<<"$places" | sort -u | wc -l | tr -d ' ')" = "250"
          berlin=$(curl -fsS https://4planetatlas.com/place/berlin)
          grep -Fq '1159151529' <<<"$berlin"
          grep -Fq 'Q64' <<<"$berlin"
          grep -Fq '2950159' <<<"$berlin"
          grep -Fq 'Verified geographic hierarchy' <<<"$berlin"
          manila=$(curl -fsS https://4planetatlas.com/place/manila)
          grep -Fq 'Q1461' <<<"$manila"
          grep -Fq 'South-Eastern Asia' <<<"$manila"
          kenya=$(curl -fsS https://4planetatlas.com/place/kenya)
          grep -Fq 'Connected Living Planet Intelligence' <<<"$kenya"
          grep -Fq 'African Savanna Elephant' <<<"$kenya"
          sm=$(curl -fsS https://4planetatlas.com/sitemap.xml)
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = "250"
          unknown=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' https://4planetatlas.com/place/__atlas-live-proof-unknown__)
          test "$unknown" = "404"
          echo 'ATLAS_ENTITY_AUTHORITY_LIVE_PASS'
          echo 'ATLAS_250_LIVE_PROOF_PASS'
