name: SUPERSAPIEN Real Browser Proof

on:
  push:
    branches: [main]
    paths:
      - tests/e2e/supersapien-live.spec.ts
      - .github/workflows/supersapien-browser-proof.yml
      - ops/supersapien/supersapien-live-worker.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supersapien-browser-proof
  cancel-in-progress: false

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Real custom-domain source journey
        env:
          BASE_URL: https://supersapien.org
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/supersapien-live.spec.ts --project=desktop-1440
