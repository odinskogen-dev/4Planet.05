name: AMM gallery restore verified artwork titles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/amm-gallery-art-titles-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read and verify independent AMM source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch amm/gallery-production https://github.com/odinskogen-dev/odinoddekalv.git amm-src
          test "$(git -C amm-src rev-parse HEAD)" = "2401cae0ba9b3b87cad65c7e9cba1b18509bbe4b"
          test -s amm-src/ammkunst/site/art/n0388.webp
          test -s amm-src/ammkunst/site/art/n0387.webp
          test -s amm-src/ammkunst/site/art/n0397.webp
      - name: Validate AMM JavaScript syntax before publishing
        run: |
          set -euo pipefail
          node --check amm-src/ammkunst/site/assets/app.js
          node - <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const js=fs.readFileSync("amm-src/ammkunst/site/assets/app.js","utf8");
          for (const path of ["/", "/works/", "/works/n0388/", "/about/"]) {
            let html="";
            const element={
              innerHTML:"",
              addEventListener(){},
              setAttribute(){},
              querySelectorAll(){return []},
              querySelector(){return null},
              classList:{toggle(){},contains(){return false}}
            };
            const app={set innerHTML(s){html=s;},get innerHTML(){return html},querySelectorAll(){return []},querySelector(){return null}};
            const dom={getElementById(id){return id==="app"?app:element},querySelector(){return element},addEventListener(){},querySelectorAll(){return []}};
            const context={document:dom,location:{pathname:path,search:"",assign(){}},URLSearchParams,Intl,localStorage:{getItem(){return "[]"},setItem(){}},fetch:async()=>({ok:false}),console};
            vm.runInNewContext(js,context,{filename:"app.js",timeout:3000});
            if(!html.includes("Amalie Myrtvedt") || html.length<200)throw new Error("Page empty on route "+path);
            if(path==="/" && !html.includes('/art/n0388.webp'))throw new Error("Homepage hero missing");
            if(path==="/works/" && !html.includes('/art/n0397.webp'))throw new Error("Works grid missing");
            console.log("AMM_DOM_RENDER_OK "+path+" characters="+html.length);
          }
          NODE
      - name: Resolve existing Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          zones="$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org')"
          account="$(jq -r '.result[0].account.id // empty' <<< "$zones")"
          test -n "$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Deploy AMM website as independent Worker
        working-directory: amm-src/ammkunst
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<'JSON'
          {
            "name":"ammkunst-gallery",
            "compatibility_date":"2026-10-19",
            "workers_dev":true,
            "assets":{"directory":"./site","not_found_handling":"single-page-application"}
          }
          JSON
          rm -f site/_redirects
          npx --yes wrangler@4.151.2 deploy
      - name: Verify live renamed artwork and images
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl -sSL --max-time 20 -o /tmp/amm-app -w '%{http_code}' https://ammkunst.com/assets/app.js || true)"
            picture="$(curl -sSL --max-time 20 -o /tmp/amm-picture -w '%{http_code}' https://ammkunst.com/art/n0388.webp || true)"
            if [[ "$code" = 200 && "$picture" = 200 ]] && grep -q '"Glowing"' /tmp/amm-app && grep -q '"Fløien Fredag"' /tmp/amm-app && test "$(wc -c < /tmp/amm-picture)" -gt 100000; then
              echo 'AMM_ART_TITLES_LIVE=https://ammkunst.com/'
              exit 0
            fi
            echo "Waiting for CDN: app=$code image=$picture"
            sleep 5
          done
          exit 7
