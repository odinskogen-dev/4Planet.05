name: LABS v3 materialize

on:
  push:
    branches:
      - labs/overview-v1
    paths:
      - .labs-v3-payload.tar.gz

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: labs/overview-v1
          fetch-depth: 0

      - name: Materialize LABS v3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labs-v3
          tar -xzf .labs-v3-payload.tar.gz -C /tmp/labs-v3
          cp /tmp/labs-v3/LabsOverview.tsx src/pages/labs/LabsOverview.tsx
          cp /tmp/labs-v3/labs.css src/pages/labs/labs.css
          cp /tmp/labs-v3/labs-contracts.test.mjs scripts/labs-contracts.test.mjs
          cp /tmp/labs-v3/labs.spec.ts tests/e2e/labs.spec.ts
          rm .labs-v3-payload.tar.gz

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4PLANET LABS build"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/labs/LabsOverview.tsx src/pages/labs/labs.css scripts/labs-contracts.test.mjs tests/e2e/labs.spec.ts .labs-v3-payload.tar.gz
          git commit -m "feat(labs): materialize luminous founder project OS v3"
          git push origin HEAD:labs/overview-v1
