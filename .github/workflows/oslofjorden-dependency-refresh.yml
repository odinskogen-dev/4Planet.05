name: Oslofjorden Safe Dependency Refresh

on:
  pull_request:
    branches:
      - phase04/brand-product-convergence
    paths:
      - '.github/workflows/oslofjorden-dependency-refresh.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh patched router and safe transitive fixes
        shell: bash
        run: |
          npm install react-router-dom@7.18.2 --save-exact
          npm audit fix --package-lock-only || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
          npm run typecheck
          npm run build

      - name: Commit lockfile refresh once
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency state already current.'
            exit 0
          fi
          git config user.name '4PLANET controlled QA'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): upgrade React Router and safe audited transitive dependencies'
          git push origin HEAD:${{ github.head_ref }}
