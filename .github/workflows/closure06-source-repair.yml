name: 4PLANET Films Closure 06 Canonical Repair

on:
  push:
    branches:
      - work/magazine-films-premium-closure-05
    paths:
      - 'scripts/closure06-source-repair.mjs'

permissions:
  contents: write

concurrency:
  group: films-closure-06-canonical-repair
  cancel-in-progress: false

jobs:
  apply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/magazine-films-premium-closure-05

      - name: Apply bounded canonical repair
        run: node scripts/closure06-source-repair.mjs

      - name: Verify only canonical film registry changed
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          [ "$changed" = 'src/content/magazineFilms.ts' ] || { echo "Unexpected write scope: $changed"; exit 2; }
          git diff --check

      - name: Commit repair back to same bounded lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '4PLANET Closure 06'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/magazineFilms.ts
          git commit -m 'FILMS CLOSURE 06: repair official sources and metadata'
          git push origin HEAD:work/magazine-films-premium-closure-05
