name: CUB LAB — Premium Pages Live QA
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths:
      - '.github/workflows/cub-premium-pages-qa.yml'
      - 'site/index.html'
      - 'site/games/**'
      - 'site/assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published URLs and preserve ROMA live game
        run: |
          set -euo pipefail
          for page in / /games/roma/ /games/wild-orca/ /roma/; do
            for i in $(seq 1 12); do
              if curl -fsSL --max-time 20 "https://lab.p4nther.com$page" -o /tmp/cubpage.html; then break; fi
              sleep 5
            done
            test -s /tmp/cubpage.html
            echo "CUB_HTTP_OK $page"
          done
          curl -fsSL https://lab.p4nther.com/assets/cub.css -o /tmp/cub.css
          grep -Fq '#000' /tmp/cub.css
          echo 'CSS_PASS'
          curl -fsSL https://lab.p4nther.com/assets/roma-art.svg -o /tmp/roma-art.svg
          grep -Fq '<svg' /tmp/roma-art.svg
          echo 'ROMA_ART_PASS'
          curl -fsSL https://lab.p4nther.com/assets/orca-art.svg -o /tmp/orca-art.svg
          grep -Fq '<svg' /tmp/orca-art.svg
          echo 'ORCA_ART_PASS'
          curl -fsSL https://lab.p4nther.com/games/roma/ -o /tmp/roma-product.html
          grep -Fq 'The Republic' /tmp/roma-product.html
          echo 'ROMA_PRODUCT_PASS'
          curl -fsSL https://lab.p4nther.com/games/wild-orca/ -o /tmp/orca-product.html
          grep -Fiq 'ocean' /tmp/orca-product.html
          echo 'ORCA_PRODUCT_PASS'
          curl -fsSL https://lab.p4nther.com/ -o /tmp/cub-home.html
          grep -Fiq 'Independent game lab' /tmp/cub-home.html
          echo 'CUB_HOME_PASS'
          echo 'CUB_PUBLIC_PREMIUM_CONTENT_PASS'
      - name: Mobile and desktop visual / navigation smoke QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            for(const viewport of [{width:390,height:844},{width:1365,height:900}]){
              const context=await browser.newContext({viewport,deviceScaleFactor:1,isMobile:viewport.width<500,hasTouch:viewport.width<500});
              for(const [path,slug] of [['/','home'],['/games/roma/','roma'],['/games/wild-orca/','orca']]){
                const page=await context.newPage();
                const errs=[];
                page.on('pageerror',e=>errs.push(e.message));
                const response=await page.goto('https://lab.p4nther.com'+path,{waitUntil:'networkidle',timeout:50000});
                await page.locator('img[loading="lazy"]').evaluateAll(imgs=>imgs.forEach(i=>i.loading='eager'));
                await page.waitForFunction(()=>[...document.images].every(i=>i.complete&&i.naturalWidth>0),null,{timeout:15000});
                const metrics=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,inner:window.innerWidth,heading:!!document.querySelector('h1'),images:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src)}));
                const result={slug,viewport,code:response.status(),...metrics,errors:errs};
                console.log('CUB_VISUAL_QA',JSON.stringify(result));
                if(response.status()!==200||!metrics.heading||metrics.scroll>metrics.inner+3||metrics.images.length||errs.length)throw Error('CUB visual QA failed: '+JSON.stringify(result));
                await page.screenshot({path:'cub-'+slug+'-'+viewport.width+'.png',fullPage:true});
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            console.log('CUB_PREMIUM_PAGES_QA_PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cub-premium-pages-qa-images
          path: cub-*.png
          if-no-files-found: ignore
          retention-days: 14
