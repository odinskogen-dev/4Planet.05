name: Finance 2.1 Live Mobile & Brand QA
on:
  push:
    branches: [work/finance-nordic-mobile-shell-20261009]
    paths:
      - 'scripts/finance-live-compact.e2e.mjs'
      - '.github/workflows/finance-live-compact.yml'
permissions:
  contents: read
jobs:
  external-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check actual production 4Finance on desktop and 390px
        run: node scripts/finance-live-compact.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-2-1-live-desktop-mobile
          path: artifacts/finance-live-compact
          if-no-files-found: ignore
          retention-days: 7
