name: ORCA07 Cloudflare Origin Read-Only
on:
  push:
    branches:
      - release/wild-orca-07-20261016
    paths:
      - .github/workflows/orca07-readonly-origin.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only Cloudflare production diagnostics
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'NO_CLOUDFLARE_TOKEN'; exit 1; }
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones=$(curl -fsS --max-time 25 "https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active" "${auth[@]}")
          zid=$(jq -r '.result[0].id // empty' <<<"$zones")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          [[ -n "$account" ]] || { echo 'NO_CLOUDFLARE_ACCOUNT'; exit 1; }
          proj=$(curl -fsS --max-time 25 "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/4planet-05" "${auth[@]}")
          echo "$proj" | jq -c '{success,project:.result.name,production_branch:.result.production_branch,source_type:.result.source.type,source_repo:.result.source.config.repo_name,source_owner:.result.source.config.owner,domains:.result.domains,deployments_enabled:.result.source.config.deployments_enabled,production_deployments_enabled:.result.source.config.production_deployments_enabled}'
          deploys=$(curl -fsS --max-time 25 "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects/4planet-05/deployments?page=1&per_page=3" "${auth[@]}")
          echo "$deploys" | jq -c '{success,recent:[.result[] | {id,environment,url,created_on,source:.deployment_trigger.type,sha:.deployment_trigger.metadata.commit_hash,branch:.deployment_trigger.metadata.branch,stage:(.latest_stage.status // "")}]}'
          echo 'LIVE_HEADERS'
          curl -fsSI --max-time 20 https://4planet.org/games/wild-orca/ | sed -n '/^HTTP\//p;/^content-security-policy:/Ip;/^cache-control:/Ip;/^cf-ray:/Ip'
          echo 'LIVE_BODY_CHECK'
          curl -fsSL --max-time 25 https://4planet.org/games/wild-orca/ -o /tmp/wild-current.html
          wc -c /tmp/wild-current.html
          sha256sum /tmp/wild-current.html
          grep -Foq 'WILD: ORCA 07' /tmp/wild-current.html && echo 'ALREADY_V07' || echo 'CURRENT_OLDER_VERSION'

      - name: Diagnose Pages preview routing without changing live
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://95dcfae7.4planet-05.pages.dev/ \
            https://95dcfae7.4planet-05.pages.dev/games/wild-orca/ \
            https://95dcfae7.4planet-05.pages.dev/games/wild-orca/index.html \
            https://release-wild-orca-07-20261016.4planet-05.pages.dev/games/wild-orca/ \
            https://4planet-05.pages.dev/games/wild-orca/ \
            https://4planet.org/games/wild-orca/; do
            echo "CHECK_URL=$url"
            curl -sSL --max-time 15 -o /tmp/response.txt -w "HTTP=%{http_code} BYTES=%{size_download} REDIRECT=%{url_effective}\\n" "$url" || true
            head -c 160 /tmp/response.txt | tr '\\n' ' '; echo
          done
          echo 'PREVIEW_DIAG_COMPLETE'

      - name: Explain why automatic Pages previews return 404
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active" "${auth[@]}")
          acct=$(jq -r '.result[0].account.id' <<<"$zone")
          obj=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$acct/pages/projects/4planet-05" "${auth[@]}")
          echo "$obj" | jq -c '{name:.result.name,build_config:.result.build_config,source:.result.source,latest_deployment:{id:.result.latest_deployment.id,stage:.result.latest_deployment.latest_stage,status:.result.latest_deployment.status}}'
          deps=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$acct/pages/projects/4planet-05/deployments?page=1&per_page=12" "${auth[@]}")
          echo "$deps" | jq -c '[.result[] | {id,environment,branch:.deployment_trigger.metadata.branch,sha:.deployment_trigger.metadata.commit_hash,stage:.latest_stage,stages:.stages}]'
          curl -fsSL --max-time 10 https://95dcfae7.4planet-05.pages.dev/ -o /tmp/empty-preview.txt || true
          grep -i -E '<title>|404|project not found|pages' /tmp/empty-preview.txt | head -n 12 | cut -c1-180 || true

      - name: Verify completed preview exact source and security
        shell: bash
        run: |
          set -euo pipefail
          url="https://95dcfae7.4planet-05.pages.dev/games/wild-orca/"
          curl -fsSL --max-time 50 "$url" -o /tmp/orca07-preview.html
          actual=$(sha256sum /tmp/orca07-preview.html | cut -d' ' -f1)
          expected="9b255c6f7b92000b77b567eef026e9dbd0eb26197a40ba4f3a5549e98a5093f4"
          echo "PREVIEW_SHA=$actual"
          [[ "$actual" == "$expected" ]]
          grep -Fq 'WILD: ORCA 07' /tmp/orca07-preview.html
          grep -Fq 'NATURE BANK' /tmp/orca07-preview.html
          grep -Fq 'charset="utf-8"' /tmp/orca07-preview.html
          grep -Fq 'viewport-fit=cover' /tmp/orca07-preview.html
          headers=$(curl -fsSI --max-time 35 "$url")
          grep -Fq "'sha256-NyoyCXWy2bG6xHRpw8YjWQuO4EOg3wZXkl/tRbaGLrM='" <<<"$headers"
          grep -Fq "'sha256-cXHmk9tgdh+3sliCzY58Ny1KuJMbYMLt8Dd8LlWl57A='" <<<"$headers"
          grep -Fq "media-src 'self' data: blob:" <<<"$headers"
          curl -fsSL --max-time 25 https://95dcfae7.4planet-05.pages.dev/games/ -o /tmp/games-preview.html
          grep -Fq 'src="/games/wild-orca/"' /tmp/games-preview.html
          echo 'PREVIEW_SHA_CSP_GAME_HUB_PASS'
      - name: Mobile Chromium smoke check (iPhone-sized viewport)
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium >/dev/null
          cat > /tmp/orca_mobile_smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          url='https://95dcfae7.4planet-05.pages.dev/games/wild-orca/'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--enable-webgl','--use-gl=angle','--use-angle=swiftshader'])
              context=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=3,is_mobile=True,has_touch=True)
              page=context.new_page()
              errors=[]
              page.on('pageerror',lambda err:errors.append(str(err)))
              page.on('console',lambda msg:errors.append('console: '+msg.text) if msg.type=='error' else None)
              res=page.goto(url,wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(10000)
              print('BROWSER_HTTP',res.status)
              body=page.locator('body').inner_text(timeout=15000)
              print('BODY_OPENING',repr(body[:1250]))
              print('PAGE_ERRORS',errors[:15])
              page.screenshot(path='/tmp/orca07-mobile.png',full_page=False,timeout=15000)
              assert res.status==200
              assert 'WILD: ORCA' in body
              assert 'NATURE BANK' in body
              assert not any('Content Security Policy' in x or 'Refused to execute inline script' in x for x in errors)
              print('MOBILE_SMOKE_PASS')
              browser.close()
          PY
          python /tmp/orca_mobile_smoke.py
