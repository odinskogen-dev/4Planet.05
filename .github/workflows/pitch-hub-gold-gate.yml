name: Pitch Hub Gold Gate

on:
  pull_request:
    paths:
      - "src/pages/v5/PitchHub.tsx"
      - "src/styles/pitch-hub.css"
      - "src/routes/router.tsx"
      - "scripts/pitch-hub-gold-contract.test.mjs"
      - ".github/workflows/pitch-hub-gold-gate.yml"
  push:
    branches:
      - "recovery/giga03-pitch-hub-gold-02"
    paths:
      - "src/pages/v5/PitchHub.tsx"
      - "src/styles/pitch-hub.css"
      - "src/routes/router.tsx"
      - "scripts/pitch-hub-gold-contract.test.mjs"
      - ".github/workflows/pitch-hub-gold-gate.yml"

permissions:
  contents: read

jobs:
  proof-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/pitch-hub-gold-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build
