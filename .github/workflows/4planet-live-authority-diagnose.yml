name: 4PLANET live authority diagnose

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths: ['.github/workflows/4planet-live-authority-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Cloudflare + live 4planet.org authority
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF3: ${{ secrets.CF_API_TOKEN }}
          CF4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF1:-${CF2:-${CF3:-${CF4:-}}}}"
          test -n "$token"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
          zone_json=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active')
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone_json")
          zone=$(jq -r '.result[0].id // empty' <<<"$zone_json")
          echo "ZONE=${zone} ACCOUNT=${account}"
          echo '=== WORKER CUSTOM DOMAIN AUTHORITY ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/workers/domains" | jq -c '.result[]? | select(.hostname=="4planet.org" or .hostname=="www.4planet.org") | {hostname,service,environment,enabled}'
          echo '=== DNS ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${zone}/dns_records?per_page=100" | jq -c '.result[]? | select(.name=="4planet.org" or .name=="www.4planet.org") | {name,type,content,proxied}'
          echo '=== PAGES PROJECTS WITH 4PLANET DOMAIN ==='
          projects=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects")
          for p in $(jq -r '.result[]?.name' <<<"$projects"); do
            d=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${p}/domains" 2>/dev/null || true)
            if [ -n "$d" ] && jq -e '.result[]? | select(.name=="4planet.org" or .name=="www.4planet.org")' >/dev/null <<<"$d"; then
              echo "PROJECT=${p}"
              jq -c '.result[]? | select(.name=="4planet.org" or .name=="www.4planet.org") | {name,status}' <<<"$d"
              jq -c --arg p "$p" '.result[]? | select(.name==$p) | {name,production_branch,subdomain}' <<<"$projects"
            fi
          done
          echo '=== LIVE HTTP ==='
          curl -fsSL -D /tmp/h.txt https://4planet.org -o /tmp/live.html
          head -n 30 /tmp/h.txt
          python - <<'PY'
          import hashlib,re,pathlib
          b=pathlib.Path('/tmp/live.html').read_bytes(); s=b.decode('utf-8','replace')
          print('LIVE_BYTES',len(b)); print('LIVE_SHA256',hashlib.sha256(b).hexdigest())
          for p in [r'<title>(.*?)</title>',r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)',r'<script[^>]+src=["\']([^"\']+)']:
              m=re.search(p,s,re.I|re.S); print('MATCH',m.group(1)[:300] if m else 'NONE')
          for marker in ['Join','Join 4PLANET','Join free','ATLAS','LIVING PLANET','Search the Living Planet','onOpenOnboarding','4PLANET']:
              print(marker, marker.lower() in s.lower())
          PY
