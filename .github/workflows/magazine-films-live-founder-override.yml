name: 4PLANET Films live founder override

on:
  push:
    branches:
      - work/magazine-public-launch-gold-01
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'playwright.magazine.config.ts'
      - '.github/workflows/magazine-films-live-founder-override.yml'

permissions:
  contents: read

concurrency:
  group: magazine-films-live-founder-override
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Magazine Films source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Magazine and Films contracts
        run: npm run test:magazine

      - name: Production build
        env:
          VITE_MAGAZINE_SITE_ORIGIN: https://4planetmagazine.com
        run: npm run build

      - name: Install Chromium + WebKit for independent Human Gold QA
        run: npx playwright install --with-deps chromium webkit

      - name: Human Gold browser QA — 320 to 1920 + WebKit
        env:
          BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/magazine-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 'http://127.0.0.1:4173/films' || true)
            [ "$code" = '200' ] && break
            sleep 1
          done
          npx playwright test tests/e2e/magazine-films-gold.spec.ts \
            --config playwright.magazine.config.ts \
            --project=mag-desktop-1440 \
            --project=mag-desktop-1920 \
            --project=mag-tablet-1024 \
            --project=mag-tablet-768 \
            --project=mag-android-412 \
            --project=mag-mobile-430 \
            --project=mag-mobile-390 \
            --project=mag-mobile-375 \
            --project=mag-mobile-320 \
            --project=mag-webkit-430 \
            --project=mag-webkit-390

      - name: Preserve Human Gold QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazine-films-live-07-${{ github.sha }}
          path: |
            magazine-test-results/**/*.png
            artifacts/magazine-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve Cloudflare credentials
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          [ -n "$TOKEN" ] || { echo 'Cloudflare token unavailable'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          zones="$RUNNER_TEMP/zones.json"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" 'https://api.cloudflare.com/client/v4/zones?name=4planetmagazine.com' > "$zones"
          account_id=$(jq -r '.result[0].account.id // empty' "$zones")
          [ -n "$account_id" ] || { echo 'Cloudflare account could not be resolved'; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy exact build to Pages
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/pages-deploy.log"
          npx --yes wrangler@latest pages deploy dist \
            --project-name=4planet-05 \
            --branch=magazine-live-films \
            --commit-hash="$GITHUB_SHA" 2>&1 | tee "$deploy_log"
          upstream=$(grep -Eo 'https://[0-9a-f]{8}\.4planet-05\.pages\.dev' "$deploy_log" | head -1 || true)
          [ -n "$upstream" ] || { echo 'Could not resolve immutable Pages deployment URL'; exit 4; }
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$upstream/films/" || true)
            if [ "$code" = '200' ]; then
              echo "FILMS_UPSTREAM=$upstream" >> "$GITHUB_ENV"
              echo "PAGES IMMUTABLE: $upstream"
              exit 0
            fi
            sleep 3
          done
          exit 5

      - name: Promote exact Magazine + Films build to LIVE
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.mjs" <<EOF
          const UPSTREAM = "${FILMS_UPSTREAM}";
          const SOURCE_SHA = "${GITHUB_SHA}";
          const APEX = "4planetmagazine.com";
          const STATIC_FILES = new Set(["/favicon.ico","/favicon.svg","/apple-touch-icon.png","/og.png","/robots.txt","/sitemap.xml","/magazine-sitemap.xml","/magazine-robots.txt","/news-sitemap.xml","/rss.xml","/manifest.webmanifest","/site.webmanifest","/4planet-indexnow-2026-9f7b3c1d5e8a.txt"]);
          const allowedEditorial = (p) => p === "/magazine" || p === "/magazine/" || p.startsWith("/magazine/") || p === "/films" || p === "/films/" || p.startsWith("/films/") || p.startsWith("/assets/") || STATIC_FILES.has(p);
          const blocked = () => new Response("Not Found", {status:404, headers:{"content-type":"text/plain; charset=utf-8","x-robots-tag":"noindex, nofollow","x-4planet-surface":"magazine-only-live"}});
          export default { async fetch(request) {
            const incoming = new URL(request.url);
            if (incoming.hostname === "www.4planetmagazine.com") { incoming.hostname = APEX; return Response.redirect(incoming.toString(), 308); }
            if (incoming.pathname === "/" || incoming.pathname === "") { incoming.pathname = "/magazine/"; return Response.redirect(incoming.toString(), 308); }
            const atlasEmbed = incoming.pathname === "/atlas" && incoming.searchParams.get("embed") === "mag";
            if (!allowedEditorial(incoming.pathname) && !atlasEmbed) return blocked();
            let upstreamPath = incoming.pathname;
            if (incoming.pathname === "/robots.txt") upstreamPath = "/magazine-robots.txt";
            if (incoming.pathname === "/sitemap.xml") upstreamPath = "/magazine-sitemap.xml";
            const upstream = new URL(upstreamPath, UPSTREAM);
            upstream.search = incoming.search;
            const response = await fetch(new Request(upstream.toString(), request));
            const headers = new Headers(response.headers);
            headers.delete("x-robots-tag");
            headers.set("x-4planet-surface", atlasEmbed ? "magazine-atlas-embed" : "magazine-only-live");
            headers.set("x-4planet-source-sha", SOURCE_SHA);
            if ((headers.get("content-type") || "").includes("text/html")) {
              headers.set("cache-control", "no-store");
              headers.set("x-robots-tag", atlasEmbed ? "noindex, nofollow" : "index, follow, max-image-preview:large");
            }
            return new Response(response.body, {status:response.status,statusText:response.statusText,headers});
          }};
          EOF
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmagazine-test-king"
          main = "$RUNNER_TEMP/worker.mjs"
          compatibility_date = "2026-09-07"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmagazine.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmagazine.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml" | tee "$RUNNER_TEMP/worker-deploy.log"

      - name: Verify exact build LIVE — 40 Films + crawler/search proof
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          verify_live() {
            local url="$1"
            for attempt in $(seq 1 30); do
              headers=$(curl -sS -D - -o /dev/null --connect-timeout 10 --max-time 30 "$url" | tr -d '\r' || true)
              code=$(printf '%s\n' "$headers" | awk '/^HTTP\//{c=$2} END{print c}')
              sha=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="x-4planet-source-sha"{s=$2} END{print s}')
              if [ "$code" = '200' ] && [ "$sha" = "$expected_sha" ]; then
                echo "PASS $url source=$sha"
                return 0
              fi
              sleep 3
            done
            echo "FAIL $url expected source=$expected_sha"
            return 1
          }

          node --input-type=module <<'NODE' > "$RUNNER_TEMP/film-slugs.txt"
          import fs from 'node:fs';
          const source = fs.readFileSync('src/content/magazineFilms.ts','utf8');
          const section = source.split('const published: FilmRecord[] = [')[1]?.split('];\n\nconst research: FilmRecord[] = [')[0] ?? '';
          const slugs = [...section.matchAll(/\bslug:\s*"([^"]+)"/g)].map(m => m[1]);
          if (slugs.length !== 40) throw new Error(`Expected 40 published films, found ${slugs.length}`);
          process.stdout.write(`${slugs.join('\n')}\n`);
          NODE

          verify_live 'https://4planetmagazine.com/magazine/'
          verify_live 'https://4planetmagazine.com/films/'
          route_count=0
          while IFS= read -r slug || [ -n "$slug" ]; do
            [ -z "$slug" ] && continue
            verify_live "https://4planetmagazine.com/films/$slug/"
            route_count=$((route_count + 1))
          done < "$RUNNER_TEMP/film-slugs.txt"
          [ "$route_count" -eq 40 ] || { echo "Expected 40 live film routes, verified $route_count"; exit 7; }

          for topic in OCEAN LAND_WILDLIFE FOOD CLIMATE ENERGY SOLUTIONS PEOPLE; do
            verify_live "https://4planetmagazine.com/films/?topic=$topic"
          done

          sitemap=$(curl -fsS 'https://4planetmagazine.com/magazine-sitemap.xml')
          sitemap_count=0
          while IFS= read -r slug || [ -n "$slug" ]; do
            [ -z "$slug" ] && continue
            printf '%s' "$sitemap" | grep -q "https://4planetmagazine.com/films/$slug"
            sitemap_count=$((sitemap_count + 1))
          done < "$RUNNER_TEMP/film-slugs.txt"
          [ "$sitemap_count" -eq 40 ] || exit 8

          robots=$(curl -fsS 'https://4planetmagazine.com/robots.txt')
          printf '%s' "$robots" | grep -q 'User-agent: OAI-SearchBot'
          printf '%s' "$robots" | grep -q 'User-agent: Googlebot'
          printf '%s' "$robots" | grep -q 'User-agent: Bingbot'
          printf '%s' "$robots" | grep -q 'Allow: /films'

          films_html=$(curl -fsS 'https://4planetmagazine.com/films/')
          printf '%s' "$films_html" | grep -q '<title>4PLANET FILMS — Films worth your attention</title>'
          printf '%s' "$films_html" | grep -q '<link rel="canonical" href="https://4planetmagazine.com/films">'
          printf '%s' "$films_html" | grep -q 'data-4planet-static-prerender="films-index"'
          printf '%s' "$films_html" | grep -q '"@type":"ItemList"'
          if printf '%s' "$films_html" | grep -qi 'qualified records\|editorial pipeline'; then exit 9; fi

          yanuni_html=$(curl -fsS 'https://4planetmagazine.com/films/yanuni/')
          printf '%s' "$yanuni_html" | grep -q '<title>YANUNI — 4PLANET FILMS</title>'
          printf '%s' "$yanuni_html" | grep -q 'data-4planet-static-prerender="film-detail"'
          printf '%s' "$yanuni_html" | grep -q 'Why 4PLANET selected it'
          printf '%s' "$yanuni_html" | grep -q '"@type":"BreadcrumbList"'

          magazine_html=$(curl -fsS 'https://4planetmagazine.com/magazine/')
          printf '%s' "$magazine_html" | grep -q 'data-4planet-static-prerender="magazine-index"'

          key=$(curl -fsS 'https://4planetmagazine.com/4planet-indexnow-2026-9f7b3c1d5e8a.txt' | tr -d '\r\n')
          [ "$key" = '4planet-indexnow-2026-9f7b3c1d5e8a' ] || { echo 'IndexNow key verification failed'; exit 10; }

          node --input-type=module <<'NODE' > "$RUNNER_TEMP/external-film-links.txt"
          import fs from 'node:fs';
          const source = fs.readFileSync('src/content/magazineFilms.ts','utf8');
          const section = source.split('const published: FilmRecord[] = [')[1]?.split('];\n\nconst research: FilmRecord[] = [')[0] ?? '';
          const urls = [...new Set([...section.matchAll(/\b(?:watchUrl|sourceUrl):\s*"(https:\/\/[^\"]+)"/g)].map(m => m[1]))];
          process.stdout.write(`${urls.join('\n')}\n`);
          NODE
          external_fail=0
          external_count=0
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            external_count=$((external_count + 1))
            code=$(curl -L -sS -A 'Mozilla/5.0 4PLANET-Link-QA/1.0' -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
            case "$code" in
              404|410) echo "BROKEN EXTERNAL FILM LINK $code $url"; external_fail=1 ;;
              000|401|403|429) echo "AUTOMATION-UNVERIFIED EXTERNAL FILM LINK $code $url" ;;
              *) echo "REACHABLE EXTERNAL FILM LINK $code $url" ;;
            esac
          done < "$RUNNER_TEMP/external-film-links.txt"
          [ "$external_count" -gt 0 ] || exit 11
          [ "$external_fail" = '0' ] || exit 12
          echo "LIVE GOLD PROOF PASS — source $expected_sha — 40/40 Film routes"

      - name: Notify IndexNow after verified LIVE content change
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          key='4planet-indexnow-2026-9f7b3c1d5e8a'
          sitemap=$(curl -fsS 'https://4planetmagazine.com/magazine-sitemap.xml')
          printf '%s' "$sitemap" | grep -o 'https://4planetmagazine.com[^<]*' > "$RUNNER_TEMP/indexnow-urls.txt"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/indexnow.json"
          import fs from 'node:fs';
          const urls = fs.readFileSync(process.env.RUNNER_TEMP + '/indexnow-urls.txt','utf8').trim().split('\n').filter(Boolean);
          const key = '4planet-indexnow-2026-9f7b3c1d5e8a';
          process.stdout.write(JSON.stringify({ host:'4planetmagazine.com', key, keyLocation:`https://4planetmagazine.com/${key}.txt`, urlList:urls }));
          NODE
          code=$(curl -sS -o "$RUNNER_TEMP/indexnow-response.txt" -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data-binary @"$RUNNER_TEMP/indexnow.json" 'https://api.indexnow.org/indexnow' || true)
          echo "INDEXNOW HTTP $code"
          case "$code" in 200|202) exit 0 ;; *) cat "$RUNNER_TEMP/indexnow-response.txt"; exit 1 ;; esac
