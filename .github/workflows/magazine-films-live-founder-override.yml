name: 4PLANET Films live founder override

on:
  push:
    branches:
      - work/magazine-public-launch-gold-01
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'playwright.magazine.config.ts'
      - '.github/workflows/magazine-films-live-founder-override.yml'

permissions:
  contents: read

concurrency:
  group: magazine-films-live-founder-override
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Magazine Gold source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve YANUNI exact official watch route
        shell: bash
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/leonardo-youtube.xml"
          if curl -fsSL --connect-timeout 10 --max-time 30 'https://www.youtube.com/feeds/videos.xml?channel_id=UChlkJxkgWqVc11Cwuz1GSbg' > "$feed"; then
            video_id=$(python - "$feed" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          atom = {'a': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015'}
          candidates = []
          for entry in root.findall('a:entry', atom):
              title = (entry.findtext('a:title', default='', namespaces=atom) or '').strip()
              video_id = (entry.findtext('yt:videoId', default='', namespaces=atom) or '').strip()
              low = title.lower()
              if 'yanuni' in low and 'trailer' not in low and video_id:
                  candidates.append((title, video_id))
          if candidates:
              print(candidates[0][1])
              print(f'YANUNI RSS MATCH: {candidates[0][0]}', file=sys.stderr)
          PY
            )
            if [ -n "$video_id" ]; then
              expected="https://www.youtube.com/watch?v=$video_id"
              current=$(python - <<'PY'
          import re
          source = open('src/content/magazineFilms.ts', encoding='utf-8').read()
          block = source.split('slug: "yanuni"', 1)[1].split('\n  },', 1)[0]
          match = re.search(r'watchUrl:\s*"([^"]+)"', block)
          print(match.group(1) if match else '')
          PY
              )
              echo "YANUNI exact official full-film route: $expected"
              if [ "$current" != "$expected" ]; then
                echo "YANUNI EXACT ROUTE REQUIRED: canonical registry currently has $current"
                exit 12
              fi
            else
              echo "YANUNI RSS: no non-trailer YANUNI upload resolved; retaining source-bounded channel route."
            fi
          else
            echo "YANUNI RSS unavailable from CI; retaining source-bounded channel route and explicit availability caveat."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Magazine quality and contract tests
        run: npm run test:magazine

      - name: Production build
        env:
          VITE_MAGAZINE_SITE_ORIGIN: https://4planetmagazine.com
        run: npm run build

      - name: Install Chromium for independent Films browser QA
        run: npx playwright install --with-deps chromium

      - name: Premium Films browser QA — 320 375 390 430 1440
        env:
          BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/magazine-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 'http://127.0.0.1:4173/films' || true)
            [ "$code" = '200' ] && break
            sleep 1
          done
          npx playwright test tests/e2e/magazine-films-gold.spec.ts \
            --config playwright.magazine.config.ts \
            --project=mag-desktop-1440 \
            --project=mag-mobile-430 \
            --project=mag-mobile-390 \
            --project=mag-mobile-375 \
            --project=mag-mobile-320

      - name: Preserve premium browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazine-films-premium-proof-${{ github.sha }}
          path: |
            magazine-test-results
            magazine-playwright-report
            artifacts/magazine-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve Cloudflare credentials
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && TOKEN="$candidate" && break
          done
          [ -n "$TOKEN" ] || { echo 'Cloudflare token unavailable'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          zones="$RUNNER_TEMP/zones.json"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" 'https://api.cloudflare.com/client/v4/zones?name=4planetmagazine.com' > "$zones"
          account_id=$(jq -r '.result[0].account.id // empty' "$zones")
          [ -n "$account_id" ] || { echo 'Cloudflare account could not be resolved'; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy exact Films build to isolated Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/pages-deploy.log"
          npx --yes wrangler@latest pages deploy dist \
            --project-name=4planet-05 \
            --branch=magazine-live-films \
            --commit-hash="$GITHUB_SHA" 2>&1 | tee "$deploy_log"
          upstream=$(grep -Eo 'https://[0-9a-f]{8}\.4planet-05\.pages\.dev' "$deploy_log" | head -1 || true)
          [ -n "$upstream" ] || { echo 'Could not resolve immutable Pages deployment URL.'; exit 4; }
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$upstream/films" || true)
            [ "$code" = '200' ] && { echo "FILMS_UPSTREAM=$upstream" >> "$GITHUB_ENV"; echo "Pages upstream ready: $upstream"; exit 0; }
            sleep 4
          done
          echo "New Magazine Films Pages upstream did not become reachable: $upstream"
          exit 5

      - name: Promote bounded Magazine + Films worker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.mjs" <<EOF
          const UPSTREAM = "${FILMS_UPSTREAM}";
          const SOURCE_SHA = "${GITHUB_SHA}";
          const APEX = "4planetmagazine.com";
          const STATIC_FILES = new Set(["/favicon.ico","/favicon.svg","/apple-touch-icon.png","/og.png","/robots.txt","/sitemap.xml","/magazine-sitemap.xml","/magazine-robots.txt","/news-sitemap.xml","/rss.xml","/manifest.webmanifest","/site.webmanifest"]);
          const allowedEditorial = (p) => p === "/magazine" || p === "/magazine/" || p.startsWith("/magazine/") || p === "/films" || p === "/films/" || p.startsWith("/films/") || p.startsWith("/assets/") || STATIC_FILES.has(p);
          const blocked = () => new Response("Not Found", {status:404, headers:{"content-type":"text/plain; charset=utf-8","x-robots-tag":"noindex, nofollow","x-4planet-surface":"magazine-only-live"}});
          export default { async fetch(request) {
            const incoming = new URL(request.url);
            if (incoming.hostname === "www.4planetmagazine.com") { incoming.hostname = APEX; return Response.redirect(incoming.toString(), 308); }
            if (incoming.pathname === "/" || incoming.pathname === "") { incoming.pathname = "/magazine/"; return Response.redirect(incoming.toString(), 308); }
            const atlasEmbed = incoming.pathname === "/atlas" && incoming.searchParams.get("embed") === "mag";
            if (!allowedEditorial(incoming.pathname) && !atlasEmbed) return blocked();
            let upstreamPath = incoming.pathname;
            if (incoming.pathname === "/robots.txt") upstreamPath = "/magazine-robots.txt";
            if (incoming.pathname === "/sitemap.xml") upstreamPath = "/magazine-sitemap.xml";
            const upstream = new URL(upstreamPath, UPSTREAM);
            upstream.search = incoming.search;
            const response = await fetch(new Request(upstream.toString(), request));
            const headers = new Headers(response.headers);
            headers.delete("x-robots-tag");
            headers.set("x-4planet-surface", atlasEmbed ? "magazine-atlas-embed" : "magazine-only-live");
            headers.set("x-4planet-source-sha", SOURCE_SHA);
            if ((headers.get("content-type") || "").includes("text/html")) {
              headers.set("cache-control", "no-store");
              headers.set("x-robots-tag", atlasEmbed ? "noindex, nofollow" : "index, follow, max-image-preview:large");
            }
            return new Response(response.body, {status:response.status,statusText:response.statusText,headers});
          }};
          EOF
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmagazine-test-king"
          main = "$RUNNER_TEMP/worker.mjs"
          compatibility_date = "2026-09-06"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmagazine.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmagazine.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"

      - name: Verify exact Films build live — premium acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$GITHUB_SHA"
          verify_live() {
            local url="$1"
            local expected="$2"
            for attempt in $(seq 1 30); do
              headers=$(curl -fsSI --connect-timeout 10 --max-time 30 "$url" | tr -d '\r' || true)
              code=$(printf '%s\n' "$headers" | awk 'NR==1{print $2}')
              if [ "$code" = "$expected" ] &&
                 printf '%s\n' "$headers" | grep -qi '^x-4planet-surface: magazine-only-live$' &&
                 printf '%s\n' "$headers" | grep -qi "^x-4planet-source-sha: $expected_sha$"; then
                echo "PASS $url"
                return 0
              fi
              sleep 4
            done
            echo "FAIL $url"
            return 1
          }

          node --input-type=module <<'NODE' > "$RUNNER_TEMP/film-slugs.txt"
          import fs from 'node:fs';
          const source = fs.readFileSync('src/content/magazineFilms.ts','utf8');
          const section = source.split('const published: FilmRecord[] = [')[1]?.split('];\n\nconst research: FilmRecord[] = [')[0] ?? '';
          const slugs = [...section.matchAll(/\bslug:\s*"([^"]+)"/g)].map(m => m[1]);
          if (slugs.length !== 20) throw new Error(`Expected 20 published films, found ${slugs.length}`);
          process.stdout.write(`${slugs.join('\n')}\n`);
          NODE

          verify_live 'https://4planetmagazine.com/magazine/' '200'
          verify_live 'https://4planetmagazine.com/films' '200'
          route_count=0
          while IFS= read -r slug || [ -n "$slug" ]; do
            [ -z "$slug" ] && continue
            verify_live "https://4planetmagazine.com/films/$slug" '200'
            route_count=$((route_count + 1))
          done < "$RUNNER_TEMP/film-slugs.txt"
          [ "$route_count" -eq 20 ] || { echo "Expected 20 live film routes, verified $route_count"; exit 7; }

          for topic in OCEAN LAND_WILDLIFE FOOD CLIMATE ENERGY SOLUTIONS PEOPLE; do
            verify_live "https://4planetmagazine.com/films?topic=$topic" '200'
          done

          sitemap=$(curl -fsS 'https://4planetmagazine.com/magazine-sitemap.xml')
          printf '%s' "$sitemap" | grep -q 'https://4planetmagazine.com/films'
          sitemap_count=0
          while IFS= read -r slug || [ -n "$slug" ]; do
            [ -z "$slug" ] && continue
            printf '%s' "$sitemap" | grep -q "https://4planetmagazine.com/films/$slug"
            sitemap_count=$((sitemap_count + 1))
          done < "$RUNNER_TEMP/film-slugs.txt"
          [ "$sitemap_count" -eq 20 ] || { echo "Expected 20 Films sitemap routes, verified $sitemap_count"; exit 8; }
          robots=$(curl -fsS 'https://4planetmagazine.com/robots.txt')
          printf '%s' "$robots" | grep -q 'Allow: /films'

          films_html=$(curl -fsS 'https://4planetmagazine.com/films')
          printf '%s' "$films_html" | grep -q '<title>4PLANET FILMS — Films worth your attention</title>'
          printf '%s' "$films_html" | grep -q '<link rel="canonical" href="https://4planetmagazine.com/films">'
          biggest_html=$(curl -fsS 'https://4planetmagazine.com/films/the-biggest-little-farm')
          printf '%s' "$biggest_html" | grep -q '<title>The Biggest Little Farm — 4PLANET FILMS</title>'
          printf '%s' "$biggest_html" | grep -q '<link rel="canonical" href="https://4planetmagazine.com/films/the-biggest-little-farm">'
          printf '%s' "$biggest_html" | grep -q '"@type":"Movie"'

          node --input-type=module <<'NODE' > "$RUNNER_TEMP/film-assets.txt"
          import fs from 'node:fs';
          const source = fs.readFileSync('src/content/magazineFilms.ts','utf8');
          const assets = [...new Set([...source.matchAll(/"(\/assets\/[^"]+)"/g)].map(m => m[1]))];
          process.stdout.write(`${assets.join('\n')}\n`);
          NODE
          while IFS= read -r asset || [ -n "$asset" ]; do
            [ -n "$asset" ] && verify_live "https://4planetmagazine.com$asset" '200'
          done < "$RUNNER_TEMP/film-assets.txt"
          verify_live 'https://4planetmagazine.com/assets/missions/4film/hero.jpg' '200'

          node --input-type=module <<'NODE' > "$RUNNER_TEMP/external-film-links.txt"
          import fs from 'node:fs';
          const source = fs.readFileSync('src/content/magazineFilms.ts','utf8');
          const section = source.split('const published: FilmRecord[] = [')[1]?.split('];\n\nconst research: FilmRecord[] = [')[0] ?? '';
          const urls = [...new Set([...section.matchAll(/\b(?:watchUrl|sourceDescriptionUrl):\s*"(https:\/\/[^\"]+)"/g)].map(m => m[1]))];
          process.stdout.write(`${urls.join('\n')}\n`);
          NODE
          external_fail=0
          external_count=0
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            external_count=$((external_count + 1))
            code=$(curl -L -sS -A 'Mozilla/5.0 4PLANET-Link-QA/1.0' -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
            case "$code" in
              404|410) echo "BROKEN EXTERNAL FILM LINK $code $url"; external_fail=1 ;;
              000) echo "UNVERIFIED EXTERNAL FILM LINK $code $url" ;;
              *) echo "REACHABLE EXTERNAL FILM LINK $code $url" ;;
            esac
          done < "$RUNNER_TEMP/external-film-links.txt"
          [ "$external_count" -gt 0 ] || { echo 'No external film links were verified'; exit 9; }
          [ "$external_fail" = '0' ] || exit 10
