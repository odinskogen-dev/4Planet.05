name: ATLAS v43 isolated pre-production QA
on:
  push:
    branches: [review/atlas-v43-preview-20261008]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R1 and exact v43 full-source overlay
        run: |
          set -euo pipefail
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Compile pinned worldwide place data and verify exact checksum
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-atlas-places.mjs
          actual=$(cd public/atlas-data/places/v1 && find . -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          test "$actual" = '07143a68144f6b118689e42f30878077b3b5b5a062c0686044c8f54fd70ed4b4'
          echo "V43_PLACE_DATA_PASS $actual"
      - name: Regression gates and build
        run: |
          set -euo pipefail
          npm run typecheck
          node --test scripts/atlas-v43-contract.test.mjs scripts/atlas-human-awe-contract.test.mjs scripts/seo-ownership-contract.test.mjs scripts/atlas-mobile-context-control-contract.test.mjs scripts/atlas-recovery-contract.test.mjs
          npm run build:atlas
          test -f dist/atlas-data/places/v1/manifest.json
          grep -R -Fq 'data-atlas-mobile-closure' dist/assets
          echo V43_VERIFIED
      - name: Resolve existing preview credentials and read active ATLAS domain routing
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -z "$candidate" ] || { token="$candidate"; break; }
          done
          [ -n "$token" ]
          token=$(printf '%s' "$token" | tr -d '\r\n'); token="${token#Bearer }"; token="${token#bearer }"
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          zone=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=4planetatlas.com&status=active' -H "Authorization: Bearer $token")
          id=$(jq -r '.result[0].id // empty' <<< "$zone")
          account=$(jq -r '.result[0].account.id // empty' <<< "$zone")
          [ -n "$id" ] && [ -n "$account" ]
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          dns=$(curl -fsS "https://api.cloudflare.com/client/v4/zones/$id/dns_records?name=4planetatlas.com&type=CNAME" -H "Authorization: Bearer $token")
          route=$(jq -r '.result[0].content // "not-a-CNAME"' <<< "$dns")
          echo "ATLAS_CURRENT_DNS_ROUTE $route"
          echo "Current ATLAS DNS target: $route" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy v43 non-production preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-05 --branch atlas-v43-20261008 --commit-hash "$GITHUB_SHA" --commit-message "ATLAS v43 isolated QA $GITHUB_SHA"
          url=https://atlas-v43-20261008.4planet-05.pages.dev
          for i in $(seq 1 20); do
            status=$(curl -sS -L --max-time 25 -o /tmp/check.html -w '%{http_code}' "$url/atlas" || true)
            if [ "$status" = '200' ] && grep -q 'id="root"' /tmp/check.html; then break; fi
            sleep 2
          done
          test "$status" = '200'
          curl -fsS "$url/atlas-data/places/v1/manifest.json" | jq -e '.v==1 and .cellDegrees==5' >/dev/null
          curl -fsS --max-time 30 "$url/api/atlas-place?lat=60.39&lon=5.32&land=1&town=Bergen&tlat=60.392&tlon=5.324" -o /tmp/place.json
          jq -e '.ecoregion.status != null and .about.status != null' /tmp/place.json >/dev/null
          jq '{ecoregion: .ecoregion.status, about: .about.status}' /tmp/place.json
          echo "V43_PREVIEW_PASS $url/atlas"
          echo "V43 preview: $url/atlas" >> "$GITHUB_STEP_SUMMARY"

      - name: Founder-approved direct ATLAS production release
        run: |
          set -euo pipefail
          echo "Confirming dedicated ATLAS domain is already attached (no DNS writes)"
          token="$CLOUDFLARE_API_TOKEN"
          zone=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=4planetatlas.com&status=active' -H "Authorization: Bearer $token")
          id=$(jq -r '.result[0].id // empty' <<< "$zone")
          dns=$(curl -fsS "https://api.cloudflare.com/client/v4/zones/$id/dns_records?name=4planetatlas.com&type=CNAME" -H "Authorization: Bearer $token")
          route=$(jq -r '.result[0].content // empty' <<< "$dns")
          test "$route" = '4planet-atlas.pages.dev'
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/4planet-atlas/domains/4planetatlas.com" -H "Authorization: Bearer $token" -o /tmp/atlas-domain-association.json
          jq -e '.success==true' /tmp/atlas-domain-association.json >/dev/null
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-atlas --branch main --commit-hash "$GITHUB_SHA" --commit-message "ATLAS v43 R1.1 FOUNDER OVERRIDE live $GITHUB_SHA"
          echo 'ATLAS_V43_PRODUCTION_DEPLOY_SUBMITTED'
      - name: Verify 4planetatlas.com production, real-place sources and time
        run: |
          set -euo pipefail
          root='https://4planetatlas.com'
          js=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          [ -n "$js" ]
          for i in $(seq 1 35); do
            code=$(curl -sS --max-time 30 -o /tmp/atlas-live-v43.html -w '%{http_code}' "$root/" || true)
            if [ "$code" = 200 ] && grep -Fq "$js" /tmp/atlas-live-v43.html; then break; fi
            sleep 3
          done
          test "$code" = 200
          grep -Fq "$js" /tmp/atlas-live-v43.html
          grep -Fq 'rel="canonical" href="https://4planetatlas.com/"' /tmp/atlas-live-v43.html
          curl -fsS --max-time 30 "$root/atlas-data/places/v1/manifest.json" -o /tmp/live-places.json
          jq -e '.v==1 and .cellDegrees==5' /tmp/live-places.json >/dev/null
          curl -fsS --max-time 30 "$root/api/atlas-place?lat=60.39&lon=5.32&land=1&town=Bergen&tlat=60.392&tlon=5.324" -o /tmp/live-bergen.json
          jq -e '.ecoregion.status!=null and .about.status!=null' /tmp/live-bergen.json >/dev/null
          jq '{ecoregion: .ecoregion.status, about: .about.status}' /tmp/live-bergen.json
          curl -fsS --max-time 20 "$root/robots.txt" | grep -Fq 'Sitemap: https://4planetatlas.com/sitemap.xml'
          curl -fsS --max-time 20 "$root/sitemap.xml" | grep -Fq '<loc>https://4planetatlas.com/'
          echo "ATLAS_V43_REAL_PRODUCTION_PASS $root/"
          node scripts/atlas-time-probe.mjs "$root" || true
          {
            echo '### FOUNDER APPROVED: ATLAS v43 R1.1 is LIVE'
            echo "Live: $root/"
            echo "Compatible ATLAS path: $root/atlas"
            echo 'Worldwide places and server-side Wikipedia/ecoregion checks included.'
            echo 'DNS untouched; dedicated Cloudflare project only. king/test not changed.'
            echo "Source: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
