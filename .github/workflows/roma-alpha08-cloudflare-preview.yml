name: ROMA isolated Cloudflare test
on:
  push:
    branches:
      - roma-alpha08-cloudflare-preview-20261016
    paths:
      - 'experiments/roma-alpha08/**'
      - '.github/workflows/roma-alpha08-cloudflare-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated ROMA game
        working-directory: experiments/roma-alpha08
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/roma-alpha08.html
          test -s dist/rts/assets/oak.glb
          test -s dist/rts/assets/rock.glb
          echo 'ROMA_BUILD_OK'
      - name: Deploy to separate Cloudflare Pages project ONLY
        working-directory: experiments/roma-alpha08
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for t in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$t" ]; then token="$t"; break; fi
          done
          [ -n "$token" ] || { echo 'CF_TOKEN_MISSING'; exit 3; }
          token=$(printf '%s' "$token" | tr -d '\r\n')
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#CF_API_TOKEN=}"
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          zone=$(curl -sS --retry 3 --max-time 30 -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org')
          if ! jq -e '.success == true' <<<"$zone" >/dev/null; then
            echo 'CF_ZONE_QUERY_FAILED'; jq '{success,errors,messages}' <<<"$zone" || true; exit 4
          fi
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account" ] || { echo 'CF_ACCOUNT_NOT_FOUND'; exit 4; }
          export CLOUDFLARE_ACCOUNT_ID="$account"
          # Standalone Cloudflare Worker with static assets. No Pages middleware or production domain.
          worker='roma-republic-odin-test'
          test "$worker" != '4planet-05'
          npx --yes wrangler@4.128.0 deploy \
            --name "$worker" \
            --assets ./dist \
            --compatibility-date 2026-10-16 \
            --workers-dev true \
            --keep-vars \
            | tee /tmp/roma-workers-deploy.txt
          url=$(grep -Eo 'https://[a-z0-9.-]+[.]workers[.]dev' /tmp/roma-workers-deploy.txt | head -1 || true)
          if [ -z "$url" ]; then echo 'WORKER_URL_NOT_RETURNED'; exit 9; fi
          echo "ROMA_WORKER_URL=$url/roma-alpha08.html"
          for i in $(seq 1 12); do
            response=$(curl -fsSL --max-time 15 "$url/roma-alpha08.html" || true)
            if grep -qF 'src="__IGNORE_ME__"' <<<"$response"; then exit 11; fi
            if grep -qF 'ROMA' <<<"$response" && grep -qF 'assets/rome-' <<<"$response" && ! grep -qF 'Off the map' <<<"$response"; then
              echo 'ROMA_WORKER_ROUTE_VERIFIED'; exit 0
            fi
            sleep 4
          done
          echo 'WORKER_HTML_NOT_VERIFIED'; exit 10
