name: ROMA isolated Cloudflare test
on:
  push:
    branches:
      - roma-alpha08-cloudflare-preview-20261016
    paths:
      - 'experiments/roma-alpha08/**'
      - '.github/workflows/roma-alpha08-cloudflare-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated ROMA game
        working-directory: experiments/roma-alpha08
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/roma-alpha08.html
          test -s dist/rts/assets/oak.glb
          test -s dist/rts/assets/rock.glb
          echo 'ROMA_BUILD_OK'
      - name: Deploy to separate Cloudflare Pages project ONLY
        working-directory: experiments/roma-alpha08
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for t in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$t" ]; then token="$t"; break; fi
          done
          [ -n "$token" ] || { echo 'CF_TOKEN_MISSING'; exit 3; }
          token=$(printf '%s' "$token" | tr -d '\r\n')
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#CF_API_TOKEN=}"
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          zone=$(curl -sS --retry 3 --max-time 30 -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org')
          if ! jq -e '.success == true' <<<"$zone" >/dev/null; then
            echo 'CF_ZONE_QUERY_FAILED'; jq '{success,errors,messages}' <<<"$zone" || true; exit 4
          fi
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account" ] || { echo 'CF_ACCOUNT_NOT_FOUND'; exit 4; }
          export CLOUDFLARE_ACCOUNT_ID="$account"
          # Branch preview only: NEVER deploy or update production branch main.
          project='4planet-05'
          branch='roma-alpha08-preview-20261016'
          [ "$branch" != main ] || { echo 'PRODUCTION_DEPLOY_FORBIDDEN'; exit 8; }
          npx --yes wrangler@4.128.0 pages deploy dist --project-name "$project" --branch "$branch" --commit-hash "$GITHUB_SHA" | tee /tmp/roma-cloudflare-deploy.txt
          preview=$(grep -Eo 'https://[a-z0-9-]+[.]4planet-05[.]pages[.]dev' /tmp/roma-cloudflare-deploy.txt | head -1 || true)
          if [ -z "$preview" ]; then echo 'DEPLOYMENT_URL_NOT_RETURNED'; exit 9; fi
          echo "ROMA_PREVIEW_DEPLOYMENT=$preview/roma-alpha08.html"
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 15 "$preview/roma-alpha08.html" | grep -Fq 'ROMA'; then
              echo 'ROMA_CLOUDFLARE_PREVIEW_LIVE_PASS'
              exit 0
            fi
            sleep 4
          done
          echo 'PREVIEW_DEPLOYED_BUT_ROUTE_NOT_VERIFIED'
          exit 10
