name: ROMA isolated Cloudflare test
on:
  push:
    branches:
      - roma-alpha08-cloudflare-preview-20261016
    paths:
      - 'experiments/roma-alpha08/**'
      - '.github/workflows/roma-alpha08-cloudflare-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand verified ROMA Premium Alpha 08 source and 3D assets
        working-directory: experiments/roma-alpha08
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          function unpack(file) {
            const encoded = fs.readFileSync(file, 'utf8').trim();
            return JSON.parse(zlib.brotliDecompressSync(Buffer.from(encoded, 'base64')).toString('utf8'));
          }
          function write(relative, content) {
            const dest = path.resolve('premium08', relative);
            if (!dest.startsWith(path.resolve('premium08') + path.sep)) throw Error('Invalid archive path');
            fs.mkdirSync(path.dirname(dest), {recursive:true});
            fs.writeFileSync(dest, content);
          }
          for (const [name, contents] of Object.entries(unpack('bundle/alpha08-source.br.base64'))) write(name, contents);
          for (const [name, encoded] of Object.entries(unpack('bundle/alpha08-assets.br.base64'))) write('public/rome/assets/' + name, Buffer.from(encoded, 'base64'));
          for (const [name, contents] of Object.entries(JSON.parse(fs.readFileSync('bundle/alpha08-aux.json', 'utf8')))) write(name, contents);
          const bank=JSON.parse(fs.readFileSync('premium08/public/rome/ASSETBANK.json','utf8'));
          if(bank.assets.length !== 11) throw Error('Expected 11 Roman assets');
          const crypto=require('node:crypto');
          for(const asset of bank.assets) {
            const bytes=fs.readFileSync('premium08/'+asset.file);
            const digest=crypto.createHash('sha256').update(bytes).digest('hex');
            if(digest!==asset.sha256) throw Error('GLB SHA mismatch: '+asset.id);
          }
          console.log('ROMA_ALPHA08_SOURCE_TRANSFER_VALID', Object.keys(unpack('bundle/alpha08-source.br.base64')).length);
          console.log('ROMA_ALPHA08_11_GLB_SHA256_PASS');
          NODE
      - name: Stage isolated Alpha 08 engine (preserve old games)
        working-directory: experiments/roma-alpha08
        shell: bash
        run: |
          set -euo pipefail
          cp roma-alpha08.html roma-alpha07.html
          printf '%s\n' '<!doctype html><script type="module" src="./src/rome/entry.js"></script>' > roma.html
          rm roma-alpha08.html # original Alpha07 compatibility entry; stage creates genuine Alpha08 independently
          printf '%s\n' '<!doctype html><script type="module" src="./src/rts/main.js"></script>' > rts.html
          printf '%s\n' "import { defineConfig } from 'vite';export default defineConfig({ build: {rollupOptions:{ input: {romaAlpha07: 'roma-alpha07.html'}}}});" > vite.config.ts
          # Alpha07 already made several MAP dimensions dynamic; normalize only the
          # disposable staging checkout for Alpha08's tested source upgrader.
          python3 - <<'PY'
          from pathlib import Path
          def rewrite(path, pairs):
              p=Path(path);text=p.read_text()
              for old,new in pairs:
                  if old not in text: raise SystemExit('ROMA_STAGE_NORMALIZE_MISSING: '+path+' '+old[:50])
                  text=text.replace(old,new)
              p.write_text(text)
          rewrite('src/rts/simulation.js', [
              ("if (x < 8 || z < 8 || x > MAP.width - 8 || z > MAP.depth - 8)",
               "if (x < 8 || z < 8 || x > 172 || z > 152)"),
              ("    s.visible = new Uint8Array(MAP.width / MAP.cell * MAP.depth / MAP.cell);",
               "    s.visible = new Uint8Array(7200);")])
          rewrite('src/rts/renderer.js', [
              ("new T.PlaneGeometry(MAP.width+320, MAP.depth+320, MAP.width===180?180:230, MAP.depth===160?170:210)",
               "new T.PlaneGeometry(500, 480, 180, 170)"),
              ("g.translate(MAP.width/2, 0, MAP.depth/2)", "g.translate(90, 0, 80)"),
              ("z <= MAP.depth+150; z += 3", "z <= 310; z += 3")])
          rewrite('src/rts/main.js', [
              ('width="${MAP.width}" height="${MAP.depth}"', 'width="180" height="160"')])
          p=Path('src/rts/main.js')
          raw=p.read_text()
          old="import { BUILDINGS, TROOPS, RESOURCE, VERSION, riverX, MAP } from './config.js';"
          if raw.count(old)!=1: raise SystemExit('ROMA_MAIN_CONFIG_IMPORT_DIFFERENT')
          raw=raw.replace(old,"import { MAP } from './config.js';\\nimport { BUILDINGS, TROOPS, RESOURCE, VERSION, riverX } from './config.js';".replace('\\n','\n'))
          p.write_text(raw)
          print('ROMA_ALPHA07_STAGE_COMPAT_READY')
          PY
          python3 premium08/scripts/stage_alpha08.py --project . --dry-run
          python3 premium08/scripts/stage_alpha08.py --project .
          test -s src/roma08/rome/boot.js
          test -s src/roma08/rts/simulation.js
          test -s public/rome/assets/roman_forum.glb
          test -s public/rome/assets/roman_siege_workshop.glb
          grep -Fq './src/roma08/rome/boot.js' roma-alpha08.html
          echo 'ROMA_PREMIUM_ALPHA08_STAGE_PASS'
      - name: Build genuine Alpha08 playable game
        working-directory: experiments/roma-alpha08
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s dist/roma-alpha08.html
          test -s dist/rome/assets/roman_forum.glb
          test -s dist/rome/assets/roman_siege_workshop.glb
          if grep -Fq 'src/rome/alpha08.js' dist/roma-alpha08.html; then
            echo 'OLD_ROMA_INSTEAD_OF_PREMIUM'; exit 7
          fi
          echo 'ROMA_GENUINE_ALPHA08_BUILD_PASS'
      - name: Deploy to separate Cloudflare Pages project ONLY
        working-directory: experiments/roma-alpha08
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for t in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$t" ]; then token="$t"; break; fi
          done
          [ -n "$token" ] || { echo 'CF_TOKEN_MISSING'; exit 3; }
          token=$(printf '%s' "$token" | tr -d '\r\n')
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#CF_API_TOKEN=}"
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          zone=$(curl -sS --retry 3 --max-time 30 -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org')
          if ! jq -e '.success == true' <<<"$zone" >/dev/null; then
            echo 'CF_ZONE_QUERY_FAILED'; jq '{success,errors,messages}' <<<"$zone" || true; exit 4
          fi
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account" ] || { echo 'CF_ACCOUNT_NOT_FOUND'; exit 4; }
          export CLOUDFLARE_ACCOUNT_ID="$account"
          # Standalone Cloudflare Worker with static assets. No Pages middleware or production domain.
          worker='roma-republic-odin-test'
          test "$worker" != '4planet-05'
          npx --yes wrangler@4.128.0 deploy \
            --name "$worker" \
            --assets ./dist \
            --compatibility-date 2026-10-16 \
            --keep-vars \
            | tee /tmp/roma-workers-deploy.txt
          url=$(grep -Eo 'https://[a-z0-9.-]+[.]workers[.]dev' /tmp/roma-workers-deploy.txt | head -1 || true)
          if [ -z "$url" ]; then echo 'WORKER_URL_NOT_RETURNED'; exit 9; fi
          echo "ROMA_WORKER_URL=$url/roma-alpha08.html"
          for i in $(seq 1 12); do
            response=$(curl -fsSL --max-time 15 "$url/roma-alpha08.html" || true)
            if grep -qF 'src="__IGNORE_ME__"' <<<"$response"; then exit 11; fi
            if grep -qF 'ROMA' <<<"$response" && grep -qF 'assets/rome-' <<<"$response" && ! grep -qF 'Off the map' <<<"$response"; then
              echo 'ROMA_WORKER_ROUTE_VERIFIED'; exit 0
            fi
            sleep 4
          done
          echo 'WORKER_HTML_NOT_VERIFIED'; exit 10
