name: Deploy Frontier Test Path Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-gateway-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_3: ${{ secrets.CF_API_TOKEN }}
      TOKEN_4: ${{ secrets.CF_TOKEN }}
      CF_ACCOUNT_ID: d53c17b06219066a0325eec01c21729e
    steps:
      - name: Deploy canonical Frontier gateway
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$candidate" ] && { TOKEN="$candidate"; break; }; done
          [ -n "$TOKEN" ] || { echo 'No Cloudflare token'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"

          cat > "$RUNNER_TEMP/gateway.mjs" <<'EOF'
          const FRONTIER_ORIGIN = 'https://life-os-canvas-6g481v.v2.appdeploy.ai/';

          function projectShell(origin) {
            const safeOrigin = JSON.stringify(origin);
            return `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <title>4PLANET FRONTIER</title>
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
              body{position:fixed;inset:0}
              iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#fff;overflow:hidden}
            </style>
          </head>
          <body>
            <iframe title="4PLANET FRONTIER" src=${safeOrigin} loading="eager" scrolling="no" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </body>
          </html>`;
          }

          export default {
            async fetch(request) {
              const url = new URL(request.url);
              const path = url.pathname.replace(/\/+$/, '') || '/';

              if (path === '/universalboard' || path.startsWith('/universalboard/')) {
                const suffix = path.slice('/universalboard'.length);
                const target = new URL('/frontier' + suffix, url.origin);
                target.search = url.search;
                return new Response(null, {
                  status: 308,
                  headers: {
                    location: target.toString(),
                    'cache-control': 'no-store',
                    'x-4planet-frontier-gateway': 'legacy-redirect'
                  }
                });
              }

              if (path === '/frontier' || path.startsWith('/frontier/')) {
                return new Response(projectShell(FRONTIER_ORIGIN), {
                  headers: {
                    'content-type': 'text/html; charset=UTF-8',
                    'cache-control': 'no-store',
                    'x-robots-tag': 'noindex, nofollow',
                    'x-4planet-frontier-gateway': 'frontier-v1'
                  }
                });
              }

              return fetch(request);
            }
          };
          EOF

          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planet-test-path-gateway"
          main = "$RUNNER_TEMP/gateway.mjs"
          compatibility_date = "2026-09-18"
          account_id = "$CF_ACCOUNT_ID"

          [[routes]]
          pattern = "test.4planet.org/*"
          zone_name = "4planet.org"
          EOF

          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"

      - name: Verify canonical and legacy routing
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            curl -sS --connect-timeout 10 --max-time 30 -D frontier.h -o frontier.b https://test.4planet.org/frontier || true
            curl -sS --connect-timeout 10 --max-time 30 -D legacy.h -o /dev/null https://test.4planet.org/universalboard || true
            curl -sS --connect-timeout 10 --max-time 30 -o root.b https://test.4planet.org/ || true
            if grep -Eq '^HTTP/[^ ]+ 200' frontier.h               && grep -qi '^x-4planet-frontier-gateway: frontier-v1' frontier.h               && grep -q 'life-os-canvas-6g481v.v2.appdeploy.ai' frontier.b               && grep -Eq '^HTTP/[^ ]+ 308' legacy.h               && grep -qi '^location: https://test.4planet.org/frontier' legacy.h               && ! grep -q 'life-os-canvas-6g481v.v2.appdeploy.ai' root.b; then
              ok=1
              break
            fi
            sleep 3
          done
          [ "$ok" -eq 1 ] || {
            echo 'Frontier gateway verification failed'
            echo '--- FRONTIER ---'; cat frontier.h; head -c 500 frontier.b
            echo '--- LEGACY ---'; cat legacy.h
            echo '--- ROOT ---'; head -c 500 root.b
            exit 1
          }
          echo 'FRONTIER_GATEWAY_PASS=YES'
