name: P0 Privacy Security Canonical HEIR QA
on:
  push:
    branches: [king/test]
    paths:
      - src/identity/identityClient.ts
      - src/analytics/Analytics.tsx
      - scripts/analytics-privacy-contract.test.mjs
      - scripts/identity-oauth-contract.test.mjs
      - .github/workflows/privacy-security-heir-qa.yml
  workflow_dispatch:
permissions: { contents: read }
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/identity-oauth-contract.test.mjs scripts/analytics-privacy-contract.test.mjs
      - run: npm run typecheck
      - run: node scripts/security-secret-scan.mjs
      - run: npm run build
