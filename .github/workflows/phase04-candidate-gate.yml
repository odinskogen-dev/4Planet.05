name: Phase 04 Candidate Gate

on:
  pull_request:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - 'src/**'
      - 'scripts/phase04-contracts.test.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase04-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: phase04-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Existing contract and smoke tests
        run: npm run test:smoke

      - name: Phase 04 convergence contracts
        run: node --test scripts/phase04-contracts.test.mjs

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify
