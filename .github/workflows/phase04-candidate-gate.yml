name: Phase 04 Candidate Gate

on:
  pull_request:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - 'src/**'
      - 'scripts/phase04-contracts.test.mjs'
      - 'scripts/prototype-contracts.test.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase04-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: phase04-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Existing contract and smoke tests
        run: npm run test:smoke

      - name: Phase 04 convergence contracts
        run: node --test scripts/phase04-contracts.test.mjs

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Install Chromium for isolated browser proof
        run: npx playwright install --with-deps chromium

      - name: Start built candidate locally
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/phase04-preview.log 2>&1 &
          echo $! > /tmp/phase04-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase04-preview.log
          exit 1

      - name: Phase 04 desktop and mobile browser proof
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase04-convergence.spec.ts

      - name: Upload Phase 04 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase04-browser-evidence
          path: |
            artifacts/phase04-product-proof
            playwright-report
            test-results
            /tmp/phase04-preview.log
          if-no-files-found: warn
          retention-days: 14
