name: 4SPECIES Discoverability Live Release
# Founder-approved SPECIES v53 promotion. Manual-only: never deploy LIVE from a workflow-file push.

on:
  workflow_dispatch:
    inputs:
      accepted_preview_sha:
        description: Exact independently accepted preview commit SHA
        required: true
        type: string
      accepted_preview_url:
        description: Immutable Cloudflare Pages deployment URL from the accepted preview
        required: true
        type: string
      rollback_worker_version:
        description: Exact pre-change 4species-router Worker version ID
        required: true
        type: string

permissions: { contents: read }
concurrency: { group: 4species-discovery-live, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCEPTED_PREVIEW_SHA: ${{ inputs.accepted_preview_sha }}
      ACCEPTED_PREVIEW_URL: ${{ inputs.accepted_preview_url }}
      ROLLBACK_WORKER_VERSION: ${{ inputs.rollback_worker_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind LIVE carrier to accepted immutable preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ACCEPTED_PREVIEW_SHA" = "$GITHUB_SHA"
          case "$ACCEPTED_PREVIEW_URL" in
            https://*.4planet-05.pages.dev) ;;
            *) echo "Preview URL is not an immutable 4planet-05 Pages deployment" >&2; exit 1 ;;
          esac
          test -n "$ROLLBACK_WORKER_VERSION"
          router_blob=$(git rev-parse "$GITHUB_SHA:ops/discovery/4species-router.js")
          live_workflow_blob=$(git rev-parse "$GITHUB_SHA:.github/workflows/4species-discovery-live.yml")
          preview_workflow_blob=$(git rev-parse "$GITHUB_SHA:.github/workflows/species-v53-canonical-deploy.yml")
          echo "ROUTER_BLOB=$router_blob" >> "$GITHUB_ENV"
          echo "LIVE_WORKFLOW_BLOB=$live_workflow_blob" >> "$GITHUB_ENV"
          echo "PREVIEW_WORKFLOW_BLOB=$preview_workflow_blob" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify accepted immutable v53 origin before promoting
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check ops/discovery/4species-router.js
          curl -fsS --max-time 25 "$ACCEPTED_PREVIEW_URL/" | grep -Fq 'Meet life on Earth'
          curl -fsS --max-time 25 "$ACCEPTED_PREVIEW_URL/species-data/v1/english-oak.json" | jq -e '.slug=="english-oak"' >/dev/null
          curl -fsS --max-time 25 "$ACCEPTED_PREVIEW_URL/release-identity.json" -o /tmp/release-identity.json
          jq -e --arg sha "$GITHUB_SHA" --arg workflow "$PREVIEW_WORKFLOW_BLOB" \
            '.triggerSha==$sha and .workflowBlob==$workflow and (.builtTree|length)==40 and (.payloadDigest|length)==64' \
            /tmp/release-identity.json >/dev/null
          echo ISOLATED_V53_ORIGIN_VERIFIED
      - name: Promote accepted v53 to existing 4species.com Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          # Pin production to the exact accepted immutable Pages preview, never a mutable branch alias.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'ops/discovery/4species-router.js';
          const url = process.env.ACCEPTED_PREVIEW_URL || '';
          if (!/^https:\/\/[a-z0-9-]+\.4planet-05\.pages\.dev$/.test(url)) {
            throw new Error('Expected an immutable 4planet-05 Pages preview hostname');
          }
          const oldOrigin = 'const SPECIES_V53_ORIGIN = "https://species-v53.4planet-05.pages.dev";';
          let source = readFileSync(file, 'utf8');
          if (source.split(oldOrigin).length !== 2) throw new Error('v53 Worker upstream anchor changed');
          source = source.replace(oldOrigin, 'const SPECIES_V53_ORIGIN = ' + JSON.stringify(url) + ';');
          writeFileSync(file, source);
          NODE
          node --check ops/discovery/4species-router.js
          echo "deployed_router_sha256=$(sha256sum ops/discovery/4species-router.js | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          npx --yes wrangler@4.128.0 deploy ops/discovery/4species-router.js --name 4species-router --compatibility-date 2026-10-05 --keep-vars 2>&1 | tee /tmp/worker-deploy.log
          worker_version=$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/worker-deploy.log | awk '{print $4}' | tail -n 1)
          test -n "$worker_version"
          echo "WORKER_VERSION=$worker_version" >> "$GITHUB_ENV"
      - name: Verify live v53 homepage, quiz, explore and six species
        shell: bash
        run: |
          set -euxo pipefail
          ORIGIN=https://4species.com
          ready=false
          for attempt in $(seq 1 24); do
            curl -fsS --max-time 25 "$ORIGIN/" -o /tmp/species-v53-home.html || true
            if grep -Fq 'Meet life on Earth' /tmp/species-v53-home.html 2>/dev/null; then ready=true; break; fi
            sleep 4
          done
          test "$ready" = true
          for path in / /explore /quiz /about /orca /english-oak /atlantic-puffin /western-honey-bee /fly-agaric /common-octopus; do
            code=$(curl -sSL --max-time 30 -o /tmp/species-page.html -w '%{http_code}' "$ORIGIN$path")
            test "$code" = 200
            grep -Eiq 'species|Meet life' /tmp/species-page.html
            echo "LIVE $path $code"
          done
          curl -fsS "$ORIGIN/species-data/v1/english-oak.json" | jq -e '.slug=="english-oak" and .identity.scientificName=="Quercus robur"' >/dev/null
          curl -sSI "$ORIGIN/species/orca" | grep -qi '^HTTP/.*301'
          curl -sSI "$ORIGIN/species/orca" | grep -qi '^location: https://4species.com/orca'
          script=$(grep -oE 'src="/assets/[^\"]+\.js"' /tmp/species-v53-home.html | head -n 1 | cut -d '"' -f 2)
          test -n "$script"
          curl -fsS --max-time 35 "$ORIGIN$script" -o /tmp/species-v53-main.js
          test "$(wc -c </tmp/species-v53-main.js)" -gt 1000
          {
            echo "### 4SPECIES immutable LIVE release receipt"
            echo "- trigger_sha: \`$GITHUB_SHA\`"
            echo "- accepted_preview_url: $ACCEPTED_PREVIEW_URL"
            echo "- preview_workflow_blob: \`$PREVIEW_WORKFLOW_BLOB\`"
            echo "- live_workflow_blob: \`$LIVE_WORKFLOW_BLOB\`"
            echo "- router_blob: \`$ROUTER_BLOB\`"
            echo "- worker_version: \`$WORKER_VERSION\`"
            echo "- rollback_worker_version: \`$ROLLBACK_WORKER_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo SPECIES_V53_CANONICAL_DOMAIN_PUBLISH_AND_ROUTES_PASS
