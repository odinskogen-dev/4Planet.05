name: CRE4TORS Discoverability Live Release

on:
  push:
    branches: [king/test]
    paths:
      - ops/discovery/live-workers/cre4tors-prototype.js
      - .github/workflows/cre4tors-discovery-live.yml

permissions:
  contents: read

concurrency:
  group: cre4tors-discovery-live
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASELINE_COMMIT: 879ac69712a3046bcff724cd2190d4534b11de20
      SOURCE: ops/discovery/live-workers/cre4tors-prototype.js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: king/test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate exact patched source
        run: |
          set -euo pipefail
          node --check "$SOURCE"
          grep -Fq 'https://cre4tors.com/sitemap.xml' "$SOURCE"
          grep -Fq 'Disallow: /api/' "$SOURCE"
      - name: Deploy, verify and rollback on failure
        shell: bash
        run: |
          set -uo pipefail
          npx --yes wrangler@4.128.0 deploy "$SOURCE" --name cre4tors-prototype --compatibility-date 2026-10-05 --keep-vars || exit 1
          sleep 3
          failed=0
          h=$(curl -sSIL --max-time 15 https://cre4tors.com/ | tr -d '\r') || failed=1
          grep -q '200' <<<"$h" || failed=1
          grep -qi '^x-robots-tag:.*noindex' <<<"$h" && failed=1
          html=$(curl -fsS --max-time 15 https://cre4tors.com/) || failed=1
          grep -Fq 'CRE4TORS — Creative Work for a Living Planet' <<<"$html" || failed=1
          grep -Fq 'https://cre4tors.com/' <<<"$html" || failed=1
          curl -fsS --max-time 15 https://cre4tors.com/robots.txt | grep -Fq 'Sitemap: https://cre4tors.com/sitemap.xml' || failed=1
          curl -fsS --max-time 15 https://cre4tors.com/sitemap.xml | grep -Fq 'https://cre4tors.com/' || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "CRE4TORS discoverability smoke failed; rolling back exact pre-change Worker source."
            git show "$BASELINE_COMMIT:$SOURCE" > /tmp/cre4tors-rollback.js
            node --check /tmp/cre4tors-rollback.js
            npx --yes wrangler@4.128.0 deploy /tmp/cre4tors-rollback.js --name cre4tors-prototype --compatibility-date 2026-10-05 --keep-vars
            exit 1
          fi
          echo "CRE4TORS_DISCOVERY_LIVE_OK"
