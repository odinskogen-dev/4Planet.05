# NIGHT GIGA 05: exact-branch read-only execution proof trigger
name: Claude Product Worker — Direct CLI Read Only Spike

on:
  push:
    branches:
      - factory/claude-product-worker-01
    paths:
      - ".github/workflows/claude-product-worker-cli-spike.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: claude-product-worker-cli-readonly
  cancel-in-progress: true

jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Fail closed unless subscription OAuth exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::CLAUDE_PRODUCT_WORKER_BLOCKED: CLAUDE_CODE_OAUTH_TOKEN is missing."
            exit 1
          fi
          echo "CLAUDE_AUTH=READY"

      - name: Checkout isolated Claude worker branch
        uses: actions/checkout@v4
        with:
          ref: factory/claude-product-worker-01
          fetch-depth: 0
          persist-credentials: false

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run independent Claude Product Worker review
        id: claude_review
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          PROMPT=$(cat <<'EOF'
          You are running the first real 4PLANET Claude Product Worker integration spike.

          Read CLAUDE.md first. Then read and execute:
          docs/claude/work-orders/CLAUDE-PRODUCT-WORKER-TEST-01.md

          Exercise independent product judgement. The goal, truth constraints, authority boundaries, and MUST-NOT-LOSE requirements are binding. Any implementation idea implied by the work order is only a hypothesis: challenge it when repository evidence supports a better diagnosis.

          This run is REVIEW_ONLY. Do not modify files. Use repository evidence and git history. If current overlap cannot be proven, mark it UNKNOWN rather than guessing.

          Return only the compact Factory-ingestible report requested by the work order. Explicitly distinguish OBSERVED / INFERRED / PROPOSED / UNKNOWN where relevant.
          EOF
          )
          claude -p "$PROMPT" \
            --model claude-opus-5 \
            --max-turns 12 \
            --permission-mode plan \
            --tools "Read,Grep,Glob,Bash" \
            --no-session-persistence \
            > /tmp/claude-product-worker-test-01.md \
            2> /tmp/claude-product-worker-test-01.stderr
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "CLAUDE_EXIT_CODE=$RC"
          exit 0

      - name: Prove no tracked repository mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "::error::CLAUDE_PRODUCT_WORKER_READONLY_VIOLATION"
            git status --porcelain=v1
            exit 1
          fi
          echo "READ_ONLY_REPOSITORY_GATE=PASS"

      - name: Upload Claude review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-product-worker-cli-test-01
          path: |
            /tmp/claude-product-worker-test-01.md
            /tmp/claude-product-worker-test-01.stderr
          if-no-files-found: error
          retention-days: 14

      - name: Require real Claude completion
        if: always()
        shell: bash
        env:
          CLAUDE_EXIT_CODE: ${{ steps.claude_review.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${CLAUDE_EXIT_CODE:-missing}" != "0" ]]; then
            echo "::error::CLAUDE_PRODUCT_WORKER_CALL_FAILED exit=${CLAUDE_EXIT_CODE:-missing}"
            if [[ -s /tmp/claude-product-worker-test-01.stderr ]]; then
              cat /tmp/claude-product-worker-test-01.stderr
            fi
            exit 1
          fi
          test -s /tmp/claude-product-worker-test-01.md
          echo "CLAUDE_PRODUCT_WORKER_REAL_CALL=PASS"
