name: Analytics Origin Source Audit

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/analytics-origin-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: d53c17b06219066a0325eec01c21729e
    steps:
      - name: Resolve fixed Pages origins to source
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/4planet-05/deployments"
          json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}?per_page=100")"
          jq -e '.success == true' <<<"$json" >/dev/null
          {
            echo '# Analytics fixed-origin source map'
            echo
            for short in b8a8f6c1 4482f621; do
              row="$(jq -c --arg u "https://${short}.4planet-05.pages.dev" '.result[] | select(.url==$u)' <<<"$json" | head -n1)"
              echo "## ${short}.4planet-05.pages.dev"
              if [[ -z "$row" ]]; then
                echo '- not found in first 100 deployments'
              else
                echo "- branch: \`$(jq -r '.deployment_trigger.metadata.branch // ""' <<<"$row")\`"
                echo "- commit: \`$(jq -r '.deployment_trigger.metadata.commit_hash // ""' <<<"$row")\`"
                echo "- environment: \`$(jq -r '.environment // ""' <<<"$row")\`"
                echo "- created: \`$(jq -r '.created_on // ""' <<<"$row")\`"
              fi
              echo
            done
          } > /tmp/report.md
          cat /tmp/report.md

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
