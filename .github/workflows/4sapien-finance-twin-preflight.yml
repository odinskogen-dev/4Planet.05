name: 4SAPIEN Finance Twin preflight

on:
  push:
    branches: [build/4sapien-finance-twin-runtime-20260915]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/4sapien-finance-twin-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize current 4SAPIEN release without deploy
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          FOOD=${SITE}/app/food/index.html
          rm -rf "$SITE"
          mkdir -p "${SITE}/app/food" "${SITE}/app"
          python products/4sapien/build/apply_front_v2_release.py \
            products/4sapien/source/claude-front-20260915-v2.html \
            "${SITE}/index.html"
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > "$FOOD"
          python products/4sapien/build/apply_provider_guard.py "$FOOD"
          python products/4sapien/build/apply_meal_plan_guard.py "$FOOD"
          python products/4sapien/build/apply_product_gateway_guard.py "$FOOD"
          python products/4sapien/build/apply_finance_route.py "${SITE}/index.html"
          python products/4sapien/build/apply_finance_typography_guard.py "$SITE"
          cp products/4sapien/cloudflare/_headers "${SITE}/_headers"
          cp products/4sapien/cloudflare/_redirects "${SITE}/_redirects"
          cat > "${SITE}/app/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/app/food/"><title>4SAPIEN</title></head><body><a href="/app/food/">Open 4SAPIEN</a></body></html>
          HTML

      - name: Finance Twin contract QA
        run: |
          set -euo pipefail
          MONEY=products/4sapien/site/app/money/index.html
          grep -q 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1' "$MONEY"
          grep -q 'four_sapien_finance_twin' "$MONEY"
          grep -q 'four_sapien_finance_save_event' "$MONEY"
          grep -q 'four_sapien_finance_batch_save_events' "$MONEY"
          grep -q 'four_sapien_finance_soft_delete_event' "$MONEY"
          grep -q 'four_sapien_plan_food_until_payday_context' "$MONEY"
          grep -q 'FourSapienFinanceRuntime' "$MONEY"
          grep -q 'UNKNOWN_NO_LIQUID_ACCOUNTS' products/4sapien/supabase/migrations/202609152340_four_sapien_finance_twin_runtime_v1.sql
          grep -q 'IMPORTED_NOT_CONFIRMED' products/4sapien/supabase/migrations/202609152340_four_sapien_finance_twin_runtime_v1.sql
          grep -q 'SCHEDULED_NOT_CONFIRMED' products/4sapien/supabase/migrations/202609152340_four_sapien_finance_twin_runtime_v1.sql
          grep -q 'EMBLA_CORE_PREVIEW_V06_FINANCE_TWIN' products/4sapien/supabase/functions/embla-core-preview/index.ts
          grep -q 'read_finance_twin' products/4sapien/supabase/functions/embla-core-preview/index.ts
          grep -q 'read_food_until_payday_context' products/4sapien/supabase/functions/embla-core-preview/index.ts

      - name: Claude zero-loss merge gate
        run: |
          set -euo pipefail
          python products/4sapien/qa/claude_merge_gate.py products/4sapien/site

      - name: Browser secret scan
        run: |
          set -euo pipefail
          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' products/4sapien/site

      - name: Syntax check Finance Twin browser runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('products/4sapien/site/app/money/index.html').read_text()
          m=re.search(r'<script id="four-sapien-finance-twin-runtime">(.*?)</script>',s,re.S)
          assert m, 'Finance Twin runtime script missing'
          pathlib.Path('/tmp/finance-twin-runtime.js').write_text(m.group(1))
          PY
          node --check /tmp/finance-twin-runtime.js

      - name: Finance donor syntax smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('products/4sapien/site/app/money/index.html').read_text()
          blocks=re.findall(r'<script(?: type="text/babel")?[^>]*>(.*?)</script>',s,re.S)
          assert blocks, 'Finance scripts missing'
          print('finance script blocks',len(blocks))
          PY

      - name: Preflight summary
        run: |
          echo '## 4SAPIEN Finance Twin preflight' >> "$GITHUB_STEP_SUMMARY"
          echo '- Finance Twin runtime contract: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Claude merge gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser secret scan: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Finance Twin JS syntax: PASS' >> "$GITHUB_STEP_SUMMARY"
