name: 4MARKET old interface first products import

on:
  push:
    branches:
      - axe/market-old-interface-first-products-20260914
    paths:
      - '.github/workflows/market-first-products-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy six already-vendored Market assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin axe/market-independent-live-20260914
          mkdir -p public/market/odin
          for file in \
            fjord-island-cabins.jpg \
            fjord-valley-mirror.jpg \
            lofoten-beach.jpg \
            reinebringen-clifftop.jpg \
            reinebringen-vista.jpg \
            seaweed-coast.jpg; do
            git show origin/axe/market-independent-live-20260914:public/market/odin/$file > public/market/odin/$file
            test -s public/market/odin/$file
          done

      - name: Insert products into existing Gold interface only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/v5/ImpactMarketGold.tsx')
          original = p.read_text()
          import_anchor = 'import { Link } from "react-router-dom";\n'
          insert_anchor = '      </section>\n\n      <section className="mkt-product-stage">'
          import_line = 'import { FirstMarketProducts } from "@/components/market/FirstMarketProducts";\n'
          component_line = '      <FirstMarketProducts />\n\n'
          component = '      </section>\n\n' + component_line + '      <section className="mkt-product-stage">'
          assert import_anchor in original, 'Import anchor missing'
          assert insert_anchor in original, 'Existing Market hero/product-stage boundary missing'
          assert import_line not in original, 'Patch already present'
          modified = original.replace(import_anchor, import_anchor + import_line, 1).replace(insert_anchor, component, 1)
          restored = modified.replace(import_line, '', 1).replace(component_line, '', 1)
          assert restored == original, 'Patch changed more than import + one insertion point'
          p.write_text(modified)
          print('PASS: existing ImpactMarketGold preserved; only FirstMarketProducts import + insertion added.')
          PY

      - name: Safety assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/market/odin -type f -name '*.jpg' | wc -l)" -eq 6
          if grep -RniE 'oddekalv\.org|raw\.githubusercontent\.com/.+OdinOddekalv' src/market/firstCreatorCatalogue.ts src/components/market/FirstMarketProducts.tsx src/styles/market-first-products.css; then
            echo 'External creator-site runtime dependency detected.'
            exit 1
          fi
          grep -q 'ART THAT' src/pages/v5/ImpactMarketGold.tsx
          grep -q 'ONE SALE' src/pages/v5/ImpactMarketGold.tsx
          grep -q 'CREATOR DASHBOARD' src/pages/v5/ImpactMarketGold.tsx
          grep -q 'FirstMarketProducts' src/pages/v5/ImpactMarketGold.tsx

      - name: Typecheck and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Commit verified candidate and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/market-first-products-import.yml
          git add src/pages/v5/ImpactMarketGold.tsx public/market/odin
          git status --short
          git commit -m '4MARKET: first real products inside restored Gold interface'
          git push origin HEAD:axe/market-old-interface-first-products-20260914
