            /tmp/via-earth.html
            /tmp/via-fires.html
            /tmp/via-whales.html
            /tmp/live-sitemap.xml
          if-no-files-found: warn
          retention-days: 30
,headers)
          raw=Path('/tmp/worker-after.multipart').read_bytes()
          message=BytesParser(policy=default).parsebytes(
              ('Content-Type: '+m.group(1)+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin1')+raw
          )
          found=[]
          for part in message.walk():
              if part.is_multipart(): continue
              payload=part.get_payload(decode=True) or b''
              if b'export default' in payload and b'async fetch' in payload: found.append(payload)
          if len(found)!=1: raise SystemExit('worker readback parse failed')
          Path('/tmp/worker-after.js').write_bytes(found[0])
          PY
          grep -Fq 'path === "/earth" || path === "/fires" || path === "/whales"' /tmp/worker-after.js

          routes_after="$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}")"
