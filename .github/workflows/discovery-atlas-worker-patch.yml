name: DISCOVERY ATLAS bounded Worker patch

on:
  push:
    branches:
      - ops/discovery-atlas-live-deploy-20261003
    paths:
      - .github/workflows/discovery-atlas-worker-patch.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch only three verified ATLAS object routes
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_1:-${TOKEN_2:-}}"
          test -n "$TOKEN"
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '\r\n')"
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          echo "::add-mask::$TOKEN"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $TOKEN")
          root="$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")"
          zid="$(jq -r '.result[0].id' <<<"$root")"
          account_id="$(jq -r '.result[0].account.id' <<<"$root")"

          routes_before="$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}")"
          jq -e '.result[]? | select(.pattern=="4planet.org/atlas*" and .script=="4planet-product-domains")' <<<"$routes_before" >/dev/null

          curl -fsS -D /tmp/worker-before.headers "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains" "${auth[@]}" -o /tmp/worker-before.multipart
          settings="$(curl -fsS "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains/settings" "${auth[@]}")"
          jq -e '.success==true and .result.compatibility_date=="2026-09-14" and ((.result.bindings // [])|length)==0' <<<"$settings" >/dev/null
          sha256sum /tmp/worker-before.multipart > /tmp/worker-before.sha256

          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import re
          headers=Path('/tmp/worker-before.headers').read_text('latin1')
          m=re.search(r'(?im)^content-type:\s*(.+?)\r?
          marker='''      if (isAssetPath(path)) return proxyAsset(request);
                if (path !== "/") return redirectTo(`https://4planet.org${path}${url.search}`);
                return proxy(request, "/atlas", "atlas");'''
          replacement='''      if (isAssetPath(path)) return proxyAsset(request);
                if (path === "/earth" || path === "/fires" || path === "/whales") {
                  return proxy(request, `/atlas${path}`, "atlas");
                }
                if (path !== "/") return redirectTo(`https://4planet.org${path}${url.search}`);
                return proxy(request, "/atlas", "atlas");'''
          if 'path === "/earth" || path === "/fires" || path === "/whales"' in s:
              raise SystemExit('bounded object patch already present; refusing duplicate mutation')
          if marker not in s:
              raise SystemExit('expected ATLAS host block not found; refusing mutation')
          s2=s.replace(marker,replacement,1)
          if s2.count('path === "/earth" || path === "/fires" || path === "/whales"') != 1:
              raise SystemExit('unexpected patch cardinality')
          Path('/tmp/worker-new.js').write_text(s2)
          PY

          node --check /tmp/worker-new.js
          diff -u /tmp/worker-source.js /tmp/worker-new.js > /tmp/worker.patch || test $? -eq 1
          cat /tmp/worker.patch
          test "$(grep -c '^+' /tmp/worker.patch)" -le 4
          test "$(grep -c '^-' /tmp/worker.patch)" -le 1

          metadata='{"main_module":"worker.js","compatibility_date":"2026-09-14","compatibility_flags":[]}'
          response="$(curl -fsS -X PUT "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains"             "${auth[@]}"             -F "metadata=${metadata};type=application/json"             -F "worker.js=@/tmp/worker-new.js;type=application/javascript+module")"
          jq -e '.success==true' <<<"$response" >/dev/null

          curl -fsS -D /tmp/worker-after.headers "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains" "${auth[@]}" -o /tmp/worker-after.multipart
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import re
          headers=Path('/tmp/worker-after.headers').read_text('latin1')
          m=re.search(r'(?im)^content-type:\s*(.+?)\r?

          routes_after="$(curl -fsS "${api}/zones/${zid}/workers/routes" "${auth[@]}")"
          jq -e '.result[]? | select(.pattern=="4planet.org/atlas*" and .script=="4planet-product-domains")' <<<"$routes_after" >/dev/null
          test "$(jq -c '[.result[]? | select(.script=="4planet-product-domains")]' <<<"$routes_before")" = "$(jq -c '[.result[]? | select(.script=="4planet-product-domains")]' <<<"$routes_after")"

      - name: Verify public ATLAS object routes and preserved products
        shell: bash
        run: |
          set -euo pipefail
          for route in earth fires whales; do
            code="$(curl -L --retry 10 --retry-all-errors --retry-delay 2 --max-time 30 -o "/tmp/direct-${route}.html" -w '%{http_code}' "https://4planetatlas.com/${route}")"
            test "$code" = "200"
          done
          grep -Fq 'Earth' /tmp/direct-earth.html
          grep -Fq 'Global Fires' /tmp/direct-fires.html
          grep -Fq 'Whales' /tmp/direct-whales.html

          for route in earth fires whales; do
            final="$(curl -L --retry 10 --retry-all-errors --retry-delay 2 --max-time 30 -sS -o "/tmp/via-${route}.html" -w '%{url_effective} %{http_code}' "https://4planet.org/atlas/${route}")"
            echo "${route}: ${final}"
            test "${final##* }" = "200"
          done
          grep -Fq 'Earth' /tmp/via-earth.html
          grep -Fq 'Global Fires' /tmp/via-fires.html
          grep -Fq 'Whales' /tmp/via-whales.html

          atlas_code="$(curl -L -sS -o /tmp/atlas-root.html -w '%{http_code}' https://4planetatlas.com/)"
          test "$atlas_code" = "200"
          species_code="$(curl -L -sS -o /tmp/orca.html -w '%{http_code}' https://4species.com/orca)"
          test "$species_code" = "200"
          curl -L -fsS https://4planet.org/sitemap.xml > /tmp/live-sitemap.xml
          grep -Fq '/atlas/earth' /tmp/live-sitemap.xml
          grep -Fq '/atlas/fires' /tmp/live-sitemap.xml
          grep -Fq '/atlas/whales' /tmp/live-sitemap.xml

      - name: Upload Worker rollback and LIVE readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-atlas-worker-live-receipt
          path: |
            /tmp/worker-before.multipart
            /tmp/worker-source.js
            /tmp/worker-before.headers
            /tmp/worker-before.sha256
            /tmp/worker-new.js
            /tmp/worker-after.multipart
            /tmp/worker-after.headers
            /tmp/worker-after.js
            /tmp/worker.patch
            /tmp/direct-earth.html
            /tmp/direct-fires.html
            /tmp/direct-whales.html
            /tmp/via-earth.html
            /tmp/via-fires.html
            /tmp/via-whales.html
            /tmp/live-sitemap.xml
          if-no-files-found: warn
          retention-days: 30
,headers)
          if not m: raise SystemExit('missing worker content-type')
          raw=Path('/tmp/worker-before.multipart').read_bytes()
          message=BytesParser(policy=default).parsebytes(
              ('Content-Type: '+m.group(1)+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin1')+raw
          )
          candidates=[]
          for part in message.walk():
              if part.is_multipart(): continue
              payload=part.get_payload(decode=True) or b''
              if b'export default' in payload and b'async fetch' in payload:
                  candidates.append(payload)
          if len(candidates)!=1: raise SystemExit(f'expected one worker module, found {len(candidates)}')
          Path('/tmp/worker-source.js').write_bytes(candidates[0])
          s=candidates[0].decode('utf-8')
          marker='''      if (isAssetPath(path)) return proxyAsset(request);
                if (path !== "/") return redirectTo(`https://4planet.org${path}${url.search}`);
                return proxy(request, "/atlas", "atlas");'''
