          jq -e '.success==true' <<<"$response" >/dev/null

          curl -fsS "${api}/accounts/${account_id}/workers/scripts/4planet-product-domains" "${auth[@]}" -o /tmp/worker-after.js
          grep -Fq 'path === "/earth" || path === "/fires" || path === "/whales"' /tmp/worker-after.js

