name: 4PLANET ID POST GOOGLE LIVE Proof

on:
  pull_request:
    paths:
      - 'scripts/identity-post-google-live-proof.mjs'
      - '.github/workflows/identity-post-google-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cloudflare exact production commit readback
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN_MISSING"
            exit 2
          fi
          api=https://api.cloudflare.com/client/v4
          zone=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api/zones?name=4planet.org")
          account=$(jq -r '.result[0].account.id // empty' <<< "$zone")
          data=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api/accounts/$account/pages/projects/4planet-05/deployments?env=production&page=1&per_page=3")
          jq -r '.result[]? | [.deployment_trigger.metadata.commit_hash, .latest_stage.name, .latest_stage.status, .created_on] | @tsv' <<< "$data"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify live Google return asset and browser bridge
        run: node scripts/identity-post-google-live-proof.mjs
