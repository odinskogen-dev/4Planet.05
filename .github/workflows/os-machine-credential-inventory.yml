name: 4PLANET OS — scoped machine credential presence audit
on:
  push:
    branches: [labs/overview-v1]
    paths: [.github/workflows/os-machine-credential-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRIVE_SA_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
      DRIVE_SA_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}
      GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
      GDRIVE_REFRESH: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_REFRESH: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_REFRESH: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OS_SUPABASE_URL: ${{ secrets.OS_SUPABASE_URL }}
      OS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OS_SUPABASE_PUBLISHABLE_KEY }}
      OS_FOUNDER_USER_ID: ${{ secrets.OS_FOUNDER_USER_ID }}
      OS_FOUNDER_EMAIL: ${{ secrets.OS_FOUNDER_EMAIL }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report presence only, never actual secret contents
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/os-credential-presence.md
          printf '# OS machine credential capability audit (presence only)\n\n' > "$report"
          for name in DRIVE_SA_JSON DRIVE_SA_KEY GOOGLE_SA_JSON GOOGLE_CREDENTIALS GOOGLE_CREDS_JSON GOOGLE_APPLICATION_CREDENTIALS_JSON GDRIVE_SA_JSON GDRIVE_TOKEN GOOGLE_DRIVE_TOKEN GDRIVE_REFRESH GOOGLE_REFRESH DRIVE_REFRESH SUPABASE_SERVICE_ROLE SUPABASE_URL OS_SUPABASE_URL OS_SUPABASE_PUBLISHABLE_KEY OS_FOUNDER_USER_ID OS_FOUNDER_EMAIL CLOUDFLARE_ACCESS_API_TOKEN; do
            if [[ -n "${!name:-}" ]]; then printf '%s: PRESENT\n' "$name" >> "$report"; else printf '%s: MISSING\n' "$name" >> "$report"; fi
          done
          cat "$report"
      - name: Prove service-account credential and read-only Knowledge OS folder access (no secret values or data)
        if: env.GOOGLE_SA_JSON != ''
        shell: bash
        env:
          GOOGLE_CREDENTIAL_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';
          const raw=process.env.GOOGLE_CREDENTIAL_JSON;
          let config;
          try { config=JSON.parse(raw); }
          catch {throw Error('SERVICE_ACCOUNT_JSON_INVALID');}
          const expected='id-planet-brain-reader@planet-brain-sync.iam.gserviceaccount.com';
          const checks={
            is_service_account: config.type==='service_account',
            matches_selected_reader: config.client_email===expected,
            contains_private_key: typeof config.private_key==='string' && config.private_key.length>0,
            contains_token_uri: typeof config.token_uri==='string' && config.token_uri.length>0
          };
          console.log('Credential shape check (boolean only; no key/email/contents):',JSON.stringify(checks));
          if(Object.values(checks).some(v=>!v))
            throw Error('SERVICE_ACCOUNT_JSON_IDENTITY_OR_CONTENT_MISMATCH');
          let key;
          try {key=createPrivateKey(config.private_key);}catch{throw Error('SERVICE_ACCOUNT_PRIVATE_KEY_INVALID');}
          if(new URL(config.token_uri).origin!=='https://oauth2.googleapis.com')
            throw Error('SERVICE_ACCOUNT_TOKEN_ENDPOINT_UNEXPECTED');
          const now=Math.floor(Date.now()/1000);
          const encode=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const unsigned=encode({alg:'RS256',typ:'JWT'})+'.'+encode({
            iss:config.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',
            aud:config.token_uri,iat:now,exp:now+1800
          });
          const jwt=unsigned+'.'+sign('RSA-SHA256',Buffer.from(unsigned),key).toString('base64url');
          const tokenResponse=await fetch(config.token_uri,{
            method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:jwt}),
            signal:AbortSignal.timeout(20000)
          });
          if(!tokenResponse.ok)throw Error('GOOGLE_TOKEN_HTTP_'+tokenResponse.status);
          const token=(await tokenResponse.json()).access_token;
          if(!token)throw Error('GOOGLE_TOKEN_MISSING');
          const folderId='16UzbrS_xiSxvsrWkmUvp9M3OABOebiSG';
          const meta=await fetch('https://www.googleapis.com/drive/v3/files/'+folderId+'?fields=id,name,mimeType&supportsAllDrives=true',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          if(!meta.ok)throw Error('KNOWLEDGE_OS_FOLDER_HTTP_'+meta.status);
          const folder=await meta.json();
          if(folder.id!==folderId||folder.mimeType!=='application/vnd.google-apps.folder')
            throw Error('KNOWLEDGE_OS_FOLDER_IDENTITY_MISMATCH');
          const children=await fetch('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({
            q:"'"+folderId+"' in parents and trashed = false",fields:'nextPageToken,files(id,mimeType)',
            page_size:'1',pageSize:'1',supportsAllDrives:'true',includeItemsFromAllDrives:'true'
          }),{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          if(!children.ok)throw Error('KNOWLEDGE_OS_CHILDREN_HTTP_'+children.status);
          console.log('PASS: scoped Google service account authenticates and reads the authorized 4PLANET Knowledge OS folder and first page. No contents or secrets logged. ODIN BRAIN not queried.');
          NODE
      - name: Save to existing OS handoff
        if: always()
        run: |
          if [[ -s /tmp/os-credential-presence.md ]]; then gh issue comment 329 --repo "$GITHUB_REPOSITORY" --body-file /tmp/os-credential-presence.md; fi
