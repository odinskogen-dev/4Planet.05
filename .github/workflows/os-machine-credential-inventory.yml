name: 4PLANET OS — scoped machine credential presence audit
on:
  push:
    branches: [labs/overview-v1]
    paths: [.github/workflows/os-machine-credential-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRIVE_SA_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
      DRIVE_SA_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}
      GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
      GDRIVE_REFRESH: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_REFRESH: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_REFRESH: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OS_SUPABASE_URL: ${{ secrets.OS_SUPABASE_URL }}
      OS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.OS_SUPABASE_PUBLISHABLE_KEY }}
      OS_FOUNDER_USER_ID: ${{ secrets.OS_FOUNDER_USER_ID }}
      OS_FOUNDER_EMAIL: ${{ secrets.OS_FOUNDER_EMAIL }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report presence only, never actual secret contents
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/os-credential-presence.md
          printf '# OS machine credential capability audit (presence only)\n\n' > "$report"
          for name in DRIVE_SA_JSON DRIVE_SA_KEY GOOGLE_SA_JSON GOOGLE_CREDENTIALS GOOGLE_CREDS_JSON GOOGLE_APPLICATION_CREDENTIALS_JSON GDRIVE_SA_JSON GDRIVE_TOKEN GOOGLE_DRIVE_TOKEN GDRIVE_REFRESH GOOGLE_REFRESH DRIVE_REFRESH SUPABASE_SERVICE_ROLE SUPABASE_URL OS_SUPABASE_URL OS_SUPABASE_PUBLISHABLE_KEY OS_FOUNDER_USER_ID OS_FOUNDER_EMAIL CLOUDFLARE_ACCESS_API_TOKEN; do
            if [[ -n "${!name:-}" ]]; then printf '%s: PRESENT\n' "$name" >> "$report"; else printf '%s: MISSING\n' "$name" >> "$report"; fi
          done
          cat "$report"
      - name: Save to existing OS handoff
        if: always()
        run: |
          if [[ -s /tmp/os-credential-presence.md ]]; then gh issue comment 329 --repo "$GITHUB_REPOSITORY" --body-file /tmp/os-credential-presence.md; fi
