name: 4PLANET OS — machine credential name inventory (values withheld)
on:
  push:
    branches: [labs/overview-v1]
    paths: [.github/workflows/os-machine-credential-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inventory relevant existing GitHub secret names ONLY
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/os-machine-credential-inventory.md
          const names=Object.keys(JSON.parse(process.env.SECRETS_JSON||'{}'));
          const allowed=/^(?:CLOUDFLARE|CF_|GOOGLE|GDRIVE|GCP_|DRIVE|SUPABASE|OS_|FOUNDER_|GH_|GITHUB_APP|FACTORY_|BRAIN_)/i;
          const redacted=names.filter(n=>allowed.test(n)).sort();
          console.log('# 4PLANET OS — GitHub machine credential names (NEVER VALUES)\n');
          console.log('Only configured secret NAMES matching OS/Cloudflare/Drive/Google/Supabase/GitHub/Factory/BRAIN are listed. Values are never logged or uploaded.');
          for(const n of redacted) console.log('- '+n);
          console.log('\nTotal matching secret names: '+redacted.length);
          NODE
          cat /tmp/os-machine-credential-inventory.md
      - name: Record credential-name readback
        if: always()
        run: |
          if [[ -s /tmp/os-machine-credential-inventory.md ]]; then gh issue comment 329 --repo "$GITHUB_REPOSITORY" --body-file /tmp/os-machine-credential-inventory.md; fi
