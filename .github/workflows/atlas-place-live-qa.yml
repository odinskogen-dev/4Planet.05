name: ATLAS Place Authority Live QA

on:
  push:
    branches: [main]
    paths:
      - "functions/_middleware.js"
      - "functions/atlas-promoted-places.generated.js"
      - ".github/workflows/atlas-place-live-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-place-live-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for current ATLAS discovery projection
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            berlin=$(curl -fsS --max-time 15 https://4planetatlas.com/place/berlin || true)
            manila=$(curl -fsS --max-time 15 https://4planetatlas.com/place/manila || true)
            sm=$(curl -fsS --max-time 15 https://4planetatlas.com/sitemap.xml || true)
            count=$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')
            if grep -Fq 'Natural Earth NE_ID' <<<"$berlin" && grep -Fq 'Verified geographic hierarchy' <<<"$berlin" && grep -Fq 'Q1461' <<<"$manila" && [ "$count" = "250" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "ATLAS live projection did not converge."
          exit 1

      - name: Verify canonical World Place Index
        shell: bash
        run: |
          set -euo pipefail
          index=$(curl -fsS https://4planetatlas.com/places)
          grep -Fq '<h1>Explore the world by place</h1>' <<<"$index"
          grep -Fq 'CollectionPage' <<<"$index"
          grep -Fq 'ItemList' <<<"$index"
          grep -Fq 'Natural Earth 1:50m Populated Places v5.1.2' <<<"$index"
          sm=$(curl -fsS https://4planetatlas.com/sitemap.xml)
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | wc -l | tr -d ' ')" = "250"
          test "$(grep -o '<loc>https://4planetatlas.com/place/[^<]*</loc>' <<<"$sm" | sort -u | wc -l | tr -d ' ')" = "250"
          curl -fsS https://4planetatlas.com/robots.txt | grep -Fq 'Sitemap: https://4planetatlas.com/sitemap.xml'

      - name: Verify representative entity authority
        shell: bash
        run: |
          set -euo pipefail
          for slug in berlin oslo nairobi tokyo kenya brazil manila; do
            html=$(curl -fsS "https://4planetatlas.com/place/$slug")
            grep -Fq '<meta name="robots" content="index,follow' <<<"$html"
            grep -Fq 'application/ld+json' <<<"$html"
            grep -Fq 'Natural Earth NE_ID' <<<"$html"
            grep -Fq 'Verified geographic hierarchy' <<<"$html"
            grep -Fq 'Source and provenance' <<<"$html"
            grep -Fq "Open " <<<"$html"
            grep -Fq 'Truth boundary:' <<<"$html"
          done
          berlin=$(curl -fsS https://4planetatlas.com/place/berlin)
          grep -Fq 'Wikidata Q64' <<<"$berlin"
          grep -Fq 'GeoNames 2950159' <<<"$berlin"
          grep -Fq 'ISO DE' <<<"$berlin"
          manila=$(curl -fsS https://4planetatlas.com/place/manila)
          grep -Fq 'ATLAS_PLACE_COHORT_02_200' <<<"$manila" || grep -Fq 'Natural Earth NE_ID' <<<"$manila"
          grep -Fq 'Wikidata Q1461' <<<"$manila"
          kenya=$(curl -fsS https://4planetatlas.com/place/kenya)
          grep -Fq 'Curated species connections' <<<"$kenya"
          grep -Fq 'African Savanna Elephant' <<<"$kenya"
          grep -Fq 'Related 4PLANET Missions' <<<"$kenya"

      - name: Red-team crawl traps
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' https://4planetatlas.com/place/__definitely-not-a-qualified-place__)
          test "$code" = "404"
          grep -Fq 'Place not found' /tmp/unknown.html
          headers=$(curl -sSI https://4planetatlas.com/place/__definitely-not-a-qualified-place__ | tr -d '\r')
          grep -qi '^x-robots-tag:.*noindex' <<<"$headers"

      - name: Check lightweight raw HTML performance
        shell: bash
        run: |
          set -euo pipefail
          for slug in berlin oslo nairobi tokyo kenya brazil manila; do
            t=$(curl -sS -o /dev/null -w '%{time_total}' "https://4planetatlas.com/place/$slug")
            python - "$slug" "$t" <<'PY'
          import sys
          slug,t=sys.argv[1],float(sys.argv[2])
          print(f"{slug}: {t:.3f}s")
          if t>3.0:
              raise SystemExit(f"{slug} raw HTML exceeded 3.0s")
          PY
          done
          echo 'ATLAS_PLACE_AUTHORITY_LIVE_QA_PASS'
