name: Bind 4planetmarket.com to restored Gold interface + real products

on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/bind-4planetmarket-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bind-4planetmarket-domain
  cancel-in-progress: false

env:
  MARKET_UPSTREAM: https://1ae04048.4planet-05.pages.dev
  MARKET_SOURCE_SHA: 90f04d71ddb56ba01cf460a96713404c22cb4822
  MARKET_MARKER: 4market-11-products-amalie-90f04d7
  ROLLBACK_UPSTREAM: https://6528d95b.4planet-05.pages.dev
  ROLLBACK_MARKER: 4market-gold-first-products-ccd3021

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/zones.json"
          status=$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" 'https://api.cloudflare.com/client/v4/zones?name=4planetmarket.com&status=active')
          test "$status" = "200"
          jq -e '.success == true' "$file" >/dev/null
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$file")
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify exact immutable candidate and self-hosted assets
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /market \
            /market/odin/reinebringen-vista.jpg \
            /market/amalie/a01-dense-animals-green-leaves.jpg \
            /market/amalie/a15-pig-society-turquoise.jpg; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$MARKET_UPSTREAM$path" || true)
            echo "$MARKET_UPSTREAM$path -> HTTP $code"
            test "$code" = "200"
          done
          headers="$RUNNER_TEMP/asset.headers"
          bytes=$(curl -L -sS -D "$headers" "$MARKET_UPSTREAM/market/amalie/a01-dense-animals-green-leaves.jpg" -o "$RUNNER_TEMP/asset.jpg" -w '%{size_download}')
          grep -qi '^content-type: image/jpeg' "$headers"
          test "$bytes" -gt 100000

      - name: Browser preflight — Gold Market + eleven real products
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          MARKET_UPSTREAM="$MARKET_UPSTREAM" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{width: 1440, height: 1000}, {width: 390, height: 844}]) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${process.env.MARKET_UPSTREAM}/market`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForSelector('.mkt-first-product', { timeout: 30000 });
            const body = (await page.locator('body').innerText()).toLowerCase();
            for (const token of ['art that', 'one sale', 'creator dashboard', 'first products', 'above the fjord', 'amalie marie myrtvedt', 'dense animals / green leaves', 'pig society / turquoise']) {
              if (!body.includes(token)) throw new Error(`Preflight missing Market token: ${token}`);
            }
            for (const forbidden of ['still water, two skies', 'demo artwork · fixture']) {
              if (body.includes(forbidden)) throw new Error(`Preflight still contains removed content: ${forbidden}`);
            }
            const products = page.locator('.mkt-first-product');
            if (await products.count() !== 11) throw new Error(`Expected 11 real products, got ${await products.count()}.`);
            if (await page.locator('.mkt-product-stage').count() < 1) throw new Error('Original Gold product stage is missing.');
            if (await page.locator('.mkt-economy').count() < 1) throw new Error('Original Market economy section is missing.');
            if (await page.locator('.mkt-dashboard').count() < 1) throw new Error('Original creator dashboard is missing.');
            await products.last().scrollIntoViewIfNeeded();
            await page.waitForFunction(() => [...document.querySelectorAll('.mkt-first-product img')].every(img => img.complete && img.naturalWidth > 0), null, { timeout: 30000 });
            const imgs = page.locator('.mkt-first-product img');
            const srcs = await imgs.evaluateAll(nodes => nodes.map(img => img.getAttribute('src')));
            const amalie = srcs.filter(src => src?.startsWith('/market/amalie/'));
            const odin = srcs.filter(src => src?.startsWith('/market/odin/'));
            if (amalie.length !== 6 || odin.length !== 5) throw new Error(`Expected 6 Amalie + 5 Odin assets, got ${amalie.length} + ${odin.length}.`);
            if (srcs.some(src => src?.includes('fjord-valley-mirror'))) throw new Error('Removed sunglasses asset is still referenced.');
            const external = await imgs.evaluateAll(nodes => nodes.find(img => new URL(img.src).hostname !== location.hostname)?.src ?? null);
            if (external) throw new Error(`External image dependency: ${external}`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 2) throw new Error(`Horizontal overflow ${overflow}px at ${viewport.width}px`);
            await page.close();
          }
          await browser.close();
          console.log('PASS — Gold Market preserved; 11 real self-hosted products render, including six Amalie works; wrong portrait and demo visual absent.');
          NODE

      - name: Deploy isolated Market Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.mjs" <<EOF
          const UPSTREAM = "$MARKET_UPSTREAM";
          const MARKER = "$MARKET_MARKER";
          const SOURCE = "$MARKET_SOURCE_SHA";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-market", MARKER);
              headers.set("x-4planet-market-source", SOURCE);
              headers.set("cache-control", "no-store");
              return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/worker.mjs"
          compatibility_date = "2026-09-14"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"
          touch "$RUNNER_TEMP/market-deployed"

      - name: Verify live Worker and local assets
        shell: bash
        run: |
          set -euo pipefail
          check_live() {
            local url="$1"
            for attempt in $(seq 1 24); do
              headers="$RUNNER_TEMP/headers-${attempt}.txt"
              code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "${url}?release=${MARKET_SOURCE_SHA}&attempt=${attempt}" || true)
              marker=$(grep -i '^x-4planet-market:' "$headers" | tr -d '\r' || true)
              source=$(grep -i '^x-4planet-market-source:' "$headers" | tr -d '\r' || true)
              echo "$url -> HTTP $code · $marker · $source"
              if [ "$code" = "200" ] && echo "$marker" | grep -q "$MARKET_MARKER" && echo "$source" | grep -q "$MARKET_SOURCE_SHA"; then return 0; fi
              sleep 5
            done
            return 1
          }
          check_live 'https://4planetmarket.com/'
          check_live 'https://www.4planetmarket.com/'
          check_live 'https://4planetmarket.com/market'
          image_headers="$RUNNER_TEMP/live-image.headers"
          bytes=$(curl -L -sS -D "$image_headers" "https://4planetmarket.com/market/amalie/a01-dense-animals-green-leaves.jpg?release=$MARKET_SOURCE_SHA" -o "$RUNNER_TEMP/live-image.jpg" -w '%{size_download}')
          grep -qi '^content-type: image/jpeg' "$image_headers"
          test "$bytes" -gt 100000

      - name: Browser verify LIVE exact Worker — cleaned Market + Amalie
        shell: bash
        run: |
          set -euo pipefail
          MARKET_MARKER="$MARKET_MARKER" MARKET_SOURCE_SHA="$MARKET_SOURCE_SHA" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const expectedMarker = process.env.MARKET_MARKER;
          const expectedSource = process.env.MARKET_SOURCE_SHA;
          for (const viewport of [{width: 1440, height: 1000}, {width: 390, height: 844}]) {
            let verified = false;
            let last = '';
            for (let attempt = 1; attempt <= 12; attempt++) {
              const page = await browser.newPage({ viewport });
              const url = `https://4planetmarket.com/?release=${expectedSource}&browser_attempt=${attempt}&w=${viewport.width}`;
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const headers = response?.headers() ?? {};
              const marker = headers['x-4planet-market'] ?? '';
              const source = headers['x-4planet-market-source'] ?? '';
              last = `marker=${marker} source=${source} url=${page.url()}`;
              console.log(`Browser ${viewport.width}px attempt ${attempt}: ${last}`);
              if (marker !== expectedMarker || source !== expectedSource) {
                await page.close();
                await new Promise(r => setTimeout(r, 5000));
                continue;
              }
              await page.waitForSelector('.mkt-first-product', { timeout: 30000 });
              const body = (await page.locator('body').innerText()).toLowerCase();
              for (const token of ['art that', 'one sale', 'creator dashboard', 'first products', 'above the fjord', 'amalie marie myrtvedt', 'dense animals / green leaves', 'pig society / turquoise']) {
                if (!body.includes(token)) throw new Error(`LIVE missing Market token: ${token}\n${body.slice(0, 2500)}`);
              }
              for (const forbidden of ['still water, two skies', 'demo artwork · fixture']) {
                if (body.includes(forbidden)) throw new Error(`LIVE still contains removed content: ${forbidden}`);
              }
              const products = page.locator('.mkt-first-product');
              if (await products.count() !== 11) throw new Error(`LIVE expected 11 products, got ${await products.count()}.`);
              if (await page.locator('.mkt-product-stage').count() < 1 || await page.locator('.mkt-economy').count() < 1 || await page.locator('.mkt-dashboard').count() < 1) throw new Error('LIVE old Market interface was not preserved.');
              await products.last().scrollIntoViewIfNeeded();
              await page.waitForFunction(() => [...document.querySelectorAll('.mkt-first-product img')].every(img => img.complete && img.naturalWidth > 0), null, { timeout: 30000 });
              const imgs = page.locator('.mkt-first-product img');
              const srcs = await imgs.evaluateAll(nodes => nodes.map(img => img.getAttribute('src')));
              const amalie = srcs.filter(src => src?.startsWith('/market/amalie/'));
              const odin = srcs.filter(src => src?.startsWith('/market/odin/'));
              if (amalie.length !== 6 || odin.length !== 5) throw new Error(`LIVE expected 6 Amalie + 5 Odin assets, got ${amalie.length} + ${odin.length}.`);
              if (srcs.some(src => src?.includes('fjord-valley-mirror'))) throw new Error('LIVE sunglasses asset is still referenced.');
              const external = await imgs.evaluateAll(nodes => nodes.find(img => new URL(img.src).hostname !== location.hostname)?.src ?? null);
              if (external) throw new Error(`LIVE external image dependency: ${external}`);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              if (overflow > 2) throw new Error(`LIVE horizontal overflow ${overflow}px at ${viewport.width}px`);
              await page.close();
              verified = true;
              break;
            }
            if (!verified) throw new Error(`Exact Worker did not reach browser edge for ${viewport.width}px. Last: ${last}`);
          }
          await browser.close();
          console.log('PASS — LIVE exact Worker shows preserved Gold Market with 11 real products, including six Amalie works; wrong portrait and demo visual absent.');
          NODE
          touch "$RUNNER_TEMP/live-verified"

      - name: Automatic rollback on any post-deploy failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/market-deployed" ] || [ -f "$RUNNER_TEMP/live-verified" ]; then
            echo 'No rollback required.'
            exit 0
          fi
          echo 'Restoring previous accepted Market origin.'
          cat > "$RUNNER_TEMP/rollback.mjs" <<EOF
          const UPSTREAM = "$ROLLBACK_UPSTREAM";
          const MARKER = "$ROLLBACK_MARKER";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-market", MARKER);
              headers.set("cache-control", "no-store");
              return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > "$RUNNER_TEMP/rollback.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/rollback.mjs"
          compatibility_date = "2026-09-14"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/rollback.toml"
          for attempt in $(seq 1 18); do
            headers="$RUNNER_TEMP/rb-$attempt.txt"
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' "https://4planetmarket.com/?rollback=$attempt" || true)
            marker=$(grep -i '^x-4planet-market:' "$headers" | tr -d '\r' || true)
            if [ "$code" = '200' ] && echo "$marker" | grep -q "$ROLLBACK_MARKER"; then
              echo 'ROLLBACK VERIFIED.'
              exit 0
            fi
            sleep 5
          done
          echo 'ROLLBACK COULD NOT BE VERIFIED.'
          exit 1

      - name: Record live binding state
        if: success()
        run: |
          echo "LIVE 4planetmarket.com -> $MARKET_UPSTREAM"
          echo "Source exact candidate: $MARKET_SOURCE_SHA"
          echo "Worker marker: $MARKET_MARKER"
          echo "Rollback upstream: $ROLLBACK_UPSTREAM"
          echo "Existing Gold Market interface preserved. 11 real self-hosted products across two creators. Six Amalie Marie Myrtvedt works live. Wrong Odin portrait and demo artwork visual removed. Commerce remains off. 4planet.org untouched."
