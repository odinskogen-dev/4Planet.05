name: Bind 4planetmarket.com to restored Gold interface + first products

on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/bind-4planetmarket-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bind-4planetmarket-domain
  cancel-in-progress: false

env:
  MARKET_UPSTREAM: https://6528d95b.4planet-05.pages.dev
  MARKET_SOURCE_SHA: ccd3021c3fdcd30e4f0c8f56a369729c8e70e5a5
  MARKET_MARKER: 4market-gold-first-products-ccd3021
  ROLLBACK_UPSTREAM: https://4482f621.4planet-05.pages.dev
  ROLLBACK_MARKER: 4market-restored-4482f621

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/zones.json"
          status=$(curl -sS -o "$file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            'https://api.cloudflare.com/client/v4/zones?name=4planetmarket.com&status=active')
          test "$status" = "200"
          jq -e '.success == true' "$file" >/dev/null
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$file")
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify exact immutable candidate and self-hosted asset
        shell: bash
        run: |
          set -euo pipefail
          for path in /market /market/odin/reinebringen-vista.jpg /market/odin/seaweed-coast.jpg; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$MARKET_UPSTREAM$path" || true)
            echo "$MARKET_UPSTREAM$path -> HTTP $code"
            test "$code" = "200"
          done
          headers="$RUNNER_TEMP/asset.headers"
          bytes=$(curl -L -sS -D "$headers" "$MARKET_UPSTREAM/market/odin/reinebringen-vista.jpg" -o "$RUNNER_TEMP/asset.jpg" -w '%{size_download}')
          grep -qi '^content-type: image/jpeg' "$headers"
          test "$bytes" -gt 100000

      - name: Browser preflight — old Market preserved + six real products
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          MARKET_UPSTREAM="$MARKET_UPSTREAM" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{width: 1440, height: 1000}, {width: 390, height: 844}]) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${process.env.MARKET_UPSTREAM}/market`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForSelector('.mkt-first-product', { timeout: 30000 });
            const body = (await page.locator('body').innerText()).toLowerCase();
            for (const token of ['art that', 'one sale', 'creator dashboard', 'first products', 'above the fjord', 'kelp line, low tide']) {
              if (!body.includes(token)) throw new Error(`Preflight missing preserved/new Market token: ${token}`);
            }
            if (await page.locator('.mkt-first-product').count() !== 6) throw new Error('Expected six first products.');
            if (await page.locator('.mkt-product-stage').count() < 1) throw new Error('Original Gold product stage is missing.');
            if (await page.locator('.mkt-economy').count() < 1) throw new Error('Original Market economy section is missing.');
            if (await page.locator('.mkt-dashboard').count() < 1) throw new Error('Original creator dashboard is missing.');
            await page.waitForFunction(() => [...document.querySelectorAll('.mkt-first-product img')].every(img => img.complete && img.naturalWidth > 0), null, { timeout: 30000 });
            const imgs = page.locator('.mkt-first-product img');
            const srcs = await imgs.evaluateAll(nodes => nodes.map(img => img.getAttribute('src')));
            if (!srcs.every(src => src?.startsWith('/market/odin/'))) throw new Error(`Unexpected image source: ${JSON.stringify(srcs)}`);
            const external = await imgs.evaluateAll(nodes => nodes.find(img => new URL(img.src).hostname !== location.hostname)?.src ?? null);
            if (external) throw new Error(`External image dependency: ${external}`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 2) throw new Error(`Horizontal overflow ${overflow}px at ${viewport.width}px`);
            await page.close();
          }
          await browser.close();
          console.log('PASS — restored Gold interface preserved and six real self-hosted products render on desktop + mobile.');
          NODE

      - name: Deploy isolated Market Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.mjs" <<EOF
          const UPSTREAM = "$MARKET_UPSTREAM";
          const MARKER = "$MARKET_MARKER";
          const SOURCE = "$MARKET_SOURCE_SHA";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-market", MARKER);
              headers.set("x-4planet-market-source", SOURCE);
              return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/worker.mjs"
          compatibility_date = "2026-09-14"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"
          touch "$RUNNER_TEMP/market-deployed"

      - name: Verify live Worker and local assets
        shell: bash
        run: |
          set -euo pipefail
          check_live() {
            local url="$1"
            for attempt in $(seq 1 24); do
              headers="$RUNNER_TEMP/headers-${attempt}.txt"
              code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
              marker=$(grep -i '^x-4planet-market:' "$headers" | tr -d '\r' || true)
              source=$(grep -i '^x-4planet-market-source:' "$headers" | tr -d '\r' || true)
              echo "$url -> HTTP $code · $marker · $source"
              if [ "$code" = "200" ] && echo "$marker" | grep -q "$MARKET_MARKER" && echo "$source" | grep -q "$MARKET_SOURCE_SHA"; then return 0; fi
              sleep 5
            done
            return 1
          }
          check_live 'https://4planetmarket.com/'
          check_live 'https://www.4planetmarket.com/'
          check_live 'https://4planetmarket.com/market'
          image_headers="$RUNNER_TEMP/live-image.headers"
          bytes=$(curl -L -sS -D "$image_headers" 'https://4planetmarket.com/market/odin/reinebringen-vista.jpg' -o "$RUNNER_TEMP/live-image.jpg" -w '%{size_download}')
          grep -qi '^content-type: image/jpeg' "$image_headers"
          test "$bytes" -gt 100000

      - name: Browser verify LIVE root — Market, not creator landing page
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{width: 1440, height: 1000}, {width: 390, height: 844}]) {
            const page = await browser.newPage({ viewport });
            await page.goto('https://4planetmarket.com/', { waitUntil: 'networkidle', timeout: 60000 });
            if (new URL(page.url()).hostname !== '4planetmarket.com') throw new Error(`Unexpected live hostname: ${page.url()}`);
            await page.waitForSelector('.mkt-first-product', { timeout: 30000 });
            const body = (await page.locator('body').innerText()).toLowerCase();
            for (const token of ['art that', 'one sale', 'creator dashboard', 'first products', 'above the fjord', 'kelp line, low tide']) {
              if (!body.includes(token)) throw new Error(`LIVE missing Market token: ${token}`);
            }
            if (await page.locator('.mkt-first-product').count() !== 6) throw new Error('LIVE expected six products.');
            if (await page.locator('.mkt-product-stage').count() < 1 || await page.locator('.mkt-economy').count() < 1 || await page.locator('.mkt-dashboard').count() < 1) throw new Error('LIVE old Market interface was not preserved.');
            await page.waitForFunction(() => [...document.querySelectorAll('.mkt-first-product img')].every(img => img.complete && img.naturalWidth > 0), null, { timeout: 30000 });
            const external = await page.locator('.mkt-first-product img').evaluateAll(nodes => nodes.find(img => new URL(img.src).hostname !== location.hostname)?.src ?? null);
            if (external) throw new Error(`LIVE external image dependency: ${external}`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 2) throw new Error(`LIVE horizontal overflow ${overflow}px at ${viewport.width}px`);
            await page.close();
          }
          await browser.close();
          console.log('PASS — LIVE 4planetmarket.com is the restored Market interface with six real products inside it.');
          NODE
          touch "$RUNNER_TEMP/live-verified"

      - name: Automatic rollback on any post-deploy failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/market-deployed" ] || [ -f "$RUNNER_TEMP/live-verified" ]; then
            echo 'No rollback required.'
            exit 0
          fi
          echo 'Restoring previous immutable Market origin.'
          cat > "$RUNNER_TEMP/rollback.mjs" <<EOF
          const UPSTREAM = "$ROLLBACK_UPSTREAM";
          const MARKER = "$ROLLBACK_MARKER";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-market", MARKER);
              return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > "$RUNNER_TEMP/rollback.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/rollback.mjs"
          compatibility_date = "2026-09-14"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/rollback.toml"
          for attempt in $(seq 1 18); do
            headers="$RUNNER_TEMP/rb-$attempt.txt"
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' 'https://4planetmarket.com/' || true)
            marker=$(grep -i '^x-4planet-market:' "$headers" | tr -d '\r' || true)
            if [ "$code" = '200' ] && echo "$marker" | grep -q "$ROLLBACK_MARKER"; then
              echo 'ROLLBACK VERIFIED.'
              exit 0
            fi
            sleep 5
          done
          echo 'ROLLBACK COULD NOT BE VERIFIED.'
          exit 1

      - name: Record live binding state
        if: success()
        run: |
          echo "LIVE 4planetmarket.com -> $MARKET_UPSTREAM"
          echo "Source exact candidate: $MARKET_SOURCE_SHA"
          echo "Worker marker: $MARKET_MARKER"
          echo "Rollback upstream: $ROLLBACK_UPSTREAM"
          echo "Existing Gold Market interface preserved. Six real self-hosted creator works inserted as first products. Commerce remains off. 4planet.org untouched."
