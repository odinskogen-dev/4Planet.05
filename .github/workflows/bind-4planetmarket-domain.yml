name: Restore previous 4planetmarket.com interface

on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/bind-4planetmarket-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bind-4planetmarket-domain
  cancel-in-progress: false

env:
  PREVIOUS_UPSTREAM: https://4482f621.4planet-05.pages.dev
  PREVIOUS_MARKER: 4market-restored-4482f621

jobs:
  restore-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/zones.json"
          status=$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" 'https://api.cloudflare.com/client/v4/zones?name=4planetmarket.com&status=active')
          test "$status" = "200"
          jq -e '.success == true' "$file" >/dev/null
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$file")
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify previous immutable interface
        shell: bash
        run: |
          set -euo pipefail
          for path in / /market; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$PREVIOUS_UPSTREAM$path")
            echo "$PREVIOUS_UPSTREAM$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Restore previous Market Worker origin
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/worker.mjs" <<EOF
          const UPSTREAM = "$PREVIOUS_UPSTREAM";
          const MARKER = "$PREVIOUS_MARKER";
          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;
              const response = await fetch(new Request(upstream.toString(), request));
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-market", MARKER);
              return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > "$RUNNER_TEMP/wrangler.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/worker.mjs"
          compatibility_date = "2026-09-14"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true
          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF
          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/wrangler.toml"

      - name: Verify restored live interface
        shell: bash
        run: |
          set -euo pipefail
          for url in https://4planetmarket.com/ https://www.4planetmarket.com/ https://4planetmarket.com/market; do
            ok=0
            for attempt in $(seq 1 18); do
              headers="$RUNNER_TEMP/h-$attempt.txt"
              code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
              marker=$(grep -i '^x-4planet-market:' "$headers" | tr -d '\r' || true)
              echo "$url -> HTTP $code · $marker"
              if [ "$code" = "200" ] && echo "$marker" | grep -q "$PREVIOUS_MARKER"; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = "1"
          done
          echo "RESTORED: 4planetmarket.com -> $PREVIOUS_UPSTREAM"
