name: Bind 4planetmarket.com to 4MARKET Gold

on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/bind-4planetmarket-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bind-4planetmarket-domain
  cancel-in-progress: true

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve Cloudflare API token without exposing it
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "No supported Cloudflare API token secret is available in this repository."
            exit 2
          fi
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"
          TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "PASS — Cloudflare credential resolved from repository Actions secrets."

      - name: Resolve 4planetmarket.com zone and account
        shell: bash
        run: |
          set -euo pipefail
          zones_file="$RUNNER_TEMP/cf-zones.json"
          status=$(curl -sS -o "$zones_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            'https://api.cloudflare.com/client/v4/zones?name=4planetmarket.com&status=active')
          test "$status" = "200"
          jq -e '.success == true' "$zones_file" >/dev/null
          ZONE_ID=$(jq -r '.result[0].id // empty' "$zones_file")
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' "$zones_file")
          if [ -z "$ZONE_ID" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "4planetmarket.com is not yet an active zone accessible to the configured token."
            exit 3
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "PASS — 4planetmarket.com zone resolved."

      - name: Verify immutable QA-passed Market upstream
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://4482f621.4planet-05.pages.dev/" \
            "https://4482f621.4planet-05.pages.dev/market" \
            "https://4482f621.4planet-05.pages.dev/cre4tors"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done

      - name: Deploy isolated 4MARKET custom-domain proxy
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/4planetmarket-worker.mjs" <<'EOF'
          const UPSTREAM = "https://4482f621.4planet-05.pages.dev";

          export default {
            async fetch(request) {
              const incoming = new URL(request.url);
              const upstream = new URL(incoming.pathname || "/", UPSTREAM);
              upstream.search = incoming.search;

              const upstreamRequest = new Request(upstream.toString(), request);
              const response = await fetch(upstreamRequest);
              const headers = new Headers(response.headers);
              headers.set("x-robots-tag", "noindex, nofollow, noarchive");
              headers.set("x-4planet-prototype", "4market-gold-01-cad5f58");

              return new Response(response.body, {
                status: response.status,
                statusText: response.statusText,
                headers,
              });
            }
          };
          EOF

          cat > "$RUNNER_TEMP/4planetmarket-wrangler.toml" <<EOF
          name = "4planetmarket-prototype"
          main = "$RUNNER_TEMP/4planetmarket-worker.mjs"
          compatibility_date = "2026-08-21"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[routes]]
          pattern = "4planetmarket.com"
          custom_domain = true

          [[routes]]
          pattern = "www.4planetmarket.com"
          custom_domain = true
          EOF

          npx --yes wrangler@latest deploy --config "$RUNNER_TEMP/4planetmarket-wrangler.toml"

      - name: Verify HTTPS and Market proxy identity
        shell: bash
        run: |
          set -euo pipefail
          check_live() {
            local url="$1"
            for attempt in $(seq 1 30); do
              headers="$RUNNER_TEMP/headers-${attempt}.txt"
              code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)
              marker=$(grep -i '^x-4planet-prototype:' "$headers" | tr -d '\r' || true)
              robots=$(grep -i '^x-robots-tag:' "$headers" | tr -d '\r' || true)
              echo "$url -> HTTP $code · $marker · $robots (attempt $attempt/30)"
              if [ "$code" = "200" ] && echo "$marker" | grep -q '4market-gold-01-cad5f58'; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          check_live "https://4planetmarket.com/"
          check_live "https://www.4planetmarket.com/"
          check_live "https://4planetmarket.com/market"
          check_live "https://4planetmarket.com/cre4tors"

      - name: Browser-check host-aware 4MARKET root and CRE4TORS bridge
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await page.goto('https://4planetmarket.com/', { waitUntil: 'networkidle', timeout: 60000 });
          const body = (await page.locator('body').innerText()).toLowerCase();
          if (!body.includes('art that') || !body.includes('something') || !body.includes('demo · not live commerce')) {
            throw new Error('4MARKET host-aware root did not render the expected Market Gold surface.');
          }
          if (new URL(page.url()).hostname !== '4planetmarket.com') {
            throw new Error(`Unexpected live hostname: ${page.url()}`);
          }
          const creatorBridge = page.locator('a[href="https://cre4tors.com"]').first();
          if (await creatorBridge.count() === 0) {
            throw new Error('Expected 4MARKET → CRE4TORS domain bridge is missing.');
          }
          console.log('PASS — 4planetmarket.com renders 4MARKET Gold on live HTTPS with CRE4TORS bridge.');
          await browser.close();
          NODE

      - name: Record reversible binding state
        run: |
          echo "4planetmarket.com + www.4planetmarket.com -> isolated Cloudflare Worker -> immutable QA-passed Market preview 4482f621."
          echo "Source exact candidate cad5f583546925412314591f717cfbcc1a14875c; controlled release head 8b323ef091a60dc01456f5b91411257226cb62b2."
          echo "4planet.org/main were not modified."
          echo "Market remains noindex prototype / DEMO commerce; real payments, POD orders, creator payouts and ecological outcomes remain disabled/unclaimed."
