name: SAFE LIVE MapLibre Security Remediation

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/safe-live-maplibre-security-remediation.yml

permissions:
  contents: write

concurrency:
  group: safe-live-maplibre-security-remediation-frozen
  cancel-in-progress: false

env:
  TARGET_BRANCH: release/safe-live-premium-final-02d-60428c6
  TARGET_BASE_SHA: 60428c6897a0216073a467e4bf4280877751d590

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Assert frozen base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_BASE_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate minimal locked security update and prove build
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact maplibre-gl@6.8.0
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          npm run test:smoke
          npm run assets:verify

      - name: Commit frozen security remediation only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_BASE_SHA" || { echo 'Frozen release branch moved; refusing write'; exit 3; }
          git config user.name '4PLANET Release Control'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/safe-live-maplibre-security-remediation.yml
          git add package.json package-lock.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/safe-live-maplibre-security-remediation.yml\npackage-lock.json\npackage.json'
          git diff --cached --check
          git commit -m 'fix(security): update MapLibre past critical sanitizer advisory'
          git push origin "HEAD:$TARGET_BRANCH"
