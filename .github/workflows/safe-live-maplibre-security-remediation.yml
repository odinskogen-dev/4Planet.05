name: SAFE HEIR MapLibre Security Remediation

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/safe-live-maplibre-security-remediation.yml

permissions:
  contents: write

concurrency:
  group: safe-heir-maplibre-security-remediation
  cancel-in-progress: false

env:
  TARGET_BRANCH: king/test

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact HEIR trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate minimal locked security update and prove build
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact maplibre-gl@6.8.0
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          npm run test:smoke
          npm run assets:verify

      - name: Commit HEIR security remediation only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$GITHUB_SHA" || { echo 'HEIR moved after trigger; refusing stale write'; exit 3; }
          git config user.name '4PLANET Release Control'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'package-lock.json\npackage.json'
          git diff --cached --check
          git commit -m 'fix(security): update MapLibre past critical sanitizer advisory'
          git push origin "HEAD:$TARGET_BRANCH"
