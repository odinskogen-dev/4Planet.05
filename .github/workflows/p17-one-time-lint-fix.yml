name: P17 One-Time Lint Fix

on:
  push:
    branches:
      - build/p17-actor-atlas-private-beta

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: build/p17-actor-atlas-private-beta
          fetch-depth: 0

      - name: Replace only the review-queue parsing block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/integrated/Actors.tsx')
          text = path.read_text()
          old = '''    let previous: unknown[] = [];
              try {
                previous = JSON.parse(localStorage.getItem(key) ?? "[]") as unknown[];
                if (!Array.isArray(previous)) previous = [];
              } catch {
                previous = [];
              }
          '''
          new = '''    const previous = (() => {
              try {
                const parsed = JSON.parse(localStorage.getItem(key) ?? "[]") as unknown;
                return Array.isArray(parsed) ? parsed : [];
              } catch {
                return [];
              }
            })();
          '''
          if old not in text:
              raise SystemExit('Expected review-queue block was not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove this one-time workflow
        run: rm .github/workflows/p17-one-time-lint-fix.yml

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "4PLANET Build Control"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/integrated/Actors.tsx .github/workflows/p17-one-time-lint-fix.yml
          git commit -m "fix(p17): make review queue parsing lint-safe"
          git push origin HEAD:build/p17-actor-atlas-private-beta
