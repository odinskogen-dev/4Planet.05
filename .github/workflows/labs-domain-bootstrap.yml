name: LABS custom domain bootstrap

on:
  push:
    branches: [ops/labs-domain-20260824]
    paths:
      - .github/workflows/labs-domain-bootstrap.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_PROJECT: 4planet-05
  CF_ZONE: 4planet.org
  LABS_DOMAIN: labs.4planet.org
  LABS_BRANCH: labs/overview-v1
  LABS_BRANCH_ALIAS: labs-overview-v1.4planet-05.pages.dev
  LABS_EXPECTED_SHA: 35486b0304779476e550b7d10e9981dd51dc8ef7

jobs:
  bind-labs-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare token exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Resolve Cloudflare zone and account
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${api}/zones?name=${CF_ZONE}&status=active" "${auth[@]}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zone_json}")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"${zone_json}")"
          test -n "${zone_id}" && test -n "${account_id}" || { echo "Could not resolve active ${CF_ZONE} zone/account"; exit 1; }
          echo "zone_id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"

      - name: Verify exact LABS branch deployment exists and is reachable
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          deployments="$(curl -fsS "${api}/accounts/${ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments?env=preview&per_page=100" "${auth[@]}")"
          match="$(jq -c --arg branch "${LABS_BRANCH}" --arg sha "${LABS_EXPECTED_SHA}" '
            .result[]?
            | select((.deployment_trigger.metadata.branch // "") == $branch)
            | select((.deployment_trigger.metadata.commit_hash // "") == $sha)
          ' <<<"${deployments}" | head -n1)"
          test -n "${match}" || { echo "Exact LABS deployment ${LABS_EXPECTED_SHA} not found for ${LABS_BRANCH}; refusing domain switch"; exit 1; }
          curl -fsS --retry 4 --retry-delay 2 "https://${LABS_BRANCH_ALIAS}/labs" -o /tmp/labs-branch.html
          grep -Eiq 'LABS|4PLANET' /tmp/labs-branch.html || { echo "Branch alias returned unexpected content"; exit 1; }
          echo "Verified branch deployment and HTTPS alias: https://${LABS_BRANCH_ALIAS}/labs"

      - name: Ensure Pages custom-domain registration
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          code="$(curl -sS -o /tmp/domain-get.json -w '%{http_code}' "${api}/accounts/${ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains/${LABS_DOMAIN}" "${auth[@]}")"
          if [[ "${code}" == "200" ]]; then
            echo "Pages custom domain already registered."
          elif [[ "${code}" == "404" ]]; then
            create="$(curl -fsS -X POST "${api}/accounts/${ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains" "${auth[@]}" --data "$(jq -nc --arg name "${LABS_DOMAIN}" '{name:$name}')")"
            [[ "$(jq -r '.success // false' <<<"${create}")" == "true" ]] || { jq '{success,errors}' <<<"${create}"; exit 1; }
            echo "Pages custom domain registered."
          else
            echo "Unexpected Pages-domain lookup HTTP ${code}"
            cat /tmp/domain-get.json
            exit 1
          fi

      - name: Point proxied DNS to the LABS branch alias
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          records="$(curl -fsS "${api}/zones/${ZONE_ID}/dns_records?name=${LABS_DOMAIN}&per_page=100" "${auth[@]}")"
          record_id="$(jq -r '.result[0].id // empty' <<<"${records}")"
          payload="$(jq -nc --arg name "${LABS_DOMAIN}" --arg content "${LABS_BRANCH_ALIAS}" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')"
          if [[ -n "${record_id}" ]]; then
            updated="$(curl -fsS -X PUT "${api}/zones/${ZONE_ID}/dns_records/${record_id}" "${auth[@]}" --data "${payload}")"
          else
            updated="$(curl -fsS -X POST "${api}/zones/${ZONE_ID}/dns_records" "${auth[@]}" --data "${payload}")"
          fi
          [[ "$(jq -r '.success // false' <<<"${updated}")" == "true" ]] || { jq '{success,errors}' <<<"${updated}"; exit 1; }
          actual="$(jq -r '.result.content // empty' <<<"${updated}")"
          proxied="$(jq -r '.result.proxied // false' <<<"${updated}")"
          [[ "${actual}" == "${LABS_BRANCH_ALIAS}" && "${proxied}" == "true" ]] || { echo "DNS readback mismatch"; exit 1; }
          echo "DNS readback: ${LABS_DOMAIN} -> ${actual} (proxied=${proxied})"

      - name: Verify custom-domain status and live HTTPS
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          status=""
          for i in $(seq 1 18); do
            domain="$(curl -fsS "${api}/accounts/${ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains/${LABS_DOMAIN}" "${auth[@]}")"
            status="$(jq -r '.result.status // empty' <<<"${domain}")"
            echo "Pages domain status: ${status:-unknown}"
            [[ "${status}" == "active" ]] && break
            [[ "${status}" == "error" || "${status}" == "blocked" ]] && { jq '.result' <<<"${domain}"; exit 1; }
            sleep 5
          done
          [[ "${status}" == "active" ]] || { echo "Domain did not become active within verification window"; exit 1; }

          curl -fsS -L --retry 8 --retry-delay 3 "https://${LABS_DOMAIN}/" -o /tmp/labs-root.html
          curl -fsS -L --retry 8 --retry-delay 3 "https://${LABS_DOMAIN}/labs" -o /tmp/labs-path.html
          grep -Eiq 'LABS' /tmp/labs-root.html || { echo "Custom-domain root is not rendering LABS content"; exit 1; }
          grep -Eiq 'LABS' /tmp/labs-path.html || { echo "Custom-domain /labs is not rendering LABS content"; exit 1; }
          curl -fsS -L --retry 4 --retry-delay 2 "https://4planet.org/" -o /tmp/main.html
          test -s /tmp/main.html || { echo "4planet.org regression check failed"; exit 1; }

          echo "LABS LIVE: https://${LABS_DOMAIN}/"
          echo "LABS PROJECT OS: https://${LABS_DOMAIN}/labs"
          echo "Source branch: ${LABS_BRANCH} @ ${LABS_EXPECTED_SHA}"
          echo "4planet.org remains reachable."
