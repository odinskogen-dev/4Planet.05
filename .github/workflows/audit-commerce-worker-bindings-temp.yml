name: TEMP audit existing Cloudflare commerce bindings
on:
  push:
    branches:
      - ops/4planetmarket-domain-20260821
    paths:
      - '.github/workflows/audit-commerce-worker-bindings-temp.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List relevant Worker names and binding names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api='https://api.cloudflare.com/client/v4'
          zone=$(curl -fsS "$api/zones?name=4planetmarket.com&status=active" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$account"
          scripts=$(curl -fsS "$api/accounts/$account/workers/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo 'RELEVANT_WORKERS'
          jq -r '.result[]?.id // empty' <<<"$scripts" | grep -Ei 'market|pay|stripe|bill|commerce|checkout|order|shop' | sort | while read -r worker; do
            [ -z "$worker" ] && continue
            echo "WORKER $worker"
            settings=$(curl -fsS "$api/accounts/$account/workers/scripts/$worker/settings" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
            jq -r '.result.bindings[]? | "  " + (.name // "unnamed") + " type=" + (.type // "unknown")' <<<"$settings" | sort
          done
