name: Founder Release 4NATION + S4PIENS 2026-10-14

on:
  push:
    branches: [release/founder-4nation-s4piens-20261014]
    paths:
      - .github/workflows/founder-live-4nation-s4piens-20261014.yml
      - ops/release/**

permissions:
  contents: read
  actions: read

concurrency:
  group: founder-release-4nation-s4piens-20261014
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve Cloudflare authority and snapshot rollback topology
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for c in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do [ -n "$c" ] && { TOKEN="$c"; break; }; done
          [ -n "$TOKEN" ] || { echo "CLOUDFLARE_TOKEN_MISSING"; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          api=https://api.cloudflare.com/client/v4
          z=$(curl -fsS "$api/zones?name=4planet.org&status=active" -H "Authorization: Bearer $TOKEN")
          aid=$(jq -r '.result[0].account.id // empty' <<<"$z")
          [ -n "$aid" ] || { echo "CLOUDFLARE_ACCOUNT_UNRESOLVED"; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
          mkdir -p artifacts/release
          curl -fsS "$api/zones?name=4nation.org" -H "Authorization: Bearer $TOKEN" > artifacts/release/cf-zone-4nation-before.json
          curl -fsS "$api/zones?name=s4piens.com" -H "Authorization: Bearer $TOKEN" > artifacts/release/cf-zone-s4piens-before.json
          szid=$(jq -r '.result[0].id // empty' artifacts/release/cf-zone-s4piens-before.json)
          [ -n "$szid" ] || { echo "S4PIENS_ZONE_MISSING"; exit 4; }
          echo "S4PIENS_ZONE_ID=$szid" >> "$GITHUB_ENV"
          curl -fsS "$api/zones/$szid/workers/routes" -H "Authorization: Bearer $TOKEN" > artifacts/release/s4-routes-before.json
          jq -e '([.result[]? | select(.pattern|contains("s4piens.com")) | select(.script!="4planet-s4piens-live")] | length)==0' artifacts/release/s4-routes-before.json >/dev/null || { echo "S4PIENS_FOREIGN_WORKER_ROUTE_HOLD"; exit 5; }
          curl -fsS "$api/accounts/$aid/workers/domains" -H "Authorization: Bearer $TOKEN" > artifacts/release/worker-domains-before.json
          jq -e '([.result[]? | select(.hostname=="4nation.org" and .service=="4planet-nation-live")] | length)==1' artifacts/release/worker-domains-before.json >/dev/null || { echo "4NATION_EXISTING_OWNER_HOLD"; exit 6; }
          cp ops/nation/4nation-live-worker.js artifacts/release/4nation-live-worker-before.js
          for w in 4planet-nation-live 4planet-s4piens-live; do
            curl -fsS "$api/accounts/$aid/workers/scripts/$w/deployments" -H "Authorization: Bearer $TOKEN" > "artifacts/release/$w-deployments-before.json" || { echo "PREVIOUS_VERSION_UNREADABLE_HOLD worker=$w"; exit 7; }
            v=$(jq -r '[.result.deployments[]?] | sort_by(.created_on) | last | select(.versions|length==1) | .versions[0] | select(.percentage==100) | .version_id // empty' "artifacts/release/$w-deployments-before.json")
            [ -n "$v" ] || { echo "PREVIOUS_VERSION_NOT_SINGLE_100PCT_HOLD worker=$w"; exit 7; }
            printf '%s\n' "$v" > "artifacts/release/$w-previous-version-id.txt"
            echo "PREVIOUS_VERSION worker=$w version_id=$v"
            case "$w" in 4planet-nation-live) echo "PREV_NATION_VERSION=$v" >> "$GITHUB_ENV";; *) echo "PREV_S4_VERSION=$v" >> "$GITHUB_ENV";; esac
          done
          # Final response header block only: s4piens.com answers HTTP/2 103 Early Hints before the 200.
          final_hdr() { curl -sSI --max-time 20 "$1" | tr -d '\r' | awk 'BEGIN{RS=""} {b=$0} END{print b}'; }
          live_n=$(final_hdr https://4nation.org/ | awk -F': ' 'tolower($1)=="x-4nation-sha"{print $2}' | head -n1)
          live_s=$(final_hdr https://s4piens.com/ | awk -F': ' 'tolower($1)=="x-s4piens-sha"{print $2}' | head -n1)
          if [ -z "$live_n" ] || [ -z "$live_s" ]; then echo "LIVE_SHA_UNREADABLE_HOLD"; exit 8; fi
          printf 'x-4nation-sha=%s\nx-s4piens-sha=%s\n' "$live_n" "$live_s" > artifacts/release/live-sha-before.txt
          echo "LIVE_NATION_SHA=$live_n" >> "$GITHUB_ENV"
          echo "LIVE_S4_SHA=$live_s" >> "$GITHUB_ENV"
          noop=0
          if [[ "$live_n" =~ ^[0-9a-f]{40}$ ]] && [ "$live_n" = "$live_s" ] && git merge-base --is-ancestor "$live_n" "$GITHUB_SHA" 2>/dev/null; then
            changed=$(git diff --name-only "$live_n" "$GITHUB_SHA")
            if [ -z "$(grep -vxF '.github/workflows/founder-live-4nation-s4piens-20261014.yml' <<<"$changed" || true)" ]; then noop=1; fi
          fi
          echo "RELEASE_NOOP=$noop" >> "$GITHUB_ENV"
          echo "RELEASE_NOOP=$noop live=$live_n candidate=$GITHUB_SHA"
          echo "ROLLBACK_SNAPSHOT=PASS"

      - name: Exact source, contract, type and build gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/4nation-gold.test.mjs
          npm run typecheck
          npm run build
          npm run test:smoke

      - name: Deploy hash-pinned frontend artifact
        if: env.RELEASE_NOOP != '1'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 pages deploy dist --project-name 4planet-05 --branch founder-4nation-s4piens-20261014 --commit-hash "$GITHUB_SHA" --commit-dirty=false | tee artifacts/release/pages-deploy.txt
          static_url=$(grep -Eo 'https://[a-z0-9]{8}[.]4planet-05[.]pages[.]dev' artifacts/release/pages-deploy.txt | head -n1 || true)
          [ -n "$static_url" ] || { echo "IMMUTABLE_PAGES_URL_NOT_FOUND"; exit 10; }
          echo "STATIC_PREVIEW_URL=$static_url" >> "$GITHUB_ENV"
          printf '%s\n' "$static_url" > artifacts/release/immutable-preview-url.txt
          echo "IMMUTABLE_STATIC_PREVIEW=$static_url"

      - name: Build exact release Workers
        if: env.RELEASE_NOOP != '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          origin=os.environ["STATIC_PREVIEW_URL"]
          sha=os.environ["GITHUB_SHA"]
          for src,dst in [
            ("ops/release/4nation-release-worker.ts","ops/release/4nation-release-worker-built.ts"),
            ("ops/release/s4piens-release-worker.ts","ops/release/s4piens-release-worker-built.ts")
          ]:
            p=Path(src).read_text().replace("__STATIC_ORIGIN__",origin).replace("__IMMUTABLE_ORIGIN__",origin).replace("__SOURCE_SHA__",sha)
            Path(dst).write_text(p)
          PY
          node --check <(sed -e 's/^import .*$/\/\/ import elided for syntax preflight/' -e 's/: Request//g' -e 's/: Record<string, unknown>//g' -e 's/: ExecutionContext//g' ops/release/4nation-release-worker-built.ts) || true
          echo "RELEASE_WORKERS_BUILT=YES"

      - name: Deploy both Founder-authorised live Workers
        if: env.RELEASE_NOOP != '1'
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/live-mutation-started
          npx --yes wrangler@4.128.0 deploy ops/release/4nation-release-worker-built.ts --name 4planet-nation-live --compatibility-date 2026-10-14 --keep-vars | tee artifacts/release/4nation-live-deploy.txt
          cat > s4-live-wrangler.toml <<'EOF'
          name = "4planet-s4piens-live"
          main = "ops/release/s4piens-release-worker-built.ts"
          compatibility_date = "2026-10-14"
          workers_dev = false
          [[routes]]
          pattern = "s4piens.com/*"
          zone_name = "s4piens.com"
          [[routes]]
          pattern = "www.s4piens.com/*"
          zone_name = "s4piens.com"
          EOF
          npx --yes wrangler@4.128.0 deploy --config s4-live-wrangler.toml --keep-vars | tee artifacts/release/s4piens-live-deploy.txt
          echo "LIVE_WORKERS_DEPLOYED=YES"

      - name: Verify real source APIs on live domains
        if: env.RELEASE_NOOP != '1'
        shell: bash
        run: |
          set -euo pipefail
          settled=0
          for i in $(seq 1 36); do
            nh=$(curl -LsSI --max-time 20 https://4nation.org/ || true)
            sh=$(curl -LsSI --max-time 20 https://s4piens.com/ || true)
            if grep -qi "x-4nation-sha: $GITHUB_SHA" <<<"$nh" && grep -qi "x-s4piens-sha: $GITHUB_SHA" <<<"$sh"; then
              settled=1
              echo "LIVE_EXACT_SHA_SETTLED=PASS attempt=$i"
              break
            fi
            sleep 5
          done
          [ "$settled" = 1 ] || { echo "LIVE_EXACT_SHA_NOT_SETTLED"; exit 12; }
          check_ok() { name="$1"; url="$2"; out="artifacts/release/$name.json"; curl -fsS --max-time 60 "$url" > "$out"; jq -e '.ok==true' "$out" >/dev/null; echo "$name=PASS"; }
          probe=$(curl -sS --max-time 30 -o artifacts/release/function-probe.json -w '%{http_code}' "https://4nation.org/api/worldbank-country" || true)
          [ "$probe" = 400 ] && jq -e '.error=="INVALID_COUNTRY_ISO3"' artifacts/release/function-probe.json >/dev/null || { echo "LIVE_API_PROBE_FAIL http=$probe"; cat artifacts/release/function-probe.json || true; exit 13; }
          check_ok worldbank-nor "https://4nation.org/api/worldbank-country?country=NOR"
          check_ok worldbank-rank "https://4nation.org/api/worldbank-country?rank=1"
          check_ok country-identity-no "https://4nation.org/api/country-identity?iso2=NO"
          check_ok unesco-wdi-no "https://4nation.org/api/unesco-country?dataset=wdi001&country=NO"
          check_ok unesco-heritage "https://4nation.org/api/unesco-data?dataset=whc001"
          success=0
          for sector in agriculture power fossil-fuel-operations manufacturing; do
            out="artifacts/release/climate-$sector.json"
            if curl -fsS --max-time 60 "https://s4piens.com/api/climate-trace?sectors=$sector&limit=8" > "$out" && jq -e '.ok==true and (.assets|length)>0' "$out" >/dev/null; then
              echo "CLIMATE_TRACE_$sector=PASS"; success=$((success+1))
            else
              echo "CLIMATE_TRACE_$sector=SOURCE_UNAVAILABLE_OR_CONTRACT_WARNING"
            fi
          done
          [ "$success" -ge 1 ] || { echo "CLIMATE_TRACE_ALL_SECTORS_UNAVAILABLE_HOLD"; exit 11; }
          echo "LIVE_REAL_SOURCE_GATE=PASS"

      - name: Verify exact live domains in Chromium and WebKit
        if: env.RELEASE_NOOP != '1'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            ncode=$(curl -LsS --max-time 20 -o artifacts/release/live-4nation.html -w '%{http_code}' https://4nation.org/ || true)
            scode=$(curl -LsS --max-time 20 -o artifacts/release/live-s4piens.html -w '%{http_code}' https://s4piens.com/ || true)
            nh=$(curl -LsSI --max-time 20 https://4nation.org/ || true)
            sh=$(curl -LsSI --max-time 20 https://s4piens.com/ || true)
            if [ "$ncode" = 200 ] && [ "$scode" = 200 ] && grep -qi "x-4nation-sha: $GITHUB_SHA" <<<"$nh" && grep -qi "x-s4piens-sha: $GITHUB_SHA" <<<"$sh"; then break; fi
            sleep 5
          done
          [ "$ncode" = 200 ] && [ "$scode" = 200 ]
          grep -qi "x-4nation-sha: $GITHUB_SHA" <<<"$nh"
          grep -qi "x-s4piens-sha: $GITHUB_SHA" <<<"$sh"
          curl -fsS https://4nation.org/country/norway -o artifacts/release/live-4nation-norway.html
          curl -fsS https://4nation.org/decisions -o artifacts/release/live-4nation-decisions.html
          curl -fsS https://s4piens.com/system/food -o artifacts/release/live-s4-food.html
          curl -fsS https://s4piens.com/object/bread -o artifacts/release/live-s4-bread.html
          npx playwright install --with-deps chromium webkit
          node --input-type=module <<'NODE'
          import { chromium, webkit } from "@playwright/test";
          const urls=["https://4nation.org/","https://4nation.org/country/norway","https://4nation.org/decisions","https://s4piens.com/","https://s4piens.com/system/food","https://s4piens.com/object/bread"];
          for (const [name,type] of [["chromium",chromium],["webkit",webkit]]) {
            for (const viewport of [{width:1440,height:900},{width:390,height:844}]) {
              const b=await type.launch();
              const ctx=await b.newContext({viewport});
              const p=await ctx.newPage(); const errors=[];
              p.on("pageerror",e=>errors.push(e.message));
              for (const url of urls) {
                await p.goto(url,{waitUntil:"domcontentloaded",timeout:45000});
                await p.waitForTimeout(1800);
                const state=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-window.innerWidth,text:(document.body?.innerText||"").trim().length}));
                if(state.overflow>2||state.text<80||errors.length) throw new Error(name+" "+JSON.stringify(viewport)+" "+url+" "+JSON.stringify({state,errors}));
              }
              await b.close();
            }
          }
          NODE
          echo "FOUNDER_LIVE_RELEASE_VERIFIED=PASS"
          echo "4NATION=https://4nation.org"
          echo "S4PIENS=https://s4piens.com"

      - name: Verify no-op release left live unchanged (read-only)
        if: env.RELEASE_NOOP == '1'
        shell: bash
        run: |
          set -euo pipefail
          # Status = curl's final http_code (never the first status line: s4piens.com sends HTTP/2 103 Early Hints first).
          final_code() { curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$1" || true; }
          final_hdr() { curl -sSI --max-time 20 "$1" | tr -d '\r' | awk 'BEGIN{RS=""} {b=$0} END{print b}'; }
          nc=$(final_code https://4nation.org/)
          sc=$(final_code https://s4piens.com/)
          if [ "$nc" != 200 ] || [ "$sc" != 200 ]; then echo "NOOP_LIVE_HOME_FAIL 4nation=$nc s4piens=$sc"; exit 14; fi
          nh=$(final_hdr https://4nation.org/)
          sh=$(final_hdr https://s4piens.com/)
          grep -qiE "^x-4nation-sha: $LIVE_NATION_SHA$" <<<"$nh" || { echo "NOOP_LIVE_SHA_CHANGED host=4nation.org"; exit 15; }
          grep -qiE "^x-s4piens-sha: $LIVE_S4_SHA$" <<<"$sh" || { echo "NOOP_LIVE_SHA_CHANGED host=s4piens.com"; exit 15; }
          for u in https://4nation.org/country/norway https://4nation.org/decisions https://s4piens.com/system/food https://s4piens.com/object/bread; do
            c=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$u"); [ "$c" = 200 ] || { echo "NOOP_LIVE_PAGE_FAIL $u http=$c"; exit 14; }
          done
          echo "RELEASE_NOOP_VERIFIED=PASS live=$LIVE_NATION_SHA nation_version=$PREV_NATION_VERSION s4_version=$PREV_S4_VERSION"

      - name: Roll back both Workers to their previous version if a post-mutation step fails
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          [ -f /tmp/live-mutation-started ] || { echo "NO_LIVE_MUTATION_TO_ROLL_BACK"; exit 0; }
          echo "ROLLBACK_START nation=$PREV_NATION_VERSION s4piens=$PREV_S4_VERSION"
          # Version-only rollback: never deletes a Worker, route, custom domain or DNS record.
          rc=0
          npx --yes wrangler@4.128.0 versions deploy "$PREV_NATION_VERSION@100%" --name 4planet-nation-live --message "rollback $GITHUB_SHA run $GITHUB_RUN_ID" --yes | tee artifacts/release/rollback-nation.txt || rc=1
          npx --yes wrangler@4.128.0 versions deploy "$PREV_S4_VERSION@100%" --name 4planet-s4piens-live --message "rollback $GITHUB_SHA run $GITHUB_RUN_ID" --yes | tee artifacts/release/rollback-s4piens.txt || rc=1
          ok=0
          for _ in $(seq 1 24); do
            nh=$(curl -sSI --max-time 20 https://4nation.org/ || true)
            sh=$(curl -sSI --max-time 20 https://s4piens.com/ || true)
            if grep -qi "x-4nation-sha: $LIVE_NATION_SHA" <<<"$nh" && grep -qi "x-s4piens-sha: $LIVE_S4_SHA" <<<"$sh"; then ok=1; break; fi
            sleep 5
          done
          if [ "$rc" = 0 ] && [ "$ok" = 1 ]; then echo "ROLLBACK_VERIFIED live=$LIVE_NATION_SHA"; else echo "ROLLBACK_FAILED rc=$rc settled=$ok"; exit 1; fi

      - name: Upload release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-release-4nation-s4piens-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: warn
          retention-days: 30
