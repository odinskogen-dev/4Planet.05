name: AXE GitHub event → Slack wake bridge

on:
  push:
    branches:
      - "system/cloudflare-axe-wake-canary-20261003"
    paths:
      - "axe-clock-canary/**"
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  workflow_run:
    workflows:
      - FOUR STATE Product Authority Gate
      - FOUR STATE Founder Review Control Plane
      - ONE INTERFACE Convergence Gate
      - GOLD / WORLD CLASS Enforcement
      - GOLD Human Craft Proof
      - Browser Product Proof
      - Public Preview Gate
      - 4PLANET ID Gold Gate
      - ATLAS Zero Loss Gate
      - 4NATION Gold Candidate QA
      - 4BRANDS Company Twin Proof
      - 4BRANDS Canonical Live
      - 4PLANET ID Canonical Live
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: axe-github-event-bridge-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cloudflare-axe-wake-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/system/cloudflare-axe-wake-canary-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Slack webhook as isolated Worker secret
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$SLACK_WEBHOOK"
          printf '%s' "$SLACK_WEBHOOK" | npx wrangler@4.128.0 secret put SLACK_AXE_WEBHOOK_URL
      - name: Deploy isolated AXE wake canary Worker
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        run: npx wrangler@4.128.0 deploy
      - name: Fire Cloudflare to Slack canary
        working-directory: axe-clock-canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          curl --fail-with-body --silent --show-error "https://4planet-axe-wake-canary.$SUBDOMAIN.workers.dev/canary"

  pr-event:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SLACK_AXE_WEBHOOK_URL: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
    steps:
      - name: Send PR wake signal
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${SLACK_AXE_WEBHOOK_URL:-}" || {
            echo "SLACK_AXE_WEBHOOK_URL repository secret is missing."
            exit 2
          }

          EVENT_ID="github:${GITHUB_REPOSITORY}:pr:${PR_NUMBER}:${EVENT_ACTION}:${HEAD_SHA}"
          TEXT="$(printf '%s\n' \
            '[GITHUB / EVENT]' \
            "event_id: ${EVENT_ID}" \
            'kind: PR_STATE' \
            "repository: ${GITHUB_REPOSITORY}" \
            "pr: ${PR_NUMBER}" \
            "action: ${EVENT_ACTION}" \
            "state: ${PR_STATE}" \
            "draft: ${PR_DRAFT}" \
            "head_sha: ${HEAD_SHA}" \
            "head_ref: ${HEAD_REF}" \
            "base_ref: ${BASE_REF}" \
            "url: ${PR_URL}" \
            "actor: ${ACTOR}" \
            'WAKE SIGNAL ONLY — not proof. Fresh-read GitHub/CI/BRAIN before action.')"

          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack-payload.json
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/slack-payload.json \
            "$SLACK_AXE_WEBHOOK_URL"

  ci-event:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SLACK_AXE_WEBHOOK_URL: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Send completed PR-associated CI wake signal
        run: |
          set -euo pipefail

          PR_COUNT="$(jq '.workflow_run.pull_requests | length' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          if [ "$PR_COUNT" -lt 1 ]; then
            echo "No associated pull request; no AXE wake."
            exit 0
          fi

          test -n "${SLACK_AXE_WEBHOOK_URL:-}" || {
            echo "SLACK_AXE_WEBHOOK_URL repository secret is missing."
            exit 2
          }

          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$META")"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PR ignored."
            exit 0
          fi

          RUN_HEAD_SHA="$(jq -r '.workflow_run.head_sha // empty' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          RUN_HEAD_REF="$(jq -r '.workflow_run.head_branch // empty' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          test -n "$RUN_HEAD_SHA" || {
            echo "workflow_run.head_sha is missing; refusing to misbind CI evidence."
            exit 2
          }

          CURRENT_HEAD_SHA="$(jq -r '.head.sha' <<<"$META")"
          CURRENT_HEAD_REF="$(jq -r '.head.ref' <<<"$META")"
          BASE_REF="$(jq -r '.base.ref' <<<"$META")"
          PR_URL="$(jq -r '.html_url' <<<"$META")"

          classify_sha_binding() {
            if [ "$1" = "$2" ]; then
              printf '%s' 'EXACT'
            else
              printf '%s' 'STALE_NON_ACTIONABLE'
            fi
          }

          # Deterministic fixtures protect both the exact A→A and stale A→B cases.
          test "$(classify_sha_binding fixture-a fixture-a)" = "EXACT"
          test "$(classify_sha_binding fixture-a fixture-b)" = "STALE_NON_ACTIONABLE"

          SHA_BINDING="$(classify_sha_binding "$RUN_HEAD_SHA" "$CURRENT_HEAD_SHA")"
          if [ "$SHA_BINDING" = "STALE_NON_ACTIONABLE" ]; then
            echo "Workflow run belongs to $RUN_HEAD_SHA; current PR head is $CURRENT_HEAD_SHA. Reporting stale evidence without promoting it."
          fi

          WORKFLOW_NAME="$(jq -r '.workflow_run.name' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          CONCLUSION="$(jq -r '.workflow_run.conclusion // "unknown"' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          RUN_URL="$(jq -r '.workflow_run.html_url' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          RUN_ID="$(jq -r '.workflow_run.id' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          ACTOR="$(jq -r '.workflow_run.actor.login // "unknown"' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"

          EVENT_ID="github:${GITHUB_REPOSITORY}:ci:${RUN_ID}:${CONCLUSION}"
          TEXT="$(printf '%s\n' \
            '[GITHUB / EVENT]' \
            "event_id: ${EVENT_ID}" \
            'kind: CI_COMPLETED' \
            "repository: ${GITHUB_REPOSITORY}" \
            "pr: ${PR_NUMBER}" \
            'action: completed' \
            "workflow: ${WORKFLOW_NAME}" \
            "conclusion: ${CONCLUSION}" \
            "head_sha: ${RUN_HEAD_SHA}" \
            "head_ref: ${RUN_HEAD_REF}" \
            "current_pr_head_sha: ${CURRENT_HEAD_SHA}" \
            "current_pr_head_ref: ${CURRENT_HEAD_REF}" \
            "candidate_binding: ${SHA_BINDING}" \
            "base_ref: ${BASE_REF}" \
            "pr_url: ${PR_URL}" \
            "run_url: ${RUN_URL}" \
            "actor: ${ACTOR}" \
            'WAKE SIGNAL ONLY — not proof. Fresh-read GitHub workflow/PR/BRAIN before action.')"

          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack-payload.json
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/slack-payload.json \
            "$SLACK_AXE_WEBHOOK_URL"

  cloudflare-preview-event:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SLACK_AXE_WEBHOOK_URL: ${{ secrets.SLACK_AXE_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Send Cloudflare Pages PR preview wake signal
        env:
          COMMENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if ! jq -e '
            .issue.pull_request != null
            and .comment.user.login == "cloudflare-workers-and-pages[bot]"
            and (.comment.body | contains("Cloudflare Pages"))
          ' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}" >/dev/null; then
            echo "Not a Cloudflare Pages PR comment; no AXE wake."
            exit 0
          fi

          test -n "${SLACK_AXE_WEBHOOK_URL:-}" || {
            echo "SLACK_AXE_WEBHOOK_URL repository secret is missing."
            exit 2
          }

          PR_NUMBER="$(jq -r '.issue.number' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          META="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$META")"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PR ignored."
            exit 0
          fi

          HEAD_SHA="$(jq -r '.head.sha' <<<"$META")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$META")"
          BASE_REF="$(jq -r '.base.ref' <<<"$META")"
          PR_URL="$(jq -r '.html_url' <<<"$META")"
          COMMENT_URL="$(jq -r '.comment.html_url' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          COMMENT_ID="$(jq -r '.comment.id' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          COMMENT_UPDATED_AT="$(jq -r '.comment.updated_at // .comment.created_at' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          BODY="$(jq -r '.comment.body' "${GITHUB_EVENT_PATH:?GitHub event payload path missing}")"
          if grep -q 'Deploy successful!' <<<"$BODY"; then
            CF_RESULT="success"
          else
            CF_RESULT="update"
          fi

          EVENT_ID="github:${GITHUB_REPOSITORY}:cloudflare-pr:${PR_NUMBER}:${COMMENT_ACTION}:${COMMENT_ID}:${COMMENT_UPDATED_AT}"
          TEXT="$(printf '%s\n' \
            '[GITHUB / EVENT]' \
            "event_id: ${EVENT_ID}" \
            'kind: CLOUDFLARE_PAGES_PREVIEW' \
            "repository: ${GITHUB_REPOSITORY}" \
            "pr: ${PR_NUMBER}" \
            "action: ${COMMENT_ACTION}" \
            "cloudflare_result: ${CF_RESULT}" \
            "head_sha: ${HEAD_SHA}" \
            "head_ref: ${HEAD_REF}" \
            "base_ref: ${BASE_REF}" \
            "pr_url: ${PR_URL}" \
            "comment_url: ${COMMENT_URL}" \
            'actor: cloudflare-workers-and-pages[bot]' \
            'WAKE SIGNAL ONLY — not proof. Fresh-read PR, Cloudflare evidence, CI and BRAIN before action.')"

          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack-payload.json
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/slack-payload.json \
            "$SLACK_AXE_WEBHOOK_URL"
