name: 4SAPIEN Finance UX inspect

on:
  push:
    branches: [finance-ux-20260915]
    paths:
      - '.github/workflows/finance-ux-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Finance and inspect Claude typography
        run: |
          set -euo pipefail
          rm -rf /tmp/finance-site
          mkdir -p /tmp/finance-site
          python products/4sapien/build/apply_finance_route.py /tmp/finance-site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/finance-site/app/money/index.html').read_text()
          print('=== FONT LINKS / IMPORTS ===')
          for m in re.findall(r'<link[^>]+>|@import[^;]+;',s,re.I):
              if 'font' in m.lower() or 'google' in m.lower(): print(m)
          print('=== T TOKENS ===')
          for pat in [r'const\s+T\s*=\s*\{.*?\};', r'let\s+T\s*=\s*\{.*?\};', r'var\s+T\s*=\s*\{.*?\};']:
              for m in re.finditer(pat,s,re.S): print(m.group(0)[:5000])
          print('=== FONT FAMILIES ===')
          vals=[]
          for m in re.finditer(r'font(?:-family|Family)?\s*[:=]\s*[^;,}\n]{1,180}',s,re.I):
              x=m.group(0).strip()
              if x not in vals: vals.append(x)
          for x in vals[:120]: print(x)
          PY
