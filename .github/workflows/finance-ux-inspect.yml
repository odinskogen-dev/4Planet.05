name: 4SAPIEN Finance UX inspect

on:
  push:
    branches: [finance-ux-20260915]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/finance-ux-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Finance
        run: |
          set -euo pipefail
          rm -rf /tmp/finance-site
          mkdir -p /tmp/finance-site
          python products/4sapien/build/apply_finance_route.py /tmp/finance-site/index.html
      - name: Inspect active Finance shell
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/finance-site/app/money/index.html').read_text()
          for term in ['AXE_FINANCE_EXPERIENCE_V2','id="axeFin"','function months()']:
            i=s.find(term)
            print('\n===',term,'===')
            print(s[max(0,i-3500):i+10000] if i>=0 else 'NOT FOUND')
          PY
