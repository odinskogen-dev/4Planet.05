name: Production Factory Shadow CI

on:
  pull_request:
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-ci.yml"
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  runtime-capability-probe:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/factory/symphony-runtime-v01') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      CLOUDFLARE_FACTORY_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
      CLOUDFLARE_FACTORY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
    steps:
      - name: Verify bounded runtime credentials and GitHub TEST-write capability
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          test_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/branches/king/test" | jq -r '.commit.sha')"

          if [[ ! "${test_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not resolve an exact current king/test SHA.'
            exit 1
          fi

          github_probe="BLOCKED_TOKEN_MISSING"
          cleanup="NOT_REQUIRED"

          if [[ -n "${FACTORY_GITHUB_TOKEN}" ]]; then
            probe_branch="factory-candidate-capability-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            create_status="$(curl --silent --show-error \
              -o /tmp/factory-probe-create.json \
              -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${FACTORY_GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/git/refs" \
              -d "{\"ref\":\"refs/heads/${probe_branch}\",\"sha\":\"${test_sha}\"}")"

            if [[ "${create_status}" == "201" ]]; then
              github_probe="PASS"
              delete_status="$(curl --silent --show-error \
                -o /tmp/factory-probe-delete.json \
                -w '%{http_code}' \
                -X DELETE \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${FACTORY_GITHUB_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/git/refs/heads/${probe_branch}")"
              if [[ "${delete_status}" != "204" ]]; then
                echo "::error::Bounded GitHub write probe succeeded but cleanup failed with HTTP ${delete_status}."
                exit 1
              fi
              cleanup="PASS"
            else
              github_probe="BLOCKED_WRITE_HTTP_${create_status}"
              echo "::warning::FACTORY_GITHUB_TOKEN exists but bounded candidate-branch write probe was refused (HTTP ${create_status})."
            fi
          else
            echo '::warning::FACTORY_GITHUB_TOKEN is missing; autonomous GitHub TEST-write remains fail-closed.'
          fi

          cloudflare_token="MISSING"
          cloudflare_account="MISSING"
          [[ -n "${CLOUDFLARE_FACTORY_API_TOKEN}" ]] && cloudflare_token="PRESENT"
          [[ -n "${CLOUDFLARE_FACTORY_ACCOUNT_ID}" ]] && cloudflare_account="PRESENT"

          cat > /tmp/factory-runtime-readiness.json <<JSON
          {
            "factory_sha": "${GITHUB_SHA}",
            "test_king_sha": "${test_sha}",
            "github_test_write_probe": "${github_probe}",
            "probe_cleanup": "${cleanup}",
            "cloudflare_api_token": "${cloudflare_token}",
            "cloudflare_account_id": "${cloudflare_account}"
          }
          JSON

          {
            echo '### Factory runtime capability evidence'
            echo "- Factory SHA: \`${GITHUB_SHA}\`"
            echo "- Current TEST KING SHA: \`${test_sha}\`"
            echo "- GitHub TEST-write probe: **${github_probe}**"
            echo "- Probe cleanup: **${cleanup}**"
            echo "- Cloudflare API token: **${cloudflare_token}**"
            echo "- Cloudflare account ID: **${cloudflare_account}**"
            echo '- No LIVE branch, file content, release, outreach, payment or Canon state was changed.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload non-secret readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-runtime-readiness-${{ github.sha }}
          path: /tmp/factory-runtime-readiness.json
          if-no-files-found: error
          retention-days: 14
