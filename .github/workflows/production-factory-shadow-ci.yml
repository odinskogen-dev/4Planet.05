name: Production Factory Shadow CI

on:
  pull_request:
    paths:
      - "factory/**"
      - ".github/workflows/production-factory-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
