name: ATLAS P0 Unknown Route Isolated QA
on:
  push:
    branches: [qa/atlas-p0-unknown-route-20261022]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct exact currently-live protected Atlas source and test
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c60a670a3ceade04ac6f2d50e706948bd835d65d HEAD
          git apply --check ops/atlas/r1-human-awe.patch
          git apply ops/atlas/r1-human-awe.patch
          echo 'ebdbd4dc533531fa3733993ada7e13bd3adeb2d4f605d72fa7482e1d7ddf7fe8  ops/atlas/v43-code-only.zip' | sha256sum -c -
          unzip -q ops/atlas/v43-code-only.zip -d /tmp/v43
          cp -a /tmp/v43/files/. ./
          while IFS= read -r file; do [ -z "$file" ] || rm -f "$file"; done < /tmp/v43/patch/DELETED_FILES.txt
          rm -f public-atlas-data-places-v1-manifest.json
          npm ci --no-audit --no-fund
          node scripts/build-atlas-places.mjs
          npm run typecheck
          node --test scripts/atlas-v43-contract.test.mjs scripts/atlas-human-awe-contract.test.mjs scripts/seo-ownership-contract.test.mjs scripts/atlas-mobile-context-control-contract.test.mjs scripts/atlas-recovery-contract.test.mjs scripts/atlas-max-exposure-middleware-runtime.test.mjs
          npm run build:atlas
          node --input-type=module <<'NODE'
          import {onRequest} from './functions/_middleware.js';
          import assert from 'node:assert/strict';
          const call=async path=>onRequest({request:new Request('https://4planetatlas.com'+path),next:async()=>new Response('<!doctype html><html><body>ATLAS map</body></html>',{status:200,headers:{'content-type':'text/html'}})});
          for(const path of ['/','/atlas/','/atlas/?place=oslo&z=7','/embed/atlas?place=berlin','/places','/place/oslo','/place/berlin'])assert.equal((await call(path)).status,200,path);
          for(const path of ['/unpublished-random-path-404','/unknown/prefix','/place/not-a-qualifying-place']){
            const r=await call(path);assert.equal(r.status,404,path);assert.match(r.headers.get('x-robots-tag'),/noindex/);
          }
          console.log('ATLAS_SOURCE_ZEROLOSS_SOFT404_GOLD_PASS');
          NODE
