name: Code Vault Export d06a148

on:
  push:
    branches:
      - archive/code-vault-d06a148-2026-08-15

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact source authority
        shell: bash
        run: |
          SOURCE_SHA=d06a148334187999dcec5b8ed3e961ccaabfeef0
          git cat-file -e "$SOURCE_SHA^{commit}"
          git show -s --format='%H %cI %s' "$SOURCE_SHA" > CODE_VAULT_SOURCE.txt
          cat CODE_VAULT_SOURCE.txt

      - name: Secret-material guard on exact source tree
        shell: bash
        run: |
          SOURCE_SHA=d06a148334187999dcec5b8ed3e961ccaabfeef0
          if git ls-tree -r --name-only "$SOURCE_SHA" | grep -E '(^|/)(\.env($|\.)|[^/]+\.(pem|key)$)' ; then
            echo 'Potential secret-bearing file path present in source tree; refusing archive.'
            exit 1
          fi

      - name: Create exact immutable source ZIP
        shell: bash
        run: |
          SOURCE_SHA=d06a148334187999dcec5b8ed3e961ccaabfeef0
          OUT=4PLANET_ONE_INTERFACE_2026-08-15_PRODUCTION_D06A148_EXACT_SOURCE.zip
          git archive --format=zip --output="$OUT" "$SOURCE_SHA"
          sha256sum "$OUT" > SHA256.txt
          cat SHA256.txt

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: code-vault-d06a148-exact-source-v2
          path: |
            4PLANET_ONE_INTERFACE_2026-08-15_PRODUCTION_D06A148_EXACT_SOURCE.zip
            CODE_VAULT_SOURCE.txt
            SHA256.txt
          retention-days: 90
          if-no-files-found: error
