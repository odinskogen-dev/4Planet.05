name: 4PLANET ID Pages Family Live Proof

on:
  push:
    branches: [release/one-interface-sprint2-6bbfebb]
    paths:
      - ".github/workflows/identity-pages-family-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Prove canonical 4PLANET ID entry across shared live product family
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from '@playwright/test';
          const hosts=[
            'https://4planet.org/',
            'https://s4piens.com/',
            'https://4planetatlas.com/',
            'https://labs.4planet.org/',
            'https://4brands.org/'
          ];
          for(const engine of [chromium, webkit]){
            const browser=await engine.launch();
            const page=await browser.newPage({viewport:{width:390,height:844}});
            for(const url of hosts){
              console.log('CHECK '+url);
              const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              if(resp?.status()!==200) throw new Error(url+' HTTP '+resp?.status());
              const login=page.getByText('LOG IN',{exact:true});
              const count=await login.count();
              const body=(await page.locator('body').innerText()).slice(0,500);
              console.log(JSON.stringify({url,status:resp?.status(),loginCount:count,title:await page.title(),body}));
              await login.first().waitFor({timeout:10000});
              await login.first().click();
              await page.waitForURL(/https:\/\/id\.4planet\.org\/login\?/,{timeout:10000});
              const target=await page.locator('.identity-card').getAttribute('data-return-to');
              if(!target || new URL(target).origin!==new URL(url).origin){
                throw new Error(url+' return target mismatch '+target);
              }
            }
            await browser.close();
          }
          console.log('4PLANET ID PAGES FAMILY LIVE PROOF: PASS · STATIC FALLBACK INCLUDED');
          NODE
