name: 4SAPIEN GOLD Gate

on:
  push:
    branches:
      - build/4me-personal-choice-proof
    paths:
      - src/pages/sapien/**
      - src/choice/**
      - src/food/**
      - functions/api/food.ts
      - functions/api/pick-price.ts
      - src/routes/router.tsx
      - tests/e2e/4sapien.spec.ts
      - .github/workflows/4sapien-gold-gate.yml
  pull_request:
    paths:
      - src/pages/sapien/**
      - src/choice/**
      - src/food/**
      - functions/api/food.ts
      - functions/api/pick-price.ts
      - src/routes/router.tsx
      - tests/e2e/4sapien.spec.ts

permissions:
  contents: read

concurrency:
  group: 4sapien-gold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 > 4sapien-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/4sapien > /dev/null; then exit 0; fi
            sleep 1
          done
          cat 4sapien-preview.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: 4SAPIEN desktop + mobile browser proof
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/4sapien.spec.ts --project=desktop-1440 --project=mobile-390
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4sapien-gold-evidence
          path: |
            4sapien-preview.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
