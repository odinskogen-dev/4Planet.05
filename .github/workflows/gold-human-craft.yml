name: GOLD Human Craft Proof

on:
  push:
    branches:
      - king/test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-human-craft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  human-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_SHA"
          printf '%s\n' "$actual" > exact-sha.txt

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: GOLD authority contract
        run: node scripts/gold-policy-check.mjs --mode=quality-contract

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact source
        run: npm run build

      - name: Start exact-head preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Human Craft objective hierarchy + Magazine premium regression
        env:
          BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/gold-human-craft.spec.ts
          tests/e2e/magazine-gold.spec.ts
          --project=desktop-1440
          --project=mobile-390
          --project=mobile-430

      - name: Upload Human Craft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-human-craft-evidence
          path: |
            exact-sha.txt
            preview.log
            artifacts/product-proof
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
