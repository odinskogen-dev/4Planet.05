name: 4NATION Explicit Live Release
on:
  push:
    branches: [king/test]
    paths: ['.github/workflows/nation-live-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: 4nation-domain-live-exact-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact tested immutable product and current HEIR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin king/test --no-tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/king/test)" = "$GITHUB_SHA" || { echo 'STALE_HEIR_HOLD'; exit 9; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'TOKEN_NOT_PRESENT_HOLD'; exit 10; }
          node --check ops/nation/4nation-live-worker.js
          diff <(git show 4a13f9d118066cd6765c3399ebff46a7d3298609:src/pages/nation/NationPage.tsx) src/pages/nation/NationPage.tsx || { echo 'PRODUCT_CHANGED_HOLD'; exit 11; }
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=4a13f9d118066cd6765c3399ebff46a7d3298609&per_page=100")
          jq -e '[.workflow_runs[]|select(.name=="4NATION Gold Candidate QA" and .conclusion=="success")]|length>=1' <<<"$runs" >/dev/null
          jq -e '[.workflow_runs[]|select(.name=="4NATION Founder Visual Preview" and .conclusion=="success")]|length>=1' <<<"$runs" >/dev/null
          code=$(curl -LsS --max-time 20 -o /tmp/nation-preview -w '%{http_code}' https://32f3e9de.4planet-05.pages.dev/4nation || true)
          [ "$code" = 200 ] && grep -qi 'noindex,nofollow' /tmp/nation-preview || { echo 'IMMUTABLE_SOURCE_NOT_AVAILABLE_HOLD'; exit 12; }
      - name: Fail closed on any existing 4nation.org owner
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          z=$(curl -fsS "$api/zones?name=4nation.org" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success==true and (.result|length)==1 and .result[0].status=="active"' <<<"$z" >/dev/null
          aid=$(jq -r '.result[0].account.id' <<<"$z")
          zid=$(jq -r '.result[0].id' <<<"$z")
          echo "CLOUDFLARE_ACCOUNT_ID=$aid" >> "$GITHUB_ENV"
          for host in 4nation.org www.4nation.org; do
            d=$(curl -fsS "$api/zones/$zid/dns_records?name=$host" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            jq -e '.success==true and ([.result[]? | select(.type!="TXT" and .type!="MX")] | length)==0' <<<"$d" >/dev/null || { echo "DNS_HOST_COLLISION=$host"; exit 13; }
          done
          ds=$(curl -fsS "$api/accounts/$aid/workers/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success==true and ([.result[]? | select(.hostname=="4nation.org" or .hostname=="www.4nation.org")] | length)==0' <<<"$ds" >/dev/null || { echo 'WORKER_DOMAIN_COLLISION_HOLD'; exit 14; }
          routes=$(curl -fsS "$api/zones/$zid/workers/routes" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success==true and ([.result[]? | select(.pattern|contains("4nation.org"))] | length)==0' <<<"$routes" >/dev/null || { echo 'WORKER_ROUTE_COLLISION_HOLD'; exit 15; }
          ps=$(curl -fsS "$api/accounts/$aid/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success==true and ([.result[]? | select(any(.domains[]?;.=="4nation.org" or .=="www.4nation.org"))] | length)==0' <<<"$ps" >/dev/null || { echo 'PAGES_DOMAIN_COLLISION_HOLD'; exit 16; }
          echo 'NATION_ONLY_HOST_COLLISION=NONE / OTHER DOMAINS UNCHANGED'
      - name: Attach only 4nation.org using Cloudflare-managed TLS
        shell: bash
        run: |
          set -euo pipefail
          cat > nation-live-release-wrangler.toml <<'EOF'
          name = "4planet-nation-live"
          main = "ops/nation/4nation-live-worker.js"
          compatibility_date = "2026-09-21"
          workers_dev = true
          [[routes]]
          pattern = "4nation.org"
          custom_domain = true
          EOF
          npx --yes wrangler@4.128.0 deploy --config nation-live-release-wrangler.toml | tee /tmp/nation-live-deploy.log
          echo '4NATION_DOMAIN_RELEASE_SUBMITTED=YES / SOURCE_IMMUTABLE'
      - name: Verify exact production hostname and full route set
        shell: bash
        run: |
          set -euo pipefail
          code=''
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --max-time 18 -o /tmp/nation-live-page -w '%{http_code}' https://4nation.org/ || true)
            if [ "$code" = 200 ] && grep -q 'index,follow,max-image-preview:large' /tmp/nation-live-page; then break; fi
            sleep 5
          done
          [ "$code" = 200 ] && grep -q 'index,follow,max-image-preview:large' /tmp/nation-live-page || { echo "APEX_EXTERNAL_FAIL=$code"; exit 17; }
          for route in / /4nation /atlas '/atlas?embed=nation'; do
            code=$(curl -L -sS --max-time 18 -o /tmp/nation-route -w '%{http_code}' "https://4nation.org$route")
            [ "$code" = 200 ] || { echo "ROUTE_ERROR=$route/$code"; exit 18; }
          done
          header=$(curl -LsSI --max-time 18 https://4nation.org/)
          grep -qi 'x-4nation-sha: 4a13f9d118066cd6765c3399ebff46a7d3298609' <<<"$header" || { echo 'EXACT_SHA_HEADER_MISMATCH'; exit 19; }
          if grep -qi 'x-robots-tag:.*noindex' <<<"$header"; then echo 'LIVE_NOINDEX_LEAK'; exit 20; fi
          echo '4NATION_LIVE_HTTP_TLS_ROUTES_EXACT_SHA=PASS'
      - name: Real-domain Chromium desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=https://4nation.org npx playwright test tests/e2e/4nation.spec.ts --project=desktop-1440 --project=mobile-390 --project=mobile-430
          echo '4NATION_LIVE_BROWSER_9_OF_9=PASS'
