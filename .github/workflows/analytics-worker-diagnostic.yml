name: Analytics Worker Diagnostic

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/analytics-worker-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: d53c17b06219066a0325eec01c21729e
    steps:
      - name: Inspect Worker upload shape
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts"
          report=/tmp/diag.md
          echo '# Analytics Worker diagnostic' > "$report"
          echo >> "$report"
          for service in cre4tors-prototype 4planetmarket-prototype; do
            h="/tmp/${service}.headers"; b="/tmp/${service}.body"
            code="$(curl -sS -w '%{http_code}' -D "$h" -o "$b" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${service}")"
            ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$h")"
            len="$(wc -c < "$b" | tr -d ' ')"
            marker="$(strings "$b" | grep -Eo '[A-Za-z0-9._-]+\.pages\.dev' | sort -u | tr '\n' ' ' || true)"
            echo "## ${service}" >> "$report"
            echo "- GET HTTP: \`${code}\`" >> "$report"
            echo "- Content-Type: \`${ct}\`" >> "$report"
            echo "- bytes: \`${len}\`" >> "$report"
            echo "- Pages origin(s): \`${marker}\`" >> "$report"
            echo >> "$report"
          done
          cat "$report"
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body-file /tmp/diag.md
