name: Claude Product Worker — Factory Queue

on:
  push:
    branches:
      - factory/claude-product-worker-01
    paths:
      - "docs/claude/queue/CURRENT.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-product-worker-factory-queue
  cancel-in-progress: false

jobs:
  product-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Fail closed unless Claude OAuth exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLAUDE_CODE_OAUTH_TOKEN:-}"
          echo "CLAUDE_QUEUE_AUTH_SECRET=READY"

      - name: Checkout Claude worker lane
        uses: actions/checkout@v4
        with:
          ref: factory/claude-product-worker-01
          fetch-depth: 0

      - name: Validate and identify Factory work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/claude/queue/CURRENT.md
          WORK_ORDER_ID="$(sed -n 's/^id:[[:space:]]*//p' docs/claude/queue/CURRENT.md | head -n 1 | tr -d '\r\n')"
          if [[ -z "$WORK_ORDER_ID" || ! "$WORK_ORDER_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::CLAUDE_QUEUE_INVALID_WORK_ORDER_ID"
            exit 1
          fi
          echo "work_order_id=$WORK_ORDER_ID" >> "$GITHUB_OUTPUT"
          echo "CLAUDE_QUEUE_WORK_ORDER_ID=$WORK_ORDER_ID"

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Execute Factory-dispatched Claude work order
        id: claude
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN}" | tr -d '\r\n')"
          test -s docs/claude/queue/CURRENT.md
          PROMPT=$(cat <<'EOF'
          You are the Claude Product/Interface Worker inside the existing 4PLANET Production Factory.

          Rehydrate in this order before making product judgements:
          1. CLAUDE.md
          2. docs/claude/4PLANET_PRODUCT_BRAND_CORE.md
          3. docs/claude/CONTEXT_PROTOCOL.md
          4. docs/claude/CURRENT_4PLANET_CONTEXT.md
          5. docs/claude/queue/CURRENT.md
          6. exact pinned repository/code evidence required by that work order.

          The work order's goal, authority, write boundary, truth constraints, MUST-NOT-LOSE requirements and return contract are binding. Exercise independent product/interface judgement inside those boundaries. Do not create a competing architecture or truth system.

          This queue lane is REVIEW_ONLY. Do not modify repository files. Do not merge, deploy, release, change Canon, spend, or communicate externally.

          Spend turns on evidence and a decision-complete answer, not exhaustive archaeology. If the requested scope is too broad to complete inside the bounded run, prioritise the highest-value material seam and explicitly mark lower-priority areas UNKNOWN rather than exhausting the run without a return.

          Return only the requested compact Markdown result. Distinguish OBSERVED / INFERRED / PROPOSED / UNKNOWN where material.
          EOF
          )
          claude -p "$PROMPT" \
            --model claude-opus-5 \
            --max-turns 60 \
            --permission-mode plan \
            --tools "Read,Grep,Glob,Bash" \
            --no-session-persistence \
            > /tmp/claude-factory-result.md
          test -s /tmp/claude-factory-result.md
          echo "CLAUDE_QUEUE_REAL_CALL=PASS"

      - name: Prove model made no repository mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "::error::CLAUDE_QUEUE_READONLY_VIOLATION"
            git status --porcelain=v1
            exit 1
          fi
          echo "CLAUDE_QUEUE_READONLY_GATE=PASS"

      - name: Persist Factory-ingestible result
        shell: bash
        env:
          QUEUE_SHA: ${{ github.sha }}
          WORK_ORDER_ID: ${{ steps.order.outputs.work_order_id }}
        run: |
          set -euo pipefail

          git fetch origin factory/claude-product-worker-01 --no-tags
          git reset --hard origin/factory/claude-product-worker-01
          echo "CLAUDE_QUEUE_REBASE_TO_LATEST=PASS"

          mkdir -p docs/claude/results
          {
            echo "# CLAUDE FACTORY RESULT"
            echo
            echo "work_order_id: ${WORK_ORDER_ID}"
            echo "queue_sha: ${QUEUE_SHA}"
            echo "worker: CLAUDE_PRODUCT_INTERFACE"
            echo "model: claude-opus-5"
            echo "completed_at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "authority: REVIEW_ONLY"
            echo
            cat /tmp/claude-factory-result.md
          } > docs/claude/results/LATEST.md

          git config user.name "4PLANET Factory Claude Worker"
          git config user.email "actions@users.noreply.github.com"
          git add docs/claude/results/LATEST.md
          STAGED="$(git diff --cached --name-only)"
          if [[ "$STAGED" != "docs/claude/results/LATEST.md" ]]; then
            echo "::error::CLAUDE_QUEUE_RESULT_SCOPE_VIOLATION: $STAGED"
            exit 1
          fi
          git commit -m "result(factory): Claude Product Worker ${WORK_ORDER_ID}"
          git push origin HEAD:factory/claude-product-worker-01
          echo "CLAUDE_QUEUE_RESULT_PERSISTED=PASS"

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-factory-queue-result
          path: /tmp/claude-factory-result.md
          if-no-files-found: error
          retention-days: 14
