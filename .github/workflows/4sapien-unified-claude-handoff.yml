name: 4SAPIEN unified Claude handoff

on:
  push:
    branches: [handoff/4sapien-unified-claude-20260916]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/4sapien-unified-claude-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact current production surfaces
        run: |
          set -euo pipefail
          SITE=/tmp/4sapien-live
          FOOD=${SITE}/app/food/index.html
          rm -rf "$SITE"
          mkdir -p "${SITE}/app/food" "${SITE}/app"

          python products/4sapien/build/apply_front_v2_release.py \
            products/4sapien/source/claude-front-20260915-v2.html \
            "${SITE}/index.html"

          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > "$FOOD"
          python products/4sapien/build/apply_provider_guard.py "$FOOD"
          python products/4sapien/build/apply_meal_plan_guard.py "$FOOD"
          python products/4sapien/build/apply_product_gateway_guard.py "$FOOD"

          python products/4sapien/build/apply_finance_route.py "${SITE}/index.html"
          python products/4sapien/build/apply_finance_typography_guard.py "$SITE"

          test -f "${SITE}/index.html"
          test -f "${SITE}/app/food/index.html"
          test -f "${SITE}/app/money/index.html"
          grep -q 'See your life clearly.' "${SITE}/index.html"
          grep -q 'Ask Embla' "${SITE}/app/food/index.html"
          grep -q 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' "${SITE}/app/money/index.html"
          grep -q 'four-sapien-finance-claude-premium-v1' "${SITE}/app/money/index.html"

      - name: Build zero-loss handoff package
        run: |
          set -euo pipefail
          OUT=/tmp/4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16
          rm -rf "$OUT"
          mkdir -p \
            "$OUT/01_LIVE_FRONT" \
            "$OUT/02_LIVE_FOOD_EMBLA" \
            "$OUT/03_LIVE_FINANCE" \
            "$OUT/04_SHARED_RUNTIME" \
            "$OUT/05_CURRENT_4SAPIEN_CODE" \
            "$OUT/06_BACKEND_RELEVANT" \
            "$OUT/07_PRODUCTION_GATES"

          cp products/4sapien/handoff/CLAUDE_CONTEXT_UNIFIED_4SAPIEN_2026-09-16.md \
            "$OUT/CLAUDE_CONTEXT_UNIFIED_4SAPIEN_2026-09-16.md"

          printf '%s\n' \
            'Canonical production repository: odinskogen-dev/4Planet.05' \
            'Canonical production branch: build/ask-embla-live-20260909' \
            'Production base SHA: 3817a7916b369349081a7d2232bdb15d5ab743d1' \
            'Handoff branch: handoff/4sapien-unified-claude-20260916' \
            "Handoff package commit: $(git rev-parse HEAD)" \
            > "$OUT/PRODUCTION_TRUTH.txt"

          cp /tmp/4sapien-live/index.html "$OUT/01_LIVE_FRONT/index.html"
          cp /tmp/4sapien-live/app/food/index.html "$OUT/02_LIVE_FOOD_EMBLA/index.html"
          cp /tmp/4sapien-live/app/money/index.html "$OUT/03_LIVE_FINANCE/index.html"
          [ -f /tmp/4sapien-live/4sapien-theme.js ] && cp /tmp/4sapien-live/4sapien-theme.js "$OUT/04_SHARED_RUNTIME/4sapien-theme.js"

          # Include the full current 4SAPIEN product code, not only selected handoff snippets.
          cp -a products/4sapien/. "$OUT/05_CURRENT_4SAPIEN_CODE/"

          # Include repository backend files that are actually relevant to 4SAPIEN,
          # Embla, Food or Finance. Preserve paths so Claude can see the real structure.
          if [ -d supabase ]; then
            while IFS= read -r -d '' f; do
              rel="$f"
              if printf '%s' "$rel" | grep -Eqi '4sapien|four.?sapien|embla|finance|food' \
                || grep -Eqi '4sapien|four_sapien|embla|finance|food' "$f" 2>/dev/null; then
                mkdir -p "$OUT/06_BACKEND_RELEVANT/$(dirname "$rel")"
                cp "$f" "$OUT/06_BACKEND_RELEVANT/$rel"
              fi
            done < <(find supabase -type f -print0)
          fi

          for wf in \
            .github/workflows/ask-embla-production.yml \
            .github/workflows/ask-embla-finance-runtime.yml \
            .github/workflows/4sapien-unified-claude-handoff.yml; do
            [ -f "$wf" ] && cp "$wf" "$OUT/07_PRODUCTION_GATES/$(basename "$wf")"
          done

          # Also preserve any additional 4SAPIEN/Embla-specific production workflow files.
          while IFS= read -r -d '' wf; do
            base=$(basename "$wf")
            case "$base" in
              *4sapien*|*ask-embla*|*embla*) cp "$wf" "$OUT/07_PRODUCTION_GATES/$base" ;;
            esac
          done < <(find .github/workflows -maxdepth 1 -type f -print0)

          cat > "$OUT/README_FIRST.md" <<'EOF'
          # 4SAPIEN → Claude unified handoff

          Start with `CLAUDE_CONTEXT_UNIFIED_4SAPIEN_2026-09-16.md`.

          This package intentionally contains both:

          1. the materialised production surfaces Claude can inspect directly, and
          2. the current source/build/runtime/backend contracts that create and support those surfaces.

          The objective of the handoff is zero-loss product unification: Front, Embla, Food and Finance should become one coherent premium 4SAPIEN application without silently dropping working behaviour.

          The materialised HTML is reference output, not a replacement for the canonical source/build chain.
          EOF

          (cd "$OUT" && find . -type f | LC_ALL=C sort > MANIFEST.txt)
          printf 'Files in package: %s\n' "$(wc -l < "$OUT/MANIFEST.txt")" >> "$OUT/PRODUCTION_TRUTH.txt"

          # Fail if obvious private-secret value formats somehow entered the package.
          if grep -ERq 'sb_secret_[A-Za-z0-9_-]{12,}' "$OUT"; then
            echo 'Potential Supabase private secret found in handoff'; exit 9
          fi

          cd /tmp
          zip -qr 4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16.zip \
            4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16
          unzip -t 4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16.zip >/dev/null

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16
          path: /tmp/4SAPIEN_CLAUDE_UNIFIED_HANDOFF_2026-09-16.zip
          if-no-files-found: error
          retention-days: 30
