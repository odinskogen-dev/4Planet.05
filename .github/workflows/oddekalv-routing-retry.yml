name: Oddekalv Routing Retry

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/oddekalv-routing-retry.yml

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Retry Cloudflare Email Routing
        shell: bash
        run: |
          set -u
          [ -n "${CF_TOKEN:-}" ] || { echo "TOKEN_MISSING"; exit 2; }
          echo "::add-mask::$CF_TOKEN"
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONES=$(api "https://api.cloudflare.com/client/v4/zones?name=oddekalv.org&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",[]); print(r[0].get("id","") if r else "")')
          [ -n "$ZONE_ID" ] || { echo "ZONE_NOT_VISIBLE"; exit 3; }
          echo "ZONE_VISIBLE"
          BEFORE=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing")
          printf '%s' "$BEFORE" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("BEFORE_SUCCESS="+str(d.get("success"))); print("BEFORE_STATUS="+str(r.get("status"))); print("BEFORE_ENABLED="+str(r.get("enabled")))'
          ENABLE=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/dns")
          printf '%s' "$ENABLE" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("ENABLE_SUCCESS="+str(d.get("success"))); print("ENABLE_STATUS="+str(r.get("status"))); print("ENABLE_ENABLED="+str(r.get("enabled"))); print("ENABLE_ERRORS="+" | ".join(str(x.get("code",""))+":"+x.get("message","") for x in (d.get("errors") or [])))'
          AFTER=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing")
          printf '%s' "$AFTER" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("AFTER_SUCCESS="+str(d.get("success"))); print("AFTER_STATUS="+str(r.get("status"))); print("AFTER_ENABLED="+str(r.get("enabled"))); print("AFTER_ERRORS="+" | ".join(str(x.get("code",""))+":"+x.get("message","") for x in (d.get("errors") or [])))'
