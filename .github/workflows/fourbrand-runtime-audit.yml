name: 4BRAND Runtime Audit

on:
  pull_request:
    branches: [king/test]
    paths:
      - .github/workflows/fourbrand-runtime-audit.yml
      - src/App.tsx
      - src/pages/partners/FourBrand.tsx
      - src/pages/partners/FourBrandsLive.tsx
      - src/styles/fourbrand.css
      - functions/api/brand-analysis.ts
      - src/styles/fourbrand-intelligence.css
      - src/pages/partners/PublicCompanyProfile.tsx
      - src/pages/partners/PublicCompanyExternalSignals.tsx
      - functions/api/company-public-profile.ts
      - functions/api/company-first-party.ts
      - functions/api/company-eu-projects.ts
      - tests/e2e/4brands-public-intelligence.spec.ts
  push:
    branches: [king/test]
    paths:
      - .github/workflows/fourbrand-runtime-audit.yml
      - src/App.tsx
      - src/pages/partners/FourBrand.tsx
      - src/pages/partners/FourBrandsLive.tsx
      - src/styles/fourbrand.css
      - functions/api/brand-analysis.ts
      - src/styles/fourbrand-intelligence.css
      - src/pages/partners/PublicCompanyProfile.tsx
      - src/pages/partners/PublicCompanyExternalSignals.tsx
      - functions/api/company-public-profile.ts
      - functions/api/company-first-party.ts
      - functions/api/company-eu-projects.ts
      - tests/e2e/4brands-public-intelligence.spec.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve Cloudflare token
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          TOKEN_4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=""
          for candidate in "$TOKEN_1" "$TOKEN_2" "$TOKEN_3" "$TOKEN_4"; do
            [ -n "$candidate" ] && { TOKEN="$candidate"; break; }
          done
          [ -n "$TOKEN" ] || { echo 'missing Cloudflare token'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Confirm 4brands.org remains attached to existing 4PLANET Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          zone4p=$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone4p")
          [ -n "$account_id" ] || { echo 'Cloudflare account unavailable'; exit 1; }

          project=$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05" "${auth[@]}")
          jq -e '.success == true' <<<"$project" >/dev/null
          target=$(jq -r '.result.subdomain // "4planet-05.pages.dev"' <<<"$project")
          production_branch=$(jq -r '.result.production_branch // ""' <<<"$project")
          echo "Pages target=${target} production_branch=${production_branch}"

          zone4b=$(curl -fsS "${api}/zones?name=4brands.org&status=active" "${auth[@]}")
          zid4b=$(jq -r '.result[0].id // empty' <<<"$zone4b")
          [ -n "$zid4b" ] || { echo '4brands.org zone is not active/visible to token'; exit 1; }

          for host in 4brands.org www.4brands.org; do
            domains=$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05/domains" "${auth[@]}")
            jq -e --arg host "$host" 'any(.result[]?; .name == $host)' <<<"$domains" >/dev/null \
              || { echo "${host} is no longer attached to 4planet-05"; exit 1; }

            records=$(curl -fsS "${api}/zones/${zid4b}/dns_records?name=${host}&per_page=100" "${auth[@]}")
            jq -e --arg target "$target" 'any(.result[]?; .type == "CNAME" and .content == $target)' <<<"$records" >/dev/null \
              || { echo "${host} DNS no longer points to ${target}"; exit 1; }
          done

      - name: Read exact 4BRANDS Cloudflare production state
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          zone=$(curl -fsS "${api}/zones?name=4planet.org&status=active" "${auth[@]}")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          [ -n "$account_id" ] || { echo '4planet.org Cloudflare account unavailable'; exit 1; }

          project=$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05" "${auth[@]}")
          production_branch=$(jq -r '.result.production_branch // empty' <<<"$project")
          [ -n "$production_branch" ] || { echo 'production branch unavailable'; exit 1; }
          echo "production_branch=${production_branch}"

          deps=$(curl -fsS "${api}/accounts/${account_id}/pages/projects/4planet-05/deployments" "${auth[@]}")
          jq -e '.success == true' <<<"$deps" >/dev/null
          echo '=== newest production deployments ==='
          jq --arg branch "$production_branch" '{result: [.result[]? | select(.deployment_trigger.metadata.branch == $branch) | {id,url,environment,created_on,status:(.latest_stage.status // ""),commit:(.deployment_trigger.metadata.commit_hash // ""),branch:(.deployment_trigger.metadata.branch // "")}][0:8]}' <<<"$deps"

          newest_commit=$(jq -r --arg branch "$production_branch" '[.result[]? | select(.deployment_trigger.metadata.branch == $branch and .environment == "production")][0].deployment_trigger.metadata.commit_hash // empty' <<<"$deps")
          newest_status=$(jq -r --arg branch "$production_branch" '[.result[]? | select(.deployment_trigger.metadata.branch == $branch and .environment == "production")][0].latest_stage.status // empty' <<<"$deps")
          echo "CLOUDFLARE_PRODUCTION_COMMIT=${newest_commit}"
          echo "CLOUDFLARE_PRODUCTION_STATUS=${newest_status}"
          if [ -z "$newest_commit" ]; then
            echo 'CLOUDFLARE_PRODUCTION_DEPLOYMENT_METADATA=UNKNOWN_READBACK_REQUIRED'
            echo 'Deployment-list metadata is not used as candidate Gold. Live HTTP is verified separately below.'
          fi

      - name: Verify canonical 4planet.org/4brands runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            echo "4planet.org/4brands attempt ${attempt}/20"
            code=$(curl -sS -L --max-time 20 -o /tmp/4planet-4brands.html -w '%{http_code}' https://4planet.org/4brands || true)
            bytes=0
            [ -f /tmp/4planet-4brands.html ] && bytes=$(wc -c < /tmp/4planet-4brands.html | tr -d ' ')
            echo "HTTP=${code} bytes=${bytes}"
            if [ "$code" = "200" ] && [ "$bytes" -gt 500 ]; then
              ok=1
              break
            fi
            sleep 15
          done
          [ "$ok" = "1" ] || { echo 'canonical /4brands not HTTP 200 within provisioning window'; exit 1; }

      - name: Verify 4brands.org runtime
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 20 -o /tmp/4brands.html -w '%{http_code}' https://4brands.org/ || true)
          bytes=0
          [ -f /tmp/4brands.html ] && bytes=$(wc -c < /tmp/4brands.html | tr -d ' ')
          echo "HTTP=${code} bytes=${bytes}"
          [ "$code" = "200" ] && [ "$bytes" -gt 500 ] || exit 1

      - name: Verify TOMRA API proof on canonical 4planet.org
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/tomra.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"company":"TOMRA"}' \
            https://4planet.org/api/brand-analysis || true)
          echo "HTTP=${code}"
          if [ -f /tmp/tomra.json ]; then
            jq '{ok, engine:(.analysis.engine // null), company:(.analysis.company.name // null), status:(.analysis.analysisStatus // null), opportunities:(.analysis.opportunities | length? // 0), evidence:(.analysis.evidence | length? // 0), error, detail}' /tmp/tomra.json 2>/dev/null || head -c 500 /tmp/tomra.json
          fi
          [ "$code" = "200" ] || exit 1
          jq -e '.analysis.company.name == "TOMRA" and (.analysis.opportunities | length) > 0 and (.analysis.evidence | length) > 0' /tmp/tomra.json >/dev/null

      - name: Probe arbitrary-company analysis honestly
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 60 -o /tmp/arbitrary.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"company":"IKEA"}' \
            https://4planet.org/api/brand-analysis || true)
          echo "ARBITRARY_COMPANY_HTTP=${code}"
          if [ -f /tmp/arbitrary.json ]; then
            jq '{ok, company:(.analysis.company.name // null), status:(.analysis.analysisStatus // null), sources:(.analysis.evidence | length? // 0), error, detail}' /tmp/arbitrary.json 2>/dev/null || head -c 800 /tmp/arbitrary.json
          fi
          if [ "$code" = "200" ]; then
            echo 'ARBITRARY_COMPANY_STATE=LIVE_RESEARCH_AVAILABLE'
          else
            echo 'ARBITRARY_COMPANY_STATE=PARTIAL_OR_RUNTIME_KEY_UNAVAILABLE'
          fi

  public-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Existing 4BRANDS source contracts
        run: node --test scripts/company-identity-contract.test.mjs scripts/procurement-demand-contract.test.mjs scripts/company-climate-trace-contract.test.mjs
      - name: Public intelligence source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fetchBrregExact' functions/api/company-public-profile.ts
          grep -q 'konsernstruktur' functions/api/company-public-profile.ts
          grep -q 'oppdateringer/enheter' functions/api/company-public-profile.ts
          grep -q 'orgNummer=' functions/api/company-public-profile.ts
          grep -q 'WHAT DOES THE PUBLIC WORLD KNOW' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'WHAT LOOKS UNUSUAL' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'INDUSTRY COHORT' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'PublicBusinessSources' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'PublicProcurementIntelligence' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'Facility emissions intelligence is unavailable right now' src/pages/partners/PublicCompanyProfile.tsx
          grep -q 'BRREG_REGISTERED_WEBSITE' functions/api/company-first-party.ts
          grep -q 'CORDIS_SPARQL' functions/api/company-eu-projects.ts
          grep -q 'EXACT_CASE_INSENSITIVE_LEGAL_NAME_AFTER_BRREG_RESOLUTION' functions/api/company-eu-projects.ts
          grep -q 'SIGNAL BOUNDARY' src/pages/partners/PublicCompanyExternalSignals.tsx
          grep -q 'IDENTITY BOUNDARY' src/pages/partners/PublicCompanyExternalSignals.tsx
          grep -q 'loadPublicProfile(payload.entity.organizationNumber)' src/pages/partners/FourBrand.tsx
          ! grep -Eq 'linear-gradient|radial-gradient|box-shadow:' src/styles/fourbrand-intelligence.css
      - run: npm run typecheck
      - run: npm run build

  public-intelligence-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact HEIR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact source
        run: npm run build
      - name: Start exact-head preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/4brands-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/4brands-preview.log || true
          exit 1
      - name: Public-first desktop + mobile proof
        env:
          BASE_URL: http://127.0.0.1:4173
        run: >-
          npm run test:e2e --
          tests/e2e/4brands-public-intelligence.spec.ts
          --project=desktop-1440
          --project=mobile-390

  public-intelligence-open-source-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: BRREG-anchored first-party source mechanism respects access controls and fetches a permitted real site
        shell: bash
        run: |
          set -euo pipefail
          orgs=(927124238 923609016 982463718 984851006 943753709 914778271 910747711 964118191 916300484 989795848)
          fetched=0
          registered=0
          for orgnr in "${orgs[@]}"; do
            entity=$(curl -fsS --retry 3 --max-time 20 -H 'Accept: application/vnd.brreg.enhetsregisteret.enhet.v2+json' "https://data.brreg.no/enhetsregisteret/api/enheter/${orgnr}")
            test "$(jq -r '.organisasjonsnummer' <<<"$entity")" = "$orgnr"
            site=$(jq -r '.hjemmeside // empty' <<<"$entity")
            [ -n "$site" ] || { echo "$orgnr NO_REGISTERED_WEBSITE"; continue; }
            registered=$((registered+1))
            case "$site" in http://*|https://*) ;; *) site="https://$site";; esac
            outfile="/tmp/first-party-${orgnr}.html"
            code=$(curl -sS -L --retry 1 --max-time 20 -A '4PLANET/1.0 public-company-source-discovery (https://4planet.org)' -o "$outfile" -w '%{http_code}' "$site" || true)
            bytes=$(wc -c <"$outfile" 2>/dev/null || echo 0)
            echo "$orgnr registered_website=$site HTTP=$code bytes=$bytes"
            if [ "$code" = "200" ] && [ "$bytes" -gt 500 ]; then
              fetched=$((fetched+1))
            elif [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "429" ]; then
              echo "$orgnr FIRST_PARTY_ACCESS_CONTROLLED — respected; no bypass attempted"
            else
              echo "$orgnr FIRST_PARTY_SOURCE_UNAVAILABLE"
            fi
          done
          test "$registered" -gt 0
          test "$fetched" -gt 0
          echo "FIRST_PARTY_REAL_FETCH_PASS fetched=$fetched registered=$registered"

      - name: Public CORDIS EURIO SPARQL endpoint responds
        shell: bash
        run: |
          set -euo pipefail
          q='PREFIX eurio: <http://data.europa.eu/s66#> SELECT ?project WHERE { ?project a eurio:Project . } LIMIT 1'
          curl -fsS --retry 2 --max-time 30 -X POST \
            -H 'accept: application/sparql-results+json' \
            -H 'content-type: application/x-www-form-urlencoded; charset=utf-8' \
            --data-urlencode "query=$q" \
            --data-urlencode 'format=application/sparql-results+json' \
            https://cordis.europa.eu/datalab/sparql -o /tmp/cordis.json
          jq -e '.results.bindings | type == "array"' /tmp/cordis.json >/dev/null

      - name: Public TED search API responds
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --max-time 30 \
            -H 'content-type: application/json' -H 'accept: application/json' \
            --data '{"query":"FT~recycling AND buyer-country=NOR SORT BY publication-date DESC","fields":["publication-number","notice-title"],"limit":1,"scope":"ACTIVE","paginationMode":"PAGE_NUMBER","page":1,"checkQuerySyntax":true}' \
            https://api.ted.europa.eu/v3/notices/search -o /tmp/ted.json
          jq -e 'type == "object"' /tmp/ted.json >/dev/null

      - name: Climate TRACE beta availability stays fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 2 --max-time 25 -G \
            --data-urlencode 'name=TOMRA' --data-urlencode 'limit=2' \
            -H 'accept: application/json' \
            -o /tmp/climate-owners.json -w '%{http_code}' \
            https://api.climatetrace.org/v7/owners || true)
          echo "Climate TRACE HTTP=$code"
          if [ "$code" = "200" ]; then
            jq -e 'type == "array" or type == "object"' /tmp/climate-owners.json >/dev/null
            echo 'CLIMATE_TRACE_OWNER_DISCOVERY=LIVE'
          else
            case "$code" in
              404|429|500|502|503|504)
                grep -q 'Facility emissions intelligence is unavailable right now' src/pages/partners/PublicCompanyProfile.tsx
                ! grep -q '<CompanyClimateTracePanel analysis={analysis} />' src/pages/partners/FourBrand.tsx
                echo "CLIMATE_TRACE_OWNER_DISCOVERY=UNAVAILABLE_FAIL_CLOSED"
                ;;
              *)
                echo "Unexpected Climate TRACE status: $code"
                exit 1
                ;;
            esac
          fi

  public-intelligence-real-brreg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { company: TOMRA, org: "927124238" }
          - { company: EQUINOR, org: "923609016" }
          - { company: TELENOR, org: "982463718" }
          - { company: DNB, org: "984851006" }
          - { company: KONGSBERG, org: "943753709" }
          - { company: HYDRO, org: "914778271" }
          - { company: ORKLA, org: "910747711" }
          - { company: MOWI, org: "964118191" }
          - { company: STOREBRAND, org: "916300484" }
          - { company: AKER_BP, org: "989795848" }
    steps:
      - name: Exact entity, roles, changes and structure
        shell: bash
        run: |
          set -euo pipefail
          base='https://data.brreg.no/enhetsregisteret/api'
          org="${{ matrix.org }}"
          curl -fsS --retry 3 -H "Accept: application/vnd.brreg.enhetsregisteret.enhet.v2+json" "$base/enheter/$org" -o entity.json
          jq -e --arg org "$org" '.organisasjonsnummer == $org and (.navn | length > 0)' entity.json >/dev/null
          curl -fsS --retry 3 -H "Accept: application/vnd.brreg.enhetsregisteret.rolle.v1+json" "$base/enheter/$org/roller" -o roles.json
          jq -e '.rollegrupper | type == "array"' roles.json >/dev/null
          curl -fsS --retry 3 "$base/oppdateringer/enheter?organisasjonsnummer=$org&includeChanges=true&size=5&sort=id,DESC" -o updates.json
          jq -e 'type == "object"' updates.json >/dev/null
          code=$(curl -sS --retry 3 -o group.json -w "%{http_code}" "$base/konsernstruktur/$org")
          case "$code" in 200|404) ;; *) echo "group HTTP=$code"; exit 1;; esac
          curl -fsS --retry 3 "$base/underenheter?overordnetEnhet=$org&size=5" -o units.json
          jq -e 'type == "object"' units.json >/dev/null
      - name: Accounts, financial facts and industry cohort
        shell: bash
        run: |
          set -euo pipefail
          org="${{ matrix.org }}"
          accounts='https://data.brreg.no/regnskapsregisteret/regnskap/aarsregnskap'
          code=$(curl -sS --retry 3 -o years.json -w "%{http_code}" "$accounts/kopi/$org/aar")
          case "$code" in 200|404) ;; *) echo "accounts HTTP=$code"; exit 1;; esac
          finance='https://data.brreg.no/regnskapsregisteret/regnskap'
          code=$(curl -sS --retry 3 -o finance.json -w "%{http_code}" "$finance?orgNummer=$org")
          case "$code" in
          200) jq -e --arg org "$org" 'type == "array" and length > 0 and (.[0].virksomhet.organisasjonsnummer == $org)' finance.json >/dev/null ;;
          404) ;;
          *) echo "financials HTTP=$code"; exit 1;;
          esac
          industry=$(jq -r '.naeringskode1.kode // empty' entity.json)
          if [ -n "$industry" ]; then
            base='https://data.brreg.no/enhetsregisteret/api'
            curl -fsS --retry 3 --get --data-urlencode "naeringskode=$industry" --data-urlencode "size=13" --data-urlencode "sort=antallAnsatte,DESC" "$base/enheter" -o cohort.json
            jq -e '._embedded.enheter | type == "array"' cohort.json >/dev/null
          fi
