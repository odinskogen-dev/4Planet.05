name: 4SAPIEN Ask Embla production gate

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/ask-embla-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE
  CF_SERVICE: four-sapien-embla
  CUSTOM_DOMAIN: 4sapien.com

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize Claude-leading interface
        run: |
          set -euo pipefail
          mkdir -p products/4sapien/site
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > products/4sapien/site/index.html
          cp products/4sapien/cloudflare/_headers products/4sapien/site/_headers

      - name: Zero-loss source and security QA
        run: |
          set -euo pipefail
          SITE=products/4sapien/site/index.html
          grep -q 'Ask Embla' "$SITE"
          grep -q '4SAPIEN by 4PLANET' "$SITE"
          grep -q 'four_sapien_profiles' "$SITE"
          grep -q 'four_sapien_list_items' "$SITE"
          grep -q 'four_sapien_shops' "$SITE"
          grep -q 'four-sapien-receipts' "$SITE"
          ! grep -q 'S4PIENS' "$SITE"
          ! grep -Eqi 'service[_-]?role|sb_secret_' "$SITE"
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('products/4sapien/site/index.html').read_text()
          m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
          assert m, 'Babel/React source block missing'
          pathlib.Path('/tmp/embla.jsx').write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/embla.jsx --loader:.jsx=jsx --outfile=/tmp/embla-check.js

      - name: Verify Supabase database gate
        id: db
        run: |
          set -euo pipefail
          ok=1
          for table in four_sapien_profiles four_sapien_list_items four_sapien_shops; do
            code=$(curl -sS -o "/tmp/${table}.json" -w '%{http_code}' \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=0" || true)
            [ "$code" = "200" ] || { ok=0; echo "DB gate missing: ${table} HTTP ${code}"; cat "/tmp/${table}.json" || true; }
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"

      - name: Verify Supabase Auth providers
        id: auth
        run: |
          set -euo pipefail
          curl -fsS -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/auth/v1/settings" > /tmp/auth.json
          email=$(jq -r '(.external.email // false) | tostring' /tmp/auth.json)
          google=$(jq -r '(.external.google // false) | tostring' /tmp/auth.json)
          echo "email=$email" >> "$GITHUB_OUTPUT"
          echo "google=$google" >> "$GITHUB_OUTPUT"
          if [ "$email" = true ] && [ "$google" = true ]; then echo 'ready=1' >> "$GITHUB_OUTPUT"; else echo 'ready=0' >> "$GITHUB_OUTPUT"; fi
          echo "Auth provider state: email=${email}, google=${google}"

      - name: Resolve Cloudflare authority
        id: cf
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF3: ${{ secrets.CF_API_TOKEN }}
          CF4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF1:-${CF2:-${CF3:-${CF4:-}}}}"
          [ -n "$token" ] || { echo 'Missing Cloudflare token'; exit 8; }
          echo "token=$token" >> "$GITHUB_OUTPUT"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
          root=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active')
          account=$(jq -r '.result[0].account.id // empty' <<<"$root")
          [ -n "$account" ] || { echo 'Cloudflare account unresolved'; exit 9; }
          zone_json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${CUSTOM_DOMAIN}&status=active")
          zone=$(jq -r '.result[0].id // empty' <<<"$zone_json")
          [ -n "$zone" ] || { echo '4sapien.com zone missing/inactive'; exit 10; }
          echo "account=$account" >> "$GITHUB_OUTPUT"
          echo "zone=$zone" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated Workers static-assets candidate
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          cd products/4sapien
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-worker.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-worker.log | tail -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then curl -fsS "$url" | grep -q 'Ask Embla'; fi

      - name: Fail closed on conflicting 4sapien.com Worker authority
        id: domaincheck
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          domains=$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains")
          current=$(jq -r --arg h "$CUSTOM_DOMAIN" '.result[]? | select(.hostname==$h) | .service' <<<"$domains" | head -n1)
          if [ -n "$current" ] && [ "$current" != "$CF_SERVICE" ]; then
            echo "4sapien.com is already bound to another Worker service: ${current}"
            exit 12
          fi
          echo "current=${current:-none}" >> "$GITHUB_OUTPUT"

      - name: Attach 4sapien.com only after database + Email + Google gates pass
        id: prod
        if: steps.db.outputs.ready == '1' && steps.auth.outputs.ready == '1'
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
          CF_ZONE_ID: ${{ steps.cf.outputs.zone }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" \
            --data "{\"hostname\":\"${CUSTOM_DOMAIN}\",\"service\":\"${CF_SERVICE}\",\"zone_id\":\"${CF_ZONE_ID}\"}" \
            | tee /tmp/domain.json
          test "$(jq -r '.success' /tmp/domain.json)" = true
          echo 'deployed=1' >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${CUSTOM_DOMAIN}" | grep -q 'Ask Embla'; then exit 0; fi
            sleep 3
          done
          echo 'Custom-domain runtime verification failed'
          exit 13

      - name: Release summary
        if: always()
        run: |
          {
            echo '## 4SAPIEN / Ask Embla production gate'
            echo '- Claude-leading source: PASS'
            echo '- Syntax/security QA: PASS'
            echo "- Database: ${{ steps.db.outputs.ready }}"
            echo "- Email Auth: ${{ steps.auth.outputs.email }}"
            echo "- Google Auth: ${{ steps.auth.outputs.google }}"
            echo '- 4sapien.com Cloudflare zone: PASS'
            echo "- Isolated Worker candidate: ${{ steps.deploy.outputs.url }}"
            echo "- Custom-domain conflict: ${{ steps.domaincheck.outputs.current }}"
            echo "- 4sapien.com production attached: ${{ steps.prod.outputs.deployed }}"
          } >> "$GITHUB_STEP_SUMMARY"
