name: 4SAPIEN One Product production gate

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/ask-embla-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE
  CF_SERVICE: four-sapien-embla
  CUSTOM_DOMAIN: 4sapien.com

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize Claude unified redesign release
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          DROP=/tmp/4sapien-unified-20260917
          FOOD=${SITE}/app/food/index.html
          rm -rf "$SITE" "$DROP"
          mkdir -p "${SITE}/app/food" "${SITE}/app" "$DROP"

          python products/4sapien/build/materialize_unified_drop.py \
            products/4sapien/source/claude-unified-20260917 \
            "$DROP"

          cp products/4sapien/source/4sapien-design.css "${SITE}/4sapien-design.css"
          cp products/4sapien/source/4sapien-theme.js "${SITE}/4sapien-theme.js"

          # Claude owns the visible shell; AXE binds it to real auth, Embla and same-origin worlds.
          python products/4sapien/build/apply_front_v2_release.py \
            "$DROP/4sapien_app_unified.html" \
            "${SITE}/index.html"

          # Claude's merged Food handback already contains the proven gateway, meal-plan,
          # permission, auth and Supabase runtime. Do not re-apply stale visible patches.
          cp "$DROP/4sapien_food_MERGED.html" "$FOOD"

          # Claude's merged Finance donor + AXE experience; keep the existing V3 interaction seam
          # and canonical Finance Twin runtime, but do not re-apply the superseded premium visual layer.
          python products/4sapien/build/apply_finance_route.py \
            "${SITE}/index.html" \
            "$DROP/4sapien_finance_MERGED.html" \
            "$DROP/4sapien_finance_AXE_experience_MERGED.html"
          python products/4sapien/build/apply_finance_typography_guard.py "$SITE"
          python products/4sapien/build/apply_unified_design_guard.py "$SITE"

          cp products/4sapien/source/4sapien-live-hardening.css "${SITE}/4sapien-live-hardening.css"
          cp products/4sapien/source/4sapien-live-hardening.js "${SITE}/4sapien-live-hardening.js"
          python products/4sapien/build/apply_live_hardening_guard.py "$SITE"
          python products/4sapien/build/apply_document_intake_guard.py "$SITE"

          cp products/4sapien/cloudflare/_headers "${SITE}/_headers"
          cp products/4sapien/cloudflare/_redirects "${SITE}/_redirects"
          cat > "${SITE}/app/index.html" <<'HTML'
          <!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/"><title>4SAPIEN</title><link rel="canonical" href="https://4sapien.com/"></head><body><a href="/">Åpne 4SAPIEN</a></body></html>
          HTML

      - name: Zero-loss unified product and security QA
        run: |
          set -euo pipefail
          ROOT=products/4sapien/site/index.html
          FOOD=products/4sapien/site/app/food/index.html
          MONEY=products/4sapien/site/app/money/index.html

          # Unified root / Today shell.
          grep -q '<title>4SAPIEN</title>' "$ROOT"
          grep -q 'Se livet ditt klart.' "$ROOT"
          grep -q '/app/food/' "$ROOT"
          grep -q '/app/money/' "$ROOT"
          grep -q '/brain/' "$ROOT"
          grep -q 'functions/v1/embla-core-preview' "$ROOT"
          grep -q 'id="account-link"' "$ROOT"
          grep -q 'id="four-sapien-front-auth"' "$ROOT"
          grep -q 'window.FourSapienTheme' "$ROOT"
          grep -q '/4sapien-design.css' "$ROOT"
          grep -q 'w-embla' "$ROOT"
          ! grep -q 'verdenen monteres her' "$ROOT"
          ! grep -q '(I det ekte produktet svarer Embla-runtimen her' "$ROOT"
          grep -Fq '/4sapien-live-hardening.js' "$ROOT"
          grep -Fq 'credit_balance_exhausted' "$ROOT"

          # Food / Ask Embla — Claude merged real runtime.
          for marker in \
            'Ask Embla' 'MAT · EMBLA · BY 4PLANET' 'four_sapien_profiles' \
            'four_sapien_list_items' 'four_sapien_shops' 'four_sapien_meal_plans' \
            'four-sapien-receipts' 'googleEnabled' 'MEAL_PLAN_HYDRATE_FAILED' \
            'MEAL_PLAN_SAVE_FAILED' 'functions/v1/embla-products' 'RATE_LIMITED' \
            'DELVIS DATADEKNING' 'price:p.embla_price' '4PLANET ID · INNLOGGET' \
            '/4sapien-theme.js' '/4sapien-design.css' 'FS_THEMES=' 'FourSapienTheme.subscribe' 'w-food'; do
            grep -Fq "$marker" "$FOOD"
          done
          grep -q 'emailRedirectTo:"https://4sapien.com/app/food/"' "$FOOD"
          grep -q 'redirectTo:"https://4sapien.com/app/food/"' "$FOOD"
          ! grep -Eqi 'world.openfoodfacts.org|cgi/search.pl|offSearch\(|offBarcode\(' "$FOOD"
          for marker in 'fs-food-main' 'knownStores' 'preferredStore' 'fs-meal-cta' 'MAT · EMBLA' '/4sapien-live-hardening.js'; do
            grep -Fq "$marker" "$FOOD"
          done

          # Money — Claude unified redesign + canonical V3/runtime.
          for marker in \
            '<title>4SAPIEN Finance — Embla</title>' 'PENGER · EMBLA · BY 4PLANET' \
            'four_sapien_finance_accounts' 'four_sapien_finance_events' 'four-sapien-finance-docs' \
            'ghvdzetmplqkdtfqiror.supabase.co' 'sb.auth.getSession()' \
            'AXE_FINANCE_EXPERIENCE_V2' 'AXE_FINANCE_UX_V3' 'CLAUDE_UNIFIED_REDESIGN_20260917' \
            'four-sapien-finance-unified-type-guard' \
            'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' '/4sapien-theme.js' '/4sapien-design.css' 'w-money'; do
            grep -Fq "$marker" "$MONEY"
          done
          ! grep -q 'window.__toggleTheme' "$MONEY"
          for marker in 'fs-money-main' 'PENGER · EMBLA' '/4sapien-live-hardening.js'; do
            grep -Fq "$marker" "$MONEY"
          done
          grep -Fq 'fs-finance-year' products/4sapien/site/4sapien-live-hardening.js
          grep -Fq 'fs-finance-attn-grid' products/4sapien/site/4sapien-live-hardening.js
          grep -Fq 'four_sapien_finance_confirm_document' products/4sapien/site/4sapien-documents.js
          python products/4sapien/build/audit_finance_typography.py \
            products/4sapien/build/apply_finance_route.py "$MONEY"

          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' products/4sapien/site

          # Babel/React syntax for both live worlds.
          python - <<'PY'
          import re, pathlib
          for src,out in [('products/4sapien/site/app/food/index.html','/tmp/food.jsx'),('products/4sapien/site/app/money/index.html','/tmp/money.jsx')]:
              s=pathlib.Path(src).read_text()
              m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
              assert m, f'Babel/React source block missing: {src}'
              pathlib.Path(out).write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/food.jsx --loader:.jsx=jsx --outfile=/tmp/food-check.js
          npx --yes esbuild@0.25.9 /tmp/money.jsx --loader:.jsx=jsx --outfile=/tmp/money-check.js
          node --check products/4sapien/site/4sapien-live-hardening.js
          node --check products/4sapien/site/4sapien-documents.js
          node --check products/4sapien/site/4sapien-document-analysis.js
          node products/4sapien/qa/test_document_analysis.cjs
          grep -Fq 'claimStage:null' products/4sapien/site/4sapien-document-analysis.js
          grep -Fq 'kid:null' products/4sapien/site/4sapien-document-analysis.js
          grep -Fq 'account:null' products/4sapien/site/4sapien-document-analysis.js
          node --check products/4sapien/site/4sapien-import.js
          node --check products/4sapien/site/4sapien-csv.js
          node products/4sapien/qa/test_csv_import.cjs
          grep -Fq 'four_sapien_finance_confirm_csv_import' products/4sapien/site/4sapien-import.js
          grep -Fq '/4sapien-csv.js' products/4sapien/site/app/money/import/index.html
          python -m py_compile products/4sapien/build/apply_document_intake_guard.py
          for marker in 'four_sapien_finance_confirm_document' 'four-sapien-finance-docs'; do
            grep -Fq "$marker" products/4sapien/site/4sapien-documents.js
          done
          for route in products/4sapien/site/app/money/documents/index.html products/4sapien/site/app/money/index.html products/4sapien/site/finance.html products/4sapien/site/finance/index.html; do
            grep -Fq '/app/money/documents/' "$route" || grep -Fq '/4sapien-documents.js' "$route"
          done
          grep -Fq 'exportPersonalBrain' products/4sapien/site/brain/index.html
          python -m py_compile products/4sapien/build/apply_live_hardening_guard.py
          BRAIN=products/4sapien/site/brain/index.html
          for marker in 'persistDirectContextFallback' 'MODEL_PENDING' 'brainIdentity' '/4sapien-live-hardening.js'; do
            grep -Fq "$marker" "$BRAIN"
          done

      - name: Verify Supabase database gate
        id: db
        run: |
          set -euo pipefail
          ok=1
          for table in four_sapien_profiles four_sapien_list_items four_sapien_shops four_sapien_meal_plans four_sapien_product_cache four_sapien_finance_accounts four_sapien_finance_events four_sapien_finance_budget; do
            code=$(curl -sS -o "/tmp/${table}.json" -w '%{http_code}' -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=0" || true)
            [ "$code" = "200" ] || { ok=0; echo "DB gate missing: ${table} HTTP ${code}"; }
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          test "$ok" = 1

      - name: Verify authenticated Food + Embla boundaries
        id: gateway
        run: |
          set -euo pipefail
          for fn in embla-products embla-core-preview; do
            code=$(curl -sS -o "/tmp/${fn}.json" -w '%{http_code}' -X POST -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' --data '{"q":"yoghurt","message":"hello"}' "${SUPABASE_URL}/functions/v1/${fn}" || true)
            [ "$code" = "401" ] || { echo "${fn} auth boundary unexpected HTTP ${code}"; cat "/tmp/${fn}.json" || true; exit 7; }
          done
          echo 'ready=1' >> "$GITHUB_OUTPUT"

      - name: Verify Supabase Auth providers
        id: auth
        run: |
          set -euo pipefail
          curl -fsS -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/auth/v1/settings" > /tmp/auth.json
          email=$(jq -r '(.external.email // false) | tostring' /tmp/auth.json)
          google=$(jq -r '(.external.google // false) | tostring' /tmp/auth.json)
          echo "email=$email" >> "$GITHUB_OUTPUT"
          echo "google=$google" >> "$GITHUB_OUTPUT"
          if [ "$email" = true ]; then echo 'launch_ready=1' >> "$GITHUB_OUTPUT"; else echo 'launch_ready=0' >> "$GITHUB_OUTPUT"; fi
          echo "Auth provider state: email=${email}, google=${google}"

      - name: Resolve Cloudflare authority
        id: cf
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF3: ${{ secrets.CF_API_TOKEN }}
          CF4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF1:-${CF2:-${CF3:-${CF4:-}}}}"
          [ -n "$token" ] || { echo 'Missing Cloudflare token'; exit 8; }
          echo "token=$token" >> "$GITHUB_OUTPUT"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
          root=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active')
          account=$(jq -r '.result[0].account.id // empty' <<<"$root")
          [ -n "$account" ] || { echo 'Cloudflare account unresolved'; exit 9; }
          echo "account=$account" >> "$GITHUB_OUTPUT"
          zone_json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${CUSTOM_DOMAIN}&status=active")
          zone=$(jq -r '.result[0].id // empty' <<<"$zone_json")
          [ -n "$zone" ] || { echo '4sapien.com zone missing/inactive'; exit 10; }
          echo "zone=$zone" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated Workers static-assets candidate
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          cd products/4sapien
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-worker.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-worker.log | tail -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] || { echo 'Worker URL not resolved'; exit 11; }
          for i in 1 2 3 4 5; do
            root_ok=0; food_ok=0; money_ok=0; css_ok=0; docs_ok=0
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/" -o /tmp/root.html && grep -q 'Se livet ditt klart.' /tmp/root.html && grep -q 'four-sapien-front-auth' /tmp/root.html && root_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/food/" -o /tmp/food.html && grep -q 'four_sapien_meal_plans' /tmp/food.html && grep -q 'functions/v1/embla-products' /tmp/food.html && grep -q 'w-food' /tmp/food.html && food_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/money/" -o /tmp/money.html && grep -q 'CLAUDE_UNIFIED_REDESIGN_20260917' /tmp/money.html && grep -q 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' /tmp/money.html && grep -q 'w-money' /tmp/money.html && money_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/money/documents/" -o /tmp/docs.html && grep -Fq 'Bekreft og lagre' /tmp/docs.html && curl -fsS "$url/4sapien-documents.js" -o /tmp/docs.js && grep -Fq 'four_sapien_finance_confirm_document' /tmp/docs.js && curl -fsS "$url/4sapien-document-analysis.js" -o /tmp/parser.js && grep -Fq 'claimStage:null' /tmp/parser.js && grep -Fq 'kid:null' /tmp/parser.js && grep -Fq 'account:null' /tmp/parser.js && docs_ok=1 || true
            curl -fsS "$url/4sapien-design.css" -o /tmp/design.css && grep -q '4SAPIEN DESIGN SYSTEM' /tmp/design.css && curl -fsS "$url/4sapien-live-hardening.js" -o /tmp/hardening.js && grep -q 'fs-finance-year' /tmp/hardening.js && grep -q 'globalAppNav' /tmp/hardening.js && grep -q 'note_updated' /tmp/hardening.js && css_ok=1 || true
            if [ "$root_ok" = 1 ] && [ "$food_ok" = 1 ] && [ "$money_ok" = 1 ] && [ "$css_ok" = 1 ] && [ "$docs_ok" = 1 ]; then exit 0; fi
            sleep 2
          done
          echo 'Worker candidate runtime verification failed'
          exit 11

      - name: Fail closed on conflicting 4sapien.com Worker authority
        id: domaincheck
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          domains=$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains")
          current=$(jq -r --arg h "$CUSTOM_DOMAIN" '.result[]? | select(.hostname==$h) | .service' <<<"$domains" | head -n1)
          if [ -n "$current" ] && [ "$current" != "$CF_SERVICE" ]; then echo "4sapien.com conflict: ${current}"; exit 12; fi
          echo "current=${current:-none}" >> "$GITHUB_OUTPUT"

      - name: Attach 4sapien.com after all gates pass
        id: prod
        if: steps.db.outputs.ready == '1' && steps.auth.outputs.launch_ready == '1' && steps.gateway.outputs.ready == '1'
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
          CF_ZONE_ID: ${{ steps.cf.outputs.zone }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "{\"hostname\":\"${CUSTOM_DOMAIN}\",\"service\":\"${CF_SERVICE}\",\"zone_id\":\"${CF_ZONE_ID}\"}" | tee /tmp/domain.json
          test "$(jq -r '.success' /tmp/domain.json)" = true
          echo 'deployed=1' >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5 6 7 8; do
            root_ok=0; food_ok=0; money_ok=0; css_ok=0; docs_ok=0
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/" -o /tmp/prod-root.html && grep -q 'Se livet ditt klart.' /tmp/prod-root.html && grep -q 'four-sapien-front-auth' /tmp/prod-root.html && root_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/app/food/" -o /tmp/prod-food.html && grep -q 'four_sapien_meal_plans' /tmp/prod-food.html && grep -q 'functions/v1/embla-products' /tmp/prod-food.html && grep -q 'w-food' /tmp/prod-food.html && food_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/app/money/" -o /tmp/prod-money.html && grep -q 'CLAUDE_UNIFIED_REDESIGN_20260917' /tmp/prod-money.html && grep -q 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' /tmp/prod-money.html && grep -q 'w-money' /tmp/prod-money.html && money_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/app/money/documents/" -o /tmp/prod-docs.html && grep -Fq 'Bekreft og lagre' /tmp/prod-docs.html && curl -fsS "https://${CUSTOM_DOMAIN}/4sapien-documents.js" -o /tmp/prod-docs.js && grep -Fq 'four_sapien_finance_confirm_document' /tmp/prod-docs.js && curl -fsS "https://${CUSTOM_DOMAIN}/4sapien-document-analysis.js" -o /tmp/prod-parser.js && grep -Fq 'claimStage:null' /tmp/prod-parser.js && grep -Fq 'kid:null' /tmp/prod-parser.js && grep -Fq 'account:null' /tmp/prod-parser.js && docs_ok=1 || true
            curl -fsS "https://${CUSTOM_DOMAIN}/4sapien-design.css" -o /tmp/prod-design.css && grep -q '4SAPIEN DESIGN SYSTEM' /tmp/prod-design.css && curl -fsS "https://${CUSTOM_DOMAIN}/4sapien-live-hardening.js" -o /tmp/prod-hardening.js && grep -q 'fs-finance-year' /tmp/prod-hardening.js && grep -q 'globalAppNav' /tmp/prod-hardening.js && grep -q 'note_updated' /tmp/prod-hardening.js && css_ok=1 || true
            if [ "$root_ok" = 1 ] && [ "$food_ok" = 1 ] && [ "$money_ok" = 1 ] && [ "$css_ok" = 1 ] && [ "$docs_ok" = 1 ]; then exit 0; fi
            sleep 3
          done
          echo 'Custom-domain runtime verification failed'
          exit 13

      - name: Release summary
        if: always()
        run: |
          {
            echo '## 4SAPIEN Unified Redesign production gate'
            echo '- Claude unified shell: PASS'
            echo '- Claude shared design grammar: PASS'
            echo '- Claude merged Food runtime: PASS'
            echo '- Claude merged Finance + AXE V3: PASS'
            echo '- Canonical Finance Twin runtime preserved: PASS'
            echo '- Canonical theme + sans typography: PASS'
            echo '- Browser-secret scan: PASS'
            echo "- Database gate: ${{ steps.db.outputs.ready }}"
            echo "- Food + Embla auth boundary: ${{ steps.gateway.outputs.ready }}"
            echo "- Email Auth: ${{ steps.auth.outputs.email }}"
            echo "- Google Auth: ${{ steps.auth.outputs.google }}"
            echo '- 4sapien.com Cloudflare authority: PASS'
            echo "- Isolated Worker candidate: ${{ steps.deploy.outputs.url }}"
            echo "- Custom-domain conflict: ${{ steps.domaincheck.outputs.current }}"
            echo "- 4sapien.com production attached: ${{ steps.prod.outputs.deployed }}"
          } >> "$GITHUB_STEP_SUMMARY"
