name: 4SAPIEN One Product production gate

on:
  push:
    branches: [build/ask-embla-live-20260909]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/ask-embla-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE
  CF_SERVICE: four-sapien-embla
  CUSTOM_DOMAIN: 4sapien.com

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize Claude One Product release
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          FOOD=${SITE}/app/food/index.html
          rm -rf "$SITE"
          mkdir -p "${SITE}/app/food" "${SITE}/app"

          # Latest Claude public front v2, integrated without shipping its local demo app.
          python products/4sapien/build/apply_front_v2_release.py \
            products/4sapien/source/claude-front-20260915-v2.html \
            "${SITE}/index.html"

          # Preserve the full existing Claude Food / Ask Embla product and proven runtime guards.
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > "$FOOD"
          python products/4sapien/build/apply_provider_guard.py "$FOOD"
          python products/4sapien/build/apply_meal_plan_guard.py "$FOOD"
          python products/4sapien/build/apply_product_gateway_guard.py "$FOOD"

          # Preserve the full Claude Finance donor against the shared Supabase runtime.
          python products/4sapien/build/apply_finance_route.py "${SITE}/index.html"

          cp products/4sapien/cloudflare/_headers "${SITE}/_headers"
          cp products/4sapien/cloudflare/_redirects "${SITE}/_redirects"
          cat > "${SITE}/app/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/app/food/"><title>4SAPIEN</title><link rel="canonical" href="https://4sapien.com/app/food/"></head><body><a href="/app/food/">Open 4SAPIEN</a></body></html>
          HTML

      - name: Zero-loss product and security QA
        run: |
          set -euo pipefail
          ROOT=products/4sapien/site/index.html
          FOOD=products/4sapien/site/app/food/index.html
          MONEY=products/4sapien/site/app/money/index.html

          # Public front v2.
          grep -q '<title>4SAPIEN — See your life clearly.</title>' "$ROOT"
          grep -q 'See your life clearly.' "$ROOT"
          grep -q 'Food × Money · together' "$ROOT"
          grep -q 'Plan my food until payday.' "$ROOT"
          grep -q 'illustrative demo' "$ROOT"
          grep -q '/app/food/' "$ROOT"
          grep -q '/app/money/' "$ROOT"
          grep -q '#2E2EFF' "$ROOT"
          grep -q '#3AE86F' "$ROOT"
          grep -q '#FF4D22' "$ROOT"
          grep -q '#FF5ACD' "$ROOT"
          grep -q 'Your data is used to provide your 4SAPIEN experience.' "$ROOT"
          grep -q 'id="method"' "$ROOT"
          grep -q 'id="privacy"' "$ROOT"
          ! grep -q 'function openApp' "$ROOT"
          ! grep -q 'id="app"' "$ROOT"

          # Food / Ask Embla.
          grep -q 'Ask Embla' "$FOOD"
          grep -q '4SAPIEN by 4PLANET' "$FOOD"
          grep -q 'four_sapien_profiles' "$FOOD"
          grep -q 'four_sapien_list_items' "$FOOD"
          grep -q 'four_sapien_shops' "$FOOD"
          grep -q 'four_sapien_meal_plans' "$FOOD"
          grep -q 'four-sapien-receipts' "$FOOD"
          grep -q 'googleEnabled' "$FOOD"
          grep -q 'MEAL_PLAN_HYDRATE_FAILED' "$FOOD"
          grep -q 'MEAL_PLAN_SAVE_FAILED' "$FOOD"
          grep -q 'functions/v1/embla-products' "$FOOD"
          grep -q 'RATE_LIMITED' "$FOOD"
          grep -q 'DELVIS DATADEKNING' "$FOOD"
          grep -q 'price:p.embla_price' "$FOOD"
          ! grep -q 'world.openfoodfacts.org' "$FOOD"
          ! grep -q 'cgi/search.pl' "$FOOD"

          # Money.
          grep -q '<title>4SAPIEN Finance — Embla</title>' "$MONEY"
          grep -q '4SAPIEN by 4PLANET' "$MONEY"
          grep -q 'four_sapien_finance_accounts' "$MONEY"
          grep -q 'four_sapien_finance_events' "$MONEY"
          grep -q 'four-sapien-finance-docs' "$MONEY"
          grep -q 'ghvdzetmplqkdtfqiror.supabase.co' "$MONEY"
          grep -q 'sb.auth.getSession()' "$MONEY"

          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' products/4sapien/site

          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('products/4sapien/site/app/food/index.html').read_text()
          m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
          assert m, 'Babel/React source block missing'
          pathlib.Path('/tmp/embla.jsx').write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/embla.jsx --loader:.jsx=jsx --outfile=/tmp/embla-check.js

      - name: Verify Supabase database gate
        id: db
        run: |
          set -euo pipefail
          ok=1
          for table in four_sapien_profiles four_sapien_list_items four_sapien_shops four_sapien_meal_plans four_sapien_product_cache four_sapien_finance_accounts four_sapien_finance_events four_sapien_finance_budget; do
            code=$(curl -sS -o "/tmp/${table}.json" -w '%{http_code}' -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=0" || true)
            [ "$code" = "200" ] || { ok=0; echo "DB gate missing: ${table} HTTP ${code}"; }
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          test "$ok" = 1

      - name: Verify authenticated Food + Embla boundaries
        id: gateway
        run: |
          set -euo pipefail
          for fn in embla-products embla-core-preview; do
            code=$(curl -sS -o "/tmp/${fn}.json" -w '%{http_code}' -X POST -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' --data '{"q":"yoghurt","message":"hello"}' "${SUPABASE_URL}/functions/v1/${fn}" || true)
            [ "$code" = "401" ] || { echo "${fn} auth boundary unexpected HTTP ${code}"; cat "/tmp/${fn}.json" || true; exit 7; }
          done
          echo 'ready=1' >> "$GITHUB_OUTPUT"

      - name: Verify Supabase Auth providers
        id: auth
        run: |
          set -euo pipefail
          curl -fsS -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/auth/v1/settings" > /tmp/auth.json
          email=$(jq -r '(.external.email // false) | tostring' /tmp/auth.json)
          google=$(jq -r '(.external.google // false) | tostring' /tmp/auth.json)
          echo "email=$email" >> "$GITHUB_OUTPUT"
          echo "google=$google" >> "$GITHUB_OUTPUT"
          if [ "$email" = true ]; then echo 'launch_ready=1' >> "$GITHUB_OUTPUT"; else echo 'launch_ready=0' >> "$GITHUB_OUTPUT"; fi
          echo "Auth provider state: email=${email}, google=${google}"

      - name: Resolve Cloudflare authority
        id: cf
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF3: ${{ secrets.CF_API_TOKEN }}
          CF4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF1:-${CF2:-${CF3:-${CF4:-}}}}"
          [ -n "$token" ] || { echo 'Missing Cloudflare token'; exit 8; }
          echo "token=$token" >> "$GITHUB_OUTPUT"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
          root=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active')
          account=$(jq -r '.result[0].account.id // empty' <<<"$root")
          [ -n "$account" ] || { echo 'Cloudflare account unresolved'; exit 9; }
          echo "account=$account" >> "$GITHUB_OUTPUT"
          zone_json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${CUSTOM_DOMAIN}&status=active")
          zone=$(jq -r '.result[0].id // empty' <<<"$zone_json")
          [ -n "$zone" ] || { echo '4sapien.com zone missing/inactive'; exit 10; }
          echo "zone=$zone" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated Workers static-assets candidate
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          cd products/4sapien
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler-worker.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-worker.log | tail -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] || { echo 'Worker URL not resolved'; exit 11; }
          for i in 1 2 3 4 5; do
            root_ok=0; food_ok=0; money_ok=0
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/" -o /tmp/root.html && grep -q 'Food × Money · together' /tmp/root.html && grep -q 'illustrative demo' /tmp/root.html && root_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/food/" -o /tmp/food.html && grep -q 'four_sapien_meal_plans' /tmp/food.html && grep -q 'functions/v1/embla-products' /tmp/food.html && food_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/money/" -o /tmp/money.html && grep -q 'four_sapien_finance_accounts' /tmp/money.html && grep -q 'four_sapien_finance_events' /tmp/money.html && money_ok=1 || true
            if [ "$root_ok" = 1 ] && [ "$food_ok" = 1 ] && [ "$money_ok" = 1 ]; then exit 0; fi
            sleep 2
          done
          echo 'Worker candidate runtime verification failed'
          exit 11

      - name: Fail closed on conflicting 4sapien.com Worker authority
        id: domaincheck
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          domains=$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains")
          current=$(jq -r --arg h "$CUSTOM_DOMAIN" '.result[]? | select(.hostname==$h) | .service' <<<"$domains" | head -n1)
          if [ -n "$current" ] && [ "$current" != "$CF_SERVICE" ]; then echo "4sapien.com conflict: ${current}"; exit 12; fi
          echo "current=${current:-none}" >> "$GITHUB_OUTPUT"

      - name: Attach 4sapien.com after all gates pass
        id: prod
        if: steps.db.outputs.ready == '1' && steps.auth.outputs.launch_ready == '1' && steps.gateway.outputs.ready == '1'
        env:
          CF_API_TOKEN: ${{ steps.cf.outputs.token }}
          CF_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
          CF_ZONE_ID: ${{ steps.cf.outputs.zone }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT -H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "{\"hostname\":\"${CUSTOM_DOMAIN}\",\"service\":\"${CF_SERVICE}\",\"zone_id\":\"${CF_ZONE_ID}\"}" | tee /tmp/domain.json
          test "$(jq -r '.success' /tmp/domain.json)" = true
          echo 'deployed=1' >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5 6 7 8; do
            root_ok=0; food_ok=0; money_ok=0
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/" -o /tmp/prod-root.html && grep -q 'Food × Money · together' /tmp/prod-root.html && grep -q 'illustrative demo' /tmp/prod-root.html && root_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/app/food/" -o /tmp/prod-food.html && grep -q 'four_sapien_meal_plans' /tmp/prod-food.html && grep -q 'functions/v1/embla-products' /tmp/prod-food.html && food_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "https://${CUSTOM_DOMAIN}/app/money/" -o /tmp/prod-money.html && grep -q 'four_sapien_finance_accounts' /tmp/prod-money.html && grep -q 'four_sapien_finance_events' /tmp/prod-money.html && money_ok=1 || true
            if [ "$root_ok" = 1 ] && [ "$food_ok" = 1 ] && [ "$money_ok" = 1 ]; then exit 0; fi
            sleep 3
          done
          echo 'Custom-domain runtime verification failed'
          exit 13

      - name: Release summary
        if: always()
        run: |
          {
            echo '## 4SAPIEN One Product production gate'
            echo '- Claude public front v2: PASS'
            echo '- Food × Money cross-world proposition: PASS'
            echo '- Full Food / Ask Embla donor preserved: PASS'
            echo '- Full Finance donor at /app/money/: PASS'
            echo '- Browser-secret scan: PASS'
            echo "- Database gate: ${{ steps.db.outputs.ready }}"
            echo "- Food + Embla auth boundary: ${{ steps.gateway.outputs.ready }}"
            echo "- Email Auth: ${{ steps.auth.outputs.email }}"
            echo "- Google Auth: ${{ steps.auth.outputs.google }}"
            echo '- 4sapien.com Cloudflare authority: PASS'
            echo "- Isolated Worker candidate: ${{ steps.deploy.outputs.url }}"
            echo "- Custom-domain conflict: ${{ steps.domaincheck.outputs.current }}"
            echo "- 4sapien.com production attached: ${{ steps.prod.outputs.deployed }}"
          } >> "$GITHUB_STEP_SUMMARY"
