name: 4SAPIEN Founder-authorised bounded LIVE release

on:
  push:
    branches: [king/test]
    paths:
      - '.github/workflows/ask-embla-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 4sapien-bounded-live
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[4sapien-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert exact HEIR release intent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/king/test"
          git fetch origin king/test --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/king/test)"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Materialize current canonical 4SAPIEN product
        shell: bash
        run: |
          set -euo pipefail
          # Single source of truth: the exact chain 4sapien-discovery-live.yml and CI use.
          bash products/4sapien/build/materialize_canonical_site.sh products/4sapien/site /tmp/4sapien-unified-20260917
          python - <<'PY'
          import os, pathlib
          sha=os.environ["GITHUB_SHA"]
          for p in pathlib.Path("products/4sapien/site").rglob("*.html"):
              s=p.read_text()
              if "</head>" not in s: raise SystemExit(f"missing head {p}")
              p.write_text(s.replace("</head>",f'<meta name="4planet-source-sha" content="{sha}"></head>',1))
          PY

      - name: Zero-loss and pantry-return gates
        shell: bash
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          ROOT=$SITE/index.html
          FOOD=$SITE/app/food/index.html
          MONEY=$SITE/app/money/index.html
          BRAIN=$SITE/brain/index.html
          for marker in 'Se livet ditt klart.' 'functions/v1/embla-core-preview' '/4sapien-live-hardening.js'; do grep -Fq "$marker" "$ROOT"; done
          for marker in 'fs-food-main' 'MAT · EMBLA' 'FoodPantryProof' 'four_sapien_embla_memories' '4sapien-pantry-decision.js'; do grep -Fq "$marker" "$FOOD"; done
          for marker in 'fs-money-main' 'PENGER · EMBLA' 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' 'FOUR_SAPIEN_DANIEL_FINANCE_FIX_01' 'FOUR_SAPIEN_FINANCE_TRUTH_MATH_V1' 'FOUR_SAPIEN_FINANCE_SYNC_B1C' 'FOUR_SAPIEN_MONEY_NOW_V1' 'four-sapien-finance-record-changed' '/4sapien-money-now.js'; do grep -Fq "$marker" "$MONEY"; done
          for file in apply_finance_daniel_feedback_guard.py apply_finance_truth_math_guard.py apply_finance_sync_b1c_guard.py apply_money_now_guard.py; do test -s "products/4sapien/build/$file"; done
          python -m py_compile products/4sapien/build/apply_finance_daniel_feedback_guard.py products/4sapien/build/apply_finance_truth_math_guard.py products/4sapien/build/apply_finance_sync_b1c_guard.py products/4sapien/build/apply_money_now_guard.py
          node --check "$SITE/4sapien-money-now.js"
          test -s tests/e2e/four-sapien-money-regression.spec.ts
          for marker in 'brainIdentity' 'functions/v1/brain-profile'; do grep -Fq "$marker" "$BRAIN"; done
          node --check "$SITE/4sapien-live-hardening.js"
          node --check "$SITE/4sapien-pantry-decision.js"
          node --check "$SITE/4sapien-local-week.js"
          node --check "$SITE/4sapien-shell.js"
          for marker in 'FOUR_SAPIEN_UNKNOWN_TRUTH_V1'; do grep -Fq "$marker" "$MONEY"; done
          grep -Fq '/4sapien-local-week.js' "$FOOD"
          test -s "$SITE/robots.txt" && test -s "$SITE/sitemap.xml"
          node products/4sapien/qa/test_document_analysis.cjs
          node products/4sapien/build/test_finance_session_ownership.cjs products/4sapien/build/apply_finance_route.py "$SITE"
          node products/4sapien/build/test_oauth_recovery.cjs "$FOOD"
          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' "$SITE"
          grep -Fq "4planet-source-sha\" content=\"$GITHUB_SHA" "$ROOT"
          grep -Fq "4planet-source-sha\" content=\"$GITHUB_SHA" "$FOOD"

      - name: Browser prove Food + Money no-regression before LIVE
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium webkit >/dev/null
          node products/4sapien/qa/test_unknown_truth.cjs products/4sapien/site/app/money/index.html
          FS_BROWSER=chromium node products/4sapien/qa/test_shell_nav.cjs products/4sapien/site
          FS_BROWSER=webkit node products/4sapien/qa/test_shell_nav.cjs products/4sapien/site
          python -m http.server 4173 -d products/4sapien/site >/tmp/4sapien-local.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/app/food/ >/dev/null && break; sleep 1; done
          FOOD_REVIEW_URL=http://127.0.0.1:4173 npx playwright test tests/e2e/four-sapien-pantry-synthetic.spec.ts --project=desktop-1440 --project=mobile-390
          FOUR_SAPIEN_REVIEW_URL=http://127.0.0.1:4173 npx playwright test tests/e2e/four-sapien-money-regression.spec.ts --project=desktop-1440 --project=mobile-390 --project=webkit-390

      - name: Verify existing LIVE Worker authority
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          zone=$(curl -fsS "$api/zones?name=4sapien.com&status=active" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account=$(jq -r '.result[0].account.id // empty' <<<"$zone")
          test -n "$account"
          domains=$(curl -fsS "$api/accounts/$account/workers/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          service=$(jq -r '[.result[]? | select(.hostname=="4sapien.com")][0].service // empty' <<<"$domains")
          test "$service" = "four-sapien-embla"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Deploy only canonical 4SAPIEN Worker
        working-directory: products/4sapien
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy --config wrangler.jsonc | tee /tmp/4sapien-live-deploy.log

      - name: Physical LIVE readback
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            root_code=$(curl -L -sS -o /tmp/live-root.html -w '%{http_code}' "https://4sapien.com/?release=$GITHUB_RUN_ID-$attempt" || true)
            food_code=$(curl -L -sS -o /tmp/live-food.html -w '%{http_code}' "https://4sapien.com/app/food/?release=$GITHUB_RUN_ID-$attempt" || true)
            money_code=$(curl -L -sS -o /tmp/live-money.html -w '%{http_code}' "https://4sapien.com/app/money/?release=$GITHUB_RUN_ID-$attempt" || true)
            money_js_code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/live-money-now.js -w '%{http_code}' "https://4sapien.com/4sapien-money-now.js" || true)
            if [ "$root_code" = 200 ] && [ "$food_code" = 200 ] && [ "$money_code" = 200 ] && [ "$money_js_code" = 200 ] &&
               grep -Fq "4planet-source-sha\" content=\"$GITHUB_SHA" /tmp/live-root.html &&
               grep -Fq 'FoodPantryProof' /tmp/live-food.html &&
               grep -Fq '4sapien-pantry-decision.js' /tmp/live-food.html &&
               grep -Fq "4planet-source-sha\" content=\"$GITHUB_SHA" /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_DANIEL_FINANCE_FIX_01' /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_FINANCE_TRUTH_MATH_V1' /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_FINANCE_SYNC_B1C' /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_MONEY_NOW_V1' /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_FINANCE_TWIN_RUNTIME_V1_1' /tmp/live-money.html &&
               grep -Fq 'FOUR_SAPIEN_MONEY_NOW_V1' /tmp/live-money-now.js; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          FOOD_REVIEW_CACHE_BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" FOOD_REVIEW_URL=https://4sapien.com npx playwright test tests/e2e/four-sapien-pantry-synthetic.spec.ts --project=desktop-1440 --project=mobile-390
          FOUR_SAPIEN_REVIEW_CACHE_BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" FOUR_SAPIEN_REVIEW_URL=https://4sapien.com npx playwright test tests/e2e/four-sapien-money-regression.spec.ts --project=desktop-1440 --project=mobile-390 --project=webkit-390
          echo "4SAPIEN LIVE VERIFIED https://4sapien.com/ source=$GITHUB_SHA"

# Founder LIVE release authorised 2026-10-01 — 4SAPIEN FOOD value loop
# Founder LIVE release authorised 2026-10-02 — 4SAPIEN Finance recovery + Money closure — final verified rerun