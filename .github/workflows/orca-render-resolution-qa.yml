name: ORCA render resolution modes audit
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/orca-render-resolution-qa.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect minified ORCA render-quality options
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('public/games/wild-orca/index.html').read_text(errors='replace')
          for token in ('let On=Math.min', 'new URLSearchParams', "q=high", 'wild-orca-claude:', 'quality', 'pixelRatio', 'setPixelRatio(On)', 'setPixelRatio(2)'):
            found=[m.start() for m in re.finditer(re.escape(token),s,re.I)]
            print('QUALITY_SOURCE',token,'COUNT',len(found))
            for x in found[-4:]:
              print('CONTEXT',s[max(0,x-200):x+500].replace('\n',' ')[:690])
          PY
      - name: Browser with high query and storage
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const queries=['','?q=high','?quality=high'];
            for(const query of queries){
              const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
              const page=await ctx.newPage();
              await page.goto('https://4planet.org/games/wild-orca/'+query,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1200);
              const s=await page.evaluate(()=>({canvas:[...document.querySelectorAll('canvas')].map(x=>({w:x.width,h:x.height,cssw:x.clientWidth,cssh:x.clientHeight})),storage:Object.fromEntries(Object.entries(localStorage).filter(([k])=>k.includes('quality')||k.includes('gfx')))}));
              console.log('QUALITY_MODE',query||'default',JSON.stringify(s));
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
