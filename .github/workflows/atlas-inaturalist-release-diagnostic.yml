name: ATLAS iNaturalist release diagnostic

on:
  push:
    branches:
      - fix/release-atlas-inaturalist-20260909
    paths:
      - '.github/workflows/atlas-inaturalist-release-diagnostic.yml'
      - 'functions/api/inaturalist.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove immutable release-fix artifact and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://173a4d95.4planet-05.pages.dev'

          echo '=== exact scientific name must resolve and return public occurrence records ==='
          exact_status="$(curl -sS -o /tmp/exact.json -w '%{http_code}' "$BASE/api/inaturalist?q=Orcinus%20orca&perPage=5&quality=research")"
          cat /tmp/exact.json
          test "$exact_status" = '200'
          node -e 'const x=require("/tmp/exact.json"); if(!x.ok||x.source!=="inaturalist"||x.resolvedTaxon?.name!=="Orcinus orca"||x.resolvedTaxon?.id!==41521||!Array.isArray(x.records)||x.records.length<1) process.exit(1)'

          echo '=== fuzzy scientific name must fail closed ==='
          fuzzy_status="$(curl -sS -o /tmp/fuzzy.json -w '%{http_code}' "$BASE/api/inaturalist?q=Orcinus%20orcx&perPage=5&quality=research")"
          cat /tmp/fuzzy.json
          test "$fuzzy_status" = '404'
          node -e 'const x=require("/tmp/fuzzy.json"); if(x.ok!==false||x.error!=="TAXON_NOT_EXACTLY_RESOLVED"||x.semantics!=="NO_EXACT_TAXON_IDENTITY_WAS_PROMOTED") process.exit(1)'

          echo 'PASS: immutable release-fix artifact restores iNaturalist while preserving exact-name fail-closed identity.'
