name: Composio SHADOW Connectivity Probe

on:
  push:
    branches:
      - "factory/symphony-runtime-v01"
    paths:
      - ".github/workflows/composio-shadow-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-factory-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package.json

      - name: Install Factory dependencies
        working-directory: factory
        run: npm install --ignore-scripts

      - name: Rotate bounded control token for authenticated probe
        working-directory: factory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$CONTROL_TOKEN"
          umask 077
          printf '%s' "$CONTROL_TOKEN" > "$RUNNER_TEMP/4planet-composio-probe-control-token"
          printf '%s' "$CONTROL_TOKEN" | npx wrangler secret put FACTORY_CONTROL_TOKEN

      - name: Verify Composio secret is bound and API accepts it
        env:
          BASE_URL: https://4planet-production-factory-v01-shadow.odin-skogen.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_TOKEN="$(cat "$RUNNER_TEMP/4planet-composio-probe-control-token")"
          echo "::add-mask::$CONTROL_TOKEN"

          PRIVATE_STATUS="$(curl --silent --show-error --fail-with-body \
            -H "x-factory-control: $CONTROL_TOKEN" \
            "$BASE_URL/__factory/capabilities/private")"
          echo "$PRIVATE_STATUS" | jq -e '.readiness.composio == "CONFIGURED"' >/dev/null

          HTTP_STATUS="$(curl --silent --show-error \
            -o "$RUNNER_TEMP/composio-session-probe.json" \
            -w '%{http_code}' \
            -X POST \
            -H "x-factory-control: $CONTROL_TOKEN" \
            -H "content-type: application/json" \
            --data '{"toolkits":["github"]}' \
            "$BASE_URL/__factory/capabilities/composio/session")"

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Composio probe failed with HTTP $HTTP_STATUS"
            jq -c '{ok,error}' "$RUNNER_TEMP/composio-session-probe.json" 2>/dev/null || true
            exit 1
          fi

          jq -e '.ok == true and (.session != null)' "$RUNNER_TEMP/composio-session-probe.json" >/dev/null
          jq -c '{ok,toolkits,sessionCreated:(.session != null)}' "$RUNNER_TEMP/composio-session-probe.json"
          echo "COMPOSIO_CONNECTIVITY_PROBE=PASS"
