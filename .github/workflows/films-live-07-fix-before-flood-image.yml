name: 4PLANET Films LIVE 07 — repair Before the Flood art

on:
  push:
    branches:
      - work/magazine-public-launch-gold-01
    paths:
      - '.github/workflows/films-live-07-fix-before-flood-image.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/magazine-public-launch-gold-01
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin verified National Geographic official trailer art
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/content/magazineFilms.ts')
          s=p.read_text()
          old='watchUrl: "https://www.beforetheflood.com/", trailerId: "f0z7Sf_S4tY", sourceUrl: "https://www.beforetheflood.com/"'
          new='watchUrl: "https://www.beforetheflood.com/", trailerId: "D9xFFyUOpXo", imageVideoId: "D9xFFyUOpXo", sourceUrl: "https://www.beforetheflood.com/"'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Before the Flood trailer target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff -- src/content/magazineFilms.ts
      - name: Validate repair
        run: |
          npm ci
          npm run typecheck
          npm run test:magazine
          VITE_MAGAZINE_SITE_ORIGIN=https://4planetmagazine.com npm run build
      - name: Commit only canonical registry repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet --exit-code -- . ':!src/content/magazineFilms.ts' || { echo 'Unexpected file mutation'; git status --short; exit 1; }
          git config user.name '4PLANET LIVE Closure 07'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/magazineFilms.ts
          git commit -m 'FILMS LIVE 07: repair Before the Flood official art'
          git push origin HEAD:work/magazine-public-launch-gold-01
