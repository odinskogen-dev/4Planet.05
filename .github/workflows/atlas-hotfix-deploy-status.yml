name: 4PLANET ATLAS hotfix deploy status

on:
  push:
    branches: [work/magazine-public-launch-gold-01]
    paths: ['.github/workflows/atlas-hotfix-deploy-status.yml']

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 2914b6f3f9a5296e3f1450eaa0a956754c374737
    steps:
      - name: Resolve Cloudflare and wait for exact production deploy
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CLOUDFLARE_TOKEN }}
          T3: ${{ secrets.CF_API_TOKEN }}
          T4: ${{ secrets.CF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=''
          for c in "$T1" "$T2" "$T3" "$T4"; do [ -n "$c" ] && TOKEN="$c" && break; done
          [ -n "$TOKEN" ] || { echo 'NO_TOKEN'; exit 2; }
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          TOKEN="${TOKEN#Bearer }"; TOKEN="${TOKEN#bearer }"; TOKEN="${TOKEN#CLOUDFLARE_API_TOKEN=}"; TOKEN="${TOKEN#CF_API_TOKEN=}"
          TOKEN="${TOKEN#\"}"; TOKEN="${TOKEN%\"}"; TOKEN="${TOKEN#\'}"; TOKEN="${TOKEN%\'}"
          echo "::add-mask::$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=4planet.org' > zones.json
          ACCOUNT=$(jq -r '.result[0].account.id // empty' zones.json)
          [ -n "$ACCOUNT" ] || { cat zones.json; exit 3; }

          found=0
          for attempt in $(seq 1 36); do
            curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/4planet-05/deployments?env=production&per_page=5" > deployments.json
            jq -r '.result[] | [.id,.latest_stage.name,.latest_stage.status,.deployment_trigger.metadata.commit_hash,.url,.created_on] | @tsv' deployments.json
            row=$(jq -r --arg sha "$EXPECTED_SHA" '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | [.id,.latest_stage.status,.url] | @tsv' deployments.json | head -1)
            if [ -n "$row" ]; then
              status=$(printf '%s' "$row" | cut -f2)
              echo "EXPECTED $row"
              if [ "$status" = 'success' ]; then found=1; break; fi
              if [ "$status" = 'failure' ]; then exit 4; fi
            fi
            sleep 10
          done
          [ "$found" = '1' ] || { echo 'Exact production deploy did not become successful'; exit 5; }

          echo '===== LIVE 4planet.org headers ====='
          headers=$(curl -sSI 'https://4planet.org/?atlas_header_probe=final' | tr -d '\r')
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi 'cache-control:.*no-store' || { echo 'Missing no-store on live home'; exit 6; }
          printf '%s\n' "$headers" | grep -qi 'frame-src.*https://4planetatlas.com' || { echo 'Missing Atlas frame-src on live home'; exit 7; }
          printf '%s\n' "$headers" | grep -qi 'connect-src.*https://eonet.gsfc.nasa.gov' || { echo 'Missing EONET connect-src on live home'; exit 8; }

          echo 'ATLAS_HOTFIX_DEPLOY_HEADERS_PASS'
