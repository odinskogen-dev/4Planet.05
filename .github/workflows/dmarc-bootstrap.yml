name: DMARC Bootstrap

on:
  push:
    branches:
      - build/four-product-integrated-prototype
    paths:
      - .github/workflows/dmarc-bootstrap.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Ensure 4planet.org DMARC
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; fi
          echo "::add-mask::$CF_TOKEN"
          api() {
            curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"
          }
          ZONES=$(api "https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active")
          ZONE_ID=$(printf '%s' "$ZONES" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result",[]); print(r[0]["id"] if r else "")')
          [ -n "$ZONE_ID" ] || { echo "Zone unavailable"; exit 3; }
          NAME="_dmarc.4planet.org"
          VALUE='v=DMARC1; p=none; adkim=r; aspf=r; pct=100'
          QUERY=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=$NAME")
          MATCH=$(printf '%s' "$QUERY" | EXPECTED="$VALUE" python3 -c 'import json,os,sys; r=json.load(sys.stdin).get("result",[]); print("yes" if any(x.get("content")==os.environ["EXPECTED"] for x in r) else "no")')
          COUNT=$(printf '%s' "$QUERY" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("result",[])))')
          if [ "$MATCH" = "yes" ]; then echo "DMARC already correct"; exit 0; fi
          if [ "$COUNT" -gt 0 ]; then echo "Existing DMARC differs; refusing overwrite"; exit 4; fi
          BODY=$(NAME="$NAME" VALUE="$VALUE" python3 -c 'import json,os; print(json.dumps({"type":"TXT","name":os.environ["NAME"],"content":os.environ["VALUE"],"ttl":1}))')
          RESULT=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" --data "$BODY")
          OK=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("success") else "no")')
          [ "$OK" = "yes" ] || { echo "DMARC create failed"; exit 5; }
          echo "DMARC_BOOTSTRAP_OK"
