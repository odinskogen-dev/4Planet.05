name: 4PLANET Magazine live proof

on:
  pull_request:
    branches:
      - recovery/testking-magazine

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published recovery Magazine and isolation
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in $(seq 1 24); do
            mag_headers="$RUNNER_TEMP/mag.txt"
            article_headers="$RUNNER_TEMP/article.txt"
            atlas_headers="$RUNNER_TEMP/atlas.txt"
            mag_code=$(curl -sS -D "$mag_headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 'https://4planetmagazine.com/magazine/' || true)
            article_code=$(curl -sS -D "$article_headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 'https://4planetmagazine.com/magazine/why-4planet-exists/' || true)
            atlas_code=$(curl -sS -D "$atlas_headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 'https://4planetmagazine.com/atlas' || true)
            root_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 'https://4planetmagazine.com/' || true)
            mag_surface=$(tr -d '\r' < "$mag_headers" | awk -F': ' 'tolower($1)=="x-4planet-surface" {print $2}' | tail -1)
            article_surface=$(tr -d '\r' < "$article_headers" | awk -F': ' 'tolower($1)=="x-4planet-surface" {print $2}' | tail -1)
            atlas_surface=$(tr -d '\r' < "$atlas_headers" | awk -F': ' 'tolower($1)=="x-4planet-surface" {print $2}' | tail -1)
            echo "attempt=$attempt magazine=$mag_code/$mag_surface article=$article_code/$article_surface atlas=$atlas_code/$atlas_surface root=$root_code"
            if [ "$mag_code" = "200" ] && [ "$mag_surface" = "magazine-only-live" ] \
              && [ "$article_code" = "200" ] && [ "$article_surface" = "magazine-only-live" ] \
              && [ "$atlas_code" = "404" ] && [ "$atlas_surface" = "magazine-only-live" ] \
              && [ "$root_code" = "308" ]; then
              pass=1
              break
            fi
            sleep 10
          done
          [ "$pass" = "1" ]
