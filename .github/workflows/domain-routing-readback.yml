name: 4PLANET domain routing readback

on:
  push:
    branches:
      - ops/domain-routing-20260914
    paths:
      - .github/workflows/domain-routing-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Control-plane and public readback after clean-path fix
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          zone=$(curl -fsS "${auth[@]}" "$api/zones?name=4planet.org" | jq -r '.result[0].id')
          echo '=== CUSTOM DOMAINS ==='
          curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/workers/domains" | jq -r '.result[] | select(.hostname=="4planetatlas.com" or .hostname=="www.4planetatlas.com" or .hostname=="4species.com" or .hostname=="www.4species.com") | [.hostname,.service] | @tsv'
          echo '=== 4PLANET ROUTES ==='
          curl -fsS "${auth[@]}" "$api/zones/$zone/workers/routes" | jq -r '.result[] | select(.pattern=="4planet.org/atlas*" or .pattern=="4planet.org/species*") | [.pattern,(.script // "")] | @tsv'
          echo '=== PUBLIC HTTP ==='
          for u in https://4planetatlas.com/ https://4species.com/ https://4species.com/orca https://4species.com/vulpesvulpes https://4planet.org/atlas https://4planet.org/species/orca https://www.4planetatlas.com/ https://www.4species.com/orca; do
            echo "URL $u"
            curl -sS -D /tmp/h -o /dev/null --max-time 12 "$u" || true
            awk 'toupper($1) ~ /^HTTP\// {status=$2} BEGIN{IGNORECASE=1} /^location:/ {loc=$0} END{gsub(/\r/,"",loc); print "STATUS " status; if(loc!="") print loc}' /tmp/h || true
          done
