name: 4PLANET domain routing readback

on:
  push:
    branches:
      - ops/domain-routing-20260914
    paths:
      - .github/workflows/domain-routing-readback.yml

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live routing after SPECIES + ATLAS repair
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_FACTORY_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FACTORY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          zone=$(curl -fsS "${auth[@]}" "$api/zones?name=4planet.org" | jq -r '.result[0].id')
          echo '=== CUSTOM DOMAINS ==='
          curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/workers/domains" | jq -r '.result[] | select(.hostname=="4planetatlas.com" or .hostname=="www.4planetatlas.com" or .hostname=="4species.com" or .hostname=="www.4species.com") | [.hostname,.service] | @tsv'
          echo '=== 4PLANET ROUTES ==='
          curl -fsS "${auth[@]}" "$api/zones/$zone/workers/routes" | jq -r '.result[] | select(.pattern=="4planet.org/atlas*" or .pattern=="4planet.org/species*") | [.pattern,(.script // "")] | @tsv'
          echo '=== PAGES PROJECT ==='
          curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/4planet-05" | jq -r '.result | [.name,.production_branch,([.domains[]?]|join(","))] | @tsv'
          echo '=== WAIT FOR PRODUCTION COMMIT 22a4b508 ==='
          found=0
          for attempt in $(seq 1 30); do
            deps=$(curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/4planet-05/deployments?env=production&page=1&per_page=5")
            echo "$deps" | jq -r '.result[] | [(.deployment_trigger.metadata.branch//""),(.deployment_trigger.metadata.commit_hash//""),(.latest_stage.status//""),(.url//"")] | @tsv'
            status=$(echo "$deps" | jq -r '.result[] | select((.deployment_trigger.metadata.commit_hash//"") | startswith("22a4b508")) | .latest_stage.status' | head -n1)
            if [ "$status" = "success" ]; then found=1; break; fi
            sleep 5
          done
          [ "$found" = "1" ] || { echo 'New production commit not successful in time'; exit 1; }
          echo '=== PUBLIC HTTP ==='
          for u in https://4species.com/ https://4species.com/species https://4species.com/orca https://4planet.org/species https://4planet.org/species/orca https://4planet.org/ https://4planetatlas.com/ https://4planet.org/atlas; do
            echo "URL $u"
            curl -sS -D /tmp/h -o /tmp/b --max-time 20 "$u" || true
            awk 'toupper($1) ~ /^HTTP\// {status=$2} BEGIN{IGNORECASE=1} /^location:/ {loc=$0} END{gsub(/\r/,"",loc); print "STATUS " status; if(loc!="") print loc}' /tmp/h || true
          done
          echo '=== CSP ==='
          curl -sSI --max-time 20 https://4planet-05.pages.dev/species | tr -d '\r' | grep -i '^content-security-policy:' | head -n1 || true
