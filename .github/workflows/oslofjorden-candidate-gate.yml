name: Oslofjorden Product Proof Gate

on:
  pull_request:
    branches:
      - phase04/brand-product-convergence
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/oslofjorden-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: oslofjorden-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Existing smoke and truth contracts
        run: npm run test:smoke

      - name: Phase 04 contracts
        run: node --test scripts/phase04-contracts.test.mjs

      - name: Oslofjorden source and product contracts
        run: node --test scripts/oslofjorden-contracts.test.mjs

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built candidate locally
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/oslofjord-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/oslofjord-preview.log
          exit 1

      - name: Oslofjorden desktop, mobile and validation proof
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/oslofjorden-product-proof.spec.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oslofjorden-browser-evidence
          path: |
            artifacts/oslofjorden-product-proof
            playwright-report
            test-results
            /tmp/oslofjord-preview.log
          if-no-files-found: warn
          retention-days: 14
