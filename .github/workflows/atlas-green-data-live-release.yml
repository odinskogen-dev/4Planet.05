name: ATLAS Green Data Live Release

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/unescoOpenData.ts"
      - "functions/api/unesco-data.ts"
      - "src/earth/layers.ts"
      - "src/earth/World.tsx"
      - "src/earth/atlasSourceControl.ts"
      - "tests/e2e/atlas-green-data.spec.ts"
      - "scripts/atlas-unesco-api-contract.test.mjs"
      - "scripts/atlas-unesco-client-contract.test.mjs"
      - ".github/workflows/atlas-green-data-live-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verify current UNESCO endpoints and minimum schema
        run: |
          node <<'NODE'
          const datasets = {
            mab001: ["mab_id", "title_en", "coordinates"],
            whc001: ["id_no", "name_en", "coordinates"],
            eg0001: ["ugg_id", "title_en", "coordinates"],
            ioc001: ["area_id", "area_name", "coordinates", "n_species"],
          };
          for (const [id, required] of Object.entries(datasets)) {
            const url = `https://data.unesco.org/api/explore/v2.1/catalog/datasets/${id}/records?limit=1&select=${encodeURIComponent(required.join(","))}`;
            const res = await fetch(url, { headers: { accept: "application/json", "user-agent": "4PLANET-ATLAS-LIVE-QA/1.0" } });
            if (!res.ok) throw new Error(`${id}: HTTP ${res.status}`);
            const body = await res.json();
            if (!Array.isArray(body.results) || body.results.length < 1) throw new Error(`${id}: no records`);
            const row = body.results[0]?.fields ?? body.results[0];
            for (const field of required) if (!(field in row)) throw new Error(`${id}: missing ${field}`);
            console.log(`${id}: PASS; total=${body.total_count ?? "unknown"}`);
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: UNESCO API pagination and completeness contract
        run: node --test scripts/atlas-unesco-api-contract.test.mjs

      - name: UNESCO client-to-map integrity contract
        run: node --test scripts/atlas-unesco-client-contract.test.mjs

      - name: Production build
        run: npm run build

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/atlas-green-live-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/atlas >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/atlas-green-live-preview.log
          exit 1

      - name: Install Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Cross-browser proof — existing ATLAS UX plus four curated data layers
        env:
          BASE_URL: http://127.0.0.1:4173
          ATLAS_LOCAL_PRECHECK: "1"
        run: >
          npx playwright test tests/e2e/atlas-green-data.spec.ts
          --project=desktop-1440
          --project=desktop-1280
          --project=mobile-390
          --project=mobile-430
          --project=webkit-desktop
          --project=webkit-390
          --project=webkit-430

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-green-data-live-release-evidence
          path: |
            artifacts/atlas-gold/**
            /tmp/atlas-green-live-preview.log
          if-no-files-found: warn
          retention-days: 14
