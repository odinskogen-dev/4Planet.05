name: Snapshot Active Public Product Workers

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/read-public-product-workers.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: king/test
          fetch-depth: 0
      - name: Snapshot exact deployed Worker source
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n')
          token="${token#Bearer }"
          echo "::add-mask::$token"
          api='https://api.cloudflare.com/client/v4'
          zone=$(curl -fsS -H "Authorization: Bearer $token" "$api/zones?name=4planet.org")
          aid=$(jq -r '.result[0].account.id' <<<"$zone")
          mkdir -p ops/discovery/live-workers
          for script in 4planetmarket-prototype cre4tors-prototype 4planet-brain-public four-sapien-embla; do
            curl -fsS -H "Authorization: Bearer $token" "$api/accounts/$aid/workers/scripts/$script" -o "/tmp/$script.multipart"
            python3 -c 'import pathlib,sys; raw=pathlib.Path(sys.argv[1]).read_bytes(); body=raw.split(b"\r\n\r\n",1)[1].rsplit(b"\r\n--",1)[0] if b"\r\n\r\n" in raw else raw; pathlib.Path(sys.argv[2]).write_bytes(body)' "/tmp/$script.multipart" "ops/discovery/live-workers/$script.js"
            node --check "ops/discovery/live-workers/$script.js"
          done
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4PLANET automation"
          git config user.email "automation@4planet.org"
          git add ops/discovery/live-workers
          if git diff --cached --quiet; then
            echo "SNAPSHOT_UNCHANGED"
            exit 0
          fi
          git commit -m "control(discovery): version exact live public Worker sources"
          git pull --rebase origin king/test
          git push origin HEAD:king/test


