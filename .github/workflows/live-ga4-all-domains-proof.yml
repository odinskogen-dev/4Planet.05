name: LIVE GA4 All Domains Proof

on:
  push:
    branches: [king/test]
    paths:
      - .github/workflows/live-ga4-all-domains-proof.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove consent to GA4 collect on all canonical domains
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const domains = [
            '4planet.org',
            's4piens.com',
            '4planetmagazine.com',
            'cre4tors.com',
            '4planetmarket.com',
          ];
          const browser = await chromium.launch();
          const rows = [];
          let failed = false;
          try {
            for (const host of domains) {
              const context = await browser.newContext();
              const page = await context.newPage();
              const googleRequests = [];
              page.on('request', r => { if (/google-analytics|googletagmanager/i.test(r.url())) googleRequests.push(r.url()); });
              try {
                let response = await page.goto(`https://${host}/`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (!response || response.status() !== 200) throw new Error(`HTTP ${response?.status()}`);
                await page.evaluate(() => localStorage.removeItem('4planet.analytics.consent.v1'));
                await page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
                const allow = page.getByRole('button', { name: 'ALLOW' });
                await allow.waitFor({ state: 'visible', timeout: 15000 });
                const collect = page.waitForRequest(r => /google-analytics\.com\/g\/collect/.test(r.url()), { timeout: 25000 });
                await allow.click();
                const req = await collect;
                const url = new URL(req.url());
                const tid = url.searchParams.get('tid') || '';
                if (tid !== 'G-Q79Y9HJRL8') throw new Error(`measurement ID ${tid || 'missing'}`);
                rows.push(`| ${host} | PASS | ${tid} |`);
              } catch (error) {
                failed = true;
                rows.push(`| ${host} | FAIL | ${String(error).replace(/\|/g, '/')} · Google reqs ${googleRequests.length} |`);
              } finally {
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }
          fs.writeFileSync('/tmp/ga4-all.md', [
            '# LIVE GA4 — all canonical domains',
            '',
            '| Domain | ALLOW → GA4 collect | Measurement |',
            '|---|---|---|',
            ...rows,
            '',
            failed ? 'Result: **NOT 5/5**' : 'Result: **5/5 END-TO-END PASS**',
          ].join('\n'));
          if (failed) process.exitCode = 1;
          NODE
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/ga4-all.md ]; then gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body-file /tmp/ga4-all.md; else gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body 'LIVE GA4 all-domains proof failed before report.'; fi
