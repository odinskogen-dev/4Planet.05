name: 4SAPIEN One Product Human Gold preview

on:
  push:
    branches: [build/4sapien-one-product-human-gold-20260915]
    paths:
      - 'products/4sapien/**'
      - '.github/workflows/4sapien-one-product-human-gold-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  SUPABASE_URL: https://ghvdzetmplqkdtfqiror.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_H6TT_u7YO4DVlvQdCJ06mA_VEvgxsOE
  PREVIEW_URL: https://four-sapien-embla-megasprint.odin-skogen.workers.dev/

jobs:
  one-product-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact One Product donors
        run: |
          set -euo pipefail
          SITE=products/4sapien/site
          ROOT=${SITE}/index.html
          FOOD=${SITE}/app/food/index.html
          MONEY=${SITE}/app/money/index.html
          rm -rf "$SITE"
          mkdir -p "${SITE}/app/food" "${SITE}/app"

          # Public One Product front selected in the real 4SAPIEN release lineage.
          python products/4sapien/build/apply_front_v2_release.py \
            products/4sapien/source/claude-front-20260915-v2.html \
            "$ROOT"

          # Full Claude Food / Ask Embla donor, kept as its own world.
          cat products/4sapien/source/part-{00..06}.b64 | base64 -d | xz -d > "$FOOD"
          python products/4sapien/build/apply_provider_guard.py "$FOOD"
          python products/4sapien/build/apply_meal_plan_guard.py "$FOOD"
          python products/4sapien/build/apply_product_gateway_guard.py "$FOOD"

          # Human Gold Core seam is preview-only and layered onto Food without replacing donor code.
          python products/4sapien/build/apply_embla_core_guard.py "$FOOD"
          python products/4sapien/build/apply_human_gold_preview_guard.py "$FOOD"

          # Full Claude Finance donor, independently materialized at canonical Money route.
          python products/4sapien/build/apply_finance_route.py "$ROOT"

          cp products/4sapien/cloudflare/_headers "${SITE}/_headers"
          cp products/4sapien/cloudflare/_redirects "${SITE}/_redirects"
          cat > "${SITE}/app/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/app/food/"><title>4SAPIEN</title></head><body><a href="/app/food/">Open 4SAPIEN</a></body></html>
          HTML

          # Preview marker on the public front only; no product logic changed.
          python - <<'PY'
          from pathlib import Path
          p=Path('products/4sapien/site/index.html')
          s=p.read_text()
          badge='<div style="position:fixed;top:8px;right:8px;z-index:2147483647;background:#000;color:#fff;padding:6px 9px;border-radius:999px;font:700 9px monospace">ONE PRODUCT · HUMAN GOLD PREVIEW</div>'
          if '<body>' in s: s=s.replace('<body>','<body>'+badge,1)
          elif '<body ' in s:
              i=s.find('>',s.find('<body ')); s=s[:i+1]+badge+s[i+1:]
          else: raise SystemExit('root body missing')
          p.write_text(s)
          PY

      - name: Zero-loss architecture QA
        run: |
          set -euo pipefail
          ROOT=products/4sapien/site/index.html
          FOOD=products/4sapien/site/app/food/index.html
          MONEY=products/4sapien/site/app/money/index.html

          grep -q 'Food × Money · together' "$ROOT"
          grep -q '/app/food/' "$ROOT"
          grep -q '/app/money/' "$ROOT"
          grep -q 'ONE PRODUCT · HUMAN GOLD PREVIEW' "$ROOT"

          grep -q 'Ask Embla' "$FOOD"
          grep -q 'EMBLA HUMAN GOLD 02' "$FOOD"
          grep -q 'functions/v1/embla-core-preview' "$FOOD"
          grep -q 'HUMAN GOLD PREVIEW' "$FOOD"
          grep -q 'four_sapien_meal_plans' "$FOOD"
          grep -q 'functions/v1/embla-products' "$FOOD"

          grep -q '<title>4SAPIEN Finance — Embla</title>' "$MONEY"
          grep -q 'four_sapien_finance_accounts' "$MONEY"
          grep -q 'four_sapien_finance_events' "$MONEY"
          grep -q 'four-sapien-finance-docs' "$MONEY"
          grep -q 'sb.auth.getSession()' "$MONEY"

          ! grep -ERqi 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|KASSALAPP_API_KEY|KASSALAPP_TOKEN' products/4sapien/site

          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('products/4sapien/site/app/food/index.html').read_text()
          m=re.search(r'<script type="text/babel"[^>]*>(.*?)</script>',s,re.S)
          assert m, 'Food Babel source missing'
          pathlib.Path('/tmp/food.jsx').write_text(m.group(1))
          PY
          npx --yes esbuild@0.25.9 /tmp/food.jsx --loader:.jsx=jsx --outfile=/tmp/food-check.js

      - name: Verify shared runtime boundaries
        run: |
          set -euo pipefail
          for table in four_sapien_profiles four_sapien_meal_plans four_sapien_finance_accounts four_sapien_finance_events four_sapien_finance_budget; do
            code=$(curl -sS -o /tmp/db.json -w '%{http_code}' -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=0" || true)
            [ "$code" = 200 ] || { echo "$table HTTP $code"; exit 5; }
          done
          core_code=$(curl -sS -o /tmp/core.json -w '%{http_code}' -X POST -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' --data '{"message":"health check"}' "${SUPABASE_URL}/functions/v1/embla-core-preview" || true)
          [ "$core_code" = 401 ] || { echo "Embla Core unauthenticated boundary HTTP $core_code"; cat /tmp/core.json; exit 6; }

      - name: Verify preview auth allowlist and model secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || exit 31
          endpoint='https://api.supabase.com/v1/projects/ghvdzetmplqkdtfqiror/config/auth'
          curl -fsS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$endpoint" > /tmp/auth.json
          jq -e --arg wanted "$PREVIEW_URL" '(.uri_allow_list // "")|split(",")|map(gsub("^ +| +$";""))|index($wanted)!=null' /tmp/auth.json >/dev/null
          npx --yes supabase@latest secrets list --project-ref ghvdzetmplqkdtfqiror > /tmp/secrets.txt
          grep -Eq '(^|[[:space:]])OPENAI_API_KEY([[:space:]]|$)' /tmp/secrets.txt

      - name: Resolve Cloudflare credentials
        id: cf
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF3: ${{ secrets.CF_API_TOKEN }}
          CF4: ${{ secrets.CF_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF1:-${CF2:-${CF3:-${CF4:-}}}}"
          [ -n "$token" ] || exit 8
          root=$(curl -fsS -H "Authorization: Bearer ${token}" 'https://api.cloudflare.com/client/v4/zones?name=4planet.org&status=active')
          account=$(jq -r '.result[0].account.id // empty' <<<"$root")
          [ -n "$account" ] || exit 9
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "account=$account" >> "$GITHUB_OUTPUT"

      - name: Deploy One Product to isolated founder preview only
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -euo pipefail
          cd products/4sapien
          npx --yes wrangler@4 deploy --config wrangler.jsonc --name four-sapien-embla-megasprint 2>&1 | tee /tmp/wrangler.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler.log | tail -n1)
          [ -n "$url" ] || exit 10
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do
            root_ok=0; food_ok=0; money_ok=0
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/" -o /tmp/root.html && grep -q 'ONE PRODUCT · HUMAN GOLD PREVIEW' /tmp/root.html && grep -q 'Food × Money · together' /tmp/root.html && root_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/food/" -o /tmp/food.html && grep -q 'HUMAN GOLD PREVIEW' /tmp/food.html && grep -q 'functions/v1/embla-core-preview' /tmp/food.html && food_ok=1 || true
            curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/app/money/" -o /tmp/money.html && grep -q 'four_sapien_finance_accounts' /tmp/money.html && grep -q 'four_sapien_finance_events' /tmp/money.html && money_ok=1 || true
            if [ "$root_ok" = 1 ] && [ "$food_ok" = 1 ] && [ "$money_ok" = 1 ]; then exit 0; fi
            sleep 2
          done
          exit 11

      - name: Summary
        if: always()
        run: |
          echo '## 4SAPIEN One Product Human Gold preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production domain: UNTOUCHED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public front donor: preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Food donor: preserved at /app/food/' >> "$GITHUB_STEP_SUMMARY"
          echo '- Finance donor: preserved at /app/money/' >> "$GITHUB_STEP_SUMMARY"
          echo '- Human Gold Core seam: preview-only on Food' >> "$GITHUB_STEP_SUMMARY"
          echo '- Shared Supabase/Auth runtime: preserved' >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: ${{ steps.preview.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
