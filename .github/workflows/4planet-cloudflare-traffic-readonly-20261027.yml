name: 4PLANET Cloudflare Analytics Read Only 20261027
on:
  push:
    branches: [king/test]
    paths: [.github/workflows/4planet-cloudflare-traffic-readonly-20261027.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_FALLBACK: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_ALT1: ${{ secrets.CF_API_TOKEN }}
      CF_ALT2: ${{ secrets.CF_TOKEN }}
    steps:
      - name: Secure read only Cloudflare traffic summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          raw_candidates=[os.environ.get(k,'') for k in ('CF_PRIMARY','CF_FALLBACK','CF_ALT1','CF_ALT2')]
          candidates=[]
          for raw in raw_candidates:
            val=raw.strip().replace('\r','').replace('\n','')
            for prefix in ('Bearer ','bearer ','CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='):
              if val.startswith(prefix): val=val[len(prefix):]
            val=val.strip().strip("\"'")
            if val and val not in candidates: candidates.append(val)
          token=candidates[0] if candidates else ''
          if not token:
            print('CLOUDFLARE_SECRET_ABSENT')
            raise SystemExit(2)
          root='https://api.cloudflare.com/client/v4'
          def req(url,body=None):
            payload=json.dumps(body).encode() if body is not None else None
            r=urllib.request.Request(url,data=payload,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(r,timeout=20) as f: return f.status,json.load(f)
            except urllib.error.HTTPError as e:
              try: x=json.load(e)
              except: x={}
              return e.code,x
          probes=[]
          zone_auth=False
          for candidate in candidates:
            token=candidate
            rc,probe=req(root+'/zones?name=4planet.org')
            probes.append((rc, bool(probe.get('success'))))
            if rc==200 and probe.get('success'):
              zone_auth=True
              break
          code,check=req(root+'/user/tokens/verify')
          print('AUTH_DIAGNOSTIC:', 'candidate_count',len(candidates),'zone_probes',probes,'token_verify_http',code,'verify_success',bool(check.get('success')))
          report=['# 4PLANET Cloudflare read-only traffic audit','','No client IPs, raw paths, visitor identifiers or token values are printed.','',f'Token verification: HTTP {code} success={bool(check.get("success"))}','',
            '| Domain | Period | HTTP requests | Page views | Daily-unique-IP sum* | Cache requests | Days | Note |',
            '|---|---|---:|---:|---:|---:|---:|---|']
          if not zone_auth:
            print('CLOUDFLARE_ZONE_API_ACCESS_NOT_CONFIRMED')
            raise SystemExit(1)
          domains=['4planet.org','4species.com','4planetatlas.com','4planetmagazine.com','4brain.app','4brands.org','4nation.org','4sapien.com','s4piens.com','4planetmarket.com','oce4n.com','cre4tors.com','n4turetech.com','p4nther.com','p4nther.org','pl4net.org','supersapien.org']
          query='query($z: string,$s: Date,$e: Date){viewer{zones(filter:{zoneTag:$z}){httpRequests1dGroups(limit:100,filter:{date_geq:$s,date_lt:$e},orderBy:[date_ASC]){dimensions{date}sum{requests pageViews cachedRequests}uniq{uniques}}}}}'
          for domain in domains:
            rc,r=req(root+'/zones?name='+urllib.parse.quote(domain))
            zones=[x for x in r.get('result',[]) if x.get('name')==domain] if isinstance(r.get('result'),list) else []
            if not zones:
              report.append(f'| {domain} | — | — | — | — | — | — | Zone unavailable (HTTP {rc}); not zero traffic |')
              continue
            for label,start,end in [('current','2026-09-27','2026-10-27'),('previous','2026-08-28','2026-09-27')]:
              rc,r=req(root+'/graphql',{'query':query,'variables':{'z':zones[0]['id'],'s':start,'e':end}})
              zz=(((r.get('data') or {}).get('viewer') or {}).get('zones') or [])
              rows=zz[0].get('httpRequests1dGroups',[]) if zz else []
              if rc!=200 or r.get('errors') or not zz:
                errors=';'.join(x.get('message','error')[:90] for x in r.get('errors',[])[:2]).replace('|','/')
                report.append(f'| {domain} | {label} | — | — | — | — | — | HTTP {rc}, {errors or "no access/data"} |')
                continue
              totals=lambda field:sum(int((x.get('sum') or {}).get(field) or 0) for x in rows)
              daily_uniq=sum(int((x.get('uniq') or {}).get('uniques') or 0) for x in rows)
              report.append(f'| {domain} | {label} | {totals("requests")} | {totals("pageViews")} | {daily_uniq} | {totals("cachedRequests")} | {len(rows)} | Edge HTTP requests, not human sessions |')
          report.extend(['','*Daily-unique-IP sums must not be treated as period unique humans. Missing data is not zero.','No Cloudflare changes were made.'])
          out='\n'.join(report)
          print(out)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(out+'\n')
          PY

      - name: Public LIVE sitemap and canonical diagnostics (read only)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,re,os
          urls=['https://4planet.org/sitemap.xml','https://4planet.org/news-sitemap.xml','https://4planetmagazine.com/news-sitemap.xml','https://4planetmagazine.com/magazine-sitemap.xml','https://4species.com/sitemap.xml','https://4planetatlas.com/sitemap.xml','https://4planet.org/now','https://4planet.org/now/','https://4planet.org/about','https://4planet.org/about/','https://4species.com/orca','https://4species.com/species/orca','https://4species.com/this-species-must-not-exist']
          out=['## Public LIVE SEO read-only check','| URL | HTTP | Final URL | XML / canonical | Robots |','|---|---:|---|---|---|']
          for url in urls:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; 4PLANET-SEOAudit/1.0)'})
              with urllib.request.urlopen(request,timeout=25) as resp:
                raw=resp.read(250000);status=resp.status;final=resp.geturl();headers=resp.headers
            except urllib.error.HTTPError as e:
              raw=e.read(20000);status=e.code;final=e.geturl();headers=e.headers
            except Exception as e:
              out.append(f'| {url} | ERROR | - | {type(e).__name__} | - |')
              continue
            body=raw.decode('utf-8','replace')
            robots=headers.get('X-Robots-Tag','')[:60]
            if url.endswith('.xml'):
              try:
                tree=ET.fromstring(raw)
                info=f'XML valid, {len(tree)} entries, {len(raw)} bytes'
              except Exception as e:
                info=f'XML INVALID: {type(e).__name__}; {len(raw)} bytes'
            else:
              match=re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"',body,re.I)
              info='canonical='+match.group(1) if match else 'canonical not found in fetched HTML'
            out.append(f'| {url} | {status} | {final} | {info.replace("|","/")} | {robots.replace("|","/")} |')
          report='\n'.join(out)
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'+report+'\n')
          PY
