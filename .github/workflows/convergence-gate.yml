name: ONE INTERFACE Convergence Gate

on:
  push:
    branches:
      - convergence/one-interface
      - claude/one-interface-premium-completion
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize staged LABS v3 source
        if: ${{ hashFiles('.labs-v3-chunks/*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .labs-v3-chunks/00 .labs-v3-chunks/01 .labs-v3-chunks/02 .labs-v3-chunks/03 | base64 -d > /tmp/labs-v3-payload.tar.gz
          mkdir -p /tmp/labs-v3
          tar -xzf /tmp/labs-v3-payload.tar.gz -C /tmp/labs-v3
          cp /tmp/labs-v3/LabsOverview.tsx src/pages/labs/LabsOverview.tsx
          cp /tmp/labs-v3/labs.css src/pages/labs/labs.css
          cp /tmp/labs-v3/labs-contracts.test.mjs scripts/labs-contracts.test.mjs
          cp /tmp/labs-v3/labs.spec.ts tests/e2e/labs.spec.ts
          rm -rf .labs-v3-chunks .labs-v3-payload.tar.gz
          git config user.name "4PLANET LABS build"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/pages/labs/LabsOverview.tsx src/pages/labs/labs.css scripts/labs-contracts.test.mjs tests/e2e/labs.spec.ts .labs-v3-chunks .labs-v3-payload.tar.gz
          git commit -m "feat(labs): materialize luminous founder project OS v3"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

      - name: Record exact candidate
        run: |
          git rev-parse HEAD > exact-sha.txt
          printf '%s\n' "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" > exact-branch.txt

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Contract and smoke tests
        run: npm run test:smoke

      - name: Lint (no NEW warnings; 6 inherited World/layer warnings are known)
        shell: bash
        run: |
          npm run lint 2>&1 | tee lint.txt || true
          warnings="$(grep -Eo '[0-9]+ warning' lint.txt | grep -Eo '[0-9]+' | tail -1 || echo 0)"
          errors="$(grep -Eo '[0-9]+ error' lint.txt | grep -Eo '[0-9]+' | tail -1 || echo 0)"
          test "${errors:-0}" -eq 0
          test "${warnings:-0}" -le 6

      - name: Asset control
        run: npm run assets:verify

      - name: Dependency audit — high severity blocks
        run: npm audit --audit-level=high 2>&1 | tee dependency-audit.txt

      - name: Record bundle evidence
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f,%s\n' | sort -t, -k2nr > bundle-sizes.csv
          largest="$(awk -F, 'NR==1 {print $2}' bundle-sizes.csv)"
          test -n "$largest"
          test "$largest" -lt 1800000

      - name: Start local preview
        run: |
          npm run preview -- --host 0.0.0.0 > preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Install Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: E2E — LABS Human Project OS on Chromium desktop + mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/labs.spec.ts --project=desktop-1440 --project=mobile-390

      - name: E2E — Jaguar Gold Reference on Chromium desktop + mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/jaguar-world.spec.ts --project=desktop-1440 --project=desktop-1280 --project=mobile-390 --project=mobile-430

      - name: E2E — Jaguar Gold Reference on WebKit desktop + mobile
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/jaguar-world.spec.ts --project=webkit-desktop --project=webkit-390 --project=webkit-430

      - name: Internal route control
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html','utf8');
          if (!html.includes('<div id="root"')) throw new Error('Root application mount missing');
          const required = ['/', '/labs', '/atlas', '/species', '/species/orca', '/species/jaguar', '/ecosystems/amazon-rainforest', '/living-systems', '/missions/cle4n', '/missions/wh4les', '/join'];
          fs.writeFileSync('required-routes.json', JSON.stringify({ required, exactSha: require('child_process').execSync('git rev-parse HEAD').toString().trim() }, null, 2));
          NODE

      - name: Security and secret-pattern control
        run: |
          curl --silent --show-error --dump-header local-headers.txt --output /dev/null http://127.0.0.1:4173/
          grep -qi '^content-type:' local-headers.txt
          if grep -R --line-number -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|SUPABASE_SERVICE_ROLE|sk_live_)' src public functions supabase 2>/dev/null; then exit 1; fi

      - name: Source mutation control
        run: |
          unexpected="$(git diff --name-only -- . ':!public/product-build.txt')"
          if [ -n "$unexpected" ]; then printf '%s\n' "$unexpected"; exit 1; fi
          git diff --cached --exit-code

      - name: Upload exact-SHA acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-evidence
          path: |
            exact-sha.txt
            exact-branch.txt
            dependency-audit.txt
            bundle-sizes.csv
            lint.txt
            preview.log
            local-headers.txt
            required-routes.json
            artifacts
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
