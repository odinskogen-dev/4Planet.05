name: P18 FOOD One-Time Alternative State Fix

on:
  push:
    branches:
      - agent/p18-food-vertical-slice
    paths:
      - ".github/workflows/p18-food-alternative-state-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FOOD branch
        uses: actions/checkout@v4
        with:
          ref: agent/p18-food-vertical-slice
          fetch-depth: 0

      - name: Apply exact truth-state changes and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_string, old, new):
              path = Path(path_string)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/food/core.js",
              """    product,\n    alternatives,\n    marketScope: text(alternativeResult.marketScope) || \"unknown\",\n""",
              """    product,\n    alternatives,\n    alternativeState: text(alternativeResult.kind) || \"not_run\",\n    alternativeMessage: text(alternativeResult.message),\n    alternativeAttempts: Array.isArray(alternativeResult.rawEnvelopeMeta?.attempts)\n      ? alternativeResult.rawEnvelopeMeta.attempts\n      : [],\n    marketScope: text(alternativeResult.marketScope) || \"unknown\",\n""",
          )

          replace_once(
              "src/food/core.d.ts",
              """  product?: CanonicalFoodProduct;\n  alternatives?: CanonicalFoodProduct[];\n};\n""",
              """  product?: CanonicalFoodProduct;\n  alternatives?: CanonicalFoodProduct[];\n  alternativeState?: string;\n  alternativeMessage?: string;\n  alternativeAttempts?: unknown[];\n};\n""",
          )

          replace_once(
              "src/food/FoodIntelligence.tsx",
              """  alternatives?: CanonicalFoodProduct[];\n  marketScope?: string;\n""",
              """  alternatives?: CanonicalFoodProduct[];\n  alternativeState?: string;\n  alternativeMessage?: string;\n  alternativeAttempts?: unknown[];\n  marketScope?: string;\n""",
          )

          replace_once(
              "src/food/FoodIntelligence.tsx",
              """              {ranked && ranked.eligible.length > 0 ? (\n                <div className=\"food-alternative-list\">{ranked.eligible.map((item, index) => <AlternativeCard key={item.product.gtin} item={item} index={index} />)}</div>\n              ) : (\n                <div className=\"food-empty-comparison\">No alternative currently passes the category, source-quality and personal-constraint gates.</div>\n              )}\n""",
              """              {result.alternativeState === \"source_error\" ? (\n                <div className=\"food-empty-comparison\"><strong>Alternative source unavailable.</strong><br />No comparison candidates were inferred or substituted. Retry later or inspect the recorded source attempts.</div>\n              ) : ranked && ranked.eligible.length > 0 ? (\n                <div className=\"food-alternative-list\">{ranked.eligible.map((item, index) => <AlternativeCard key={item.product.gtin} item={item} index={index} />)}</div>\n              ) : (\n                <div className=\"food-empty-comparison\">No alternative currently passes the category, source-quality and personal-constraint gates.</div>\n              )}\n""",
          )

          test_path = Path("scripts/food-contracts.test.mjs")
          test_text = test_path.read_text()
          marker = """test(\"canonical JSON is stable across key order\", () => {\n"""
          new_test = """test(\"keeps a found product distinct from an alternative-source failure\", () => {\n  const envelope = structuredClone(FOOD_FIXTURES.complete.envelope);\n  envelope.alternatives = {\n    kind: \"source_error\",\n    httpStatus: 503,\n    categoryTag: \"en:yogurts\",\n    message: \"Fixture alternative search unavailable\",\n    raw: { products: [] },\n    rawEnvelopeMeta: { attempts: [{ httpStatus: 503 }] },\n  };\n  const result = normaliseSourceEnvelope(envelope);\n  assert.equal(result.state, \"found\");\n  assert.equal(result.alternativeState, \"source_error\");\n  assert.equal(result.alternatives.length, 0);\n  assert.equal(result.alternativeAttempts.length, 1);\n});\n\n"""
          if marker not in test_text:
              raise SystemExit("Test insertion marker not found")
          test_path.write_text(test_text.replace(marker, new_test + marker, 1))

          Path(".github/workflows/p18-food-alternative-state-fix.yml").unlink()
          PY

          git config user.name "4PLANET Gate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/food/core.js src/food/core.d.ts src/food/FoodIntelligence.tsx scripts/food-contracts.test.mjs .github/workflows/p18-food-alternative-state-fix.yml
          git commit -m "fix(food): expose alternative source failure honestly"
          git push origin HEAD:agent/p18-food-vertical-slice
