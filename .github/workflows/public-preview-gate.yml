name: Public Preview Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/four-product-integrated-prototype

permissions:
  contents: read

concurrency:
  group: public-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "TYPECHECK_EXIT=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Upload typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Contract and smoke tests
        shell: bash
        run: |
          set +e
          npm run test:smoke 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          echo "SMOKE_EXIT=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Upload smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostic
          path: smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Asset control
        run: npm run assets:verify

      - name: Dependency audit
        run: npm audit --audit-level=high
