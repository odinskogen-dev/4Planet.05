name: CUB LAB — Real Gameplay Media
on:
  push:
    branches: [cub-lab-roma-challenger-20261018]
    paths: [.github/workflows/cub-gameplay-capture.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cub-lab-gameplay-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture real gameplay screenshots from existing public builds
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 sharp@0.33.5
          node <<'NODE'
          const {chromium}=require('playwright');
          const sharp=require('sharp');
          const fs=require('fs');
          const targets=[
            {slug:'roma',url:'https://lab.p4nther.com/roma/',minCanvases:1},
            {slug:'orca',url:'https://4planet.org/games/wild-orca/',minCanvases:1}
          ];
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const outcomes=[];
            for(const t of targets){
              const page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto(t.url,{waitUntil:'domcontentloaded',timeout:75000});
              await page.waitForTimeout(8000);
              const initial=await page.evaluate(()=>({canvases:document.querySelectorAll('canvas').length,title:document.title,buttons:[...document.querySelectorAll('button')].slice(0,16).map(x=>x.textContent?.trim().slice(0,45)),text:document.body.innerText.slice(0,250)}));
              if(initial.canvases<t.minCanvases){
                const btn=page.getByRole('button',{name:/^(play|start|begin|enter|continue)$/i}).first();
                if(await btn.isVisible().catch(()=>false)){await btn.click();await page.waitForTimeout(6000);}
              }
              const canvases=await page.locator('canvas').count();
              const name='site/assets/gameplay-'+t.slug+'.jpg';
              await page.screenshot({path:name,type:'jpeg',quality:84,timeout:50000,animations:'disabled'});
              const stats=await sharp(name).stats();
              const deviation=stats.channels.slice(0,3).map(x=>x.stdev).reduce((a,b)=>a+b,0)/3;
              const fileSize=fs.statSync(name).size;
              console.log('CUB_REAL_CAPTURE',JSON.stringify({slug:t.slug,status:response.status(),canvases,fileSize,deviation:Math.round(deviation),title:initial.title,buttons:initial.buttons,errors:errors.slice(0,4)}));
              if(response.status()!==200||canvases<t.minCanvases||fileSize<26000||deviation<20)throw Error('Gameplay capture not sufficiently verified: '+t.slug);
              outcomes.push({slug:t.slug,size:fileSize});
              await page.close();
            }
            await browser.close();
            console.log('CUB_REAL_GAMEPLAY_CAPTURE_PASS',JSON.stringify(outcomes));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Archive screenshots without changing game builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CUB LAB media capture bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/gameplay-roma.jpg site/assets/gameplay-orca.jpg
          if git diff --cached --quiet; then echo 'UNCHANGED_CAPTURE'; exit 0; fi
          git commit -m 'CUB LAB record actual screenshots of public ROMA and ORCA builds'
          git push origin HEAD:cub-lab-roma-challenger-20261018
          echo 'CUB_REAL_GAMEPLAY_ARCHIVED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cub-real-gameplay-evidence
          path: site/assets/gameplay-*.jpg
          if-no-files-found: ignore
          retention-days: 30
